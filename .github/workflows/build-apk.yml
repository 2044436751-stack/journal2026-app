name: 构建 APK

on:
  workflow_dispatch:      # 手动点一下就构建
  push:
    branches: [ main, master ]

# 允许 Actions 用默认 GITHUB_TOKEN 创建/更新 Release（上传 APK 资产）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android 35 平台与构建工具
        run: |
          # 构建机（ubuntu-latest）自带 Android SDK，不再用 setup-android@v3（它偶发失败）
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          fi
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 装 Gradle 8.9
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo chmod +x /opt/gradle-8.9/bin/gradle
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 上传 APK（Artifacts，需登录，30天过期）
        uses: actions/upload-artifact@v4
        with:
          name: journal2026-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 发布 APK 到 Release（稳定直链，手机浏览器可直接下）
        uses: ncipollo/release-action@v1
        with:
          tag: apk-latest
          name: Journal2026 最新 APK
          body: |
            自动构建的调试版 APK，对应最新 main 提交的 versionCode。
            下载后传到手机安装即可（覆盖安装不丢日记数据）。
          allowUpdates: true        # 同名 tag 直接更新，不堆积历史 release
          replacesArtifacts: true
          makeLatest: true
          artifacts: app/build/outputs/apk/debug/*.apk
          artifactErrorsFailBuild: true
