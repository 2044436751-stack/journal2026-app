  border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:3px;letter-spacing:.03em}
.tp-mode button.on{border-color:var(--ink);background:var(--soft);color:var(--ink);font-weight:600}
.tp-dur{display:flex;gap:6px;flex-wrap:wrap}
.tp-dur button{font-family:inherit;font-size:13.5px;line-height:1;padding:6px 12px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:12px;
  font-variant-numeric:tabular-nums}
.tp-dur button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.tp-go{width:100%;margin-top:14px;font-family:inherit;font-size:15.5px;letter-spacing:.06em;
  padding:11px 0;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px}
.tp-go:active{opacity:.8}
.tp-digits{text-align:center;font-size:44.5px;font-weight:600;letter-spacing:.02em;line-height:1.25;
  font-variant-numeric:tabular-nums;padding:6px 0 0}
.tp-digits.paused{color:var(--ink3)}
.tp-digits.low{color:#c0392b}
.tp-prog{height:5px;border-radius:2px;background:var(--line2);overflow:hidden;margin:8px 2px 0}
.tp-prog i{display:block;height:100%;width:0;background:#0F6E56;border-radius:2px;transition:width .3s linear}
.tp-prog.low i{background:#c0392b}
.tp-meta{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;
  color:var(--ink3);margin-top:9px}
.tp-meta .dot{width:7px;height:7px;border-radius:50%;background:#0F6E56;flex:0 0 7px;
  animation:tbpulse 1.6s ease infinite}
.tp-meta.off .dot{background:var(--ink3);animation:none}
.tp-ctl{display:flex;gap:8px;margin-top:13px}
.tp-ctl button{flex:1;font-family:inherit;font-size:15px;line-height:1;padding:10px 0;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:3px;letter-spacing:.04em}
.tp-ctl button:active{opacity:.7}
.tp-ctl .tp-end{background:var(--ink);border-color:var(--ink);color:#fff}
.tp-ctl .tp-save{background:#0F6E56;border-color:#0F6E56;color:#fff}
.tp-zero{text-align:center;font-size:15px;color:#0F6E56;font-weight:600;letter-spacing:.08em;margin-top:8px}

/* ==========================================================
   每日记录（data-tpl="daynote"，2026-10-16）
   月切片器（复用 mc 体系）+ 一个月每天一行：
   行首 [星期][日期][＋]，跟着一条记录；行底一条横线分开每一天。
   对齐定稿（与设计稿 mockup-two-pages.html 同源）：
   · 三件套中心同线；空行落在两根横线正中；有内容时与首条内容同线；
   · 跨行各列固定对齐（星期 13 / 日期 20 / ＋ 15）；
   · 首条条目 padding-top 归零（条目自带 3px，不清会低 3px）。
========================================================== */
.page[data-tpl="daynote"] .mc-titlerow{justify-content:flex-start;gap:10px}
.page[data-tpl="daynote"] .p-title{order:1;flex:0 0 auto;text-align:left;margin:0}
.page[data-tpl="daynote"] .mc-sel{order:2;position:static;transform:none}
.dn-list{display:block;border-top:1px solid var(--line2)}   /* 第一条记录也有顶部横线 */
/* 每天一行：head 只占 47px（星期 13 + gap 7 + 日期 20 + gap 7），⊕ 绝对定位在第三列；
   条目区也从 47px 起 ——「第一条的类型位」正好落在 ⊕ 的位置：
   空行看 ⊕、有条目看类型位（⊕ 自动让位，2026-10-17 定稿）。
   padding 上下对称 —— 空行时 ⊕ 落在两根横线正中；有内容时与第一条同一水平线 */
.dn-day{display:flex;align-items:flex-start;position:relative;
  border-bottom:1px solid var(--line2);padding:6px 0}
.dn-head{flex:0 0 47px;display:flex;align-items:center;gap:7px;height:26px}
/* 第一列：星期x的x（13px / 灰）。列宽 = 字宽 → 「星期→数字」的间距 = 纯 gap */
.dn-wd{flex:0 0 13px;font-size:16px;color:var(--ink3);letter-spacing:.02em;line-height:26px;
  text-align:center}
/* 第二列：数字日期（13px / 黑 / 等宽数字 / 居中 —— 两侧留白相同 ⇒ 相邻间距相等） */
.dn-dd{flex:0 0 20px;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;
  line-height:26px;text-align:center}
/* 第三列：⊕＝淡灰十字（2026-10-17 定稿，用户点名的 A 版）。
   本体不带定位（这个外观可能被别处复用），行内定位单独写一行 */
.dn-plus{position:relative;width:13px;height:13px;border:none;background:none;
  padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dn-day .dn-plus{position:absolute;left:47px;top:50%;transform:translateY(-50%)}
.dn-plus::before,.dn-plus::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);background:#d8d8d8;border-radius:1px}
.dn-plus::before{width:9px;height:1.5px}
.dn-plus::after{width:1.5px;height:9px}
.dn-plus:active::before,.dn-plus:active::after{background:#c0392b}
/* 这一天已经有条目 → ⊕ 让位：第一条的类型位（勾选框/圆点/序号）顶在它的位置。
   类由 dnMarkRows() 维护（不用 :has() 是为了兼容老 WebView） */
.dn-day.has-item .dn-plus{display:none}
/* 周界标记（2026-10-17 定稿）：每个**星期日**下面一块高光黄 ——
   从「日」到日期结束（13 + 7 + 20 = 40px），下端贴着那条横线，像在日期下涂了一小块荧光 */
.dn-day[data-wd="0"]::after{content:"";position:absolute;left:0;width:40px;bottom:0;
  height:5px;background:#FFE95C;border-radius:2px 2px 0 0;pointer-events:none}
/* 内容区：从 47px 起（与 ⊕ 同一列起步）；缩进按钮不占位 → 类型位贴左缘 = ⊕ 位 */
.dn-body{flex:1;min-width:0}
.dn-body > .yp-item > .yp-iw{display:none}
.dn-body > .yp-item:first-child{padding-top:0}   /* 与左首三件套同一条水平线 */
.dn-day.today .dn-wd{color:#c0392b;font-weight:600}
.dn-day.today .dn-dd{color:#c0392b}

/* ---------- 空白任务表（data-tpl="tasklist"，2026-10-16）----------
   日切片器（dateField：日期框 + 星期）+ 标题「x月x日」随日期变（标题可编辑）；
   正文＝[☐][一行] × 10 起，写满自动加一行（.grow-item 的通用机制）。 */
.page[data-tpl="tasklist"] .mc-head{margin-bottom:12px}
.page[data-tpl="tasklist"] .dfield{flex:0 1 132px}
.page[data-tpl="tasklist"] .chk{padding:6px 0}
/* 框与文字中心同线：不靠"墨迹"经验值（那样换设备会歪），
   直接定死行高 —— 文字行盒 21px、框 13px 补 4px ⇒ 两者中心都在 10.5 */
.page[data-tpl="tasklist"] .chk .txt{min-height:26px;line-height:26px}
.page[data-tpl="tasklist"] .chk .box{margin-top:4px}
.page[data-tpl="tasklist"] .tl-list .chk:last-child{border-bottom:none}
.page[data-tpl="tasklist"] .addrow{display:none}   /* 写满自动加行，不需要「＋ 新增一条」按钮 */
.tl-day{display:none}
.tl-day.on{display:block}

/* ============ 天气 ============ */
.weather{display:flex;gap:5px;flex:0 0 auto}
.wx{width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.3}
.wx.on{opacity:1;border-color:var(--ink);background:var(--soft)}
.wx svg{width:12px;height:12px}

/* ============ 周/月 ============ */
.dow{display:flex;gap:4px;margin:6px 0}
.dow span{
  flex:1 1 0;min-width:0;text-align:center;font-size:12.5px;line-height:1;color:var(--ink3);
  border:1px solid var(--line2);border-radius:4px;
  padding:4px 2px;cursor:pointer;
  transition:color .12s,border-color .12s,background .12s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.dow span:hover{color:var(--ink2);border-color:var(--line)}
.dow span.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wk-grid{display:grid;grid-template-columns:1fr;gap:8px}
.daycard{border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.daycard .dh{background:var(--soft);font-size:11.5px;letter-spacing:.08em;color:var(--ink2);padding:3px 7px;text-transform:uppercase}
.daycard .db{padding:5px 7px;min-height:64px}

/* ============ FAB / 抽屉 ============ */
#fab{
  position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom));
  width:50px;height:50px;border-radius:25px;border:none;
  background:var(--ink);color:#fff;font-size:32px;line-height:50px;text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:60;padding:0;
}
#fab:active{transform:scale(.94)}
/* 目录按钮：坐在 ＋ 上方 */
/* 与 ＋ 同尺寸（50px）且同右边距 → 圆心天然重合；两者间距仍是 12px */
#idxbtn{
  position:fixed;right:16px;bottom:calc(20px + 50px + 12px + env(safe-area-inset-bottom));
  width:50px;height:50px;border-radius:25px;padding:0;
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;z-index:60;
  -webkit-tap-highlight-color:transparent;
}
#idxbtn:active{transform:scale(.94)}

/* ============ 目录侧边栏 ============ */
#dwm{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
#dwm.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;right:0;top:0;bottom:0;z-index:85;
  width:min(78vw,320px);background:#fff;border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
}
#drawer.on{transform:translateX(0)}
/* 右列对齐：关闭符号 / 类型页数 / 页面页码都用 24px 定宽居中槽位，
   父级右侧留白一致 → 三者中心与右边缘都落在同一条竖线上 */
/* 头部右侧留白 14px ＝ .dw-body 的 6px + 行自身的 8px，
   这样 ✕ 与下面两处槽位的右边缘才真正对齐 */
.dw-h{display:flex;align-items:center;justify-content:space-between;
  padding:14px 14px 10px 16px;border-bottom:1px solid var(--line2)}
.dw-h b{font-size:16.5px;font-weight:600;letter-spacing:.04em}
.dw-x{flex:0 0 24px;text-align:center;font-size:16px;color:var(--ink3);cursor:pointer;padding:4px 0}
/* 目录里不需要选文字：否则长按拖动会顺带选中（手机上尤其明显） */
.dw-body{
  flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 6px 14px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.dw-f{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line2)}
.dw-add{
  width:100%;font-family:inherit;font-size:14px;padding:9px 0;
  border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);cursor:pointer;
}
.dw-add:active{background:var(--soft)}
.dw-g{font-size:13.5px;color:var(--ink3);letter-spacing:.06em;padding:12px 0 4px}
.dw-t{display:flex;align-items:center;gap:5px;padding:5px 8px 2px 6px;font-size:14px;color:var(--ink)}
.dw-t .i{flex:0 0 auto;color:var(--ink2)}
.dw-t .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-t .c{flex:0 0 24px;text-align:center;font-size:13px;color:var(--ink3)}
/* 页面行：缩进 12px，缩进位置用实心圆点占位 */
.dw-r{
  position:relative;overflow:hidden;
  height:29.5px;border-radius:3px;cursor:pointer;
}
/* 红块：删除（右贴，藏在内容层下方，左滑露出） */
.dw-r .dw-del{
  position:absolute;top:0;right:0;bottom:0;width:64px;z-index:0;
  background:#c0392b;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:15px;letter-spacing:.06em;
}
.dw-r .dw-del .x{font-size:17px;font-weight:700;line-height:1}
/* 内容层：负责平移露出红块，底色与抽屉一致以遮挡 */
.dw-r .dw-c{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:6px;height:29.5px;
  padding:0 8px 0 12px;border-radius:3px;background:#fff;
  will-change:transform;
}
.dw-r .dw-c .dot{flex:0 0 4px;height:5px;border-radius:50%;background:#bdbdbd}
.dw-r .dw-c .s{flex:0 1 auto;min-width:0;font-size:13.5px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-r .dw-c .no{flex:0 0 24px;margin-left:auto;text-align:center;font-size:13px;color:var(--ink3)}
/* 页面行：摘要后面的模板名小高光 */
.dw-r .dw-c .tp{flex:0 0 auto;max-width:81px;font-size:12.5px;color:#5f5e5a;
  background:#f1efe8;border-radius:8px;padding:1px 6px;line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-r:active .dw-c{background:var(--soft)}
.dw-r.cur .dw-c{background:var(--soft)}
.dw-r.cur .dw-c .s{color:var(--ink)}
.dw-r .dw-c .h{display:none;font-size:15px;color:#bdbdbd;letter-spacing:-1px}
/* 拖动中 */
.dw-r.lift .dw-c{background:#f2f2f0;border:1px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.dw-r.lift .dw-c .h{display:inline}
.dw-r.hidden{visibility:hidden}
/* 拖动幽灵里不显示红块 / 内容白底 */
.dw-fly .dw-del{display:none}
.dw-fly .dw-c{background:transparent}
.dw-fly{
  position:fixed;z-index:99;pointer-events:none;
  display:flex;align-items:center;gap:6px;height:29.5px;padding:0 8px 0 12px;
  border-radius:3px;background:#f2f2f0;border:1px solid var(--line);
  box-shadow:0 4px 12px rgba(0,0,0,.16);
  font-size:13.5px;color:var(--ink);
}
.dw-fly .dot{flex:0 0 4px;height:5px;border-radius:50%;background:#bdbdbd}
.dw-fly .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-fly .no{flex:0 0 24px;text-align:center;font-size:13px;color:var(--ink3)}
.dw-dropline{height:0;border-top:2px solid #c0392b;margin:0 4px;position:relative}
.dw-dropline:before,.dw-dropline:after{
  content:"";position:absolute;top:-4px;width:6px;height:6px;border-radius:50%;background:#c0392b;
}
.dw-dropline:before{left:-3px}
.dw-dropline:after{right:-3px}
body.drawn{overflow:hidden}
#mask{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none;
}
#mask.on{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;
  border-radius:14px 14px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:78vh;overflow-y:auto;box-shadow:0 -4px 20px rgba(0,0,0,.18);
}
#sheet.on{transform:translateY(0)}
#sheet .sh{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
}
#sheet .sh b{font-size:17px;font-weight:600;letter-spacing:.04em}
#sheet .sh span{font-size:15px;color:var(--ink3);cursor:pointer;padding:4px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{
  border:1px solid var(--line);border-radius:6px;padding:10px 9px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;background:#fff;
}
.tcard:active{background:var(--soft)}
.tcard{position:relative}
.tcard .tn{font-size:15.5px;font-weight:600;letter-spacing:.03em;padding-right:20px}
.tcard .tn.tn-edit{outline:1px dashed #c0392b;border-radius:2px;padding:0 3px;cursor:text}
.tcard .td{font-size:11.5px;color:var(--ink3);line-height:1.45}
.tcard .tico{font-size:18.5px;color:var(--ink3)}
/* 每张卡片右上角的「编辑样式」铅笔 */
.tpl-pen{
  position:absolute;right:5px;top:5px;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;padding:0;
  border:1px solid transparent;border-radius:50%;background:none;color:#bfbfbf;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.tpl-pen:hover{border-color:var(--line2);color:var(--ink2)}
.tpl-pen:active{background:var(--soft);color:var(--ink)}
.tpl-cust{color:#c0392b;font-weight:700;font-size:13.5px;margin-left:3px}
/* ---- 长按模版卡：排序 + 删除（灰色 ✕ 只在长按激活后出现，替掉铅笔的位置） ---- */
.tpl-del{
  position:absolute;right:5px;top:5px;width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;padding:0;
  border:1px solid transparent;border-radius:50%;background:none;color:#bfbfbf;
  font-size:15px;line-height:1;font-family:inherit;
  cursor:pointer;visibility:hidden;-webkit-tap-highlight-color:transparent;
}
.tpl-del:active{background:var(--soft);color:#c0392b}
.tcard.tpl-on{border-color:#c0392b;background:#fdf7f6}
.tcard.tpl-on .tpl-del{visibility:visible}
.tcard.tpl-on .tpl-pen{visibility:hidden}
.tcard.tpl-lift{visibility:hidden}
.tpl-fly{
  position:fixed;z-index:99;pointer-events:none;
  border:1px solid var(--line);border-radius:6px;background:#fff;

<script>
"use strict";

/* ==========================================================
   工具
========================================================== */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const pad = n=>(n<10?"0":"")+n;
const TODAY = new Date();
const WD = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const WD_CN = ["周日","周一","周二","周三","周四","周五","周六"];

function fmtDate(d){ return d.getFullYear()+"."+pad(d.getMonth()+1)+"."+pad(d.getDate()); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* ---------- 存储安全包装 ----------
   有些手机浏览器用 file:// 打开本地页面时会把 localStorage 整个禁掉 —— **连读都抛异常**
   （SecurityError）。直接裸调 localStorage.getItem 会让 load() 当场炸掉，
   结果是「整本一个字都不显示、点什么都没反应」。所以一律走这两个包装：
   存不进去至少还能用（只是不落盘），并且只提醒一次，不静默丢数据。 */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){
  try{ localStorage.setItem(k,v); window.__storeWarned=false; return true; }
  catch(_){
    if(!window.__storeWarned){ window.__storeWarned=true; toast("这个浏览器不让存数据，改动只在本次打开期间有效"); }
    return false;
  }
}
function lsDel(k){ try{ localStorage.removeItem(k); }catch(_){} }

/* 可选带一个动作按钮（复制后的「撤销」用）。
   不传第二个参数时行为和以前完全一样，其他调用点零改动。 */
function toast(msg, opt){
  const t=$("#toast");
  opt=opt||{};
  t.textContent="";
  t.appendChild(document.createTextNode(msg));
  if(opt.action){
    const sep=document.createElement("span");
    sep.className="toast-sep";
    const b=document.createElement("button");
    b.type="button";
    b.className="toast-act";
    b.textContent=opt.action;
    b.addEventListener("click",ev=>{
      ev.stopPropagation();
      clearTimeout(t._tm); t._tm=null;
      if(opt.onAction) opt.onAction();
    });
    t.appendChild(sep); t.appendChild(b);
    t.classList.add("act");
  }else{
    t.classList.remove("act");
  }
  t.classList.add("on");
  clearTimeout(t._tm); t._tm=setTimeout(()=>{
    t.classList.remove("on"); t.classList.remove("act");
  }, opt.ms||1400);
}

/* ---------- 确认弹窗（替代原生 confirm，样式统一且移动端可用） ---------- */
let dlgResolve=null;
function askConfirm(opts){
  const d=$("#dlg");
  $("#dlg-msg").innerHTML=opts.msg||"";
  $("#dlg-ttl").textContent=opts.title||"确认删除";
  const ok=$("#dlg-ok");
  ok.textContent=opts.okText||"删除";
  ok.classList.toggle("danger",opts.danger!==false);
  d.classList.add("on");
  /* 让「删除」成为默认焦点，回车即可确认 */
  setTimeout(()=>{ try{ ok.focus(); }catch(e){} },60);
  return new Promise(res=>{ dlgResolve=res; });
}
function closeDlg(v){
  const d=$("#dlg");
  if(!d.classList.contains("on")) return;
  d.classList.remove("on");
  const r=dlgResolve; dlgResolve=null;
  if(r) r(!!v);
}
$("#dlg").addEventListener("click",function(e){
  const b=e.target.closest("[data-dlg]");
  if(b){ closeDlg(b.dataset.dlg==="1"); return; }
  if(e.target.id==="dlg") closeDlg(false);   /* 点遮罩 = 取消 */
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape" && $("#dlg").classList.contains("on")) closeDlg(false);
});

   通用控件：单选题组 / 日期字段

/* 单选题式选项组（同组内互斥，点一下即选中，不用手打） */
function optGroup(name, arr, sel){
  return `<span class="opts" data-opt="${name}">`+
    arr.map(o=>`<span class="opt${o===sel?" on":""}" data-v="${esc(o)}">${esc(o)}</span>`).join("")+
  `</span>`;
}

/* 下拉框（读书清单状态）：折叠态，点开由 blOpen 弹面板 */
const BL_OPTS=["想读","在读","读完","弃读"];
function selBox(v){
  v=v||BL_OPTS[0];
  return `<span class="selbox" data-selst="1" data-v="${esc(v)}">${esc(v)}<i class="crt"></i></span>`;
}

/* 日期字段：选日期 → 自动生成星期几 */
function dateField(v){
  /* 自定义日期选择器（2026-10-17）：input 只做数据载体（视觉隐藏），
     上面盖一层 .dshow 显示 + 点击触发面板；空值显示「选择日期」 */
  const iso=/^\d{4}-\d{2}-\d{2}$/.test(v||"")? v : "";

    `<input type="date" class="dinput" data-df="1" tabindex="-1" aria-hidden="true" value="${iso}">`+
    `<span class="dshow" data-dshow="1">`+
      `<span class="dtxt${iso?"":" gray"}">${iso?iso.replace(/-/g,"/"):"选择日期"}</span>`+
      `<span class="dwd" data-wd="1"></span>`+
      `<span class="dico">▾</span>`+
    `</span>`+
  `</span>`;
}

/* 紧凑星级评分（用于表格内） */
function starRating(cur){
  return `<span class="stars mini">`+
    Array.from({length:5},(_,i)=>`<span class="s${i<cur?" on":""}" data-star="${i+1}">${ICO.star}</span>`).join("")+
  `</span>`;

/* 星期快捷按钮组（直接点星期几） */
function dowPicker(sel){
  return `<span class="opts dowpick" data-opt="dow">`+
    WD_CN.map(d=>`<span class="dbtn${d===sel?" on":""}" data-v="${d}">${d.slice(1)}</span>`).join("")+

/* 由 yyyy-mm-dd 得到「周X」 */
function weekdayOf(val){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(val||"");
  if(!m) return "";
  const d=new Date(+m[1], +m[2]-1, +m[3]);
  if(isNaN(d.getTime())) return "";
  return WD_CN[d.getDay()];
}

/* 页面内所有日期字段同步星期显示，并联动星期按钮高亮 */
function syncDates(scope){
  const root=scope||document;
  $$(".dfield", root).forEach(f=>{
    const i=$(".dinput",f), w=$(".dwd",f);
    if(!i||!w) return;
    const wd=weekdayOf(i.value);
    w.textContent = wd || "";        /* 空值留白（旧版是「周—」占位，自定义选择器不需要） */
    w.classList.toggle("set", !!wd);
    /* 自定义日期选择器的显示层：日期文字跟着值走（空 → 「选择日期」灰字） */
    const tx=$(".dtxt",f);
    if(tx){
      const v=i.value||"";
      if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ tx.textContent=v.replace(/-/g,"/"); tx.classList.remove("gray"); }
      else{ tx.textContent="选择日期"; tx.classList.add("gray"); }
    }
  });
  /* 星期按钮组跟随本页第一个日期 */
  const pages = (root.classList && root.classList.contains("page")) ? [root] : $$(".page", root);  pages.forEach(pg=>{
    const first=$(".dinput",pg);
    if(!first||!first.value) return;
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(first.value);
    if(!m) return;
    const dt=new Date(+m[1],+m[2]-1,+m[3]);
    if(isNaN(dt.getTime())) return;

    const dow=$(".auto-dow",pg);
    if(dow){
      const idx=dt.getDay();
      $$("span",dow).forEach((s,i)=>s.classList.toggle("on",i===idx));
    }
    /* 周计划：自动算出该周的周一–周日范围（周数按当月口径） */
    const wr=$("[data-weekrange]",pg);
    if(wr){
      const shift=(dt.getDay()+6)%7;          // 周一为起点
      const mon=new Date(dt); mon.setDate(dt.getDate()-shift);
      const sun=new Date(mon); sun.setDate(mon.getDate()+6);
      wr.textContent=weekLabel(mon,sun);
    }
  });
}

/* ============ 自定义日期选择器（2026-10-17）============
   页级单例：#dpmask（透明遮罩）> .dp（面板）。
   · 打开：贴在触发器下方（下方放不下就翻到上方）；
   · 选日期 / 今天 / 清除 → 写回 input 并派发 change（所有既有联动照旧）；
   · 点遮罩空白、再点触发器、页面滚动 → 关闭。 */
const DP={ el:null, box:null, ttl:null, grid:null, inp:null, y:0, m:0 };
let DP_SY=0, DP_LOCK=false;

function dpEnsure(){
  if(DP.el) return;
  const el=document.createElement("div");
  el.id="dpmask";
  el.innerHTML=
    '<div class="dp">'+
      '<div class="dp-head">'+
        '<button type="button" class="dp-nav" data-dpnav="-1">‹</button>'+
        '<div class="dp-ttl" data-dpttl="1"></div>'+
        '<button type="button" class="dp-nav" data-dpnav="1">›</button>'+
      '</div>'+
      '<div class="dp-wd"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>'+
      '<div class="dp-grid" data-dpgrid="1"></div>'+
      '<div class="dp-foot">'+
        '<button type="button" class="dp-q" data-dptoday="1">今天</button>'+
        '<button type="button" class="dp-q ghost" data-dpclear="1">清除</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(el);
  DP.el=el;
  DP.box=el.querySelector(".dp");
  DP.ttl=el.querySelector("[data-dpttl]");
  DP.grid=el.querySelector("[data-dpgrid]");
  el.addEventListener("click",e=>{
    if(e.target===el){ dpClose(); return; }          /* 点遮罩空白 */
    const nav=e.target.closest("[data-dpnav]");
    if(nav){
      DP.m+=parseInt(nav.dataset.dpnav,10);
      if(DP.m<0){ DP.m=11; DP.y--; }
      if(DP.m>11){ DP.m=0; DP.y++; }
      dpRender(); return;
    }
    const cell=e.target.closest("[data-dpiso]");
    if(cell){ dpPick(cell.dataset.dpiso); return; }
    if(e.target.closest("[data-dptoday]")){ dpPick(ddISO(bjDate())); return; }
    if(e.target.closest("[data-dpclear]")){ dpClear(); return; }
  });
  window.addEventListener("scroll",()=>{
    if(DP_LOCK){
      if(Math.abs(window.scrollY-DP_SY)>0.5) window.scrollTo(0,DP_SY);
      return;
    }
    if(DP.el&&DP.el.classList.contains("on")) dpClose();
  },{passive:true});
  /* 点日期显示层时先掐掉默认行为：否则部分机型会把页面轻微下滚一下 */
  document.addEventListener("pointerdown",function(ev){
    if(ev.target&&ev.target.closest&&ev.target.closest("[data-dshow]")&&ev.cancelable){
      ev.preventDefault();
    }
  },{passive:false});
}

function dpOpen(inp){
  dpEnsure();
  DP.inp=inp;
  DP_SY=window.scrollY;
  DP_LOCK=true;
  setTimeout(()=>{ DP_LOCK=false; }, 300);
  const iso=/^\d{4}-\d{2}-\d{2}$/.test(inp.value||"")? inp.value : "";
  const d=iso? new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)) : bjDate();
  DP.y=d.getFullYear(); DP.m=d.getMonth();
  const f=inp.closest(".dfield");
  const show=f? (f.querySelector(".dshow")||inp) : inp;
  const r=show.getBoundingClientRect();
  DP.el.classList.add("on");                        /* 先显示再量尺寸 */
  DP.box.style.left="0px"; DP.box.style.top="0px";
  const W=DP.box.offsetWidth||242, H=DP.box.offsetHeight||330;
  let left=r.left, top=r.bottom+6;
  if(left+W>window.innerWidth-10) left=window.innerWidth-10-W;
  if(left<10) left=10;
  if(top+H>window.innerHeight-8 && r.top>H+20) top=r.top-H-6;
  DP.box.style.left=left+"px";
  DP.box.style.top=top+"px";
  if(f) f.classList.add("on");
  dpRender();
  requestAnimationFrame(()=>{
    if(DP_LOCK && Math.abs(window.scrollY-DP_SY)>0.5) window.scrollTo(0,DP_SY);
  });
}

function dpClose(){
  DP_LOCK=false;
  if(DP.el) DP.el.classList.remove("on");
  $$(".dfield.on").forEach(f=>f.classList.remove("on"));
  DP.inp=null;
}

function dpRender(){
  if(!DP.ttl) return;
  DP.ttl.textContent=DP.y+"年"+(DP.m+1)+"月";
  const today=ddISO(bjDate());
  const sel=DP.inp? (DP.inp.value||"") : "";
  const firstWd=(new Date(DP.y,DP.m,1).getDay()+6)%7;    /* 周一 = 0 */
  const dim=daysInMonth(DP.y,DP.m);
  const prevY=DP.m===0? DP.y-1 : DP.y, prevM=(DP.m+11)%12;
  const prevDim=daysInMonth(prevY,prevM);
  const nextY=DP.m===11? DP.y+1 : DP.y, nextM=(DP.m+1)%12;
  const cells=[];
  for(let i=firstWd;i>0;i--){
    const d=prevDim-i+1;
    cells.push({d, iso:prevY+"-"+pad(prevM+1)+"-"+pad(d), out:1});
  }
  for(let d=1;d<=dim;d++) cells.push({d, iso:DP.y+"-"+pad(DP.m+1)+"-"+pad(d), out:0});
  let n=1;
  while(cells.length%7!==0) cells.push({d:n, iso:nextY+"-"+pad(nextM+1)+"-"+pad(n++), out:1});
  DP.grid.innerHTML=cells.map(c=>{
    const cls="dp-d"+(c.out?" out":"")+(c.iso===today?" today":"")+(c.iso===sel?" sel":"");
    return '<button type="button" class="'+cls+'" data-dpiso="'+c.iso+'">'+c.d+'</button>';
  }).join("");
}

function dpPick(iso){
  const inp=DP.inp; if(!inp) return;
  inp.value=iso;
  inp.setAttribute("value",iso);
  inp.dispatchEvent(new Event("change",{bubbles:true}));
  dpClose(); save();
}

function dpClear(){
  const inp=DP.inp; if(!inp) return;
  inp.value=""; inp.setAttribute("value","");
  inp.dispatchEvent(new Event("change",{bubbles:true}));
  dpClose(); save();
}

/* 一年中的第几周（周一为一周起点，简单按天整除） */
function weekNo(d){
  const start=new Date(d.getFullYear(),0,1);
  const diff=Math.floor((d-start)/86400000);
  return Math.floor(diff/7)+1;
}
/* 这一周是「当月的第几周」：归属月取该周周四所在的月（一周只会有一个编号），
   周数＝含该月 1 号的那一周算第 1 周 */
function weekOfMonth(mon){
  const thu=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+3);
  return { y:thu.getFullYear(), m:thu.getMonth(), n:Math.ceil(thu.getDate()/7) };
}
/* 统一文案：10月 第1周（9.28–10.04） */
function weekLabel(mon,sun){
  const w=weekOfMonth(mon);
  const f=x=>(x.getMonth()+1)+"."+pad(x.getDate());
  return (w.m+1)+"月 第"+w.n+"周（"+f(mon)+"–"+f(sun)+"）";
}

/* ---------- 周切片器 ----------
   周计划改成「一页只显示一周」：每周一个区块，切到没写过的周就新建一份空白，
   切回来内容原样在（与月区块同一套机制，只是粒度从月变成周）。 */

/* 任意日期 → 那一天的周一零点 */
function wkMondayOf(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x;
}
function wkMonISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
/* "yyyy-mm-dd" → Date（周一），非法返回 null */
function wkParseISO(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");
  if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return isNaN(d.getTime())?null:d;
}
/* 药丸上的短标签：10月 第1周 */
function wkMonLabel(mon){
  const w=weekOfMonth(mon);
  return (w.m+1)+"月 第"+w.n+"周";
}
/* 面板右侧的区间：9.28–10.04（跨月的周写全两头） */
function wkRangeTxt(mon){
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=x=>(x.getMonth()+1)+"."+pad(x.getDate());
  return f(mon)+"–"+f(sun);
}
/* 归属月为 y-m 的所有周（按周数升序，每周只出现一次） */
function wkMondaysOf(y,m){
  const dim=new Date(y,m+1,0).getDate(), seen={}, res=[];
  for(let d=1;d<=dim;d++){
    const mon=wkMondayOf(new Date(y,m,d));
    const w=weekOfMonth(mon);
    if(w.y!==y || w.m!==m) continue;
    if(seen[w.n]) continue;
    seen[w.n]=1; res.push({n:w.n, mon});
  }
  return res;
}
/* 面板：月份步进器 + 该月各周。年份跟着月份走，所以不需要年步进器 */
function wkPopHTML(y,m,curISO){
  const nowISO=wkMonISO(wkMondayOf(bjDate()));
  const rows=wkMondaysOf(y,m).map(o=>{
    const iso=wkMonISO(o.mon);
    return `<div class="wk-wrow${iso===curISO?" on":""}" data-wkw="${iso}">`+
      `<span class="wk-wdot${iso===nowISO?"":" gap"}"></span>`+
      `<span class="wk-wn">第${o.n}周</span>`+
      `<span class="wk-wr">${wkRangeTxt(o.mon)}</span>`+
    `</div>`;
  }).join("");
  return `<div class="mc-popin">`+
    `<div class="mc-popy">`+
      `<button type="button" class="mc-yb" data-wkprev="1">‹</button>`+
      `<span class="mc-yt">${y}年${m+1}月</span>`+
      `<button type="button" class="mc-yb" data-wknext="1">›</button>`+
    `</div>`+
    `<div class="mc-popline"></div>`+ rows +
  `</div>`;
}
/* 切到某一周（iso＝该周周一）：块不存在才新建空白周 */
function wkShow(pg,iso){
  const wrap=$("[data-wkwrap]",pg);
  const mon=wkParseISO(iso);
  if(!wrap||!mon) return;
  let blk=$(`.wk-week[data-wk="${iso}"]`,wrap);
  if(!blk){
    /* weekSection 自己就返回带 .wk-week/.on/data-wk 的整块，别再套一层 */
    const d=document.createElement("div");
    d.innerHTML=weekSection(iso,false,true,true);
    blk=d.firstElementChild;
    wrap.appendChild(blk);
    renumberOL(blk);
  }
  $$(".wk-week",wrap).forEach(b=>b.classList.toggle("on",b===blk));
  pg.dataset.wk=iso;
  const w=weekOfMonth(mon);
  pg.dataset.wky=w.y; pg.dataset.wkm=w.m;
  const lab=$("[data-wklab]",pg); if(lab) lab.textContent=wkMonLabel(mon);
  wkDates(blk);
}
function wkInitPage(pg){
  let iso=pg.dataset.wk;
  if(!iso || !wkParseISO(iso)) iso=wkMonISO(wkMondayOf(bjDate()));
  wkShow(pg,iso);
}

/* ---------- 饮食页：按周存档（与周计划同一套机制，内容换成 7 张日卡片）----------
   切到没写过的周＝新建一份空白（周一~周日七张卡），切回来原样在，绝不串周。 */
function fjShow(pg,iso){
  let wrap=$("[data-fjwrap]",pg);
  if(!wrap){                                   /* 老存档兜底：现造一个周容器 */
    wrap=document.createElement("div");

  pg.dataset.wky=w.y; pg.dataset.wkm=w.m;
  const lab=$("[data-wklab]",pg);
  if(lab) lab.textContent=wkMonLabel(mon);
}
function fjInitPage(pg){
  const d=wkParseISO(pg.dataset.wk);
  fjShow(pg, d ? wkMonISO(wkMondayOf(d)) : wkMonISO(wkMondayOf(bjDate())));
}
/* 老存档迁移：日计划的时间表补上 07 与 24 两行（原来 08–15 / 16–23 各 8 行）。
   已写的内容原样留在原行上，只在首尾各插一行空的。 */
function migrateDailyTimetable(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="daily")
    ? [scope] : $$('.page[data-tpl="daily"]',scope||book);
  let dirty=false;
  const mkRow=h=>{
    const d=document.createElement("div");
    d.className="tt-r";
    d.innerHTML=ttRowHTML(h);
    return d;
  };
  pages.forEach(pg=>{
    const tt=$(".tt",pg); if(!tt) return;
    const cols=$$(".tt-col",tt);
    /* 把所有列里的钟点行收拢起来，按小时排好，再铺成一列 07–24。
       一并兜住两种老存档：① 07–15 / 16–24 两列；② 08–15 / 16–23（缺首尾两行）。 */
    const rows=$$(".tt-r",tt);
    if(!rows.length) return;
    const byHour={};
    rows.forEach(r=>{
      const h=parseInt((($(".tt-h",r)||{}).textContent||"").trim(),10);
      if(h>=7&&h<=24&&!byHour[h]) byHour[h]=r;
    });
    const col=cols[0]||document.createElement("div");
    if(!cols.length){ col.className="tt-col"; tt.appendChild(col); }
    const want=[];
    for(let h=7;h<=24;h++){
      const r=byHour[h]||mkRow(h);
      want.push(r);
      if(!byHour[h]) dirty=true;
    }
    /* 多出来的行（重复小时 / 越界）清掉 */
    rows.forEach(r=>{ if(want.indexOf(r)<0){ r.remove(); dirty=true; } });
    /* 按顺序铺进第一列：已经是这个样子就不动，免得每次都白写一遍存档 */
    const cur=$$(".tt-r",col);
    if(cur.length!==want.length || cur.some((r,i)=>r!==want[i])){
      want.forEach(r=>col.appendChild(r));
      dirty=true;
    }
    cols.slice(1).forEach(c=>{ c.remove(); dirty=true; });
  });
  return dirty;
}
/* 老存档迁移：页头灰字 → 周药丸；日卡片按各自日期归到所在周，凑齐 7 天；去掉「＋ 加一天」 */
function migrateFoodWeeks(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="food")
    ? [scope] : $$('.page[data-tpl="food"]',scope||book);
  let dirty=false;
  pages.forEach(pg=>{
    const head=$(".fj-head",pg);
    if(head && !$("[data-wksel]",head)){
      const ttl=$(".p-title",head), sub=$(".sub",head);
      head.innerHTML=
        '<div class="fj-titlerow">'+
          (ttl?ttl.outerHTML:'<h1 class="p-title">Food Journal</h1>')+
          '<button type="button" class="mc-sel" data-wksel="1"><span data-wklab="1">—</span><span class="caret">▾</span></button>'+
          '<div class="mc-pop" data-wkpop="1"></div>'+
        '</div>'+
        (sub?sub.outerHTML:'<p class="sub" style="margin:0">饮食 · 运动记录</p>');
      dirty=true;
    }
    $$("[data-addday]",pg).forEach(b=>{ b.remove(); dirty=true; });
    if($("[data-fjwrap]",pg)) return;
    const days=$$(".fj-day",pg).filter(d=>!d.closest("[data-fjwrap]"));
    const weeks={}, order=[];
    const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    days.forEach(d=>{
      const inp=$(".dinput",d);
      const dt=wkParseISO(inp?inp.value:"")||bjDate();
      const wk=wkMonISO(wkMondayOf(dt)), v=isoOf(dt);
      if(!weeks[wk]){ weeks[wk]={used:{},extra:[]}; order.push(wk); }
      const fd=$(".fj-date",d);
      if(fd) fd.innerHTML='<span class="fj-d">'+v.slice(5).replace("-",".")+'</span>'+
                          '<span class="dwd set">'+weekdayOf(v)+'</span>';
      d.dataset.fjd=v;
      if(weeks[wk].used[v]) weeks[wk].extra.push(d); else weeks[wk].used[v]=d;
    });
    const wrap=document.createElement("div");
    wrap.className="fj-weeks"; wrap.dataset.fjwrap="1";
    if(days.length) days[0].parentElement.insertBefore(wrap,days[0]);
    else pg.appendChild(wrap);
    order.sort().forEach(wk=>{
      const mon=wkParseISO(wk);
      const box=document.createElement("div");
      box.className="fj-week"; box.dataset.wk=wk;
      let html="";
      for(let i=0;i<7;i++){
        const dd=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
        const v=isoOf(dd);
        const old=weeks[wk].used[v];
        html += old ? old.outerHTML : fjDayHTML(v);
      }
      box.innerHTML=html;
      weeks[wk].extra.forEach(d=>box.appendChild(d));   /* 同一天重复的卡片不丢，接在后面 */
      wrap.appendChild(box);
    });
    days.forEach(d=>d.remove());
    pg.dataset.wk=wkMonISO(wkMondayOf(bjDate()));
    dirty=true;
  });
  return dirty;
}
/* 周计划页头改版：标题「周计划」→「我的一周」、标题下加横线、
   每个周区块顶部补「周计划 + 该周日期范围」小标题与清单，
   并把页面级那份清单搬进当前那一周（它原来是切周不变的，现在按周存档） */
function migrateWeeklyPlan(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="weekly")
    ? [scope] : $$('[data-tpl="weekly"]',scope||book);
  let dirty=false;
  pages.forEach(pg=>{
    /* ① 标题文字 */
    const t=$(".wk-title",pg);
    if(t && t.textContent.trim()==="周计划"){ t.textContent="我的一周"; dirty=true; }
    /* ② 标题下的横线 */
    if(!$(".wk-hr-top",pg)){
      const d=document.createElement("div");
      d.className="wk-hr wk-hr-top";
      const head=$(".wk-head",pg);
      (head||pg.firstElementChild).after(d);
      dirty=true;
    }
    /* ③ 周区块顶部补「小标题 + 清单 + 下横线」（已有小标题＝已是新版，跳过） */
    $$(".wk-week",pg).forEach(blk=>{
      if($(".wk-ptitle",blk)) return;
      const pre=document.createElement("div");
      pre.className="wk-ptitle";
      pre.innerHTML='周计划<span class="wk-prange"></span>';
      const items=document.createElement("div");
      items.className="yp-items wk-items";
      const hr=document.createElement("div");
      hr.className="wk-hr wk-hr-bot";
      blk.insertBefore(pre,blk.firstChild);
      pre.after(items); items.after(hr);
      dirty=true;
    });
    /* ④ 页面级旧清单搬进当前那一周（不丢内容），搬完删掉空壳 */
    let old=$(".yp-items.wk-items",pg);
    if(old && old.parentElement!==pg) old=null;          /* 已经在区块里了 */
    if(old){
      const blk=$(".wk-week.on",pg) || $(".wk-week",pg);
      const target=blk?$(".wk-items",blk):null;
      if(target) while(old.firstChild) target.appendChild(old.firstChild);
      old.remove();
      dirty=true;
    }
    /* ⑤ 每天的 ＋ 从「周X」那一行挪到该天清单里（末尾占位）
       —— 只删掉旧按钮，renumberOL 会给每天的 .yp-items 重新挂上 */
    $$(".wk-drow .wk-add",pg).forEach(b=>{ b.remove(); dirty=true; });
  });
  return dirty;
}
/* 老存档的周计划页是「一周一个区块往下堆叠」（还有页头日期框与「＋新增一周」）。
   这里把每个已有区块按**它自己的日期**分别归位到周区块容器里 —— 必须逐个归位，
   只留当前那一个会丢掉用户写在其它周里的内容。 */
function migrateWeekly(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="weekly")
    ? [scope] : $$('[data-tpl="weekly"]',scope||book);
  let dirty=false;
  pages.forEach(pg=>{
    if($("[data-wkwrap]",pg)) return;
    const head=$(".wk-head",pg);
    const headInp=head?$(".dinput",head):null;
    const secs=$$(".wk-sec",pg);
    if(!secs.length) return;
    /* ① 逐块记下它属于哪一周（第一块的日期在页头，其余在自己的 .wk-top 里） */
    const keys=secs.map((sec,i)=>{
      const inp=$(".dinput",sec) || (i===0?headInp:null);
      const d=inp&&inp.value?wkParseISO(inp.value):null;
      return wkMonISO(d?wkMondayOf(d):wkMondayOf(bjDate()));
    });
    /* ② 去掉旧的日期行：药丸已经显示「几月第几周」，7 天日期列也各自有日期 */
    secs.forEach(sec=>{ const t=$(".wk-top",sec); if(t) t.remove(); });
    const nb=$(".wk-nextweek",pg); if(nb) nb.remove();
    const db=$(".wk-datebox",pg); if(db) db.remove();
    /* ③ 页头改成「标题 + 周药丸 + 面板」 */
    if(head){
      const mon=wkParseISO(keys[0])||wkMondayOf(bjDate());
      const w=weekOfMonth(mon);
      head.innerHTML=
        `<div class="wk-title">周计划</div>`+
        `<button type="button" class="mc-sel" data-wksel="1"><span data-wklab="1">${wkMonLabel(mon)}</span><span class="caret">▾</span></button>`+
        `<div class="mc-pop" data-wkpop="1"></div>`;
      pg.dataset.wky=w.y; pg.dataset.wkm=w.m;
    }
    /* ④ 全部塞进周区块容器；默认选中「今天所在的那一周」，没有就选第一块 */
    const wrap=document.createElement("div");
    wrap.className="wk-weeks"; wrap.dataset.wkwrap="1";
    const nowISO=wkMonISO(wkMondayOf(bjDate()));
    let selIdx=keys.indexOf(nowISO); if(selIdx<0) selIdx=0;
    secs.forEach((sec,i)=>{
      sec.classList.add("wk-week");
      sec.dataset.wk=keys[i];
      sec.classList.toggle("on",i===selIdx);
      wrap.appendChild(sec);
    });
    pg.appendChild(wrap);
    pg.dataset.wk=keys[selIdx];
    dirty=true;
  });
  return dirty;
}

/* ---------- 通用条目（年计划 / 周计划共用） ----------
   kind: task 任务框 | ul 无序 | ol 有序 | del 删除线        */
const KIND_NAME = {task:"任务", ul:"无序", ol:"有序", del:"删除线", plain:"纯文本"};

/* ==========================================================
   年计划条目 ↔ 周计划条目 的关联
   ----------------------------------------------------------
   周计划里写「背英语单词 50 个」，长按它 → 选月份 → 选该月下的年计划条目，
   挂上后条目后面接一个 @4月|背雅思单词 的标签（可以有多个）。
   靠 ID 认人：年计划条目被改名，标签跟着变；被删掉，标签变灰写「已删除」。
========================================================== */
const YPL_MAX=6;                      /* 一条最多挂几个，防误按长按挂出一串 */
let YPL_SEQ=0;
/* 给页面上所有年计划条目补一个稳定 ID（老存档迁移 + 新建时补） */
function yplEnsureIds(scope){
  let changed=false;
  $$(".yp-item",scope||book).forEach(it=>{
    if(it.closest('[data-tpl="weekly"]')) return;      /* 只给年计划条目编号 */
    if(!it.dataset.ypid){
      /* 时间戳 + 序号，保证刷新后不会撞 */
      it.dataset.ypid="y"+Date.now().toString(36)+(YPL_SEQ++).toString(36)+
        Math.floor(Math.random()*1296).toString(36);
      changed=true;
    }
  });
  return changed;
}
/* 全本的年计划条目：按月份分组，只返回有内容的（空行不给挂） */
function yplTargets(){
  const out=[];
  $$('.page[data-tpl="yearly"]',book).forEach(pg=>{
    $$(".yp-month",pg).forEach(mo=>{
      const m=parseInt(mo.dataset.m,10);
      const items=[];
      $$(".yp-item",mo).forEach(it=>{
        const txt=$(".yp-txt",it);
        const s=txt?txt.textContent.trim():"";
        if(!s) return;
        if(!it.dataset.ypid) yplEnsureIds(mo);
        items.push({id:it.dataset.ypid, text:s,
          kind:["task","ul","ol","plain"].filter(k=>it.classList.contains(k))[0]||"plain",
          struck:it.classList.contains("struck")||it.classList.contains("del")});
      });
      if(items.length) out.push({m:m, items:items});
    });
  });
  return out;
}
function yplRead(it){
  try{
    const a=JSON.parse(it.dataset.ypl||"[]");
    return Array.isArray(a)?a.filter(x=>x&&x.id):[];
  }catch(_){ return []; }
}
function yplWrite(it,arr){
  if(arr&&arr.length) it.dataset.ypl=JSON.stringify(arr);
  else it.removeAttribute("data-ypl");
}
/* 一条引用在标签上显示什么：@4月|背雅思单词 */
function yplTagHTML(ref){
  const hit=yplFind(ref.id);
  const dead=!hit;
  /* 原条目被删 → 明写「已删除」（旧名字只在 title 里留着，鼠标长按能看到） */
  const txt=dead?"已删除":hit.text;
  const mo=dead?(ref.m!=null?ref.m:""):hit.m;
  return `<span class="ypl-tag${dead?" dead":""}" data-yplref="${escAttr(ref.id)}"`+
    ` title="${dead?("原来指向："+escAttr(ref.t||"未知条目")):escAttr(txt)}">`+
    `<span class="ypl-at">@</span>${esc(mo)}月|${esc(txt)}`+
  `</span>`;
}
/* 按 ID 找那条年计划条目（顺便带出所属月份）；找不到＝已删除 */
function yplFind(id){
  if(!id) return null;
  let found=null;
  $$('.page[data-tpl="yearly"] .yp-item',book).some(it=>{
    if(it.dataset.ypid!==id) return false;
    const txt=$(".yp-txt",it);
    const mo=it.closest(".yp-month");
    found={el:it, text:txt?txt.textContent.trim():"", m:mo?parseInt(mo.dataset.m,10)+1:""};
    return true;
  });
  return found;
}
/* 把一条周计划条目上的标签渲染出来（挂在 .yp-txt 后面，可多个） */
function yplPaint(it){
  const txt=$(".yp-txt",it);
  if(!txt||!it.classList.contains("yp-item")) return;
  const host=txt.parentElement&&txt.parentElement.classList.contains("wk-item-txtwrap")
    ? txt.parentElement : null;
  $$(".ypl-box",it).forEach(b=>b.remove());
  const refs=yplRead(it);
  if(!refs.length) return;
  const box=document.createElement("span");
  box.className="ypl-box";
  box.innerHTML=refs.map(yplTagHTML).join("");
  /* 插在文字格（或旧存档遗留的 .wk-item-txtwrap 包裹层）之后，保证是 .yp-item 直接子级
     —— 若插进收缩的 wrap 里，标签会贴在文字旁、离行尾 ⇄ 一大截 */
  (host||txt).insertAdjacentElement("afterend",box);
}
function yplRefreshAll(){
  $$('.page[data-tpl="weekly"] .yp-item,[data-wk] .yp-item',book).forEach(it=>yplPaint(it));
  yplPaintYearly();          /* 年计划条目上的「被引用」徽标跟着一起刷新 */
}
/* 找出引用某条年计划条目（按 ID）的所有周计划条目 —— 数组顺序＝周计划的先后 */
function yplUsers(id){
  const out=[];
  if(!id) return out;
  $$('.page[data-tpl="weekly"] .yp-item,[data-wk] .yp-item',book).forEach(w=>{
    if(yplRead(w).some(r=>r.id===id)) out.push(w);
  });
  return out;
}
/* 年计划条目行尾挂一个「被引用」徽标（N 个 → 显示 @ 与数量） */
function yplPaintYearly(){
  $$('.page[data-tpl="yearly"] .yp-item',book).forEach(it=>{
    $$(".yp-refbadge",it).forEach(b=>b.remove());
    const id=it.dataset.ypid; if(!id) return;
    const users=yplUsers(id);
    if(!users.length) return;                 /* 没被引用就不显示 */
    const bd=document.createElement("span");
    bd.className="yp-refbadge";
    bd.dataset.ypref="1";
    bd.dataset.ypid=id;
    bd.title="被 "+users.length+" 条周计划条目引用 · 点击查看详情";
    bd.innerHTML='<span class="ypl-at">@</span>'+
      (users.length>1?'<span class="cnt">'+users.length+'</span>':"");
    /* 插在「⇄ / S / ×」三个符号之前 —— 即所有符号的最左边 */
    const sw=$("[data-ypsw]",it);
    if(sw) sw.before(bd);
    else{ const del=$("[data-ypdel]",it); if(del) del.before(bd); else it.appendChild(bd); }
  });
}
/* 一条年计划条目的「本周条目文字」（用于详情页表格的「任务」列） */
function ypItemText(it){
  const tx=$(".yp-txt",it)||$(".fin",it);
  return tx?tx.textContent.trim():"";
}


/* 行尾的「缩进」按钮：Tab 符号两条直线 + 圆头，同一个按钮两态（缩进 / 反向）。
   放在 ⇄ 前面。老存档里的条目由 load() 里的迁移补上。 */
const YP_IND_SVG_IN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14"/><path d="M7.5 12h10"/><path d="M13.5 8l4 4-4 4"/></svg>';
const YP_IND_SVG_OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5v14"/><path d="M16.5 12h-10"/><path d="M10.5 8l-4 4 4 4"/></svg>';
const YP_IND_HTML='<button class="yp-iw" data-ypind="1" type="button" title="缩进 / 退回">'+
  '<span class="in">'+YP_IND_SVG_IN+'</span>'+
  '<span class="out">'+YP_IND_SVG_OUT+'</span></button>';
function ypItem(kind){
  /* 所有类型共用同一个 .yp-mark 容器，保证图标与文字中心在同一横线 */
  const inner = kind==="task" ? '<span class="box"></span>' : "";
  const cls   = kind==="del" ? ' class="del"' : "";
  const ph    = kind==="plain" ? "写点文字…" : (KIND_NAME[kind]||"内容");
  return `<div class="yp-item ${kind}">`+
    `<span class="yp-mark"${cls}>${inner}</span>`+
    `<div class="yp-txt" contenteditable="true" data-ph="${ph}"></div>`+
    YP_IND_HTML+
    `<button class="yp-sw" data-ypsw="1" title="切换类型">⇄</button>`+
    `<button class="yp-st" data-ypst="1" title="删除线">S</button>`+
    `<button class="yp-del" data-ypdel="1" title="删除">×</button>`+
  `</div>`;
}

/* 类型循环：任务 → 无序 → 有序 → 纯文本 → 任务
   （删除线不再是类型 —— 它是对选中文字施加的格式，不参与轮换） */
function nextKind(cur){
  const order=["task","ul","ol","plain"];
  if(order.indexOf(cur)<0) return "task";     /* 旧的 del 条目：下一步回到任务 */
  return order[(order.indexOf(cur)+1)%order.length];
}
/* 读一条 .yp-item 现在的类型（task / ul / ol / plain） */
function ypKindOf(it){
  if(!it||!it.classList) return "task";
  if(it.classList.contains("task")) return "task";
  if(it.classList.contains("ul")) return "ul";
  if(it.classList.contains("ol")) return "ol";
  return "plain";
}
/* 原地换一条 .yp-item 的类型。**必须保住**：文字 / 整行删除线 / 缩进 / 打勾 /
   data-tt（排到时间表的时段）/ data-ypid（年计划关联 ID）。
   换类型是重建节点，漏拷贝哪个就会「换个类型把排期也弄丢了」。 */
function setYPKind(it, kind){
  if(!it||!kind) return it;
  const txt=$(".yp-txt",it);
  const html=txt?txt.innerHTML:"";
  const d=document.createElement("div");
  d.innerHTML=ypItem(kind);
  const ni=d.firstElementChild;
  const nt=$(".yp-txt",ni);
  if(nt && html) nt.innerHTML=html;
  if(it.classList.contains("struck")){
    ni.classList.add("struck");               /* 符号变了（圆点↔序号），起笔位置要重算 */
    const off=markContentLeft(ni);
    ni.style.setProperty("--strike-x",(off==null?0:off).toFixed(2)+"px");
  }
  if(it.classList.contains("ind")) ni.classList.add("ind");
  if(it.classList.contains("done")) ni.classList.add("done");
  ["tt","ypid","ttauto"].forEach(k=>{ if(it.dataset[k]!=null) ni.dataset[k]=it.dataset[k]; });
  it.replaceWith(ni);
  return ni;
}

/* 打开「添加」类型菜单（年计划月份、周计划通用）
   kinds 可指定要出现哪些类型，默认四种 */
const MENU_ICON={
  task:'<span class="box"></span>',
  ul:'<span class="dot"></span>',
  ol:'<span class="num">1.</span>',
  strike:''
};
const MENU_LABEL={task:"任务", ul:"无序", ol:"有序", plain:"纯文本", strike:"删除线"};
function openAddMenu(items, kinds){
  const ex=$(".yp-menu",items);
  if(ex){ ex.remove(); return; }
  closeFitMenu();
  const list=kinds? kinds.split(",") : ["task","ul","ol","plain","strike"];
  const menu=document.createElement("div");
  menu.className="yp-menu";
  menu.dataset.kinds=list.join(",");   /* 列表被整体重画时按它原样开回来 */
  menu.innerHTML=list.map(k=>{
    const ic=MENU_ICON[k];
    return `<button type="button" data-kind="${k}">`+
      (ic?`<span class="mi">${ic}</span>`:"")+
      `<span>${MENU_LABEL[k]||k}</span></button>`;
  }).join("");
  /* 插在占位 ＋ 的上一行 —— 就是「准备写的那一行」，菜单本身占位、加号与横线一起下移 */
  const slot=$(".yp-addslot",items);
  if(slot) slot.before(menu); else items.appendChild(menu);
  ensureVisible(menu,true);
  return menu;
}

/* ==========================================================
   长按周计划条目 → 关联到年计划（选月份 → 选该月条目）
========================================================== */
let YPL_LP=null, YPL_ITEM=null, YPL_MONTH=null;
function yplClose(){
  $$(".ypl-pop").forEach(p=>p.remove());
  $$(".ypl-lp").forEach(b=>b.classList.remove("ypl-lp"));
  YPL_ITEM=null; YPL_MONTH=null;
}
/* 面板挂页级（周区块会被 display:none，挂块里会跟着藏） */
function yplHost(it){
  const pg=it.closest(".page");
  return pg||document.body;
}
function yplOpen(it){
  const cur=yplRead(it);
  yplClose();
  YPL_ITEM=it;
  it.classList.add("ypl-lp");
  const pg=yplHost(it);
  const pop=document.createElement("div");
  pop.className="ypl-pop";
  pop.dataset.yplpop="1";
  pop.innerHTML=yplMonthHTML();
  pg.appendChild(pop);
  /* 定位在条目下方；贴边就往回收 */
  const r=it.getBoundingClientRect(), pr=pg.getBoundingClientRect();
  const W=Math.min(232,pr.width-8);
  pop.style.width=W+"px";
  const left=Math.max(0,Math.min(r.left-pr.left,pr.width-W));
  pop.style.left=left+"px";
  pop.style.top=(r.bottom-pr.top+6)+"px";
  if(typeof ensureVisible==="function") ensureVisible(pop,true);
  return pop;
}
/* 第一步：1–12 月，只列有内容的月份；已挂过的月份打个点 */
function yplMonthHTML(){
  const all=yplTargets();
  const refs=YPL_ITEM?yplRead(YPL_ITEM):[];
  const linkedMonths={};
  refs.forEach(r=>{
    const hit=yplFind(r.id);
    if(hit&&hit.m) linkedMonths[hit.m]=(linkedMonths[hit.m]||0)+1;
  });
  let rows="";
  for(let m=1;m<=12;m++){
    const hit=all.find(x=>x.m===m-1);
    const n=hit?hit.items.length:0;
    const li=linkedMonths[m]||0;
    if(!n){
      rows+=`<div class="ypl-mo empty"><span class="nm">${m}月</span><span class="ct">—</span></div>`;
    }else{
      rows+=`<button type="button" class="ypl-mo" data-yplmo="${m-1}">`+
        `<span class="nm">${m}月</span>`+
        (li?`<span class="linked">已关联 ${li}</span>`:"")+
        `<span class="ct">${n}</span></button>`;
    }
  }
  return `<div class="ypl-hd">关联到年计划</div>`+
    `<div class="ypl-sub">选月份</div>`+
    `<div class="ypl-list">${rows}</div>`+
    `<div class="ypl-ft">长按条目 · 再点同一条取消关联</div>`;
}
/* 第二步：该月下的所有条目，已关联的显示勾选；点一下＝切换 */
function yplItemsHTML(m){
  const all=yplTargets();
  const hit=all.find(x=>x.m===m);
  const refs=YPL_ITEM?yplRead(YPL_ITEM):[];
  const linked={};
  refs.forEach(r=>{ linked[r.id]=true; });
  if(!hit||!hit.items.length) return "";
  const mark={"task":'<span class="box"></span>',"ul":'<span class="dot"></span>',
              "ol":'<span class="num">1.</span>',"plain":""};
  const rows=hit.items.map(x=>{
    const on=!!linked[x.id];
    return `<button type="button" class="ypl-it${on?" on":""}" data-yplit="${escAttr(x.id)}">`+
      `<span class="mk">${mark[x.kind]||""}</span>`+
      `<span class="tx${x.struck?" struck":""}">${esc(x.text)}</span>`+
      `<span class="ck">${on?"✓":""}</span></button>`;
  }).join("");
  return `<div class="ypl-hd"><button type="button" class="ypl-back" data-yplback="1">‹</button>`+
    `${m+1}月的条目</div>`+
    `<div class="ypl-sub">点一下关联 / 再点取消 · 可多选</div>`+
    `<div class="ypl-list">${rows}</div>`+
    `<div class="ypl-ft">选完浮窗自动收起</div>`;
}
/* 挂上 / 取消一条，写进条目的 data-ypl，并把后面要显示的文本快照一起存 */
function yplToggle(it,id){
  const refs=yplRead(it);
  const i=refs.findIndex(r=>r.id===id);
  if(i>=0){
    refs.splice(i,1);
    toast("已取消关联");
  }else{
    if(refs.length>=YPL_MAX){ toast("一条最多关联 "+YPL_MAX+" 个"); return; }
    const hit=yplFind(id);
    if(!hit){ toast("这条年计划条目已经不在了"); return; }
    refs.push({id:id, t:hit.text, m:hit.m});
    toast("已关联到 "+hit.m+"月|"+hit.text);
  }
  yplWrite(it,refs);
  yplPaint(it);
  yplPaintYearly();          /* 年计划条目上的 @ 徽标跟着增删 */
  save();
}

/* ==========================================================
   年计划条目详情页（全屏覆盖层）
   ----------------------------------------------------------
   入口两个：年计划条目行尾的 @ 徽标；周计划条目上的 @ 标签。
   返回时回到「来路」那一页（谁点进来就回谁那儿）。
========================================================== */
let YPD_ID=null;              /* 当前打开的条目 ID */
let YPD_FROM=null;            /* 来路：null=年计划页 / {el:周计划条目} */
/* 该条目被引用的每条周计划条目 → 一行（任务 / week / 是否完成） */
function ypdRows(id){
  const hit=yplFind(id);
  const out=[];
  $$('.page[data-tpl="weekly"] .yp-item,[data-wk] .yp-item',book).forEach(w=>{
    if(!yplRead(w).some(r=>r.id===id)) return;
    /* 所属周：条目最近的 [data-wk]（周区块 / 周计划页） */
    const wkEl=w.closest("[data-wk]");
    const iso=(wkEl&&wkEl.dataset.wk)||"";
    const mon=iso?wkParseISO(iso):null;
    /* week 列＝该周周一在该条目所属月份里的第几周（weekOfMonth 返回 {y,m,n}） */
    let wkTxt="—";
    if(mon && hit){
      const d=new Date(mon);
      if(d.getMonth()!==hit.m-1) d.setDate(1);   /* 跨月周：按该月第一天归属的周算 */
      const w=weekOfMonth(d);
      wkTxt="W"+w.n;
    }
    const isTask=w.classList.contains("task");
    out.push({el:w, text:ypItemText(w)||"（空）", wk:wkTxt,
      task:isTask, done:w.classList.contains("done")});
  });
  return out;
}
/* 详情页完整 HTML */
function ypdHTML(id){
  const hit=yplFind(id);
  if(!hit) return "";
  const rows=ypdRows(id);
  const tasks=rows.filter(r=>r.task);
  const total=tasks.length;                       /* 总任务数＝被引用的「任务」型条目数 */
  const doneN=tasks.filter(r=>r.done).length;
  const pct=total?Math.round(doneN/total*100):0;
  const trs=rows.length
    ? rows.map(r=>
        `<div class="tr">`+
          `<div class="c1${r.task?"":" dim"}">${esc(r.text)}</div>`+
          `<div class="c2">${esc(r.wk)}</div>`+
          (r.task
            ? `<div class="c3"><span class="ypd-ck ${r.done?"on":"off"}"></span></div>`
            : `<div class="c3"><span class="ypd-ck na">—</span></div>`)+
        `</div>`).join("")
    : `<div class="ypd-empty">还没有周计划条目关联到这条</div>`;
  /* 截止日期：默认该月最后一天；已存过就用存的 */
  const y=TODAY.getFullYear();
  const due=hit.el.dataset.ypdue||(y+"-"+pad(hit.m)+"-"+pad(daysInMonth(y,hit.m-1)));
  return `<div class="ypd-card">`+
    `<div class="ypd-back" data-ypdback="1"><span class="arw">‹</span><span>返回</span></div>`+
    `<div class="ypd-name" contenteditable="true" data-ypdname="1">${esc(hit.text)}</div>`+
    `<div class="ypd-row"><div class="lb">动机</div>`+
      `<div class="ypd-motive" contenteditable="true" data-ypdnote="1">${esc(hit.el.dataset.ypnote||"")}</div></div>`+
    `<div class="ypd-row"><div class="lb">总任务数</div><div class="vl">${total}</div></div>`+
    `<div class="ypd-row"><div class="lb">已完成</div><div class="vl">${doneN}</div></div>`+
    `<div class="ypd-row"><div class="lb">完成度</div>`+
      `<div class="ypd-prog"><div class="bar"><i style="width:${pct}%"></i></div>`+
      `<span class="pct">${pct}%</span></div></div>`+
    `<div class="ypd-sec">关联的周任务</div>`+
    `<div class="ypd-tbl">`+
      `<div class="th"><div class="c1">任务</div><div class="c2">week</div><div class="c3">是否完成</div></div>`+
      trs+
    `</div>`+
    `<div class="ypd-row" style="margin-top:18px"><div class="lb">截止日期</div>`+
      `<div class="ypd-due">`+
        `<span class="dt" contenteditable="true" data-ypddue="1">${esc(due)}</span>`+
        ypdDueHint(due)+
      `</div></div>`+
  `</div>`;
}
/* 截止日期后面的「（距截止日余 x 天）」三态 */
function ypdDueHint(due){
  const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((due||"").trim());
  if(!m) return "";
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  if(isNaN(d.getTime())) return "";
  const t0=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
  const n=Math.round((d-t0)/86400000);
  if(n>0)  return `<span class="hint">（距截止日余 ${n} 天）</span>`;
  if(n===0)return `<span class="hint warn">（今天截止）</span>`;
  return `<span class="hint over">（已逾期 ${-n} 天）</span>`;
}
function ypdOpen(id,fromEl){
  const hit=yplFind(id);
  if(!hit){ toast("这条年计划条目已经不在了"); return; }
  ypdClose();
  YPD_ID=id;
  YPD_FROM=fromEl||null;
  const d=document.createElement("div");
  d.className="yp-detail";
  d.dataset.ypdetail="1";
  d.innerHTML=ypdHTML(id);
  document.body.appendChild(d);
  d.scrollTop=0;
}
function ypdClose(){
  $$(".yp-detail").forEach(e=>e.remove());
  YPD_ID=null; YPD_FROM=null;
}
/* 详情页里改的东西（条目名 / 动机 / 截止日期）写回年计划条目 → 同步存档 + 重画标签 */
function ypdSyncField(field,val){
  if(!YPD_ID) return;
  const hit=yplFind(YPD_ID);
  if(!hit) return;
  if(field==="name"){
    const tx=$(".yp-txt",hit.el);
    if(tx && tx.textContent!==val) tx.textContent=val;
  }else if(field==="note"){
    hit.el.dataset.ypnote=val;
  }else if(field==="due"){
    hit.el.dataset.ypdue=val;
  }
  /* 年计划条目改了名 → 周计划上的标签跟着变 */
  yplRefreshAll();
  save();
}

/* ---------- 删除线：对「选中的文字」施加 / 移除 ----------
   点 ＋ 会让编辑区失焦、选中态被清空，所以平时就用 selectionchange 把最近一次
   有效选中（以及光标所在条目）记下来，点菜单里的「删除线」时再恢复。 */
let SEL_RANGE=null, SEL_BOX=null;
/* 程序化施加删除线（execCommand）时会触发一次 input 事件 →
   别让「写满自动加一行」误判成用户在写字 */
let EXEC_STRIKE=false;
document.addEventListener("selectionchange",function(){
  const s=window.getSelection();
  if(!s||!s.rangeCount) return;
  const r=s.getRangeAt(0);
  const node=r.startContainer.nodeType===1 ? r.startContainer : r.startContainer.parentElement;
  const box=node&&node.closest ? node.closest(".yp-txt,.fin") : null;
  if(!box){ SEL_RANGE=null; SEL_BOX=null; return; }
  SEL_BOX=box;
  SEL_RANGE = s.isCollapsed ? null : r.cloneRange();   /* isCollapsed 是属性，不是方法 */
});
/* 返回 "sel"（施加到选中文字）/ "item"（施加到整条）/ null（没有可作用的目标） */
function applyStrike(){
  const S=window.getSelection();
  try{
    if(SEL_RANGE && document.contains(SEL_RANGE.commonAncestorContainer)){
      SEL_BOX.focus();
      S.removeAllRanges(); S.addRange(SEL_RANGE);
      EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
      SEL_RANGE=null;
      return "sel";
    }
    if(SEL_BOX && document.contains(SEL_BOX)){
      SEL_BOX.focus();
      const r=document.createRange(); r.selectNodeContents(SEL_BOX);
      S.removeAllRanges(); S.addRange(r);
      EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
      SEL_RANGE=null;
      return "item";
    }
  }catch(_){ EXEC_STRIKE=false; }
  return null;
}

/* 量「符号内容」在标记列里的左缘（相对标记列），供桥接线起笔用：
   task 的框 / ol 的数字是真实节点，Range 能量到；ul 的圆点是 ::before 画的，
   Range 是空矩形 → 按几何算（列宽15、点4、居中 = 5.5px） */
/* 符号左边留多少"出头"：圆点只有 4px，线贴着它的左缘起笔会看不出是被划掉的 → 留 2px */
const OVERHANG={ul:2};
function markContentLeft(it){
  const mark=$(".yp-mark",it); if(!mark) return null;
  let cr=null;
  try{
    const rng=document.createRange(); rng.selectNodeContents(mark);
    cr=rng.getBoundingClientRect();
  }catch(_){}
  if(cr && cr.width>0) return cr.left - mark.getBoundingClientRect().left;
  if(it.classList.contains("ul")) return 5.5 - (OVERHANG.ul||0);
  return null;
}
/* 整行删除线：execCommand 已经把文字划上/取消，这里同步给行加/去 .struck
   （.struck 负责把横线延伸到符号上，与文字那条线接成一条） */
function toggleStruckRow(it){
  if(!it) return;
  if(it.classList.contains("struck")){ it.classList.remove("struck"); return; }
  const txt=$(".yp-txt",it)||$(".fin",it);   /* FIT 行的文字格是 .fin */
  const struck = !txt || /<(s|strike)\b/i.test(txt.innerHTML) ||
    getComputedStyle(txt).textDecorationLine.indexOf("line-through")>=0;
  if(struck){
    it.classList.add("struck");
    const off=markContentLeft(it);
    it.style.setProperty("--strike-x", (off==null?0:off).toFixed(2)+"px");
  }
}
/* 行内的 S 按钮：选中了字 → 只划选中的（不动符号）；
   光标在行内/没选中 → 划整行（符号一起划）；再点一次 → 取消 */
function strikeRow(it){
  const txt=$(".yp-txt",it)||$(".fin",it); if(!txt) return false;
  const S=window.getSelection();
  try{
    if(SEL_RANGE && SEL_BOX===txt && document.contains(SEL_RANGE.commonAncestorContainer)){
      txt.focus(); S.removeAllRanges(); S.addRange(SEL_RANGE);
      EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
      SEL_RANGE=null;
      save(); return true;
    }
    txt.focus();
    const r=document.createRange(); r.selectNodeContents(txt);
    S.removeAllRanges(); S.addRange(r);
    EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
    toggleStruckRow(it);
    /* 整行划完要把选区收起来：否则 selectionchange 会把「全选」记成有效选区，
       下一次点 S 走的是「只划选中部分」那条路 → .struck 永远去不掉 */
    try{
      const c=document.createRange(); c.selectNodeContents(txt); c.collapse(false);
      S.removeAllRanges(); S.addRange(c);
    }catch(_){}
    SEL_RANGE=null;
    save(); return true;
  }catch(_){ EXEC_STRIKE=false; }
  return false;
}
/* 点 S 时别让按钮抢走焦点、把文字选区清空（触摸端靠 selectionchange 快照兜底） */
document.addEventListener("mousedown",function(e){
  const b=e.target && e.target.closest ? e.target.closest("[data-ypst]") : null;
  if(b) e.preventDefault();
},true);

/* ---------- FIT 行（饮食页底部）：类型菜单 + 切换 + 删除线 ----------
   与 .yp-item 共用一套：标记列用 .yp-mark（⇄ 换类型时符号会变，桥接线起笔要重算），
   文字格是 .fin（所以 strikeRow / toggleStruckRow 里按 .yp-txt || .fin 取） */
const FIT_TYPES=["task","ul","ol","plain"];
let FIT_MENU_ROW=null;
let __fitMigrated=false;                 /* 老存档补结构 → 写回一次 */
function fitMarkHTML(kind){
  if(kind==="task") return '<span class="box"></span>';
  if(kind==="plain") return '<span class="fitplus">＋</span>';
  return "";                             /* ul 的圆点 / ol 的序号由 CSS 或编号生成 */
}
/* 有序编号按每个 FIT 列表独立重排 */
function fitRenumber(scope){
  const lists = (scope && scope.classList && scope.classList.contains("grow-list")) ? [scope]
              : (scope ? $$(".grow-list",scope) : $$(".grow-list"));
  lists.forEach(list=>{
    let n=0;
    $$(".fit-row",list).forEach(it=>{
      if(!it.classList.contains("ol")) return;
      n++;
      const mk=$(".yp-mark",it);
      if(mk) mk.textContent=n+".";
      if(it.classList.contains("struck")){
        const off=markContentLeft(it);   /* 序号变宽（9.→10.）→ 起笔位置重算 */
        if(off!=null) it.style.setProperty("--strike-x",off.toFixed(2)+"px");
      }
    });
  });
}
function fitSetKind(row,kind){
  row.classList.remove("task","ul","ol","plain");
  row.classList.add(kind);
  const mk=$(".yp-mark",row);
  if(mk) mk.innerHTML=fitMarkHTML(kind);
  if(kind!=="task"){
    $$(".box",row).forEach(b=>b.classList.remove("on"));
    row.classList.remove("done");
  }
  fitRenumber(row.parentElement);
  if(row.classList.contains("struck")){
    const off=markContentLeft(row);
    row.style.setProperty("--strike-x",(off==null?0:off).toFixed(2)+"px");
  }
}
function fitNextKind(row){
  const cur=FIT_TYPES.filter(k=>row.classList.contains(k))[0]||"plain";
  fitSetKind(row, nextKind(cur));
}
/* 复用 strikeRow：文字格按 .yp-txt || .fin 取，符号列都是 .yp-mark */
function fitStrikeRow(row){ return strikeRow(row); }
function fitDelRow(row){
  const list=row.parentElement;
  if(!list || $$(".fit-row",list).length<=1){
    const ce=$(".fin",row); if(ce) ce.textContent="";
    $$(".box",row).forEach(b=>b.classList.remove("on"));
    row.classList.remove("done","struck"); row.style.removeProperty("--strike-x");
    return;
  }
  row.remove(); fitRenumber(list);
}
/* 菜单就是「准备写的那一行」：临时把这一行藏起来，菜单占在它原来的位置（不新增行） */
function openFitMenu(row){
  closeFitMenu();
  const menu=document.createElement("div");
  menu.className="yp-menu"; menu.dataset.fitrow="1";
  menu.innerHTML=["task","ul","ol","plain","strike"].map(k=>{
    const ic=MENU_ICON[k];
    return `<button type="button" data-kind="${k}">`+
      (ic?`<span class="mi">${ic}</span>`:"")+
      `<span>${MENU_LABEL[k]||k}</span></button>`;
  }).join("");
  row.classList.add("fit-menu");       /* 行让位 */
  row.after(menu);                     /* 菜单落在这一行的位置 */
  FIT_MENU_ROW=row;
  ensureVisible(menu,true);
}
/* 收菜单＝菜单消失 + 那一行回到原位（少了这步，行会被永久藏住） */
function closeFitMenu(){
  $$(".yp-menu",document).forEach(m=>m.remove());

}
/* FIT 行：plain 类型有文字时，隐藏行首的 ＋，让第一个字占据它的位置 */
function fitPaintRows(scope){
  $$(".fit-row",scope||document).forEach(row=>{
    const fin=$(".fin",row);
    row.classList.toggle("has-txt", !!(fin && fin.textContent.trim()));
  });
}
/* 老存档 / 老自定义模板里补上标记列与 ⇄/S/×（幂等） */
function fitNormalize(scope){
  let changed=false;
  $$(".fit-row",scope||document).forEach(row=>{
    $$(".del-item",row).forEach(b=>{ b.remove(); changed=true; });   /* 以前挂的独立 × */
    let mk=$(".yp-mark",row);
    if(!mk){
      mk=document.createElement("span");
      mk.className="yp-mark";
      const ft=$(".ftag",row);
      if(ft) ft.after(mk); else row.insertBefore(mk,row.firstChild);
      changed=true;
    }
    if(!FIT_TYPES.some(k=>row.classList.contains(k))){ row.classList.add("plain"); changed=true; }
    if(!$(".yp-sw",row)){
      const fin=$(".fin",row);
      const frag=document.createElement("div");
      frag.innerHTML='<button class="yp-sw" data-ypsw="1" title="切换类型">⇄</button>'+
        '<button class="yp-st" data-ypst="1" title="删除线">S</button>'+
        '<button class="yp-del" data-ypdel="1" title="删除">×</button>';
      const __nodes=[...frag.children];
      if(fin) fin.after(...__nodes); else row.append(...__nodes);
      changed=true;
    }
    if(!mk.children.length && !mk.textContent.trim()){
      const k=FIT_TYPES.filter(x=>row.classList.contains(x))[0];
      if(k==="task"||k==="plain"){ mk.innerHTML=fitMarkHTML(k); changed=true; }
    }
  });
  if(scope) fitRenumber(scope);
  if(changed) __fitMigrated=true;
  return changed;
}

/* ==========================================================
   索引：自动扫描全本，按页面类型归类
========================================================== */
/* 取一页的摘要文字（日期优先，其次标题，其次类型名） */
function pageSummary(pg){
  const t=pg.dataset.tpl||"";
  /* 周计划 / 饮食页 → 当前这一周：x月 第x周（m.d–m.d）。格式与页内药丸、周面板同源（weekLabel）。
     **自己从 pg.dataset.wk 算，不读页内元素** ——
     · 周计划的页内日期行（.wk-top / [data-weekrange]）已被 migrateWeekly 有意移除；
     · 饮食页只有短的周药丸（它是可点按钮，塞不下区间）。
     切周时 wkShow/fjShow 会更新 data-wk，且选周处理末尾有 autoIndex()，摘要始终跟得上。 */
  if(t==="weekly"||t==="food"){
    const mon=wkParseISO(pg.dataset.wk||"");
    if(!mon) return "—";
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    return weekLabel(mon,sun);
  }
  /* 日历格 → 当前月份 + 当前分类 */
  if(t==="calgrid"){
    const m=parseInt(pg.dataset.mcm,10);
    return (isNaN(m)?"—":(m+1)+"月")+(pg.dataset.cat?" · "+pg.dataset.cat:"");
  }
  /* 计时模式 → 页面那天的日期（+ 已记录几条） */
  if(t==="timer"){
    const iso=pg.dataset.tbday||"";
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    const base=m? (m[2].replace(/^0/,"")+"."+m[3]+(weekdayOf(iso)?" "+weekdayOf(iso):"")) : "—";
    const n=$$(".tb-rec[data-tbrec]",pg).length;
    return base+(n? " · "+n+" 条记录":"");
  }
  /* 每日记录 → 当前月份 */
  if(t==="daynote"){
    const m=parseInt(pg.dataset.mcm,10);
    return (isNaN(m)?"—":(m+1)+"月")+" · 一天一行";
  }
  /* 空白任务表 → 当前日期 + 星期 */
  if(t==="tasklist"){
    /* 用户改过标题就用标题识别；标题空才回退日期 */
    const tt=$("[data-tlttl]",pg);
    const nm=tt?tt.textContent.trim():"";
    if(nm) return nm;
    const iso=pg.dataset.tl||"";
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    return m? (m[2].replace(/^0/,"")+"."+m[3]+(weekdayOf(iso)?" "+weekdayOf(iso):"")) : "—";
  }
  /* 有日期字段的：用第一个日期 + 星期 */
  const di=$(".dinput",pg);
  if(di&&di.value){
    const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(di.value);
    if(m){
      const wd=weekdayOf(di.value);
      const base=m[1].replace(/^0/,"")+"."+m[2]+(wd?" "+wd:"");
      /* 日计划再带上 Focus 一句话 */
      if(t==="daily"){
        const f=$(".p-title",pg) && pg.querySelector("[data-ph^='今天最重要']");
        const txt=f?f.textContent.trim():"";
        return base + (txt&&txt!=="今天最重要的一件事" ? " · "+txt.slice(0,12) : "");
      }
      /* 饮食页带上天数 */
      if(t==="food"){ return base+" · "+pg.querySelectorAll(".fj-day").length+" 天"; }
      return base;
    }
  }
  /* 阅读记录 → 书名 */
  if(t==="reading"){
    /* Title 字段（data-ph="书名"）优先；老结构回退第一个 .fv */
    const f=pg.querySelector('.field .fv[data-ph="书名"]') || $(".field .fv",pg);
    const s=f?f.textContent.trim():"";
    return s||"（未命名书）";
  }
  /* 年计划 → 年份 */
  if(t==="yearly"){
    const y=$(".yp-year",pg);
    const n=pg.querySelectorAll(".yp-item").length;
    return (y?y.textContent:"—")+" 年 · "+n+" 条";
  }
  /* 年度日历 → 年份 */
  if(t==="yearcal"){ const y=$("[data-cyear]",pg); return (y?y.textContent:"—")+" 年"; }
  /* 月度计划 → 年 + 月 */
  if(t==="monthly"){
    const y=$("[data-myear]",pg), mo=pg.querySelector('[data-opt="mm"] .opt.on');
    return (y?y.textContent:"—")+" 年 "+(mo?mo.textContent:"—");
  }
  /* 打卡 → 月份；体重 → 年月 */
  if(t==="habit"){
    const s=$(".sub",pg); return s?s.textContent.trim().split(" · ")[0]:"—";
  }
  if(t==="weight"){
    const s=$(".sub",pg);
    if(s){ const a=s.textContent.trim().split(" · "); return a[a.length-1]||"—"; }
    return "—";
  }
  /* 空白 / 点阵 → 标题 */
  const h=pg.querySelector("h2.p-title");
  if(h){
    const s=h.textContent.trim();
    if(s && s!=="标题") return s;
  }
  const m=tplMeta(t);
  return m.n;
}

/* 重建索引页内容 */
/* 目录数据：类目 → 模板类型 → 页面。索引页和目录侧边栏共用同一份口径 */
function ixData(){
  const pages=$$(".page",book);
  const idx=pages.find(p=>p.dataset.tpl==="index");
  const out=[];
  GROUP_ORDER.forEach(g=>{
    const byTpl={};
    pages.forEach((pg,i)=>{
      if(pg===idx) return;                   // 索引不索引自己
      const t=pg.dataset.tpl||"blank";
      const meta=tplMeta(t);
      if(meta.g!==g) return;
      (byTpl[t]=byTpl[t]||[]).push({pg, no:i+1, tpl:t, meta:meta});
    });
    const types=Object.keys(byTpl).map(t=>({tpl:t, meta:byTpl[t][0].meta, list:byTpl[t]}));
    if(types.length) out.push({g:g, name:GROUP_NAME[g], types:types});
  });
  return out;
}
/* 平铺版：按页面实际顺序，不分组（抽屉与索引页共用） */
function ixFlat(){
  const pages=$$(".page",book);
  const idx=pages.find(p=>p.dataset.tpl==="index");
  const out=[];
  pages.forEach((pg,i)=>{
    if(pg===idx) return;
    const t=pg.dataset.tpl||"blank";
    out.push({pg:pg, no:i+1, tpl:t, meta:tplMeta(t)});
  });
  return out;
}
function buildIndex(){
  const idx=$$(".page",book).find(p=>p.dataset.tpl==="index");
  if(!idx) return;
  const body=$("[data-ixbody]",idx), stat=$("[data-ixstat]",idx);
  if(!body) return;

  const data=ixFlat();
  let html="";
  data.forEach(x=>{
    const tp=tplDispName(x.tpl, x.meta.n);
    html+=`<div class="ix-row" data-goto="${x.no}">`+
          `<span class="ix-ico"></span>`+
          `<span class="ix-tp">${esc(tp)}</span>`+
          `<span class="ix-sum">${esc(pageSummary(x.pg))}</span>`+
          `<span class="ix-no">${x.no}</span></div>`;
  });

  if(!data.length){
    body.innerHTML='<div style="font-size:11px;color:var(--ink3);padding:8px 0">还没有可归类的页面</div>';
  }else{
    body.innerHTML=html;
  }
  if(stat) stat.textContent=`共 ${data.length} 页`;
}

/* 索引页存在时，结构变动后自动重排 */
function autoIndex(){
  if($$(".page",book).some(p=>p.dataset.tpl==="index")) buildIndex();
}

/* ==========================================================
   年计划：重排有序列表编号（只数 ol 项）
========================================================== */
function renumberOL(scope){
  const roots = (scope&&scope.classList&&scope.classList.contains("yp-items")) ? [scope]
              : (scope ? $$(".yp-items",scope) : $$(".yp-items"));
  roots.forEach(items=>{
    let n=0;
    $$(".yp-item",items).forEach(it=>{
      if(it.classList.contains("ol")){
        n++;
        const mk=$(".yp-mark",it);
        if(mk) mk.textContent=n+".";
        /* 序号宽度变了（9.→10.），整行删除线的起笔位置跟着重算 */
        if(it.classList.contains("struck")){
          const off=markContentLeft(it);
          if(off!=null) it.style.setProperty("--strike-x", off.toFixed(2)+"px");
        }
      }
    });
    /* 月任务步骤格：不用 ＋ 占位，点进单元格直接弹类型菜单（见 click 里的 td.mt-step）
       老存档里可能已经烘进一个 ＋，这里顺手清掉 */
    if(items.classList.contains("mt-items")){
      $$(".yp-addslot",items).forEach(s=>s.remove());
      mtSyncEmpty(items.closest("table"));   /* 步骤格增删条目 → 重算哪些行是空行 */
    }
    /* 周计划清单与每天的清单：末尾始终挂一个「占位」＋
       （幂等，appendChild 对已存在的节点是移动）
       ＋ 落在 15px 标记列里 → 中心与勾选框、圆点、周字左缘同一条竖线 */
    if(items.classList.contains("wk-items")||items.closest(".wk-day")||
       items.classList.contains("dg-items")){
      let slot=$(".yp-addslot",items);
      if(!slot){
        slot=document.createElement("div");
        slot.className="yp-addslot";
        slot.innerHTML='<span class="yp-mark"><button type="button" class="wk-add" data-mk="1" data-kinds="task,ul,ol,plain,strike" title="添加一项">＋</button></span>';
      }
      items.appendChild(slot);
    }
  });
}

/* 从「今年重要日期」表格解析 月-日 集合（支持 10/18、10-18、10.18、10月18日、2026-10-18） */
function ycalImps(pg){
  const set=new Set();
  if(!pg) return set;
  $$("table tbody td:first-child",pg).forEach(td=>{
    const s=(td.textContent||"").trim(); if(!s) return;
    let m=/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/.exec(s);
    if(m){ set.add((+m[2])+"-"+(+m[3])); return; }
    m=/^(\d{1,2})\s*[\/\-\.月]\s*(\d{1,2})/.exec(s);
    if(m){ set.add((+m[1])+"-"+(+m[2])); }
  });
  return set;
}
/* 只切 class、不重绘：用户正在表格里打字时不会丢焦点 */
function ycalPaint(pg){
  pg=pg||$('.page[data-tpl="yearcal"]');
  if(!pg) return;
  const imps=ycalImps(pg);
  $$(".mg span[data-md]",pg).forEach(sp=>{
    sp.classList.toggle("imp", imps.has(sp.dataset.md));
  });
}
function yearGrid(y, imps){
  const MN=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  let out="";
  for(let m=0;m<12;m++){
    const dim=daysInMonth(y,m), first=new Date(y,m,1).getDay();
    let cells="";
    for(let i=0;i<first;i++) cells+='<span class="wk"></span>';
    for(let d=1;d<=dim;d++){
      const w=new Date(y,m,d).getDay();
      const isToday=(y===TODAY.getFullYear()&&m===TODAY.getMonth()&&d===TODAY.getDate());
      const isImp=!!(imps&&imps.has((m+1)+"-"+d));
      const cls=[(w===0||w===6)?'wk':'', isImp?'imp':'', isToday?'today':''].filter(Boolean).join(' ');
      cells+=`<span${cls?` class="${cls}"`:''} data-md="${m+1}-${d}">${d}</span>`;
    }
    const cur=(y===TODAY.getFullYear()&&m===TODAY.getMonth())?' style="font-weight:700;color:#c0392b"':'';
    out+=`<div class="mini-m"><div class="mh"${cur}>${MN[m]}</div><div class="mg">${cells}</div></div>`;
  }
  return out;
}

const MC_WD=["周日","周一","周二","周三","周四","周五","周六"];

/* ---------- 打卡页（本月打卡）----------
   视图＝一周 7 格（周一~周日），按周切换；月份切片器照旧。
   数据仍是「月区块里每行 31 个 .dot[data-d]」，切周只是把别的列收起来
   （.habgrid .off{display:none}）→ 切来切去一格都不会丢，也不用改存档结构。 */
/* 该月 1 号是周几（0=周一 … 6=周日） */
function hbFirstWd(y,m){ return (new Date(y,m,1).getDay()+6)%7; }
/* 日号 → 该月第几周（1 起） */
function hbWeekOfDay(y,m,day){
  const dim=daysInMonth(y,m);
  const d=Math.min(Math.max(day,1),dim);
  return Math.floor((hbFirstWd(y,m)+d-1)/7)+1;
}
function hbWeekCount(y,m){ return hbWeekOfDay(y,m,daysInMonth(y,m)); }
/* 第 k 周落在本月的日号（残周就是 4 天、3 天之类） */
function hbWeekDays(y,m,k){
  const out=[];
  for(let d=1;d<=daysInMonth(y,m);d++) if(hbWeekOfDay(y,m,d)===k) out.push(d);
  return out;
}
function hbWeekRangeTxt(y,m,k){
  const ds=hbWeekDays(y,m,k);
  if(!ds.length) return "—";
  const f=d=>(m+1)+"."+pad(d);
  return f(ds[0])+"–"+f(ds[ds.length-1]);
}
function hbWeekLabel(y,m,k){ return "第"+k+"周 "+hbWeekRangeTxt(y,m,k); }
/* 默认停在哪一周：显示的就是本月 → 停在含今天的那一周；否则第 1 周 */
function hbDefaultWeek(y,m){
  const total=hbWeekCount(y,m), t=bjDate();
  if(y!==t.getFullYear()||m!==t.getMonth()) return 1;
  return Math.min(hbWeekOfDay(y,m,t.getDate()),total);
}
function hbBody(y,m){
  const dim=daysInMonth(y,m);
  const habits=["睡眠","运动","阅读","早起","喝水","冥想"];
  const WD7=["周一","周二","周三","周四","周五","周六","周日"];
  /* 两个表头行都带上 data-w（第几周），切周时一起显隐 */
  let wd="",dt="";
  for(let d=1;d<=dim;d++){
    const w=hbWeekOfDay(y,m,d), idx=(hbFirstWd(y,m)+d-1)%7;
    wd+=`<div class="hw" data-w="${w}">${WD7[idx]}</div>`;
    dt+=`<div class="hh" data-w="${w}">${m+1}/${d}</div>`;
  }
  const rows=habits.map(h=>{
    let cells="";
    for(let d=1;d<=dim;d++)
      cells+=`<div class="hc" data-w="${hbWeekOfDay(y,m,d)}"><div class="dot" data-d="${d}"></div></div>`;
    return `<div class="hr"><div class="hname">`+
      `<span class="nm" contenteditable="true" data-ph="${h}">${h}</span></div>${cells}`+
      `<div class="hs" data-hbsum="1">0/0</div></div>`;
  }).join("");
  return `<div class="sect">`+
    `<div class="lbl"><span>习惯</span><span class="hint">长按名字可删除</span></div>`+
    `<div class="hb-streak" data-hbstreak="1"></div>`+
    `<div class="hscroll"><div class="habgrid">`+
      `<div class="hr hdr wdrow"><div class="hname"></div>${wd}`+
        `<div class="hs hs-hd"></div></div>`+
      `<div class="hr hdr"><div class="hname"></div>${dt}`+
        `<div class="hs hs-hd">小计</div></div>`+
      `${rows}`+
    `</div></div>`+
    `<button type="button" class="addrow" data-hbadd="1">＋ 新增一个习惯</button>`+
  `</div>`+
  `<div class="sect">`+
    `<div class="lbl"><span>月末小结</span><span class="hint">&lt;70% 的下月调整</span></div>`+
    `<div class="lined l4" contenteditable="true" data-ph="哪个习惯最难坚持？哪几天断了？原因是什么……"></div>`+
  `</div>`;
}
/* 每一行的小计：当前这一周里打了几个 / 这一周在本月有几天 */
function hbSums(blk,y,m,k){
  const ds=hbWeekDays(y,m,k);
  $$(".hr:not(.hdr)",blk).forEach(row=>{
    let on=0;
    ds.forEach(d=>{ const t=$('.dot[data-d="'+d+'"]',row);
      if(t&&t.classList.contains("on")) on++; });
    const cell=$("[data-hbsum]",row); if(cell) cell.textContent=on+"/"+ds.length;
  });
}
/* 全本所有月份区块里，每个习惯打过卡的日子（"yyyy-mm-dd" 集合）——连胜要跨月接着数 */
function hbAllSets(){
  const map={};
  $$('.page[data-tpl="habit"] .mc-month',book).forEach(mo=>{
    const ym=mo.dataset.ym; if(!ym) return;
    $$(".hr:not(.hdr)",mo).forEach(r=>{
      const nm=$(".nm",r); if(!nm) return;
      const s=nm.textContent.trim(); if(!s) return;
      const set=map[s]||(map[s]=new Set());
      $$(".dot",r).forEach(dt=>{
        const d=parseInt(dt.dataset.d,10);
        if(dt.classList.contains("on")&&d) set.add(ym+"-"+pad(d));
      });
    });
  });
  return map;
}
/* 连胜：从今天往回找最近一次打卡；它不是今天也不昨天 → 算断。
   连着的就继续往前数（跨月也算，只要前面的月份区块里有记录）。 */
function hbStreakOf(set,today){
  if(!set||!set.size) return {n:0, alive:false};
  const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  /* 从「最近一次打卡」往前数：今天没打、但已提前打了未来几天，也能看到连胜 */
  let last=null;
  set.forEach(s=>{ if(!last||s>last) last=s; });
  if(!last) return {n:0, alive:false};
  const d0=new Date(last+"T00:00:00");
  const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(Math.round((t0-d0)/86400000)>1) return {n:0, alive:false};
  let n=0, d=new Date(d0);
  while(set.has(iso(d))){ n++; d.setDate(d.getDate()-1); }
  return {n:n, alive:true};
}
/* 顶部一行：今天 + 还连着的习惯（断了的不出现） */
function hbStreakRow(pg,sets){
  const box=$("[data-hbstreak]",pg); if(!box) return;
  const t=bjDate();
  /* 连胜已下线：这里只保留「今天 X/X」标识 */
  box.innerHTML='<span class="today">今天 '+(t.getMonth()+1)+"/"+t.getDate()+"</span>";
}
/* 只显示 pg.dataset.hbw 那一周，并重算小计与连胜 */
function hbWeek(pg){
  if(!pg||pg.dataset.tpl!=="habit") return;
  const y=parseInt(pg.dataset.mcy,10), m=parseInt(pg.dataset.mcm,10);
  if(isNaN(y)||isNaN(m)) return;
  const blk=$(".mc-month.on",pg)||$(".mc-month",pg); if(!blk) return;
  const total=hbWeekCount(y,m);
  let k=parseInt(pg.dataset.hbw,10);
  if(isNaN(k)||k<1||k>total) k=hbDefaultWeek(y,m);
  pg.dataset.hbw=k;
  $$("[data-w]",blk).forEach(el=>el.classList.toggle("off", +el.dataset.w!==k));
  hbSums(blk,y,m,k);
  hbStreakRow(pg);
  const lab=$("[data-hblab]",pg);
  if(lab) lab.textContent=hbWeekLabel(y,m,k);
}
/* 周切片器：药丸 + 面板（沿用月切片器那套 .mc-sel / .mc-pop） */

function hbPopHTML(y,m,k){

/* 新增一个习惯行：日号列与当前月一致，行尾带小计格 */

/* ---------- 体重追踪 月份内容（原 12 个 .pill 月选择已移除，改用 .mc-sel） ---------- */
function wtBody(y,m){

/* 切到某年某月：该月的区块不存在才新建，已写的内容原样保留 */
function mcShow(pg,y,m){
  const wrap=$("[data-mcwrap]",pg);
  const ym=y+"-"+pad(m+1);
  let blk=wrap?$(`.mc-month[data-ym="${ym}"]`,pg):null;
  if(wrap){
    if(!blk){
      blk=document.createElement("div");
      blk.className="mc-month"; blk.dataset.ym=ym;
      blk.innerHTML=mcBody(pg,y,m);
      wrap.appendChild(blk);
      renumberOL(blk); mtSyncEmpty(blk);
    }
    $$("tr.mt-act",pg).forEach(r=>r.classList.remove("mt-act"));
    $$(".mc-month",pg).forEach(b=>b.classList.toggle("on",b===blk));
    /* 每行：先按内容决定要不要显示符号，再标出「今天」 */
    const td=bjDate();
    const isThisMonth = y===td.getFullYear() && m===td.getMonth();
    $$(".mc-row",blk).forEach(row=>{
      mcMarkRow(row);
      row.classList.toggle("today",
        isThisMonth && +row.dataset.d===td.getDate());
    });
    /* 每日记录：懒创建的老区块也要重标「今天」；顺便刷 ⊕ 互斥状态 */
    if(pg.dataset.tpl==="daynote"){
      $$(".dn-day",blk).forEach(row=>{
        row.classList.toggle("today",
          isThisMonth && +row.dataset.d===td.getDate());
      });
      dnMarkRows(pg);
    }
  }
  pg.dataset.mcy=y; pg.dataset.mcm=m;
  /* 月日历的标题写着当前月份（切月即变）：可切换年月的这个函数是唯一入口 */
  if(pg.dataset.tpl==="monthcal"){
    const ttl=$(".mc-title",pg); if(ttl) ttl.textContent=(m+1)+"月日历";
  }
  const lab=$("[data-mclab]",pg); if(lab) lab.textContent=y+" · "+pad(m+1)+"月";
  const wm=$("[data-mcwm]",pg);
  if(wm) wm.textContent = pg.dataset.tpl==="monthtask" ? (y+"年"+(m+1)+"月") : (y+"年");
  /* 三页：切月时副标题跟着变月份 */
  const sub=$(".sub",pg);
  if(sub){
    const t=pg.dataset.tpl;
    if(t==="habit") sub.textContent=(m+1)+" 月 · 习惯追踪";
    else if(t==="weight") sub.textContent="体重追踪 · "+y+"."+pad(m+1);
    else if(t==="booklist") sub.textContent="Reading list · "+y+"."+pad(m+1);
    else if(t==="calgrid") sub.textContent=(m+1)+" 月 · 每天一格";
  }
  /* 日历格：标题跟月份，再切到该月该看的分类 */
  if(pg.dataset.tpl==="calgrid"){
    const ttl=$(".mc-title",pg); if(ttl) ttl.textContent=(m+1)+"月日历";
    cgShow(pg,pg.dataset.cat);
  }
  if(pg.dataset.tpl==="weight") refreshWeight(pg);
  if(pg.dataset.tpl==="habit") hbWeek(pg);     /* 打卡页：切月后按当前周重排 + 重算小计/连胜 */
}
