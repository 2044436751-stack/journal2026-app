<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="uDyfRV8L024Y8ac2lTLvpE">
<head data-page-node-id="N6VygsMdRcBKxnpkaoAksG">
<meta charset="UTF-8" data-page-node-id="Q5O3hsg633CSkFCcYhy6bH">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" data-page-node-id="4ej97sMVQBMQLUolVU88Gy">
<title>日程本 2026</title>
<style>
:root{
  --ink:#1f1f1f; --ink2:#5a5a5a; --ink3:#9a9a9a;
  --line:#d5d5d5; --line2:#e8e8e8; --soft:#f4f4f2;
  --paper:#fff; --bg:#e9e9e6;
  --accent:#2f6f5e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); font-size:13px; line-height:1.6;
  padding:16px 12px 120px;
  -webkit-text-size-adjust:100%;
}
#book{max-width:420px;margin:0 auto}

/* ============ 页面卡片 ============ */
.page{
  position:relative; background:var(--paper);
  border:1px solid var(--line); border-radius:4px;
  padding:20px 18px 40px;
  min-height:640px; margin-bottom:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.05);
}
.page::after{
  content:attr(data-label);
  position:absolute; left:18px; bottom:6px;
  font-size:9px; letter-spacing:.08em; color:var(--ink3); text-transform:uppercase;
}
/* 页面类型标签和标题重复：月日历页不显示
   （注意 .page::after 实际贴的是左下角 left:18px;bottom:6px，不是右下角）
   若要全站都去掉，删掉选择器里的 [data-tpl="monthcal"] 即可 */
.page[data-tpl="monthcal"]::after{display:none}
.page[data-tpl="monthtask"]::after{display:none}
.page-num{
  position:absolute; left:50%; transform:translateX(-50%); bottom:5px;
  font-size:9px; color:var(--ink3); letter-spacing:.1em;
}
/* 删除页：放在右下角，避开正文与右上角控件，且放大点击区
   z-index 高于 #fab(60)，保证悬浮加号不会抢走点击；
   半透明白底保证叠在深色加号上时依然清晰可读 */
.del-page{
  position:absolute; right:4px; bottom:2px; z-index:61;
  width:34px; height:34px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; color:var(--ink3);
  background:rgba(255,255,255,.72); border:none; border-radius:5px;
  padding:0; cursor:pointer; opacity:.6;
  -webkit-tap-highlight-color:transparent;
}
.del-page:hover{opacity:1;color:#c0392b;background:#fff}
.del-page:active{opacity:1;color:#c0392b;background:#fff}

/* ============ 通用排版 ============ */
/* 顶部标题统一＝年计划标准：22px · 600 · 红 · 左上对齐（封面 / 阅读记录特殊头部除外） */
h1.p-title{
  font-size:22px; font-weight:600; letter-spacing:.06em; line-height:1.2;
  color:#c0392b; margin:0 0 2px; text-transform:uppercase;
}
h2.p-title{
  font-size:22px; font-weight:600; letter-spacing:.06em; line-height:1.2;
  color:#c0392b; margin:0 0 10px;
}
/* 日计划页标题按原文大小写显示（Today's List），不用 h1 的全大写 */
.page[data-tpl="daily"] .p-title{text-transform:none}
.sub{font-size:10px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
.sect{margin:16px 0 0}
.sect>.lbl{
  font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink2); border-bottom:1px solid var(--line);
  padding-bottom:3px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:baseline;
}
.hint{font-size:10px;color:var(--ink3);letter-spacing:.02em}
.rule{height:1px;background:var(--line2);margin:14px 0}
.center{text-align:center}

[contenteditable="true"]{outline:none;min-height:1em}
[contenteditable="true"]:empty:before{content:attr(data-ph);color:#c9c9c9}
.ed td[contenteditable="true"]:empty:before{content:attr(data-ph);color:#c9c9c9}

/* ============ 表格 ============ */
table{width:100%;border-collapse:collapse;font-size:12px}
table th{
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
  font-weight:600;border-bottom:1px solid var(--ink);padding:4px 4px;text-align:left;
}
table td{border-bottom:1px solid var(--line2);padding:5px 4px;vertical-align:top}
table td.n{border-bottom:1px solid var(--line2)}
.tight td,.tight th{padding:3px 4px}

/* ============ 九宫格 ============ */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cellbox{border:1px solid var(--line);border-radius:3px;padding:7px 8px;min-height:66px}
.cellbox .ct{font-size:9px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-bottom:3px}

/* ============ 勾选行 ============ */
.chk{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid var(--line2)}
.box{
  flex:0 0 auto;width:13px;height:13px;border:1px solid var(--ink2);border-radius:2px;
  /* 文字行盒 20.8px，方框 13px → 上边距 3px 使两者墨迹中心对齐（实测偏差 0.01px） */
  margin-top:3px;cursor:pointer;position:relative;
}
.box.on{background:var(--ink);border-color:var(--ink)}
.box.on::after{content:"";position:absolute;left:3.5px;top:1px;width:4px;height:7px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.chk.done .txt{color:var(--ink3);text-decoration:line-through}
.chk.done .box{border-color:#cbcbca}
.chk.done .box.on{background:#f1f1ef;border-color:#cbcbca}
.chk.done .box.on::after{border-color:#b4b4b2}
.txt{flex:1;min-height:1.2em}

/* ============ 刻度条 ============ */
.scale{display:flex;align-items:center;gap:6px;margin:6px 0}
.scale .bar{display:flex;gap:2px;flex:1}
.scale .seg{flex:1;height:7px;border:1px solid var(--line);border-radius:1px;cursor:pointer}
.scale .seg.on{background:var(--ink);border-color:var(--ink)}
.scale .ends{font-size:8.5px;color:var(--ink3);white-space:nowrap}

/* ============ 迷你年历 ============ */
.mini-year{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-m .mh{font-size:9px;letter-spacing:.1em;color:var(--ink2);margin-bottom:3px;text-transform:uppercase}
.mini-m .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-m .mg span{text-align:center;font-size:7.5px;color:var(--ink3);padding:1.5px 0;border-radius:1px}
.mini-m .mg span.wk{color:#bbb}

/* ============ 打卡网格 ============ */
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.hscroll::-webkit-scrollbar{height:0}
/* table-layout:fixed 让下面指定的列宽真正生效（否则习惯名列会被内容撑开） */
.habgrid{display:table;table-layout:fixed;border-collapse:separate;border-spacing:2px;font-size:0;min-width:100%}
.habgrid .hr{display:table-row}
.habgrid .hc,.habgrid .hh{display:table-cell;vertical-align:middle}
.habgrid .hh{
  width:15px;min-width:15px;font-size:7.5px;color:var(--ink3);text-align:center;padding:0 1px;
}
/* 习惯名列：单元格左右各留 2px 列间距，所以列宽取 18.8px →
   单元格 2..20.8，第一个任务框左边缘正好落在 22.8px ＝「习惯」标题的右边缘。
   名字右对齐、右侧留 4px → 名字与第一个框（右移后）相隔 8px；
   名字比内容区宽时向左溢出（右对齐的默认行为），不会把任务框顶开 */
.habgrid .hname{
  display:table-cell;width:18.8px;min-width:18.8px;max-width:18.8px;padding:0;
  font-size:10.5px;color:var(--ink);white-space:nowrap;overflow:visible;
}
/* 名字用绝对定位放在单元格里（最后一个字的右边缘距第一个框左边缘 8px：
   单元格右内边缘 20.8，right:4 → 名字右边缘 16.8；框已右移 2px → 24.8，24.8-16.8=8）：
   这样它不参与列宽计算，列宽能稳定停在 20.8px；名字比单元格宽时自然向左溢出 */
.habgrid .hname .nm{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  white-space:nowrap;text-align:right;
}
.habgrid .hname{position:relative}
/* 长按习惯名可以删掉这一行（见 hbLongPress），不再占一列 ✕ */
.habgrid .dot{
  width:15px;height:15px;border:1px solid var(--line);border-radius:2.5px;margin:0 auto;cursor:pointer;
}
/* 数据行任务框 + 表头日期数字整体右移 2px（名称列不动），框与日期保持上下对齐 */
.habgrid .hr:not(.hdr) .dot,
.habgrid .hdr .hh{transform:translateX(2px)}
.habgrid .dot.on{background:var(--ink);border-color:var(--ink)}
.habgrid .hdr .dot{border:none;height:auto;font-size:7.5px;color:var(--ink3);width:15px;text-align:center}

/* ============ 心情 ============ */

/* ============ 饮食记录 ============ */
.fj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
/* 饮食页按周存档：页头＝标题 + 周药丸（同一行、中心对齐，与「我的一周」一致），副标题在下一行 */
.page[data-tpl="food"] .fj-head{position:relative;display:block}
.page[data-tpl="food"] .fj-titlerow{position:relative;display:flex;align-items:center;gap:10px}
.page[data-tpl="food"] .fj-head .p-title{margin:0}
.page[data-tpl="food"] .mc-sel{position:static;transform:none;flex:0 0 auto}
.fj-week{display:none}
.fj-week.on{display:block}
/* 日卡片的日期由所在周算出来，只展示、不可手改 */
.fj-d{
  font-size:11px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line);padding-bottom:1px;
}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:9px;color:var(--ink2)}
.legend .li{display:flex;align-items:center;gap:3px}
.legend svg{width:14px;height:14px}
/* 高度取 17px ＝ 左边 .src 图标的高度，配合行内 align-items:flex-start 顶部对齐，
   五个圆点的中心线就自然落在图标中心线上（圆点自身尺寸再变也仍然居中） */
.fullness{display:flex;gap:3px;align-items:center;height:17px}
.fullness .f{width:9px;height:9px;border:1px solid var(--line);border-radius:50%;cursor:pointer}
.fullness .f.on{background:var(--ink);border-color:var(--ink)}
.fj-day{border:1px solid var(--line);border-radius:3px;margin-bottom:8px;overflow:hidden}
.fj-dh{
  background:var(--soft);padding:4px 8px;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;
  align-items:center;gap:8px;
}
.fj-date{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.fj-date .dfield{border-bottom-color:var(--line)}
.fj-date .dwd{color:var(--ink2);font-weight:600;font-size:9.5px}
/* 整行垂直居中：餐次标签、来源图标、饱腹感圆点三组的中心点因此锁在同一条横线上
   （文字写多行、行被撑高时也一样对齐） */
.fj-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-top:1px solid var(--line2)}
.fj-row:first-of-type{border-top:none}
.fj-tag{
  flex:0 0 22px;font-size:9px;letter-spacing:.06em;color:var(--ink2);
  border:1px solid var(--line);border-radius:2px;text-align:center;padding:1px 0;
}
.fj-in{flex:1;min-height:1.3em}
.srcs{display:flex;gap:3px;flex:0 0 auto}
.src{width:17px;height:17px;border:1px solid var(--line);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.35}
.src.on{opacity:1;border-color:var(--ink);background:var(--soft)}
.src svg{width:11px;height:11px}
.fit-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-top:1px solid var(--line2);background:#fcfcfb}
/* 类型菜单顶在这一行的位置时，行暂时让位（收菜单时由 closeFitMenu 还原） */
.fit-row.fit-menu{display:none}
/* 条目之间不画线：整块只在顶部留一条，与上方饮食记录分隔 */
.fit-row + .fit-row{border-top:none}
.fit-row .ftag{flex:0 0 22px;font-size:8.5px;color:var(--accent);letter-spacing:.04em}
/* FIT 只是栏目标题 → 只有第一行显示；后面的行留同样的 22px，文字左缘与第一行对齐 */
.fit-row + .fit-row .ftag{visibility:hidden}
.fit-row .yp-mark{
  flex:0 0 15px;align-self:stretch;margin:0;height:auto;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;line-height:1;color:var(--ink2);
}
.fit-row .yp-mark .box{margin-top:0}
.fit-row.ul .yp-mark::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--ink2)}
.fit-row.ol .yp-mark{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.fit-row.plain .fitplus{font-size:9px;color:var(--ink3);opacity:.5}
.fit-row .fin{flex:1;min-height:1.3em}
.fit-row .yp-sw,.fit-row .yp-st,.fit-row .yp-del{--item-lh:15px;font-size:10px}
.fit-row.done .fin{color:var(--ink3);text-decoration:line-through}
.fit-row.done .box{border-color:#cbcbca;background:#f1f1ef}
.fit-row.done .box.on{background:#f1f1ef;border-color:#cbcbca}
.fit-row.done .box.on::after{border-color:#b4b4b2}
/* 整行删除线：一条横线穿过符号 + 间隙 + 文字（--strike-x 由 JS 实测符号左缘，21 = 标记15 + 间隙6） */
.fit-row.struck .fin{
  position:relative;color:var(--ink3);
  text-decoration:line-through;text-decoration-color:var(--ink3);
}
.fit-row.struck .fin::before{
  content:"";position:absolute;
  left:calc(-21px + var(--strike-x,0px));
  width:calc(21px - var(--strike-x,0px));
  /* 取文字格垂直中点：与浏览器画的 line-through 同一条线（不写死 px，字号变了也跟得上） */
  height:1px;top:50%;margin-top:-.5px;background:var(--ink3);pointer-events:none;
}
.fit-row.struck.plain .fin::before{display:none}
.grow-list .yp-menu{padding:4px 8px 6px}
.addline{
  font-size:9px;color:var(--ink3);border:none;background:none;padding:2px 8px 4px;
  cursor:pointer;letter-spacing:.06em;text-align:left;width:100%;
}
/* ============ 增删行 ============ */
.addrow{
  display:block;width:100%;margin-top:5px;padding:5px 8px;
  border:1px dashed var(--line);border-radius:3px;background:none;
  font-size:10px;letter-spacing:.06em;color:var(--ink3);
  font-family:inherit;cursor:pointer;text-align:center;
}
.addrow:active{background:var(--soft);color:var(--ink)}
.rowact{width:18px!important;padding-left:0!important;padding-right:0!important;text-align:center}
.del-row,.del-item{
  border:none;background:none;color:var(--ink3);font-size:12px;line-height:1;
  padding:0 2px;cursor:pointer;opacity:.45;font-family:inherit;
}
.del-row:active,.del-item:active{opacity:1;color:#c0392b}
.grow-item{position:relative}
.del-item{flex:0 0 auto;margin-left:2px}
.fj-day .del-item{margin-top:2px}

/* ============ 日历格 calgrid：月份 × 分类 双层存档 ============
   格宽固定 100px、整月横向滑动（与「本月打卡」同一套 .hscroll 逻辑） */
.page[data-tpl="calgrid"] .mc-titlerow{gap:10px}
.page[data-tpl="calgrid"] .mc-title{order:1;flex:0 0 auto;text-align:left}
.page[data-tpl="calgrid"] .mc-sel{order:2;position:static;transform:none;flex:0 0 auto}
/* 分类药丸紧挨月药丸：10px 间距再往回拉 4px = 6px */
.page[data-tpl="calgrid"] [data-cgsel]{margin-left:-4px}
.page[data-tpl="calgrid"] .mc-sel.cg-empty{border-style:dashed;color:var(--ink3)}
.page[data-tpl="calgrid"] .mc-sel.cg-empty .caret{color:#c9c8c4}
.cg-file{display:none}
.cg-set{display:none}
.cg-set.on{display:block}
.cg-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.cg-inner{width:max-content;min-width:100%}
.cg-grid{display:grid;grid-template-columns:repeat(7,100px);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:3px;overflow:hidden}
.cg-wh{background:var(--soft);padding:4px 0 3px;text-align:center;font-size:10px;color:var(--ink2);letter-spacing:.04em}
.cg-blank{background:#fff;min-height:98px}
.cg-cell{position:relative;background:#fff;min-height:98px;padding:4px 5px 5px;
  display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cg-d{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:1.2}
.cg-cell.today{background:#fbeaea}
.cg-cell.today .cg-d{color:var(--accent);font-weight:600}
.cg-cell.on{box-shadow:inset 0 0 0 1px var(--accent)}
/* 格子里可以有多条目：回车在光标处拆成紧邻的下一条，类型跟原来那条一致 */
.cg-items{display:flex;flex-direction:column}
.cg-item{display:flex;gap:4px;align-items:flex-start}
.cg-mark{flex:0 0 11px;font-size:9px;line-height:15px;color:var(--ink2);text-align:center;cursor:pointer;
  font-variant-numeric:tabular-nums}
/* 纯文本不留标记位：文字直接贴左、与日期数字左缘对齐 */
.cg-item.plain .cg-mark{display:none}
.cg-blank[data-d]{cursor:pointer}
.cg-blank[data-d]:active{background:var(--soft)}
.cg-box{display:inline-block;width:10px;height:10px;border:1px solid var(--line);border-radius:2px;vertical-align:-1px}
.cg-box.on{background:var(--ink);border-color:var(--ink)}
.cg-box.on::after{content:"";display:block;width:4px;height:6px;margin:1px 0 0 2px;
  border:solid #fff;border-width:0 1.2px 1.2px 0;transform:rotate(42deg)}
.cg-txt{flex:1 1 auto;font-size:11px;line-height:15px;color:var(--ink);min-height:15px;
  word-break:break-word;outline:none}
.cg-txt:empty::before{content:attr(data-ph);color:var(--ink3);opacity:.65}
.cg-item.done .cg-txt{color:var(--ink3)}
.cg-item.struck .cg-txt{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.cg-item.struck .cg-mark{color:var(--ink3)}
/* 整条删除线：文字部分交给浏览器自己的 line-through（只盖到最后一个字，不会拖出格子），
   这里只补「标记 + 间隙」那一小段（实测 15px = 标记 11 + 间距 4），把它接上文字那一头 */
.cg-item.struck{position:relative}
.cg-item.struck:not(.plain)::before{
  content:"";position:absolute;left:0;width:15px;height:1px;top:7.5px;background:var(--ink3);
}
.cg-imgs{display:flex;flex-direction:column;gap:3px}
.cg-img{position:relative;border-radius:2px;overflow:hidden;background:var(--soft)}
.cg-img img{display:block;width:100%;height:auto;max-height:86px;object-fit:cover}
.cg-img-x{position:absolute;left:2px;top:2px;width:15px;height:15px;border:none;border-radius:50%;
  background:rgba(255,255,255,.92);color:var(--ink3);font-size:10px;line-height:15px;padding:0;cursor:pointer}
.cg-img-x:active{color:var(--accent)}
/* 工具条：点格子才出现，纯图标无文字 */
.cg-bar{display:none;align-items:center;gap:4px;padding-top:3px;border-top:1px solid var(--line2)}
.cg-cell.on .cg-bar{display:flex}
.cg-bar button{width:17px;height:17px;border:1px solid var(--line);border-radius:3px;background:#fff;
  color:var(--ink2);font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;
  padding:0;cursor:pointer;font-family:inherit}
.cg-bar button:active{background:var(--soft)}
.cg-bar svg{width:11px;height:11px;display:block}
.cg-bar .cg-s{font-size:9px}
/* 类型菜单顶掉这一条（复用 .yp-menu 观感） */
.cg-item.cg-menuing{display:none}
.cg-empty-state{border:1px dashed var(--line);border-radius:4px;padding:26px 14px;text-align:center;
  font-size:11px;color:var(--ink3);line-height:1.8}
/* 分类面板 */
.cg-cat{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:4px;cursor:pointer;
  user-select:none;-webkit-tap-highlight-color:transparent;position:relative}
.cg-cat.on{background:#fbecea}
.cg-catdot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 5px}
.cg-catdot.gap{background:none}
.cg-cat .nm{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-cat.on .nm{color:var(--accent);font-weight:500}
.cg-cat .ct{margin-left:auto;font-size:11px;color:var(--ink3);flex:0 0 auto}
.cg-cat.on .ct{color:var(--accent)}
.cg-cat .cx{flex:0 0 16px;text-align:center;font-size:12px;color:var(--ink3);opacity:.55}
.cg-cat .cx:active{color:var(--accent);opacity:1}
.cg-cat.lift{opacity:.9}
.cg-cat.gone{visibility:hidden}
.cg-fly{position:fixed;z-index:200;pointer-events:none;background:#fff;border:1px solid var(--line);
  border-radius:4px;padding:5px 6px;display:flex;align-items:center;gap:6px}
.cg-new{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px dashed var(--line);
  border-radius:4px;margin-top:8px}
.cg-new input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:12px;color:var(--ink);outline:none}
.cg-new input::placeholder{color:var(--ink3)}
.cg-new button{border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink2);
  font-family:inherit;font-size:10px;line-height:1;padding:3px 7px;cursor:pointer}
.cg-poy{font-size:10px;color:var(--ink3);letter-spacing:.1em;margin:0 2px 7px}
/* 一行横滑：面板只有 38px 高，不会像三行那样压住下面一整排格子 */
.cg-mood{display:flex;align-items:center;gap:4px;padding:5px 6px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cg-mood::-webkit-scrollbar{display:none}
.cg-mood button{flex:0 0 26px;height:26px;border:none;background:var(--soft);border-radius:4px;font-size:15px;
  line-height:1;padding:0;cursor:pointer}
.cg-mood button:active{background:#efece5}
.cg-mood .sep{flex:0 0 1px;width:1px;height:20px;background:var(--line2);margin:0 3px}
/* 心情模式：整格让给一个 44px 表情 + 情绪名，文字条目与图片只是收起（不删） */
.cg-cell .cg-moodbox{display:none}
.cg-cell.mood .cg-moodbox{display:flex;flex:1 1 auto;min-height:0;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
.cg-cell.mood .cg-items,.cg-cell.mood .cg-imgs{display:none}
.cg-face{font-size:44px;line-height:1;cursor:pointer;user-select:none}
.cg-mname{font-size:11px;line-height:14px;color:var(--ink3);text-align:center;outline:none;
  max-width:100%;min-width:22px;padding:0 2px;word-break:break-word;cursor:text}
.cg-mname:empty::before{content:attr(data-ph);opacity:.55}
.cg-cell.mood [data-cgact="mood"]{background:#fbecea;border-color:var(--accent);color:var(--accent)}

/* ============ 阅读 ============ */
.stars{display:inline-flex;gap:2px;flex:0 0 auto}
.stars .s{width:11px;height:11px;cursor:pointer;opacity:.25}
.stars .s.on{opacity:1}
.stars svg{width:11px;height:11px;display:block}
.stars.mini{gap:1px;align-items:center}
.stars.mini .s{width:9px;height:9px}
.stars.mini svg{width:9px;height:9px}
td>.stars.mini{display:inline-flex;margin-top:2px}
.field{display:flex;align-items:baseline;gap:6px;margin:5px 0}
.field .fl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);flex:0 0 auto}
.field .fv{flex:1;border-bottom:1px solid var(--line2);min-height:1.3em;padding-bottom:1px}
.pill{
  font-size:9px;border:1px solid var(--line);border-radius:9px;padding:1px 7px;
  cursor:pointer;color:var(--ink3);
}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============ 单选题式选项组 ============ */
.opts{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.opt{
  font-size:9px;line-height:1.5;border:1px solid var(--line);border-radius:9px;
  padding:1px 6px;cursor:pointer;color:var(--ink3);white-space:nowrap;
  background:#fff;user-select:none;
}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.add-opt{border-style:dashed;color:var(--ink3)}

/* ============ 下拉框（读书清单「状态」列） ============
   折叠态撑满所在列；展开面板浮在表格之上，不占行高 */
.selbox{
  display:inline-flex;align-items:center;justify-content:space-between;gap:4px;
  width:100%;height:22px;padding:0 5px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:3px;background:#fff;
  font-size:11px;line-height:1;color:var(--ink);cursor:pointer;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.selbox:active{background:var(--soft)}
.selbox .crt{
  flex:0 0 auto;width:0;height:0;
  border-left:3px solid transparent;border-right:3px solid transparent;
  border-top:4px solid var(--ink3);
}
td.selcell{padding:3px 4px!important}
.bl-pop{
  position:absolute;z-index:63;display:none;padding:3px;box-sizing:border-box;
  background:#fff;border:1px solid var(--line);border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.bl-pop.on{display:block}
.bl-opt{
  display:flex;align-items:center;justify-content:space-between;
  height:24px;padding:0 5px;border-radius:2px;
  font-size:12px;line-height:1;color:var(--ink2);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.bl-opt:active{background:var(--soft);color:var(--ink)}
.bl-opt.on{background:var(--ink);color:#fff}
.bl-opt.on:active{background:var(--ink);color:#fff}
.bl-opt .tick{font-size:10px}

/* ============ 日期字段（选日期 → 自动星期） ============ */
.dfield{
  display:inline-flex;align-items:center;gap:4px;flex:1;min-width:0;
  border-bottom:1px solid var(--line2);padding-bottom:1px;
}
.dinput{
  border:none;background:none;font:inherit;font-size:11px;color:var(--ink);
  padding:0;outline:none;flex:1 1 auto;min-width:74px;
  font-variant-numeric:tabular-nums;
}
.dinput::-webkit-datetime-edit{font-size:11px}
.dwd{
  font-size:9px;color:var(--ink3);flex:0 0 auto;letter-spacing:.04em;
  min-width:2.4em;text-align:right;
}
.dwd.set{color:var(--ink2)}
.dbtn{
  font-size:9px;border:1px solid var(--line);border-radius:9px;padding:1px 6px;
  cursor:pointer;color:var(--ink3);background:#fff;white-space:nowrap;
}
.dbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============ 年计划 ============ */
.yp-head{position:relative;margin-bottom:6px}
/* 年计划页头：标题在左，年份切片器紧随其后；标题字样跟着年份走 */
.yp-top{display:flex;align-items:center;gap:10px}
.yp-ttl{
  font-size:22px;font-weight:600;color:#c0392b;letter-spacing:.06em;line-height:1.2;
  white-space:nowrap;
}
.yp-sel{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;
  border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink2);
  font-size:12px;line-height:1;cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}
.yp-sel:active{background:var(--soft)}
.yp-sel .caret{font-size:9px;color:var(--ink3);font-style:normal;line-height:1}
.yp-sel .yp-year{font-size:12px;color:var(--ink2);letter-spacing:.04em;min-width:0;text-align:left}
.yp-pop{position:absolute;left:0;top:100%;margin-top:6px;z-index:62;display:none}
.yp-pop.on{display:block}
.yp-popin{
  background:#fff;border:1px solid var(--line);border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);padding:6px;max-height:230px;overflow-y:auto;
}
.yp-yo{
  display:block;font-size:12px;line-height:1;text-align:center;
  padding:8px 22px;border-radius:3px;color:var(--ink2);cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.yp-yo.on{background:var(--ink);color:#fff}
.yp-yo:active{background:var(--soft)}
.yp-yearbox{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.yp-ybtn{
  width:22px;height:22px;border:1px solid var(--line);border-radius:50%;
  background:none;color:var(--ink3);font-size:13px;line-height:1;cursor:pointer;
  font-family:inherit;padding:0;
}
.yp-ybtn:active{background:var(--soft)}
.yp-year{font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink2);letter-spacing:.04em;min-width:3.2em;text-align:center;display:inline-block}
.yp-list{border-top:1px solid var(--line2)}
.yp-month{border-bottom:1px solid var(--line2)}
.yp-mrow{display:flex;align-items:center;justify-content:space-between;padding:9px 1px}
.yp-mname{font-size:14px;color:var(--ink);letter-spacing:.02em}
.yp-month.cur .yp-mname{color:#c0392b;font-weight:600}
.yp-add{
  flex:0 0 auto;width:21px;height:20.8px;border-radius:50%;border:1px solid var(--line);
  background:none;color:var(--ink3);font-size:12px;line-height:1;padding:0;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
}
.yp-month.cur .yp-add{border-color:#c0392b;color:#c0392b}
.yp-add:active{background:var(--soft)}
.yp-items{padding:0 1px 6px;counter-reset:ypol}
/* --item-lh 为文字行盒高；标记盒与之等高并内部居中 → 图标与文字中心必然同一横线 */
.yp-item{display:flex;align-items:flex-start;gap:7px;padding:3px 0;--item-lh:20px}
.yp-mark{
  flex:0 0 15px;height:var(--item-lh);margin:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;line-height:1;color:var(--ink2);
}
.yp-mark .box{margin-top:0}
/* 圆点用几何形状而非字符，避免字形基线不对称造成的偏移 */
.yp-item.ul .yp-mark::before{
  content:"";width:4px;height:4px;border-radius:50%;background:var(--ink2);
}
.yp-item.ol .yp-mark{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.yp-txt{flex:1;min-height:var(--item-lh);font-size:12.5px;line-height:var(--item-lh);padding:0}
/* 任务打勾 → 整条（勾选框 + 文字）一起变浅灰并加删除线；取消打勾自动还原 */
.yp-item.done .yp-txt{color:var(--ink3);text-decoration:line-through}
.yp-item.done .box{border-color:#cbcbca;background:#f1f1ef}
.yp-item.done .box.on{background:#f1f1ef;border-color:#cbcbca}
.yp-item.done .box.on::after{border-color:#b4b4b2}
.yp-sw,.yp-del,.yp-st{
  flex:0 0 auto;height:var(--item-lh,20px);margin:0;
  display:flex;align-items:center;justify-content:center;
  border:none;background:none;color:var(--ink3);font-size:11px;
  line-height:1;padding:0 1px;cursor:pointer;opacity:.4;font-family:inherit;
}
/* S＝删除线：字母自带一条横线，一眼能认出 */
.yp-st{text-decoration:line-through;text-decoration-thickness:1px}
.yp-sw:active,.yp-del:active,.yp-st:active{opacity:1;color:#c0392b}
.yp-menu{display:flex;gap:5px;flex-wrap:wrap;padding:4px 0 6px}
.yp-menu button{
  border:1px solid var(--line);background:#fff;border-radius:11px;font-size:10px;
  padding:0 8px;color:var(--ink2);font-family:inherit;cursor:pointer;
  /* 定高 + 居中 → 图标与文字的垂直中心在同一条横线上（纯文本无图标，其首字自然落在同一线） */
  display:inline-flex;align-items:center;justify-content:center;gap:4px;height:22px;
}
.yp-menu button .mi{display:inline-flex;align-items:center;justify-content:center;width:11px;flex:0 0 11px;height:11px}
.yp-menu button .mi .box{width:9px;height:9px;margin-top:0}
.yp-menu button .mi .dot{width:4px;height:4px;border-radius:50%;background:var(--ink2)}
.yp-menu button .mi .num{font-size:9px;line-height:1;color:var(--ink2)}
.yp-menu button .mi .no{width:7px;height:7px;position:relative}
.yp-menu button .mi .no::before,.yp-menu button .mi .no::after{
  content:"";position:absolute;left:0;right:0;height:1px;background:var(--ink2);
}
.yp-menu button .mi .no::before{top:1px}
.yp-menu button .mi .no::after{bottom:1px}
.yp-menu button:active{background:var(--soft);color:var(--ink)}

/* ============ 月度计划 / 年度日历头部 ============ */
.mp-head{margin-bottom:8px}
.mp-months{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:4px}
.mp-months .opt{padding:1px 5px;font-size:9.5px}
.yp-title2{font-size:22px;font-weight:600;color:#c0392b;letter-spacing:.06em;line-height:1.2}

/* ============ 月日历（每行一天 · 大量留白） ============
   四列固定：星期(26) → 日期(24,右对齐) → 符号(26) → 内容(flex)
   于是日期右边缘落在 x=50，符号中心 x=63，内容起点 x=76 */
.mc-head{position:relative;margin:0 0 16px}
.mc-wm{position:absolute;right:0;top:-14px;font-size:11px;color:#cfcfcf;letter-spacing:.04em;line-height:1}
.mc-titlerow{position:relative;display:flex;align-items:center}
.mc-title{
  flex:1;text-align:center;font-size:22px;font-weight:600;color:#c0392b;
  letter-spacing:.06em;line-height:1.2;
}
/* 月日历 / 月任务：标题在左、切片器紧随其后（与年计划同一套排法）
   DOM 里切片器写在标题前面，用 order 换过来即可，不动模板结构 */
.page[data-tpl="monthcal"] .mc-titlerow,.page[data-tpl="monthtask"] .mc-titlerow,
.page[data-tpl="habit"] .mc-titlerow,.page[data-tpl="booklist"] .mc-titlerow,.page[data-tpl="weight"] .mc-titlerow{justify-content:flex-start;gap:10px}
.page[data-tpl="monthcal"] .mc-title,.page[data-tpl="monthtask"] .mc-title{order:1;flex:0 0 auto;text-align:left}
.page[data-tpl="monthcal"] .mc-sel,.page[data-tpl="monthtask"] .mc-sel,
.page[data-tpl="habit"] .mc-sel,.page[data-tpl="booklist"] .mc-sel,.page[data-tpl="weight"] .mc-sel{order:2;position:static;transform:none}
/* 三页用 .p-title 作切片器前的标题：清掉自带 margin、不伸缩，保证与切片器同行不压字 */
.mc-titlerow .p-title{margin:0;flex:0 0 auto}
.mc-head .sub{margin:0}
.mc-sel{
  position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:2;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  height:26px;padding:0 9px;border:1px solid var(--line);border-radius:4px;
  background:#fff;color:var(--ink2);font-family:inherit;font-size:12px;line-height:1;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.mc-sel:active{background:var(--soft)}
.mc-sel .caret{font-size:9px;color:var(--ink3);line-height:1}
.mc-pop{position:absolute;left:0;top:100%;margin-top:6px;z-index:62;display:none}
.mc-pop.on{display:block}
.mc-popin{
  width:206px;background:#fff;border:1px solid var(--line);border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);padding:10px 10px 12px;
}
.mc-popy{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:9px}
.mc-yt{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:3em;text-align:center}
.mc-yb{
  width:20px;height:20px;border:1px solid var(--line);border-radius:50%;
  background:none;color:var(--ink3);font-size:12px;line-height:1;
  cursor:pointer;font-family:inherit;padding:0;
}
.mc-yb:active{background:var(--soft)}
.mc-popline{height:1px;background:var(--line2);margin-bottom:10px}
.mc-popm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mc-mo{
  text-align:center;font-size:12px;color:var(--ink2);padding:5px 0;border-radius:4px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.mc-mo.on{background:#fbecea;color:#c0392b}
.mc-month{display:none}
.mc-month.on{display:block}
/* 日记页按日存档：每天一份内容，切换日期只是换 .on 的区块 */
.dd-day{display:none}
.dd-day.on{display:block}
.mc-row{position:relative;display:flex;align-items:center;height:26px}
/* 「今天」：一整块浅红底把星期与数字一起框住。
   底色用伪元素画，不参与布局 → 文字位置与其它行完全一致 */
.mc-row.today::before{
  content:"";position:absolute;left:-2px;top:50%;transform:translateY(-50%);
  width:58px;height:19px;background:#fbeaea;border-radius:4px;z-index:0;
}
.mc-row.today .mc-wd,.mc-row.today .mc-d{color:#c0392b;position:relative;z-index:1}
.mc-wd{flex:0 0 26px;font-size:12px;color:var(--ink3);line-height:1}
.mc-wd.we{color:#c0392b}
.mc-d{
  flex:0 0 24px;text-align:right;font-size:13px;font-weight:600;color:var(--ink);
  line-height:1;font-variant-numeric:tabular-nums;
}
.mc-sym{
  flex:0 0 26px;height:26px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.mc-sym i{display:block;width:4px;height:4px;border-radius:50%;background:var(--ink2)}
.mc-sym[data-sym="dash"] i{width:9px;height:1px;border-radius:0}
.mc-row.blank .mc-sym{visibility:hidden}
.mc-txt{
  flex:1;min-width:0;font-size:12px;line-height:26px;color:var(--ink);
  outline:none;min-height:26px;padding:0;
}
.mc-txt:empty:before{content:""}

/* ============ 月任务（任务表 + PDCA 月回顾） ============
   列宽 22/32/26/20（%），窄屏等比收缩；表头 10px 不折行 */
.mt-lbl{font-size:11px;letter-spacing:.06em;color:var(--ink3);margin:14px 0 6px}
.mt-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.mt-tbl th{
  font-size:10px;font-weight:400;color:var(--ink3);text-align:left;
  padding:5px 4px;border-bottom:1px solid var(--line2);white-space:nowrap;
}
.mt-tbl td{border-bottom:1px solid var(--line2);vertical-align:top;padding:0 4px}
.mt-goal,.mt-year{font-size:12px;color:var(--ink);line-height:20px;min-height:26px;padding:5px 4px!important}
.mt-step{padding:2px 4px 0!important}
/* 给空步骤格留 26px 可点高度：光标落进来就弹类型菜单，不需要任何占位按钮 */
.mt-items{padding:0;min-height:26px}
.mt-items .yp-item{padding:1px 0}
/* 格子窄：⇄ / × 平时隐形但保留占位，点进条目才显形。
   不能用 display:none——失焦瞬间文字重新排版会把按钮顶跑，导致点空 */
.mt-items .yp-sw,.mt-items .yp-del{visibility:hidden;width:12px;padding:0;font-size:10px}
.mt-items .yp-item:hover .yp-sw,.mt-items .yp-item:hover .yp-del,
.mt-items .yp-item:focus-within .yp-sw,.mt-items .yp-item:focus-within .yp-del{visibility:visible}
.mt-st{position:relative;min-height:26px;text-align:center;cursor:pointer;padding:5px 4px!important;-webkit-tap-highlight-color:transparent}
.mt-st:active{background:var(--soft)}
/* 空行的删除按钮：钉在行最右端，平时隐形但保留占位（同 ⇄/× 的做法，版式不跳）。
   只有「四格全空」的行才有资格显示；显形靠 hover / 聚焦 / 当前行标记 */
.mt-del{
  position:absolute;right:1px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;padding:0;border:0;background:none;
  font-size:11px;line-height:1;color:#c4c4c4;visibility:hidden;
  -webkit-tap-highlight-color:transparent;
}
.mt-del:hover,.mt-del:active{color:#c0392b}
tr[data-mtempty="1"]:hover .mt-del,
tr[data-mtempty="1"]:focus-within .mt-del,
tr[data-mtempty="1"].mt-act .mt-del{visibility:visible}
.mt-chip{
  display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border-radius:9px;
  border:1px solid var(--line);color:var(--ink3);background:none;
}
.mt-chip.st-doing{border-color:#c0392b;color:#c0392b}
.mt-chip.st-done{background:var(--ink);border-color:var(--ink);color:#fff}
.mt-popin{
  width:62px;background:#fff;border:1px solid var(--line);border-radius:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);padding:3px 0;
}
.mt-opt{
  display:block;text-align:center;font-size:11px;color:var(--ink2);
  padding:5px 0;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.mt-opt.on{background:#fbecea;color:#c0392b}
.mt-opt:active{background:var(--soft)}
/* PDCA 月回顾：上下两组、每组两个 */
.pdca{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pdca-c{background:#fafaf8;border:1px solid var(--line2);border-radius:6px;padding:8px 10px 10px}
.pdca-h{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.pdca-b{
  flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:#fff;
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--ink2);
}
.pdca-t{font-size:12px;color:var(--ink)}
.pdca-e{font-size:11px;color:var(--ink3)}
.pdca-x{font-size:12px;line-height:18px;color:var(--ink);min-height:36px;outline:none}

/* ============ 索引页 ============ */
.ix-head{display:flex;justify-content:space-between;align-items:center}
.ix-btn{
  font-family:inherit;font-size:11px;line-height:1;
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:12px;padding:5px 13px;cursor:pointer;
}
.ix-btn:active{opacity:.75}
.ix-group{margin-top:10px}
.ix-gh{
  font-size:10px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;
  border-bottom:1px solid var(--ink);padding-bottom:3px;margin-bottom:5px;
}
.ix-tpl{margin-bottom:7px}
.ix-th{display:flex;align-items:center;gap:5px;margin:4px 0 2px}
.ix-ico{font-size:11px;color:var(--ink3);width:12px}
.ix-tn{font-size:11.5px;font-weight:600;color:var(--ink)}
.ix-cnt{
  font-size:9px;color:var(--ink3);border:1px solid var(--line);
  border-radius:8px;padding:0 5px;margin-left:2px;
}
.ix-row{
  display:flex;align-items:center;gap:7px;padding:3px 2px;
  border-bottom:1px solid var(--line2);cursor:pointer;
}
.ix-row:active{background:var(--soft)}
.ix-no{
  flex:0 0 22px;font-size:9.5px;color:var(--ink3);text-align:right;
  font-variant-numeric:tabular-nums;
}
.ix-sum{flex:1;font-size:11.5px;color:var(--ink2);overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}

/* 跳转后闪烁提示 */
.page.flash{animation:pageflash 1.1s ease-out}
@keyframes pageflash{
  0%,60%{box-shadow:0 0 0 3px rgba(192,57,43,.45),0 1px 3px rgba(0,0,0,.07)}
  100%{box-shadow:0 1px 3px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.05)}
}

/* ============ 周计划 ============ */
/* 标题贴页面顶（上间距与年计划一致）；日期框改为顶对齐，不再把标题压下去 */
.wk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:2px}
.wk-title{font-size:22px;font-weight:600;color:#c0392b;letter-spacing:.06em;line-height:1.2}
/* 页头日期：靠页面右侧，与「周计划」同一行 */
.wk-datebox{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  margin-bottom:2px;
}
.wk-datebox .dfield{border-bottom-color:var(--line)}
.wk-datebox .dwd{font-size:9.5px}
.wk-range-top{font-size:9.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
/* 周级添加按钮：与「周计划」左对齐，位于其下一行 */
.wk-items+.wk-sec{margin-top:2px}
.wk-nextweek{
  display:block;width:100%;margin-top:8px;padding:6px;
  border:1px dashed var(--line);border-radius:3px;background:none;
  font-size:10.5px;letter-spacing:.06em;color:var(--ink3);
  font-family:inherit;cursor:pointer;
}
.wk-nextweek:active{background:var(--soft);color:var(--ink)}
/* ---------- 周计划：周切片器（药丸直接复用 .mc-sel，样式与月切片器同一套） ---------- */
.page[data-tpl="weekly"] .wk-head{position:relative;justify-content:flex-start;align-items:center;gap:10px}
.page[data-tpl="weekly"] .wk-title{order:1;flex:0 0 auto}
.page[data-tpl="weekly"] .mc-sel{order:2;position:static;transform:none}
/* 每周一份内容，切周只是换 .on 的那块 */
.wk-weeks .wk-week{display:none}
.wk-weeks .wk-week.on{display:block}
/* 面板里的周行：左「第N周」右「完整区间」，红点＝本周 */
.wk-wrow{
  display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:4px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.wk-wrow.on{background:#fbecea}
.wk-wdot{width:5px;height:5px;border-radius:50%;background:#c0392b;flex:0 0 5px}
.wk-wdot.gap{background:none}
.wk-wn{font-size:12px;color:var(--ink2);flex:0 0 auto}
.wk-wrow.on .wk-wn{color:#c0392b;font-weight:500}
.wk-wr{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wk-wrow.on .wk-wr{color:#c0392b}
/* 标题下的横线 + 「周计划 + 该周日期范围」小标题（规格与「周记」完全一致） */
.wk-hr{height:1px;background:var(--line2)}
.page[data-tpl="weekly"] .wk-hr-top{margin:8px 0 0}
.wk-ptitle{
  margin:6px 0 0;display:flex;align-items:baseline;gap:8px;
  font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.02em;
}
.wk-prange{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
/* ＋ 与它下面那条横线的距离「锁死」＝15.5px：
   周计划区（小标题→线③）与每天（周X→该行横线）同一套算法，空态 / 有条目都一样 ——
   中间加内容时两者一起下移，距离不变。
   上 = 9（撑高）+ 6.5（半径）；下 = 6.5 + 余下内边距，同样凑成 15.5 */
.wk-items{padding-bottom:0}
.wk-items .yp-addslot{align-items:center;padding:9px 0}
.wk-day .yp-items{padding-bottom:1px}
.wk-day .yp-items .yp-addslot{align-items:center;padding:9px 0 0}
/* 类型菜单在周计划区/每天里是「行内的一行」：插在占位 ＋ 的上一行（准备写的那一行），
   会把 ＋ 和下面的横线一起推下去，但 ＋ 到横线的锁定距离不受影响 */
/* 周区块现在是「切周只显示一块」，不再需要当年堆叠布局的顶边框/上内边距/上外边距
   —— 留着会在标题下横线下面 8px 处再画一条线，看起来像双线。分隔交给 .wk-hr-bot */
.wk-sec{border-top:none;padding-top:0;margin-top:0}
.wk-top{display:flex;align-items:center;gap:7px;padding:1px 0 5px}
.wk-top .dfield{flex:0 0 auto}
.wk-range{flex:1;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums}
.wk-del{
  flex:0 0 auto;border:none;background:none;color:var(--ink3);font-size:13px;
  line-height:1;padding:0 2px;cursor:pointer;opacity:.4;font-family:inherit;
}
.wk-del:active{opacity:1;color:#c0392b}
.wk-jrow{display:flex;align-items:center;gap:6px;margin:2px 0 0}
.wk-jname{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.wk-edit{
  border:none;background:none;color:#c0392b;font-size:13px;line-height:1;
  padding:0 2px;cursor:pointer;font-family:inherit;opacity:.9;
}
.wk-edit:active{opacity:.6}
.wk-journal{margin:3px 0 0;position:relative}
/* 周记正文只保留两根格线占位：格线由 .lined 渐变每 26px 画一根（画在每格的 21px 处），
   框高 48px 时正好是 21 / 47 两根，且第二根贴着框底 → 周一紧挨第二根线。
   下外边距归零 + 星期行上内边距 4px，两者相加＝「线到周一」4px。 */
.page[data-tpl="weekly"] .wk-journal{min-height:48px}
.wk-day{border-bottom:1px solid var(--line2);padding:4px 0 8px}
.wk-day:last-child{border-bottom:none}
.wk-drow{display:flex;align-items:center;gap:7px}
.wk-dname{flex:0 0 auto;font-size:13px;color:var(--ink);letter-spacing:.02em}
.wk-ddate{flex:1;font-size:10.5px;line-height:20.8px;color:var(--ink3);font-variant-numeric:tabular-nums}
/* 全站的 ＋ 统一 13px（与勾选框同宽、落在 15px 标记列里） */
.wk-add{
  flex:0 0 auto;width:13px;height:13px;border-radius:50%;
  border:1px solid #c0392b;background:none;color:#c0392b;
  font-size:8.5px;line-height:1;padding:0;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;position:relative;
  -webkit-tap-highlight-color:transparent;
}
/* 视觉 13px 但手指好按：可点区域透明扩到 39px（不参与布局，外观不变） */
.wk-add::before{content:"";position:absolute;left:-13px;right:-13px;top:-13px;bottom:-13px}
.wk-add:active{background:#fbecea}

/* 列表末尾的「占位」＋：13px，与任务勾选框同宽，
   放进 15px 的 .yp-mark 标记列居中 → 中心与勾选框、圆点同一条竖直中轴线 */
.yp-addslot{display:flex;align-items:flex-start;gap:7px;padding:3px 0}
.yp-addslot .wk-add{
  width:13px;height:13px;font-size:8.5px;line-height:1;
  border-radius:50%;border:1px solid #c0392b;background:none;color:#c0392b;
  padding:0;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.yp-addslot .wk-add:active{background:#fbecea}
.wk-day.today .wk-dname{color:#c0392b;font-weight:600}
.wk-day.today .wk-ddate{color:#c0392b}
.wk-day.today .wk-add{border-color:#c0392b;color:#c0392b}

/* 删除线条目 */
/* 删除线条目（旧的 del 类型，保留兼容；新的删除线是对选中文字施加） */
.yp-item.del .yp-txt{text-decoration:line-through;color:var(--ink3)}
/* 纯文本：没有标记，首字直接落在 15px 标记列的中心（与勾选框/圆点/序号同轴 39.5px）。
   汉字advance比1em窄一点，实测首字中心会偏左 1.2px → 用 padding 补回来 */
.yp-item.plain .yp-mark{display:none}
.yp-item.plain .yp-txt{padding-left:1.2px}
/* 选中的文字被加删除线：execCommand 产生的是 <s> / <strike> */
.yp-txt s,.yp-txt strike{text-decoration:line-through;color:var(--ink3)}
/* 整行删除线（划整行时）：文字沿用浏览器自己的删除线（跟随文字长度、换行也覆盖），
   再用一段「桥接线」从文字左缘往左延伸 22px（＝间隙 7 + 标记列 15），
   与文字那条线同 y 接上 → 视觉上是「一条」贯穿 符号＋文字 的横线，不是两段。 */
.yp-item.struck .yp-txt{
  position:relative;color:var(--ink3);
  text-decoration:line-through;text-decoration-color:var(--ink3);
}
.yp-item.struck .yp-txt::before{
  content:"";position:absolute;
  /* 从「符号左缘」起笔（--strike-x 由 JS 实测），穿过符号、跨过间隙、接上文字那条线；
     不从标记列最左缘起笔，否则圆点/序号左边会甩出一截线头 */
  left:calc(-22px + var(--strike-x,0px));
  width:calc(22px - var(--strike-x,0px));
  height:1px;
  top:var(--strike-y,10px);background:var(--ink3);pointer-events:none;
}
/* 纯文本没有标记列，不需要桥接线 */
.yp-item.struck.plain .yp-txt::before{display:none}
.yp-mark.del::before{content:"S";font-size:11px;color:var(--ink2);opacity:.55}

/* ============ Reading Journal 标题行 ============ */
.rj-head{display:flex;align-items:center;gap:4px;margin-bottom:2px}
/* 阅读记录页头对标顶部标题标准：22px/600/红；图标同色；星星保留右上。
   全大写标题较宽：字距归零+两侧间距4px 后实测放得下（星星沿用全局原版 11px） */
.rj-ico{width:22px;height:22px;color:#c0392b;flex:0 0 22px}
.rj-ico svg{width:22px;height:22px}
.rj-t{
  font-size:22px;font-weight:600;letter-spacing:0;line-height:1.2;
  flex:1;color:#c0392b;
  white-space:nowrap;      /* 标题单行，与左侧图标垂直居中 */
}
/* 选中星星＝红色令牌（星星大小/间距沿用全局 .stars 原版 11px，不另设覆盖） */
.rj-head .stars .s.on{color:#c0392b}
/* Reading Journal / Weight Tracker 标题＝自然大小写（只有首字母大写），
   不用 h1.p-title 的全大写；其余页面标题维持原样 */
.page[data-tpl="weight"] .p-title{text-transform:none}
.prog{display:flex;gap:2px;margin:6px 0 2px}
.prog .p{flex:1;height:9px;border:1px solid var(--line);border-radius:1px;cursor:pointer}
.prog .p.on{background:var(--ink);border-color:var(--ink)}
.proglbl{display:flex;justify-content:space-between;font-size:8px;color:var(--ink3)}
/* 横线/点阵：行高 = 格距，线画在每行底部（文字压在线上），
   最小高度取格距整数倍，保证首尾间距与行间一致 */
.notes{
  border:1px solid var(--line2);border-radius:3px;min-height:172px;padding:8px;
  /* 1px 细线，与表格行线 / 检查行线同为 var(--line2) */
  background-image:linear-gradient(to bottom,transparent 21px,var(--line2) 21px,var(--line2) 22px,transparent 22px);
  background-size:100% 22px;background-origin:content-box;background-clip:content-box;background-position:0 0;
  line-height:22px;
}
.dots{
  border:1px solid var(--line2);border-radius:3px;min-height:128px;padding:8px;
  background-image:radial-gradient(circle at 50% 50%,var(--line) 1px,transparent 1.2px);
  background-size:16px 16px;background-origin:content-box;background-clip:content-box;background-position:0 0;
  line-height:16px;
}
.lined{
  min-height:130px;padding:0;
  /* 1px 细线，格距 26px，线画在文字底部下方 */
  background-image:linear-gradient(to bottom,transparent 21px,var(--line2) 21px,var(--line2) 22px,transparent 22px);
  background-size:100% 26px;background-position:0 0;line-height:26px;
}
.lined.l2{min-height:52px}
.lined.l3{min-height:78px}
.lined.l4{min-height:104px}
.lined.l6{min-height:156px}
.lined.l8{min-height:208px}

/* ============ 体重 ============ */
.wt-top{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:10px}
.wt-f{display:flex;align-items:baseline;gap:5px;border-bottom:1px solid var(--line);padding-bottom:2px}
.wt-f .l{font-size:8.5px;letter-spacing:.08em;color:var(--ink2);flex:0 0 auto;text-transform:uppercase}
.wt-f .v{flex:1;min-height:1.2em;font-variant-numeric:tabular-nums}
.chart{border:1px solid var(--line2);border-radius:3px;margin:8px 0;background:#fdfdfc}
.chart svg{display:block;width:100%;height:130px}
.wt-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wt-tbl td,.wt-tbl th{padding:2.5px 3px;font-size:11px}
.wt-tbl input{width:100%;border:none;background:none;font:inherit;color:inherit;padding:0;outline:none}
.delta.up{color:#c0392b}
.delta.down{color:var(--accent)}

/* ============ 时间轴 ============ */
.tt{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}
.tt-col .tt-r{display:flex;gap:6px;align-items:flex-start;border-bottom:1px solid var(--line2);padding:3.5px 0}
/* 小时标签与内容行盒等高 → 两者中心在同一横线 */
.tt-h{flex:0 0 26px;font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:21px;padding-top:0}
.tt-c{flex:1;min-height:21px;line-height:21px}

/* ============ 天气 ============ */
.weather{display:flex;gap:5px;flex:0 0 auto}
.wx{width:20px;height:20px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.3}
.wx.on{opacity:1;border-color:var(--ink);background:var(--soft)}
.wx svg{width:12px;height:12px}

/* ============ 周/月 ============ */
.dow{display:flex;gap:4px;margin:6px 0}
.dow span{
  flex:1 1 0;min-width:0;text-align:center;font-size:10px;line-height:1;color:var(--ink3);
  border:1px solid var(--line2);border-radius:4px;
  padding:4px 2px;cursor:pointer;
  transition:color .12s,border-color .12s,background .12s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.dow span:hover{color:var(--ink2);border-color:var(--line)}
.dow span.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wk-grid{display:grid;grid-template-columns:1fr;gap:8px}
.daycard{border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.daycard .dh{background:var(--soft);font-size:9.5px;letter-spacing:.08em;color:var(--ink2);padding:3px 7px;text-transform:uppercase}
.daycard .db{padding:5px 7px;min-height:52px}

/* ============ FAB / 抽屉 ============ */
#fab{
  position:fixed; right:16px; bottom:calc(20px + env(safe-area-inset-bottom));
  width:50px;height:50px;border-radius:25px;border:none;
  background:var(--ink);color:#fff;font-size:26px;line-height:50px;text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:60;padding:0;
}
#fab:active{transform:scale(.94)}
/* 目录按钮：坐在 ＋ 上方 */
/* 与 ＋ 同尺寸（50px）且同右边距 → 圆心天然重合；两者间距仍是 12px */
#idxbtn{
  position:fixed;right:16px;bottom:calc(20px + 50px + 12px + env(safe-area-inset-bottom));
  width:50px;height:50px;border-radius:25px;padding:0;
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;z-index:60;
  -webkit-tap-highlight-color:transparent;
}
#idxbtn:active{transform:scale(.94)}

/* ============ 目录侧边栏 ============ */
#dwm{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
#dwm.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;right:0;top:0;bottom:0;z-index:85;
  width:min(78vw,320px);background:#fff;border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
}
#drawer.on{transform:translateX(0)}
/* 右列对齐：关闭符号 / 类型页数 / 页面页码都用 24px 定宽居中槽位，
   父级右侧留白一致 → 三者中心与右边缘都落在同一条竖线上 */
/* 头部右侧留白 14px ＝ .dw-body 的 6px + 行自身的 8px，
   这样 ✕ 与下面两处槽位的右边缘才真正对齐 */
.dw-h{display:flex;align-items:center;justify-content:space-between;

/* ==========================================================
   通用控件：单选题组 / 日期字段
========================================================== */
/* 单选题式选项组（同组内互斥，点一下即选中，不用手打） */
function optGroup(name, arr, sel){
  return `<span class="opts" data-opt="${name}">`+
    arr.map(o=>`<span class="opt${o===sel?" on":""}" data-v="${esc(o)}">${esc(o)}</span>`).join("")+
  `</span>`;
}

/* 下拉框（读书清单状态）：折叠态，点开由 blOpen 弹面板 */
const BL_OPTS=["想读","在读","读完","弃读"];
function selBox(v){
  v=v||BL_OPTS[0];
  return `<span class="selbox" data-selst="1" data-v="${esc(v)}">${esc(v)}<i class="crt"></i></span>`;
}

/* 日期字段：选日期 → 自动生成星期几 */
function dateField(v){
  return `<span class="dfield">`+
    `<input type="date" class="dinput" data-df="1" value="${v||""}">`+
    `<span class="dwd" data-wd="1"></span>`+

/* 紧凑星级评分（用于表格内） */
function starRating(cur){

    Array.from({length:5},(_,i)=>`<span class="s${i<cur?" on":""}" data-star="${i+1}">${ICO.star}</span>`).join("")+
  `</span>`;

/* 星期快捷按钮组（直接点星期几） */
function dowPicker(sel){
  return `<span class="opts dowpick" data-opt="dow">`+
    WD_CN.map(d=>`<span class="dbtn${d===sel?" on":""}" data-v="${d}">${d.slice(1)}</span>`).join("")+
  `</span>`;
}

/* 由 yyyy-mm-dd 得到「周X」 */
function weekdayOf(val){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(val||"");
  if(!m) return "";
  const d=new Date(+m[1], +m[2]-1, +m[3]);
  if(isNaN(d.getTime())) return "";
  return WD_CN[d.getDay()];
}

/* 页面内所有日期字段同步星期显示，并联动星期按钮高亮 */
function syncDates(scope){
  const root=scope||document;
  $$(".dfield", root).forEach(f=>{
    const i=$(".dinput",f), w=$(".dwd",f);
    if(!i||!w) return;
    const wd=weekdayOf(i.value);
    w.textContent = wd || "周—";
    w.classList.toggle("set", !!wd);
  });
  /* 星期按钮组跟随本页第一个日期 */
  const pages = (root.classList && root.classList.contains("page")) ? [root] : $$(".page", root);
  pages.forEach(pg=>{
    const first=$(".dinput",pg);
    if(!first||!first.value) return;
    const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(first.value);
    if(!m) return;
    const dt=new Date(+m[1],+m[2]-1,+m[3]);
    if(isNaN(dt.getTime())) return;

    const dow=$(".auto-dow",pg);
    if(dow){
      const idx=dt.getDay();
      $$("span",dow).forEach((s,i)=>s.classList.toggle("on",i===idx));
    }
    /* 饮食页：按首日自动算出「当月的第几周」 */
    const fw=$("[data-foodweek]",pg);
    if(fw){
      const shift=(dt.getDay()+6)%7;
      const mon=new Date(dt); mon.setDate(dt.getDate()-shift);
      const w=weekOfMonth(mon);
      fw.textContent=(w.m+1)+"月 第"+w.n+"周";
    }

    /* 周计划：自动算出该周的周一–周日范围（周数按当月口径） */
    const wr=$("[data-weekrange]",pg);
    if(wr){
      const shift=(dt.getDay()+6)%7;          // 周一为起点
      const mon=new Date(dt); mon.setDate(dt.getDate()-shift);
      const sun=new Date(mon); sun.setDate(mon.getDate()+6);
      wr.textContent=weekLabel(mon,sun);
    }
  });
}

/* 一年中的第几周（周一为一周起点，简单按天整除） */
function weekNo(d){
  const start=new Date(d.getFullYear(),0,1);
  const diff=Math.floor((d-start)/86400000);
  return Math.floor(diff/7)+1;
}
/* 这一周是「当月的第几周」：归属月取该周周四所在的月（一周只会有一个编号），
   周数＝含该月 1 号的那一周算第 1 周 */
function weekOfMonth(mon){
  const thu=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+3);
  return { y:thu.getFullYear(), m:thu.getMonth(), n:Math.ceil(thu.getDate()/7) };
}
/* 统一文案：10月 第1周（9.28–10.04） */
function weekLabel(mon,sun){
  const w=weekOfMonth(mon);
  const f=x=>(x.getMonth()+1)+"."+pad(x.getDate());
  return (w.m+1)+"月 第"+w.n+"周（"+f(mon)+"–"+f(sun)+"）";
}

/* ---------- 周切片器 ----------
   周计划改成「一页只显示一周」：每周一个区块，切到没写过的周就新建一份空白，
   切回来内容原样在（与月区块同一套机制，只是粒度从月变成周）。 */

/* 任意日期 → 那一天的周一零点 */
function wkMondayOf(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x;
}
function wkMonISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
/* "yyyy-mm-dd" → Date（周一），非法返回 null */
function wkParseISO(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");
  if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return isNaN(d.getTime())?null:d;
}
/* 药丸上的短标签：10月 第1周 */
function wkMonLabel(mon){
  const w=weekOfMonth(mon);
  return (w.m+1)+"月 第"+w.n+"周";
}
/* 面板右侧的区间：9.28–10.04（跨月的周写全两头） */
function wkRangeTxt(mon){
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=x=>(x.getMonth()+1)+"."+pad(x.getDate());
  return f(mon)+"–"+f(sun);
}
/* 归属月为 y-m 的所有周（按周数升序，每周只出现一次） */
function wkMondaysOf(y,m){
  const dim=new Date(y,m+1,0).getDate(), seen={}, res=[];
  for(let d=1;d<=dim;d++){
    const mon=wkMondayOf(new Date(y,m,d));
    const w=weekOfMonth(mon);
    if(w.y!==y || w.m!==m) continue;
    if(seen[w.n]) continue;
    seen[w.n]=1; res.push({n:w.n, mon});
  }
  return res;
}
/* 面板：月份步进器 + 该月各周。年份跟着月份走，所以不需要年步进器 */
function wkPopHTML(y,m,curISO){
  const nowISO=wkMonISO(wkMondayOf(bjDate()));
  const rows=wkMondaysOf(y,m).map(o=>{
    const iso=wkMonISO(o.mon);
    return `<div class="wk-wrow${iso===curISO?" on":""}" data-wkw="${iso}">`+
      `<span class="wk-wdot${iso===nowISO?"":" gap"}"></span>`+
      `<span class="wk-wn">第${o.n}周</span>`+
      `<span class="wk-wr">${wkRangeTxt(o.mon)}</span>`+
    `</div>`;
  }).join("");
  return `<div class="mc-popin">`+
    `<div class="mc-popy">`+
      `<button type="button" class="mc-yb" data-wkprev="1">‹</button>`+
      `<span class="mc-yt">${y}年${m+1}月</span>`+
      `<button type="button" class="mc-yb" data-wknext="1">›</button>`+
    `</div>`+
    `<div class="mc-popline"></div>`+ rows +
  `</div>`;
}
/* 切到某一周（iso＝该周周一）：块不存在才新建空白周 */
function wkShow(pg,iso){
  const wrap=$("[data-wkwrap]",pg);
  const mon=wkParseISO(iso);
  if(!wrap||!mon) return;
  let blk=$(`.wk-week[data-wk="${iso}"]`,wrap);
  if(!blk){
    /* weekSection 自己就返回带 .wk-week/.on/data-wk 的整块，别再套一层 */
    const d=document.createElement("div");
    d.innerHTML=weekSection(iso,false,true,true);
    blk=d.firstElementChild;
    wrap.appendChild(blk);
    renumberOL(blk);
  }
  $$(".wk-week",wrap).forEach(b=>b.classList.toggle("on",b===blk));
  pg.dataset.wk=iso;
  const w=weekOfMonth(mon);
  pg.dataset.wky=w.y; pg.dataset.wkm=w.m;
  const lab=$("[data-wklab]",pg); if(lab) lab.textContent=wkMonLabel(mon);
  wkDates(blk);
}
function wkInitPage(pg){
  let iso=pg.dataset.wk;
  if(!iso || !wkParseISO(iso)) iso=wkMonISO(wkMondayOf(bjDate()));
  wkShow(pg,iso);
}

/* ---------- 饮食页：按周存档（与周计划同一套机制，内容换成 7 张日卡片）----------
   切到没写过的周＝新建一份空白（周一~周日七张卡），切回来原样在，绝不串周。 */
function fjShow(pg,iso){
  let wrap=$("[data-fjwrap]",pg);
  if(!wrap){                                   /* 老存档兜底：现造一个周容器 */
    wrap=document.createElement("div");
    wrap.className="fj-weeks"; wrap.dataset.fjwrap="1";
    const first=$(".fj-day",pg);
    if(first) first.parentElement.insertBefore(wrap,first); else pg.appendChild(wrap);
  }
  const mon=wkParseISO(iso);
  if(!mon) return;
  let blk=$(`.fj-week[data-wk="${iso}"]`,wrap);
  if(!blk){
    const box=document.createElement("div");
    box.innerHTML=fjWeekHTML(iso,false);
    blk=box.firstElementChild;
    wrap.appendChild(blk);
    initRowControls(blk);
  }
  $$(".fj-week",wrap).forEach(b=>b.classList.toggle("on",b===blk));
  pg.dataset.wk=iso;
  const w=weekOfMonth(mon);
  pg.dataset.wky=w.y; pg.dataset.wkm=w.m;
  const lab=$("[data-wklab]",pg);
  if(lab) lab.textContent=wkMonLabel(mon);
}
function fjInitPage(pg){
  const d=wkParseISO(pg.dataset.wk);
  fjShow(pg, d ? wkMonISO(wkMondayOf(d)) : wkMonISO(wkMondayOf(bjDate())));
}
/* 老存档迁移：日计划的时间表补上 07 与 24 两行（原来 08–15 / 16–23 各 8 行）。
   已写的内容原样留在原行上，只在首尾各插一行空的。 */
function migrateDailyTimetable(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="daily")
    ? [scope] : $$('.page[data-tpl="daily"]',scope||book);
  let dirty=false;
  const mkRow=h=>{
    const d=document.createElement("div");
    d.className="tt-r";
    d.innerHTML='<div class="tt-h">'+pad(h)+'</div><div class="tt-c" contenteditable="true" data-ph=""></div>';
    return d;
  };
  pages.forEach(pg=>{
    const cols=$$(".tt-col",pg);
    if(cols.length<2) return;
    const c1=cols[0], c2=cols[1];
    const first=$(".tt-r .tt-h",c1);
    if(first && first.textContent.trim()==="08"){ c1.insertBefore(mkRow(7),c1.firstChild); dirty=true; }
    const hs=$$(".tt-r .tt-h",c2);
    const last=hs[hs.length-1];
    if(last && last.textContent.trim()==="23"){ c2.appendChild(mkRow(24)); dirty=true; }
  });
  return dirty;
}
/* 老存档迁移：页头灰字 → 周药丸；日卡片按各自日期归到所在周，凑齐 7 天；去掉「＋ 加一天」 */
function migrateFoodWeeks(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="food")
    ? [scope] : $$('.page[data-tpl="food"]',scope||book);
  let dirty=false;
  pages.forEach(pg=>{
    const head=$(".fj-head",pg);
    if(head && !$("[data-wksel]",head)){
      const ttl=$(".p-title",head), sub=$(".sub",head);
      head.innerHTML=
        '<div class="fj-titlerow">'+
          (ttl?ttl.outerHTML:'<h1 class="p-title">Food Journal</h1>')+
          '<button type="button" class="mc-sel" data-wksel="1"><span data-wklab="1">—</span><span class="caret">▾</span></button>'+
          '<div class="mc-pop" data-wkpop="1"></div>'+
        '</div>'+
        (sub?sub.outerHTML:'<p class="sub" style="margin:0">饮食 · 运动记录</p>');
      dirty=true;
    }
    $$("[data-addday]",pg).forEach(b=>{ b.remove(); dirty=true; });
    if($("[data-fjwrap]",pg)) return;
    const days=$$(".fj-day",pg).filter(d=>!d.closest("[data-fjwrap]"));
    const weeks={}, order=[];
    const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    days.forEach(d=>{
      const inp=$(".dinput",d);
      const dt=wkParseISO(inp?inp.value:"")||bjDate();
      const wk=wkMonISO(wkMondayOf(dt)), v=isoOf(dt);
      if(!weeks[wk]){ weeks[wk]={used:{},extra:[]}; order.push(wk); }
      const fd=$(".fj-date",d);
      if(fd) fd.innerHTML='<span class="fj-d">'+v.slice(5).replace("-",".")+'</span>'+
                          '<span class="dwd set">'+weekdayOf(v)+'</span>';
      d.dataset.fjd=v;
      if(weeks[wk].used[v]) weeks[wk].extra.push(d); else weeks[wk].used[v]=d;
    });
    const wrap=document.createElement("div");
    wrap.className="fj-weeks"; wrap.dataset.fjwrap="1";
    if(days.length) days[0].parentElement.insertBefore(wrap,days[0]);
    else pg.appendChild(wrap);
    order.sort().forEach(wk=>{
      const mon=wkParseISO(wk);
      const box=document.createElement("div");
      box.className="fj-week"; box.dataset.wk=wk;
      let html="";
      for(let i=0;i<7;i++){
        const dd=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
        const v=isoOf(dd);
        const old=weeks[wk].used[v];
        html += old ? old.outerHTML : fjDayHTML(v);
      }
      box.innerHTML=html;
      weeks[wk].extra.forEach(d=>box.appendChild(d));   /* 同一天重复的卡片不丢，接在后面 */
      wrap.appendChild(box);
    });
    days.forEach(d=>d.remove());
    pg.dataset.wk=wkMonISO(wkMondayOf(bjDate()));
    dirty=true;
  });
  return dirty;
}
/* 周计划页头改版：标题「周计划」→「我的一周」、标题下加横线、
   每个周区块顶部补「周计划 + 该周日期范围」小标题与清单，
   并把页面级那份清单搬进当前那一周（它原来是切周不变的，现在按周存档） */
function migrateWeeklyPlan(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="weekly")
    ? [scope] : $$('[data-tpl="weekly"]',scope||book);
  let dirty=false;
  pages.forEach(pg=>{
    /* ① 标题文字 */
    const t=$(".wk-title",pg);
    if(t && t.textContent.trim()==="周计划"){ t.textContent="我的一周"; dirty=true; }
    /* ② 标题下的横线 */
    if(!$(".wk-hr-top",pg)){
      const d=document.createElement("div");
      d.className="wk-hr wk-hr-top";
      const head=$(".wk-head",pg);
      (head||pg.firstElementChild).after(d);
      dirty=true;
    }
    /* ③ 周区块顶部补「小标题 + 清单 + 下横线」（已有小标题＝已是新版，跳过） */
    $$(".wk-week",pg).forEach(blk=>{
      if($(".wk-ptitle",blk)) return;
      const pre=document.createElement("div");
      pre.className="wk-ptitle";
      pre.innerHTML='周计划<span class="wk-prange"></span>';
      const items=document.createElement("div");
      items.className="yp-items wk-items";
      const hr=document.createElement("div");
      hr.className="wk-hr wk-hr-bot";
      blk.insertBefore(pre,blk.firstChild);
      pre.after(items); items.after(hr);
      dirty=true;
    });
    /* ④ 页面级旧清单搬进当前那一周（不丢内容），搬完删掉空壳 */
    let old=$(".yp-items.wk-items",pg);
    if(old && old.parentElement!==pg) old=null;          /* 已经在区块里了 */
    if(old){
      const blk=$(".wk-week.on",pg) || $(".wk-week",pg);
      const target=blk?$(".wk-items",blk):null;
      if(target) while(old.firstChild) target.appendChild(old.firstChild);
      old.remove();
      dirty=true;
    }
    /* ⑤ 每天的 ＋ 从「周X」那一行挪到该天清单里（末尾占位）
       —— 只删掉旧按钮，renumberOL 会给每天的 .yp-items 重新挂上 */
    $$(".wk-drow .wk-add",pg).forEach(b=>{ b.remove(); dirty=true; });
  });
  return dirty;
}
/* 老存档的周计划页是「一周一个区块往下堆叠」（还有页头日期框与「＋新增一周」）。
   这里把每个已有区块按**它自己的日期**分别归位到周区块容器里 —— 必须逐个归位，
   只留当前那一个会丢掉用户写在其它周里的内容。 */
function migrateWeekly(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="weekly")
    ? [scope] : $$('[data-tpl="weekly"]',scope||book);
  let dirty=false;
  pages.forEach(pg=>{
    if($("[data-wkwrap]",pg)) return;
    const head=$(".wk-head",pg);
    const headInp=head?$(".dinput",head):null;
    const secs=$$(".wk-sec",pg);
    if(!secs.length) return;
    /* ① 逐块记下它属于哪一周（第一块的日期在页头，其余在自己的 .wk-top 里） */
    const keys=secs.map((sec,i)=>{
      const inp=$(".dinput",sec) || (i===0?headInp:null);
      const d=inp&&inp.value?wkParseISO(inp.value):null;
      return wkMonISO(d?wkMondayOf(d):wkMondayOf(bjDate()));
    });
    /* ② 去掉旧的日期行：药丸已经显示「几月第几周」，7 天日期列也各自有日期 */
    secs.forEach(sec=>{ const t=$(".wk-top",sec); if(t) t.remove(); });
    const nb=$(".wk-nextweek",pg); if(nb) nb.remove();
    const db=$(".wk-datebox",pg); if(db) db.remove();
    /* ③ 页头改成「标题 + 周药丸 + 面板」 */
    if(head){
      const mon=wkParseISO(keys[0])||wkMondayOf(bjDate());
      const w=weekOfMonth(mon);
      head.innerHTML=
        `<div class="wk-title">周计划</div>`+
        `<button type="button" class="mc-sel" data-wksel="1"><span data-wklab="1">${wkMonLabel(mon)}</span><span class="caret">▾</span></button>`+
        `<div class="mc-pop" data-wkpop="1"></div>`;
      pg.dataset.wky=w.y; pg.dataset.wkm=w.m;
    }
    /* ④ 全部塞进周区块容器；默认选中「今天所在的那一周」，没有就选第一块 */
    const wrap=document.createElement("div");
    wrap.className="wk-weeks"; wrap.dataset.wkwrap="1";
    const nowISO=wkMonISO(wkMondayOf(bjDate()));
    let selIdx=keys.indexOf(nowISO); if(selIdx<0) selIdx=0;
    secs.forEach((sec,i)=>{
      sec.classList.add("wk-week");
      sec.dataset.wk=keys[i];
      sec.classList.toggle("on",i===selIdx);
      wrap.appendChild(sec);
    });
    pg.appendChild(wrap);
    pg.dataset.wk=keys[selIdx];
    dirty=true;
  });
  return dirty;
}

/* ---------- 通用条目（年计划 / 周计划共用） ----------
   kind: task 任务框 | ul 无序 | ol 有序 | del 删除线        */
const KIND_NAME = {task:"任务", ul:"无序", ol:"有序", del:"删除线", plain:"纯文本"};

function ypItem(kind){
  /* 所有类型共用同一个 .yp-mark 容器，保证图标与文字中心在同一横线 */
  const inner = kind==="task" ? '<span class="box"></span>' : "";
  const cls   = kind==="del" ? ' class="del"' : "";
  const ph    = kind==="plain" ? "写点文字…" : (KIND_NAME[kind]||"内容");
  return `<div class="yp-item ${kind}">`+
    `<span class="yp-mark"${cls}>${inner}</span>`+
    `<div class="yp-txt" contenteditable="true" data-ph="${ph}"></div>`+
    `<button class="yp-sw" data-ypsw="1" title="切换类型">⇄</button>`+
    `<button class="yp-st" data-ypst="1" title="删除线">S</button>`+
    `<button class="yp-del" data-ypdel="1" title="删除">×</button>`+
  `</div>`;
}

/* 类型循环：任务 → 无序 → 有序 → 纯文本 → 任务
   （删除线不再是类型 —— 它是对选中文字施加的格式，不参与轮换） */
function nextKind(cur){
  const order=["task","ul","ol","plain"];
  if(order.indexOf(cur)<0) return "task";     /* 旧的 del 条目：下一步回到任务 */
  return order[(order.indexOf(cur)+1)%order.length];
}

/* 打开「添加」类型菜单（年计划月份、周计划通用）
   kinds 可指定要出现哪些类型，默认四种 */
const MENU_ICON={
  task:'<span class="box"></span>',
  ul:'<span class="dot"></span>',
  ol:'<span class="num">1.</span>',
  strike:'<span class="no"></span>'
};
const MENU_LABEL={task:"任务", ul:"无序", ol:"有序", plain:"纯文本", strike:"删除线"};
function openAddMenu(items, kinds){
  const ex=$(".yp-menu",items);
  if(ex){ ex.remove(); return; }
  closeFitMenu();
  const list=kinds? kinds.split(",") : ["task","ul","ol","plain","strike"];
  const menu=document.createElement("div");
  menu.className="yp-menu";
  menu.innerHTML=list.map(k=>{
    const ic=MENU_ICON[k];
    return `<button type="button" data-kind="${k}">`+
      (ic?`<span class="mi">${ic}</span>`:"")+
      `<span>${MENU_LABEL[k]||k}</span></button>`;
  }).join("");
  /* 插在占位 ＋ 的上一行 —— 就是「准备写的那一行」，菜单本身占位、加号与横线一起下移 */
  const slot=$(".yp-addslot",items);
  if(slot) slot.before(menu); else items.appendChild(menu);
  ensureVisible(menu,true);
  return menu;
}

/* ---------- 删除线：对「选中的文字」施加 / 移除 ----------
   点 ＋ 会让编辑区失焦、选中态被清空，所以平时就用 selectionchange 把最近一次
   有效选中（以及光标所在条目）记下来，点菜单里的「删除线」时再恢复。 */
let SEL_RANGE=null, SEL_BOX=null;
/* 程序化施加删除线（execCommand）时会触发一次 input 事件 →
   别让「写满自动加一行」误判成用户在写字 */
let EXEC_STRIKE=false;
document.addEventListener("selectionchange",function(){
  const s=window.getSelection();
  if(!s||!s.rangeCount) return;
  const r=s.getRangeAt(0);
  const node=r.startContainer.nodeType===1 ? r.startContainer : r.startContainer.parentElement;
  const box=node&&node.closest ? node.closest(".yp-txt,.fin") : null;
  if(!box){ SEL_RANGE=null; SEL_BOX=null; return; }
  SEL_BOX=box;
  SEL_RANGE = s.isCollapsed ? null : r.cloneRange();   /* isCollapsed 是属性，不是方法 */
});
/* 返回 "sel"（施加到选中文字）/ "item"（施加到整条）/ null（没有可作用的目标） */
function applyStrike(){
  const S=window.getSelection();
  try{
    if(SEL_RANGE && document.contains(SEL_RANGE.commonAncestorContainer)){
      SEL_BOX.focus();
      S.removeAllRanges(); S.addRange(SEL_RANGE);
      EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
      SEL_RANGE=null;
      return "sel";
    }
    if(SEL_BOX && document.contains(SEL_BOX)){
      SEL_BOX.focus();
      const r=document.createRange(); r.selectNodeContents(SEL_BOX);
      S.removeAllRanges(); S.addRange(r);
      EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
      SEL_RANGE=null;
      return "item";
    }
  }catch(_){ EXEC_STRIKE=false; }
  return null;
}

/* 量「符号内容」在标记列里的左缘（相对标记列），供桥接线起笔用：
   task 的框 / ol 的数字是真实节点，Range 能量到；ul 的圆点是 ::before 画的，
   Range 是空矩形 → 按几何算（列宽15、点4、居中 = 5.5px） */
/* 符号左边留多少"出头"：圆点只有 4px，线贴着它的左缘起笔会看不出是被划掉的 → 留 2px */
const OVERHANG={ul:2};
function markContentLeft(it){
  const mark=$(".yp-mark",it); if(!mark) return null;
  let cr=null;
  try{
    const rng=document.createRange(); rng.selectNodeContents(mark);
    cr=rng.getBoundingClientRect();
  }catch(_){}
  if(cr && cr.width>0) return cr.left - mark.getBoundingClientRect().left;
  if(it.classList.contains("ul")) return 5.5 - (OVERHANG.ul||0);
  return null;
}
/* 整行删除线：execCommand 已经把文字划上/取消，这里同步给行加/去 .struck
   （.struck 负责把横线延伸到符号上，与文字那条线接成一条） */
function toggleStruckRow(it){
  if(!it) return;
  if(it.classList.contains("struck")){ it.classList.remove("struck"); return; }
  const txt=$(".yp-txt",it)||$(".fin",it);   /* FIT 行的文字格是 .fin */
  const struck = !txt || /<(s|strike)\b/i.test(txt.innerHTML) ||
    getComputedStyle(txt).textDecorationLine.indexOf("line-through")>=0;
  if(struck){
    it.classList.add("struck");
    const off=markContentLeft(it);
    it.style.setProperty("--strike-x", (off==null?0:off).toFixed(2)+"px");
  }
}
/* 行内的 S 按钮：选中了字 → 只划选中的（不动符号）；
   光标在行内/没选中 → 划整行（符号一起划）；再点一次 → 取消 */
function strikeRow(it){
  const txt=$(".yp-txt",it)||$(".fin",it); if(!txt) return false;
  const S=window.getSelection();
  try{
    if(SEL_RANGE && SEL_BOX===txt && document.contains(SEL_RANGE.commonAncestorContainer)){
      txt.focus(); S.removeAllRanges(); S.addRange(SEL_RANGE);
      EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
      SEL_RANGE=null;
      save(); return true;
    }
    txt.focus();
    const r=document.createRange(); r.selectNodeContents(txt);
    S.removeAllRanges(); S.addRange(r);
    EXEC_STRIKE=true; document.execCommand("strikeThrough"); EXEC_STRIKE=false;
    toggleStruckRow(it);
    /* 整行划完要把选区收起来：否则 selectionchange 会把「全选」记成有效选区，
       下一次点 S 走的是「只划选中部分」那条路 → .struck 永远去不掉 */
    try{
      const c=document.createRange(); c.selectNodeContents(txt); c.collapse(false);
      S.removeAllRanges(); S.addRange(c);
    }catch(_){}
    SEL_RANGE=null;
    save(); return true;
  }catch(_){ EXEC_STRIKE=false; }
  return false;
}
/* 点 S 时别让按钮抢走焦点、把文字选区清空（触摸端靠 selectionchange 快照兜底） */
document.addEventListener("mousedown",function(e){
  const b=e.target && e.target.closest ? e.target.closest("[data-ypst]") : null;
  if(b) e.preventDefault();
},true);

/* ---------- FIT 行（饮食页底部）：类型菜单 + 切换 + 删除线 ----------
   与 .yp-item 共用一套：标记列用 .yp-mark（⇄ 换类型时符号会变，桥接线起笔要重算），
   文字格是 .fin（所以 strikeRow / toggleStruckRow 里按 .yp-txt || .fin 取） */
const FIT_TYPES=["task","ul","ol","plain"];
let FIT_MENU_ROW=null;
let __fitMigrated=false;                 /* 老存档补结构 → 写回一次 */
function fitMarkHTML(kind){
  if(kind==="task") return '<span class="box"></span>';
  if(kind==="plain") return '<span class="fitplus">＋</span>';
  return "";                             /* ul 的圆点 / ol 的序号由 CSS 或编号生成 */
}
/* 有序编号按每个 FIT 列表独立重排 */
function fitRenumber(scope){
  const lists = (scope && scope.classList && scope.classList.contains("grow-list")) ? [scope]
              : (scope ? $$(".grow-list",scope) : $$(".grow-list"));
  lists.forEach(list=>{
    let n=0;
    $$(".fit-row",list).forEach(it=>{
      if(!it.classList.contains("ol")) return;
      n++;
      const mk=$(".yp-mark",it);
      if(mk) mk.textContent=n+".";
      if(it.classList.contains("struck")){
        const off=markContentLeft(it);   /* 序号变宽（9.→10.）→ 起笔位置重算 */
        if(off!=null) it.style.setProperty("--strike-x",off.toFixed(2)+"px");
      }
    });
  });
}
function fitSetKind(row,kind){
  row.classList.remove("task","ul","ol","plain");
  row.classList.add(kind);
  const mk=$(".yp-mark",row);
  if(mk) mk.innerHTML=fitMarkHTML(kind);
  if(kind!=="task"){
    $$(".box",row).forEach(b=>b.classList.remove("on"));
    row.classList.remove("done");
  }
  fitRenumber(row.parentElement);
  if(row.classList.contains("struck")){
    const off=markContentLeft(row);
    row.style.setProperty("--strike-x",(off==null?0:off).toFixed(2)+"px");
  }
}
function fitNextKind(row){
  const cur=FIT_TYPES.filter(k=>row.classList.contains(k))[0]||"plain";
  fitSetKind(row, nextKind(cur));
}
/* 复用 strikeRow：文字格按 .yp-txt || .fin 取，符号列都是 .yp-mark */
function fitStrikeRow(row){ return strikeRow(row); }
function fitDelRow(row){
  const list=row.parentElement;
  if(!list || $$(".fit-row",list).length<=1){
    const ce=$(".fin",row); if(ce) ce.textContent="";
    $$(".box",row).forEach(b=>b.classList.remove("on"));
    row.classList.remove("done","struck"); row.style.removeProperty("--strike-x");
    return;
  }
  row.remove(); fitRenumber(list);
}
/* 菜单就是「准备写的那一行」：临时把这一行藏起来，菜单占在它原来的位置（不新增行） */
function openFitMenu(row){
  closeFitMenu();
  const menu=document.createElement("div");
  menu.className="yp-menu"; menu.dataset.fitrow="1";
  menu.innerHTML=["task","ul","ol","plain","strike"].map(k=>{
    const ic=MENU_ICON[k];
    return `<button type="button" data-kind="${k}">`+
      (ic?`<span class="mi">${ic}</span>`:"")+
      `<span>${MENU_LABEL[k]||k}</span></button>`;
  }).join("");
  row.classList.add("fit-menu");       /* 行让位 */
  row.after(menu);                     /* 菜单落在这一行的位置 */
  FIT_MENU_ROW=row;
  ensureVisible(menu,true);
}
/* 收菜单＝菜单消失 + 那一行回到原位（少了这步，行会被永久藏住） */
function closeFitMenu(){
  $$(".yp-menu",document).forEach(m=>m.remove());
  $$(".fit-row.fit-menu",document).forEach(r=>r.classList.remove("fit-menu"));
  FIT_MENU_ROW=null;
}
/* 老存档 / 老自定义模板里补上标记列与 ⇄/S/×（幂等） */
function fitNormalize(scope){
  let changed=false;
  $$(".fit-row",scope||document).forEach(row=>{
    $$(".del-item",row).forEach(b=>{ b.remove(); changed=true; });   /* 以前挂的独立 × */
    let mk=$(".yp-mark",row);
    if(!mk){
      mk=document.createElement("span");
      mk.className="yp-mark";
      const ft=$(".ftag",row);
      if(ft) ft.after(mk); else row.insertBefore(mk,row.firstChild);
      changed=true;
    }
    if(!FIT_TYPES.some(k=>row.classList.contains(k))){ row.classList.add("plain"); changed=true; }
    if(!$(".yp-sw",row)){
      const fin=$(".fin",row);
      const frag=document.createElement("div");
      frag.innerHTML='<button class="yp-sw" data-ypsw="1" title="切换类型">⇄</button>'+
        '<button class="yp-st" data-ypst="1" title="删除线">S</button>'+
        '<button class="yp-del" data-ypdel="1" title="删除">×</button>';
      const __nodes=[...frag.children];
      if(fin) fin.after(...__nodes); else row.append(...__nodes);
      changed=true;
    }
    if(!mk.children.length && !mk.textContent.trim()){
      const k=FIT_TYPES.filter(x=>row.classList.contains(x))[0];
      if(k==="task"||k==="plain"){ mk.innerHTML=fitMarkHTML(k); changed=true; }
    }
  });
  if(scope) fitRenumber(scope);
  if(changed) __fitMigrated=true;
  return changed;
}

/* ==========================================================
   索引：自动扫描全本，按页面类型归类
========================================================== */
/* 取一页的摘要文字（日期优先，其次标题，其次类型名） */
function pageSummary(pg){
  const t=pg.dataset.tpl||"";
  /* 周计划 → 周范围（比单日日期更有用） */
  if(t==="weekly"){
    const wr=$("[data-weekrange]",pg);
    return (wr&&wr.textContent)?wr.textContent:"—";
  }
  /* 饮食页 → 当前那一周（按周存档，卡片日期由周决定） */
  if(t==="food"){
    const lb=$("[data-wklab]",pg);
    return (lb&&lb.textContent)?lb.textContent:"—";
  }
  /* 日历格 → 当前月份 + 当前分类 */
  if(t==="calgrid"){
    const m=parseInt(pg.dataset.mcm,10);
    return (isNaN(m)?"—":(m+1)+"月")+(pg.dataset.cat?" · "+pg.dataset.cat:"");
  }
  /* 有日期字段的：用第一个日期 + 星期 */
  const di=$(".dinput",pg);
  if(di&&di.value){
    const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(di.value);
    if(m){
      const wd=weekdayOf(di.value);
      const base=m[1].replace(/^0/,"")+"."+m[2]+(wd?" "+wd:"");
      /* 日计划再带上 Focus 一句话 */
      if(t==="daily"){
        const f=$(".p-title",pg) && pg.querySelector("[data-ph^='今天最重要']");
        const txt=f?f.textContent.trim():"";
        return base + (txt&&txt!=="今天最重要的一件事" ? " · "+txt.slice(0,12) : "");
      }
      /* 饮食页带上天数 */
      if(t==="food"){ return base+" · "+pg.querySelectorAll(".fj-day").length+" 天"; }
      return base;
    }
  }
  /* 阅读记录 → 书名 */
  if(t==="reading"){
    const f=$(".field .fv",pg);
    const s=f?f.textContent.trim():"";
    return s||"（未命名书）";
  }
  /* 年计划 → 年份 */
  if(t==="yearly"){
    const y=$(".yp-year",pg);
    const n=pg.querySelectorAll(".yp-item").length;
    return (y?y.textContent:"—")+" 年 · "+n+" 条";
  }
  /* 年度日历 → 年份 */
  if(t==="yearcal"){ const y=$("[data-cyear]",pg); return (y?y.textContent:"—")+" 年"; }
  /* 月度计划 → 年 + 月 */
  if(t==="monthly"){
    const y=$("[data-myear]",pg), mo=pg.querySelector('[data-opt="mm"] .opt.on');
    return (y?y.textContent:"—")+" 年 "+(mo?mo.textContent:"—");
  }
  /* 打卡 → 月份；体重 → 年月 */
  if(t==="habit"){
    const s=$(".sub",pg); return s?s.textContent.trim().split(" · ")[0]:"—";
  }
  if(t==="weight"){
    const s=$(".sub",pg);
    if(s){ const a=s.textContent.trim().split(" · "); return a[a.length-1]||"—"; }
    return "—";
  }
  /* 空白 / 点阵 → 标题 */
  const h=pg.querySelector("h2.p-title");
  if(h){
    const s=h.textContent.trim();
    if(s && s!=="标题") return s;
  }
  /* 周计划 → 周范围 */
  if(t==="weekly"){ const wr=$("[data-weekrange]",pg); return wr&&wr.textContent?wr.textContent:"—"; }
  const m=tplMeta(t);
  return m.n;
}

/* 重建索引页内容 */
/* 目录数据：类目 → 模板类型 → 页面。索引页和目录侧边栏共用同一份口径 */
function ixData(){
  const pages=$$(".page",book);
  const idx=pages.find(p=>p.dataset.tpl==="index");
  const out=[];
  GROUP_ORDER.forEach(g=>{
    const byTpl={};
    pages.forEach((pg,i)=>{
      if(pg===idx) return;                   // 索引不索引自己
      const t=pg.dataset.tpl||"blank";
      const meta=tplMeta(t);
      if(meta.g!==g) return;
      (byTpl[t]=byTpl[t]||[]).push({pg, no:i+1, tpl:t, meta:meta});
    });
    const types=Object.keys(byTpl).map(t=>({tpl:t, meta:byTpl[t][0].meta, list:byTpl[t]}));
    if(types.length) out.push({g:g, name:GROUP_NAME[g], types:types});
  });
  return out;
}
function buildIndex(){
  const idx=$$(".page",book).find(p=>p.dataset.tpl==="index");
  if(!idx) return;
  const body=$("[data-ixbody]",idx), stat=$("[data-ixstat]",idx);
  if(!body) return;

  const data=ixData();
  let html="", total=0;
  data.forEach(grp=>{
    html+=`<div class="ix-group"><div class="ix-gh">${grp.name}</div>`;
    grp.types.forEach(t=>{
      total+=t.list.length;
      html+=`<div class="ix-tpl"><div class="ix-th"><span class="ix-ico">${t.meta.i}</span>`+
            `<span class="ix-tn">${t.meta.n}</span><span class="ix-cnt">${t.list.length}</span></div>`;
      t.list.forEach(x=>{
        /* 摘要在前、页码靠右（页数集中成一列，好扫） */
        html+=`<div class="ix-row" data-goto="${x.no}">`+
              `<span class="ix-sum">${esc(pageSummary(x.pg))}</span>`+
              `<span class="ix-no">${x.no}</span></div>`;
      });
      html+=`</div>`;
    });
    html+=`</div>`;
  });

  if(!total){
    body.innerHTML='<div style="font-size:11px;color:var(--ink3);padding:8px 0">还没有可归类的页面</div>';
  }else{
    body.innerHTML=html;
  }
  if(stat) stat.textContent=`共 ${total} 页 · ${data.length} 类`;
}
