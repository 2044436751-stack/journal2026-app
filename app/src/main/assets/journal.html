/* 给页面内的所有列表装上「+ 新增」和「× 删除」控件（幂等，可重复调用） */
function initRowControls(page){
  /* --- 表格 --- */
  $$('table[data-autorow]',page).forEach(tb=>{
    const thead=$("thead",tb);
    const body=$("tbody",tb);
    if(!body) return;
    const rows=$$("tr",body);
    const needAct = rows.length && !rows[0].querySelector(".rowact");
    if(needAct){
      if(thead){
        const htr=$("tr",thead);
        if(htr && !$(".rowact",htr)){
          const th=document.createElement("th");
          th.className="rowact"; th.textContent="";
          htr.appendChild(th);
        }
      }
      rows.forEach(tr=>{
        const td=document.createElement("td");
        td.className="rowact";
        td.innerHTML='<button class="del-row" title="删除此行">×</button>';
        tr.appendChild(td);
      });
    }
    if(!tb.nextElementSibling || !tb.nextElementSibling.classList.contains("addrow")){
      const b=document.createElement("button");
      b.className="addrow"; b.dataset.addrow="1"; b.textContent="＋ 新增一行";
      tb.insertAdjacentElement("afterend",b);
    }
  });

  /* --- grow-list（Todo / fitness / 周计划任务） --- */
  $$(".grow-list",page).forEach(list=>{
    fitNormalize(list);                       /* FIT 行：补标记列与 ⇄/S/× */
    const items=$$(".grow-item",list);
    items.forEach(it=>{
      if(it.classList.contains("fit-row")) return;   /* FIT 行用 ⇄/S/×，不再挂单独的 × */
      if(!$(".del-item",it)){
        const b=document.createElement("button");
        b.className="del-item"; b.dataset.delitem="1"; b.textContent="×"; b.title="删除此条";
        it.appendChild(b);
      }
    });
    if(!list.nextElementSibling || !list.nextElementSibling.classList.contains("addrow")){
      const b=document.createElement("button");
      b.className="addrow"; b.dataset.additem="1"; b.textContent="＋ 新增一条";
      list.insertAdjacentElement("afterend",b);
    }
  });
}

function renumber(){
  $$(".page",book).forEach((p,i)=>{
    let n=$(".page-num",p);
    if(!n){ n=document.createElement("div"); n.className="page-num"; p.appendChild(n); }
    n.textContent=(i+1);
    if(!$(".del-page",p)){
      const b=document.createElement("button");
      b.className="del-page"; b.textContent="✕"; b.title="删除此页";
      p.appendChild(b);
    }
    initRowControls(p);
    /* 老存档：单行格子 → 多条目结构；顺带补心情块 */
    if(p.dataset.tpl==="calgrid" && cgNormalize(p)) __cgMigrated=true;
    if(isMCPage(p.dataset.tpl)) mcInitPage(p);
    if(p.dataset.tpl==="diary") ddInitPage(p);
    if(p.dataset.tpl==="weekly") wkInitPage(p);
    if(p.dataset.tpl==="food") fjInitPage(p);
  });
}

function save(){
  $$("[contenteditable]",book).forEach(e=>e.removeAttribute("data-focus"));
  /* 图片多了可能撑爆 localStorage：当场说明白，别静默丢数据 */
  try{ localStorage.setItem(KEY, book.innerHTML); window.__saveWarned=false; }
  catch(err){
    if(!window.__saveWarned){ window.__saveWarned=true; toast("存储空间已满，本次改动没存进去"); }
  }
}

function load(){
  loadTpls();                       /* 自定义模板样式（若用户改过） */
  const s=localStorage.getItem(KEY);
  if(s){ book.innerHTML=s; }
  else{
    book.innerHTML = [
      T.cover(), T.legend(), T.index(), T.yearly(), T.yearcal(),
      T.monthly(), T.weekly(), T.daily(), T.diary(), T.food(),
      T.habit(), T.weight(), T.booklist(), T.reading()
    ].join("");
  }
  /* 迁移标记要在这些 migrate 之前声明：它们改完结构要写回存档一次，
     否则每次打开都要重跑一遍迁移（migrateMonthPages 必须在 renumber 之前跑） */
  let __migrated=false;
  if(migrateMonthPages(book)) __migrated=true;   /* 老存档：三页包进当前月区块，防丢数据 */
  if(migrateWeekly(book)) __migrated=true;       /* 老存档：周计划堆叠的周区块逐个归位，防丢数据 */
  if(migrateDiary(book)) __migrated=true;        /* 老存档：日记页正文包进当天区块，防丢数据 */
  if(migrateWeeklyPlan(book)) __migrated=true;   /* 老存档：周计划页头改版＋旧清单搬进当周 */
  if(migrateFoodWeeks(book)) __migrated=true;    /* 老存档：饮食页按周存档，卡片归到各自那一周 */
  if(migrateDailyTimetable(book)) __migrated=true; /* 老存档：日计划时间表补 07 / 24 两行 */
  renumber();
  /* 日计划页标题：Today's Focus on → Today's List（大小写照原文显示） */
  $$('.page[data-tpl="daily"] .p-title',book).forEach(el=>{
    const t=el.textContent.replace(/\s+/g," ").trim();
    if(/^Today'?s Focus on$/i.test(t)){ el.textContent="Today's List"; __migrated=true; }
  });
  /* 读书清单状态面板：老存档里可能还留在月份区块内 → 提到页级 */
  if(migrateBlPop(book)) __migrated=true;
  /* 右上角水印只保留月任务：月日历 / 读书清单 / Weight Tracker / 本月打卡 四页去掉 */
  $$('.page[data-tpl="monthcal"] .mc-wm,.page[data-tpl="habit"] .mc-wm,'+
    '.page[data-tpl="booklist"] .mc-wm,.page[data-tpl="weight"] .mc-wm',book)
    .forEach(el=>{ el.remove(); __migrated=true; });
  /* Reading Journal 标题旧存档里是两行（含 <br>），换成单行 */
  $$(".rj-t",book).forEach(el=>{
    if(el.querySelector("br")||/<br/i.test(el.innerHTML)){
      el.innerHTML=el.innerHTML.replace(/<br\s*\/?>/gi," ");
      __migrated=true;
    }
  });
  $$(".fj-dh .hint",book).forEach(el=>{
    if(/^b\/?l\/?d\/?s.d$/i.test(el.textContent.replace(/\s/g,""))){ el.textContent="饱腹感"; __migrated=true; }
  });
  /* 旧版周计划页头下方的独立 ＋ 已移除，改到列表末尾做占位行 */
  $$(".wk-head + .wk-add",book).forEach(el=>{ el.remove(); __migrated=true; });
  /* 读书清单：状态列由四个胶囊改成下拉框，保留原来选中的那一项 */
  $$('[data-opt="status"]',book).forEach(g=>{
    const on=$(".opt.on",g);
    const cur=((on&&on.textContent)||BL_OPTS[0]).trim();
    const box=document.createElement("span");
    box.className="selbox"; box.dataset.selst="1"; box.dataset.v=cur;
    box.innerHTML=esc(cur)+'<i class="crt"></i>';
    const td=g.closest("td"); if(td) td.classList.add("selcell");
    g.replaceWith(box); __migrated=true;
  });
  /* 年计划页头改版：标题在左 + 年份切片器紧随其后；原来那行操作提示去掉 */
  if(migrateYPHead(book)) __migrated=true;
  /* 打卡页：习惯行补删除列 + 底部补新增入口 */
  if(migrateHabit(book)) __migrated=true;
  /* 顶部标题统一（22px/红/左上）：老存档标题上的内联字号/颜色清掉，交给 CSS */
  $$(".p-title",book).forEach(el=>{
    if(el.style.fontSize||el.style.color||el.style.letterSpacing||el.style.lineHeight){
      el.style.removeProperty("font-size"); el.style.removeProperty("color");
      el.style.removeProperty("letter-spacing"); el.style.removeProperty("line-height");
      __migrated=true;
    }
  });
  /* ＋ 按钮的类型清单归一：老存档把旧的 task,ul,ol 烘进了 ＋ 按钮，
     导致菜单只有三个按钮（缺纯文本/删除线）→ 每次加载统一归一成五种 */
  $$('[data-kinds]',book).forEach(b=>{
    if(b.dataset.kinds!=="task,ul,ol,plain,strike"){
      b.dataset.kinds="task,ul,ol,plain,strike"; __migrated=true;
    }
  });
  /* 老存档的行补上删除线 S 按钮（在 ⇄ 与 × 之间） */
  $$(".yp-item",book).forEach(it=>{
    const sw=$(".yp-sw",it);
    if(sw && !$(".yp-st",it)){
      const b=document.createElement("button");
      b.className="yp-st"; b.dataset.ypst="1"; b.title="删除线"; b.textContent="S";
      sw.after(b); __migrated=true;
    }
  });
  /* FIT 行改版（标记列 + ⇄/S/×）由 renumber → initRowControls 补齐，这里只负责写回存档 */
  if(__fitMigrated){ __migrated=true; __fitMigrated=false; }
  if(__cgMigrated){ __migrated=true; __cgMigrated=false; }
  if(__migrated) save();
  /* 弹层属于运行时状态，不该跟正文一起存：加载时清一遍（顺带修掉以前存进去的残留） */
  let __popDirty=false;
  $$(".bl-pop,.mc-pop,.yp-menu,.yp-pop,[data-mtpop]",book).forEach(p=>{
    if(p.classList.contains("on")||p.innerHTML||p.dataset.for){
      p.classList.remove("on"); p.innerHTML=""; delete p.dataset.for; __popDirty=true;
    }
  });
  /* FIT 菜单顶掉的那一行：万一存档时还留着隐藏状态，这里放回来 */
  $$(".fit-row.fit-menu",book).forEach(r=>{ r.classList.remove("fit-menu"); __popDirty=true; });
  if(__popDirty) save();
  $$('[data-tpl="weight"]',book).forEach(refreshWeight);
  syncDates(book);
  wkDates(book);
  renumberOL(book);
  $$('[data-tpl="yearly"]',book).forEach(ypUpdateCur);   /* 标题字样与年份保持一致 */
  buildIndex();
}

/* ==========================================================
   插入
========================================================== */
function insert(key){
  const html=tplHtml(key);          /* 有自定义样式就用自定义的 */
  const wrap=document.createElement("div");
  wrap.innerHTML=html;
  const page=wrap.firstElementChild;
  if(TPL_CUSTOM[key]) hydrateTpl(page);
  book.appendChild(page);
  page.scrollIntoView({behavior:"smooth",block:"start"});
  renumber();
  renumberOL(page);   /* 新页面的周计划列表立刻挂上占位 ＋（月任务步骤格不用） */
  if(migrateYPHead(page)) ypUpdateCur(page);   /* 老的自定义模板可能还是旧页头 */
  migrateHabit(page);                          /* 老的自定义模板补删除列 / 新增入口 */
  if(key==="weight") refreshWeight(page);
  syncDates(page);
  wkDates(page);
  autoIndex();
  save();
  toast("已插入："+page.dataset.label);
}

/* ==========================================================
   交互：点击
========================================================== */
document.addEventListener("click",function(e){
  const t=e.target;

  /* 目录侧边栏：打开 / 关闭 / 底部插入入口 / 点条目跳转 */
  if(t.closest("[data-idxbtn]")){ openDrawer(); return; }
  if(t.closest("[data-dwclose]")||t.id==="dwm"){ closeDrawer(); return; }
  if(t.closest("[data-dwadd]")){ closeDrawer(); setTimeout(openSheet,240); return; }
  const dwr=t.closest("[data-dwno]");
  if(dwr){
    if(DW_JUST_DRAGGED) return;              /* 刚拖动完，别当成点击 */
    const no=parseInt(dwr.dataset.dwno,10);
    closeDrawer();
    setTimeout(()=>gotoPage(no),60);
    return;
  }

  /* 面板：卡片右上角铅笔 → 进入模板样式编辑 */
  const pen=t.closest("[data-tpledit]");
  if(pen){ closeSheet(); enterTplEdit(pen.dataset.tpledit); return; }
  /* 模板编辑模式：块删除 / 保存 / 取消 / 恢复默认 */
  const tpx=t.closest("[data-tplx]");
  if(tpx){ const blk=tpx.parentElement; blk.remove(); return; }
  if(t.closest("[data-tplsave]")){ saveTplEdit(); return; }
  if(t.closest("[data-tplcancel]")){ exitTplEdit(); toast("已取消编辑"); return; }
  if(t.closest("[data-tplreset]")){ resetTplEdit(); return; }

  /* 月任务：标出「当前行」——空行的删除按钮靠它显形（移动端 hover 不可靠）。
     每次点击先清掉旧的，再按落点重新标 */
  $$("tr.mt-act",book).forEach(r=>r.classList.remove("mt-act"));
  const mtrow=t.closest("tr");
  if(mtrow && mtrow.dataset.mtempty) mtrow.classList.add("mt-act");

  /* 索引：点「整理」 */
  const ri=t.closest("[data-reindex]");
  if(ri){ buildIndex(); toast("已整理 "+$$('.ix-row',book).length+" 条"); return; }

  /* 索引：点条目 → 跳转并高亮 */
  const go=t.closest("[data-goto]");
  if(go){ gotoPage(parseInt(go.dataset.goto,10)); return; }

  /* ---------- 日历格（calgrid）---------- */
  if(t.closest("[data-cgsel]")){
    const cgs=t.closest("[data-cgsel]");
    const pg=cgs.closest(".page"), pop=$("[data-cgpop]",pg);
    if(!pop) return;
    const wasOn=pop.classList.contains("on");
    mcClosePop();
    if(!wasOn){
      pop.innerHTML=cgPopHTML(pg);
      pop.classList.add("on");
      pop.style.left=(cgs.offsetLeft||0)+"px";
      const pr=pop.getBoundingClientRect(), gr=pg.getBoundingClientRect();
      const over=pr.right-(gr.right-19);
      if(over>0) pop.style.left=Math.max(0,(cgs.offsetLeft||0)-over)+"px";
    }
    return;
  }
  const cgAdd=t.closest("[data-cgadd]");
  if(cgAdd){
    const pg=cgAdd.closest(".page"), inp=$("[data-cgnew]",pg);
    cgAddCat(pg,inp?inp.value:"");
    if(inp) inp.value="";
    return;
  }
  const cgCat=t.closest("[data-cgcat]");
  if(cgCat){
    const pg=cgCat.closest(".page");
    if(t.closest("[data-cgdel]")){ cgDelCat(pg,cgCat.dataset.cgcat); return; }
    cgShow(pg,cgCat.dataset.cgcat);
    mcClosePop(); save();
    return;
  }
  const cgAct=t.closest("[data-cgact]");
  if(cgAct){
    const cell=cgAct.closest(".cg-cell"), pg=cgAct.closest(".page"), a=cgAct.dataset.cgact;
    const item=cgCurItem(cell);
    if(a==="type"){ if(item) cgOpenType(item); return; }
    if(a==="img"){
      const inp=$("[data-cgfile]",pg);
      if(inp){ inp.dataset.cgd=cell.dataset.d; inp.value=""; inp.click(); }
      return;
    }
    if(a==="mood"){ cgToggleMood(pg,cell); return; }
    if(a==="strike"){ if(item) cgStrike(item); return; }
    if(a==="clear"){ cgClear(cell); return; }
  }
  /* 心情模式下点那张大脸 → 换一个表情（点名字是改字，交给默认行为） */
  const cgMoodBox=t.closest(".cg-moodbox");
  if(cgMoodBox){
    const mcell=cgMoodBox.closest(".cg-cell"), mpg=mcell&&mcell.closest(".page");
    if(mpg){
      cgActivate(mpg,mcell);
      if(!t.closest(".cg-mname")) cgOpenMood(mpg,mcell);
    }
    return;
  }
  const cgKind=t.closest(".cg-menu button");
  if(cgKind){
    const item=CG_TYPE_ITEM;
    cgCloseType();
    if(item) cgSetKind(item,cgKind.dataset.kind);
    return;
  }
  const cgEmo=t.closest("[data-cgemo]");
  if(cgEmo){
    const cell=CG_MOOD_CELL, item=CG_MOOD_ITEM;
    cgCloseMood();
    /* 心情模式：选表情＝换成这一格的大表情（名字跟着换） */
    if(cell&&cell.classList.contains("mood")){ cgSetFace(cell,cgEmo.dataset.cgemo); return; }
    const txt=item?$(".cg-txt",item):null;
    if(txt){
      /* 面板按钮会抢焦点、选区可能已经丢了 → 丢失时把光标放到该条目末尾 */
      const s=window.getSelection();
      if(!s.rangeCount||!txt.contains(s.anchorNode)){
        const r=document.createRange();
        r.selectNodeContents(txt); r.collapse(false);
        s.removeAllRanges(); s.addRange(r);
      }
      txt.focus({preventScroll:true});
      try{ document.execCommand("insertText",false,cgEmo.dataset.cgemo); }
      catch(_){ txt.textContent+=cgEmo.dataset.cgemo; }
      save();
    }
    return;
  }
  const cgImgX=t.closest(".cg-img-x");
  if(cgImgX){ cgImgX.closest(".cg-img").remove(); save(); return; }
  const cgBlank=t.closest(".cg-blank[data-d]");
  if(cgBlank){ cgRestoreCell(cgBlank); return; }
  const cgMk=t.closest(".cg-mark");
  if(cgMk){
    const item=cgMk.closest(".cg-item");
    if(item&&item.classList.contains("task")){ item.classList.toggle("done"); cgMark(item); save(); }
    return;
  }
  const cgCell=t.closest(".cg-cell");
  if(cgCell){
    const pg=cgCell.closest(".page");
    cgActivate(pg,cgCell);
    const item=t.closest(".cg-item");
    if(item) CG_ITEM=item;
    return;
  }
  /* 点日历格页面上的别处 → 收起工具条 / 表情面板 / 类型菜单 */
  const cgPg=t.closest(".page");
  if(cgPg && cgPg.dataset.tpl==="calgrid" && !t.closest(".mc-pop,[data-cgsel],[data-mcsel]")){
    cgDeactivate(cgPg); cgCloseType(); cgCloseMood();
  }

  /* FIT 行（饮食页底部）：点行弹类型菜单；文字区照常打字 */
  const fr=t.closest(".fit-row");
  if(fr){
    if(t.closest("[data-ypst]")){ if(!fitStrikeRow(fr)) toast("先选中要加删除线的文字"); return; }
    if(t.closest("[data-ypsw]")){ fitNextKind(fr); save(); return; }
    if(t.closest("[data-ypdel]")){ fitDelRow(fr); save(); return; }
    const fbx=t.closest(".box");
    if(fbx){ fbx.classList.toggle("on"); fr.classList.toggle("done",fbx.classList.contains("on")); save(); return; }
    if(t.closest(".fin")) return;
    const flist=fr.parentElement;
    const fex=$(".yp-menu",flist);
    if(fex && FIT_MENU_ROW===fr){ closeFitMenu(); return; }   /* 再点一次＝收起，行回来 */
    openFitMenu(fr);
    return;
  }

  /* 月日历：点页面别处收起年月面板（周切片器也复用 .mc-pop，一并收起） */
  if($(".mc-pop.on") && !t.closest(".mc-pop") && !t.closest("[data-mcsel]") && !t.closest("[data-wksel]")) mcClosePop();

  /* 点别处收起「类型菜单」（＋ / 步骤格唤出的那个）；点 ＋ 本身保留开关效果 */
  if(!t.closest(".yp-menu") && !t.closest("[data-mk]")){
    closeFitMenu();
  }

  /* 点别处收起「读书清单状态下拉」的面板 */
  if(!t.closest(".bl-pop") && !t.closest("[data-selst]")) blClosePop();
  /* 点别处收起「年计划年份」的面板 */
  if(!t.closest(".yp-pop") && !t.closest("[data-ysel]")) ypClosePop();

  /* 月日历：打开 / 收起年月切片器 */
  const mcs=t.closest("[data-mcsel]");
  if(mcs){
    const pg=mcs.closest(".page"), pop=$("[data-mcpop]",pg);
    const wasOn=pop.classList.contains("on");
    mcClosePop();
    if(!wasOn){
      pop.innerHTML=mcPopHTML(parseInt(pg.dataset.mcy,10),parseInt(pg.dataset.mcm,10));
      /* 面板对齐到切片器下方（月日历的切片器不再贴最左，所以要跟着走位） */
      pop.style.left=(mcs.offsetLeft||0)+"px";
      pop.classList.add("on");
    }
    return;
  }
  /* 月日历：切年份（把今天所在的年写进页面，内容同步） */
  const mcprev=t.closest("[data-mcyprev]"), mcnext=t.closest("[data-mcynext]");
  if(mcprev||mcnext){
    const pg=(mcprev||mcnext).closest(".page");
    const y=parseInt(pg.dataset.mcy,10)+(mcprev?-1:1);
    const m=parseInt(pg.dataset.mcm,10);
    mcShow(pg,y,m);
    $("[data-mcpop]",pg).innerHTML=mcPopHTML(y,m);
    save(); return;
  }
  /* 月日历：选月份 */
  const mcmo=t.closest("[data-mcmo]");
  if(mcmo){
    const pg=mcmo.closest(".page");
    mcShow(pg,parseInt(pg.dataset.mcy,10),parseInt(mcmo.dataset.mcmo,10));
    mcClosePop(); save(); return;
  }
  /* 月日历：符号切换 实心（有固定时间） ⇄ 短横（笔记） */
  const mcsy=t.closest(".mc-sym");
  if(mcsy){
    const row=mcsy.closest(".mc-row");
    if(row&&!row.classList.contains("blank")){
      mcsy.dataset.sym = mcsy.dataset.sym==="dash" ? "dot" : "dash";
      save();
    }
    return;
  }

  /* 月任务：空行最右侧的 ✕ → 删除这一行（不补行，行数由用户自己控制） */
  const mtdel=t.closest("[data-mtdel]");
  if(mtdel){
    const tr=mtdel.closest("tr"), tb=tr&&tr.closest("tbody");
    if(tr&&tb&&tb.children.length>1){
      tr.remove(); mtSyncEmpty(tb); save(); toast("已删除一行");
    }else{
      toast("至少保留一行");
    }
    return;
  }
  /* 月任务：完成情况单元格 → 弹三选菜单 */
  const mtst=t.closest("[data-mtst]");
  if(mtst){
    const pop=$("[data-mtpop]",mtst.closest(".page"));
    const was=pop&&pop.classList.contains("on")&&pop.dataset.for===mtst.dataset.mtid;
    mcClosePop();
    if(!was){
      mcTagId(mtst);
      if(pop){ pop.dataset.for=mtst.dataset.mtid; mtOpenStatus(mtst); }
    }
    return;
  }
  /* 月任务：选状态 */
  const mtv=t.closest("[data-mtstv]");
  if(mtv){
    const pop=mtv.closest(".mc-pop");
    const id=pop&&pop.dataset.for;
    const td=id?$(`[data-mtid="${id}"]`,mtv.closest(".page")):null;
    if(td) mtSetStatus(td,mtv.dataset.mtstv);
    mcClosePop(); save(); return;
  }
  /* 月任务：＋ 新增一行（限定在当前月份区块内） */
  const mtadd=t.closest("[data-mtadd]");
  if(mtadd){
    mtAddRow(mtadd.closest(".mc-month")||mtadd.closest(".page"));
    const tb=$(".mt-tbl tbody",mtadd.closest(".mc-month")||mtadd.closest(".page"));
    const last=tb&&tb.lastElementChild;
    const ce=last&&last.querySelector(".mt-goal"); if(ce) ce.focus();
    return;
  }
  /* 月任务：光标落进「具体执行步骤」单元格 → 直接弹类型菜单（＝原来点 ＋ 的效果）
     注意：本段位于类型菜单等条目处理之前，必须排除条目 / 菜单内的点击，
     否则会把「选类型 / ⇄ / ×」的点击吞掉 */
  const mtstep=t.closest("td.mt-step");
  if(mtstep && !t.closest(".yp-item") && !t.closest("[data-mk]") && !t.closest(".yp-menu")){
    const items=$(".yp-items",mtstep);
    if(items){ openAddMenu(items,"task,ul,ol,plain,strike"); return; }
  }

  /* 月度计划：切年份 / 选月份 → 重绘月历 */
  const mpv=t.closest("[data-mprev]"), mpx=t.closest("[data-mnext]"), mmo=t.closest('[data-opt="mm"] .opt');
  if(mpv||mpx||mmo){
    const pg=(mpv||mpx||mmo).closest(".page");
    const ye=$("[data-myear]",pg);
    let y=parseInt(ye.textContent,10)||TODAY.getFullYear();
    if(mpv) y--; if(mpx) y++;
    ye.textContent=y;
    if(mmo){ const g=mmo.parentElement; $$(".opt",g).forEach(s=>s.classList.toggle("on",s===mmo)); }
    const mon=pg.querySelector('[data-opt="mm"] .opt.on');
    const m=mon?parseInt(mon.textContent,10)-1:TODAY.getMonth();
    const grid=$("[data-mgrid]",pg);
    if(grid) grid.innerHTML=monthGrid(y,m);
    save(); autoIndex(); return;
  }

  /* 年度日历：切年份 → 重绘 12 格 */
  const cpv=t.closest("[data-cprev]"), cpx=t.closest("[data-cnext]");
  if(cpv||cpx){
    const pg=(cpv||cpx).closest(".page");
    const ye=$("[data-cyear]",pg);
    let y=parseInt(ye.textContent,10)||TODAY.getFullYear();
    y += cpv ? -1 : 1;
    ye.textContent=y;
    const g=$("[data-ygrid]",pg);
    if(g) g.innerHTML=yearGrid(y);
    save(); autoIndex(); return;
  }

  /* 周计划：周切片器 —— 打开/收起面板 */
  const wks=t.closest("[data-wksel]");
  if(wks){
    const pg=wks.closest(".page"), pop=$("[data-wkpop]",pg);
    if(!pop) return;
    const wasOn=pop.classList.contains("on");
    mcClosePop();
    if(!wasOn){
      pop.innerHTML=wkPopHTML(parseInt(pg.dataset.wky,10),parseInt(pg.dataset.wkm,10),pg.dataset.wk);
      pop.classList.add("on");
      pop.style.left=(wks.offsetLeft||0)+"px";
      /* 标题长的页（如 Food Journal）药丸靠右，206px 面板会捅出纸面 → 整体左移到不溢出
         （19 = 纸面 1px 边框 + 18px 内边距） */
      const pr=pop.getBoundingClientRect(), gr=pg.getBoundingClientRect();
      const over=pr.right-(gr.right-19);
      if(over>0) pop.style.left=Math.max(0,(wks.offsetLeft||0)-over)+"px";
    }
    return;
  }
  /* 周计划：面板里翻月份（只翻列表，选中哪一周要再点一次） */
  const wkprev=t.closest("[data-wkprev]"), wknext=t.closest("[data-wknext]");
  if(wkprev||wknext){
    const pg=(wkprev||wknext).closest(".page");
    let y=parseInt(pg.dataset.wky,10), m=parseInt(pg.dataset.wkm,10);
    if(wkprev){ m--; if(m<0){ m=11; y--; } }
    else{ m++; if(m>11){ m=0; y++; } }
    pg.dataset.wky=y; pg.dataset.wkm=m;
    $("[data-wkpop]",pg).innerHTML=wkPopHTML(y,m,pg.dataset.wk);
    return;
  }
  /* 周计划：选某一周（切块；没写过的周自动新建一份空白） */
  const wkw=t.closest("[data-wkw]");
  if(wkw){
    const pg=wkw.closest(".page"), iso=wkw.dataset.wkw;
    /* 饮食页与周计划页共用这一份面板：按页类型走各自的切周 */
    if(pg.dataset.tpl==="food") fjShow(pg,iso); else wkShow(pg,iso);
    mcClosePop(); save(); autoIndex();
    return;
  }

  /* 周计划：删除某一周 */
  const wkd=t.closest("[data-wkdel]");
  if(wkd){
    const pg=wkd.closest(".page");
    if($$(".wk-sec",pg).length<=1){ toast("至少保留一周"); return; }
    const sec=wkd.closest(".wk-sec");
    const dt=$(".dinput",sec);
    const when=dt&&dt.value?dt.value:"这一周";
    askConfirm({
      title:"删除这一周？",
      msg:"即将删除 <b>"+esc(when)+"</b> 的计划与周记。删除后无法恢复。"
    }).then(ok=>{
      if(!ok) return;
      sec.remove(); autoIndex(); save(); toast("已删除该周");
    });
    return;
  }

  /* 周计划：编辑周记 */
  const wke=t.closest("[data-wkedit]");
  if(wke){
    const j=$(".wk-journal",wke.closest(".wk-sec"));
    if(j){ j.focus(); ensureVisible(j,true); }
    return;
  }

  /* 加号 —— 展开类型菜单（年计划 / 周计划通用） */
  const mk=t.closest("[data-mk]");
  if(mk){
    /* 优先看按钮所属容器，其次是其后的条目区（页头 ＋ 的情况） */
    let items=null;
    const host=mk.closest(".yp-month")||mk.closest(".wk-day")||mk.closest(".yp-items");
    if(host) items=$(".yp-items",host)||host;
    if(!items){
      let nx=mk.nextElementSibling;
      while(nx && !nx.classList.contains("yp-items")) nx=nx.nextElementSibling;
      items=nx;
    }
    if(!items){
      const pg=mk.closest(".page");
      items=$(".wk-items",pg);
    }
    if(items) openAddMenu(items, mk.dataset.kinds);
    return;
  }

  /* 选择类型 → 添加一项 */
  const kb=t.closest(".yp-menu button");
  if(kb){
    const menu=kb.parentElement, items=menu.parentElement;
    const kind=kb.dataset.kind;
    /* FIT 行的菜单：不新增条目，改的是被点的那一行 */
    if(menu.dataset.fitrow){
      const frow=FIT_MENU_ROW;
      closeFitMenu();                        /* 菜单消失 + 那一行回到原位 */
      if(frow){
        if(kind==="strike"){ if(!fitStrikeRow(frow)) toast("先选中要加删除线的文字"); }
        else fitSetKind(frow,kind);
        save();
      }
      return;
    }
    menu.remove();
    if(kind==="strike"){
      /* 删除线不是类型：施加到选中的文字（没有选中就整条），不新增条目 */
      const r=applyStrike();
      if(!r){ toast("先选中要加删除线的文字"); return; }
      if(r==="item" && SEL_BOX) toggleStruckRow(SEL_BOX.closest(".yp-item,.fit-row"));
      save(); return;
    }
    const d=document.createElement("div");
    d.innerHTML=ypItem(kind);
    items.appendChild(d.firstElementChild);
    const ce=$(".yp-txt",items.lastElementChild); if(ce) ce.focus();
    renumberOL(items); save(); return;
  }

  /* 行内删除线按钮 S：选中了字只划选中的，没选中划整行（含符号），再点取消 */
  const stb=t.closest("[data-ypst]");
  if(stb){
    if(!strikeRow(stb.closest(".yp-item,.fit-row"))) toast("先选中要加删除线的文字");
    return;
  }

  /* 切换类型（任务 → 无序 → 有序 → 删除线） */
  const sw=t.closest("[data-ypsw]");
  if(sw){
    const it=sw.closest(".yp-item");
    const cur=it.classList.contains("task")?"task":(it.classList.contains("ol")?"ol":
      (it.classList.contains("plain")?"plain":(it.classList.contains("del")?"del":"ul")));
    const next=nextKind(cur);
    const txt=$(".yp-txt",it).innerHTML;
    const d=document.createElement("div");
    d.innerHTML=ypItem(next);
    const ni=d.firstElementChild;
    $(".yp-txt",ni).innerHTML=txt;
    if(it.classList.contains("struck")){
      ni.classList.add("struck");   /* 换类型保留整行删除线 */
      const off=markContentLeft(ni);   /* 符号变了（圆点↔序号），起笔位置要重算 */
      ni.style.setProperty("--strike-x", (off==null?0:off).toFixed(2)+"px");
    }
    it.replaceWith(ni);
    renumberOL(ni.closest(".yp-items")); save(); return;
  }

  /* 年计划：删除一项 */
  const yd=t.closest("[data-ypdel]");
  if(yd){
    const it=yd.closest(".yp-item"), items=it.closest(".yp-items");
    it.remove(); renumberOL(items); save(); return;
  }

  /* 打卡页：新增一个习惯 */
  const hba=t.closest("[data-hbadd]");
  if(hba){ hbAddRow(hba.closest(".page")); return; }

  /* 年计划：点年份切片器 → 弹年份面板 */
  const ysel=t.closest("[data-ysel]");
  if(ysel){
    const pg=ysel.closest(".page"), pop=$("[data-ypop]",pg);
    const wasOn=pop&&pop.classList.contains("on");
    ypClosePop();
    if(!wasOn&&pop){
      const cur=parseInt(($(".yp-year",pg)||{}).textContent,10)||TODAY.getFullYear();
      pop.innerHTML=ypPopHTML(cur);
      pop.classList.add("on");
      const on=$(".yp-yo.on",pop); if(on&&on.scrollIntoView) on.scrollIntoView({block:"center"});
    }
    return;
  }
  /* 年计划：选年份 → 标题字样跟着变 */
  const ypy=t.closest("[data-ypy]");
  if(ypy){
    ypSetYear(ypy.closest(".page"),parseInt(ypy.dataset.ypy,10));
    ypClosePop();
    return;
  }

  /* 勾选框 */
  const box=t.closest(".box");
  if(box){
    box.classList.toggle("on");
    const c=box.closest(".chk"); if(c) c.classList.toggle("done",box.classList.contains("on"));
    const yi=box.closest(".yp-item"); if(yi) yi.classList.toggle("done",box.classList.contains("on"));
    save(); return;
  }

  /* 习惯格子 */
  const dot=t.closest(".habgrid .dot");
  if(dot){ dot.classList.toggle("on"); save(); return; }

  /* 心情刻度条 */
  const seg=t.closest("[data-mood]");
  if(seg){ const bar=seg.parentElement; $$(".seg",bar).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.mood,10)<=parseInt(seg.dataset.mood,10))); save(); return; }

  /* 饱腹感 */
  const ff=t.closest(".fj-row .f");
  if(ff){ const box=ff.parentElement; $$(".f",box).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.f,10)<=parseInt(ff.dataset.f,10))); save(); return; }

  /* 餐食来源（单选） */
  const src=t.closest(".src");
  if(src){ const g=src.parentElement; $$(".src",g).forEach(s=>s.classList.toggle("on",s===src)); save(); return; }

  /* 读书清单：点状态框 → 弹下拉面板（再点一次收起） */
  const slb=t.closest("[data-selst]");
  if(slb){
    const pg=slb.closest(".page"), pop=pg&&$("[data-blpop]",pg);
    const was=pop&&pop.classList.contains("on")&&pop.dataset.for===slb.dataset.selid;
    blClosePop();
    if(!was) blOpen(slb);
    return;
  }
  /* 读书清单：选一项 → 写入并收起 */
  const blo=t.closest(".bl-opt");
  if(blo){
    const pop=blo.closest("[data-blpop]");
    const id=pop&&pop.dataset.for;
    const box=id?$(`[data-selid="${id}"]`,pop.closest(".page")):null;
    if(box) blSet(box,blo.dataset.blv);
    blClosePop(); save(); return;
  }

  /* 单选题式选项组（同组互斥） */
  const op=t.closest(".opt");
  if(op){
    const g=op.parentElement;
    $$(".opt",g).forEach(s=>s.classList.toggle("on",s===op));
    save(); return;
  }

  /* 星级 */
  const st=t.closest("[data-star]");
  if(st){ const g=st.parentElement; $$(".s",g).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.star,10)<=parseInt(st.dataset.star,10))); save(); return; }

  /* 阅读进度 */
  const pg=t.closest("[data-p]");
  if(pg){ const g=pg.parentElement; $$(".p",g).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.p,10)<=parseInt(pg.dataset.p,10))); save(); return; }

  /* 版本 pill */
  const pl=t.closest("[data-kind]");
  if(pl){ $$("[data-kind]",pl.closest(".field")).forEach(s=>s.classList.toggle("on",s===pl)); save(); return; }

  /* 天气 */
  const wx=t.closest(".wx");
  if(wx){ $$(".wx",wx.closest(".weather")).forEach(s=>s.classList.toggle("on",s===wx)); save(); return; }

  /* 星期高亮 */
  const dw=t.closest(".dow span");
  if(dw){ $$("span",dw.parentElement).forEach(s=>s.classList.toggle("on",s===dw)); save(); return; }

  /* 删除表格行 */
  const dr=t.closest(".del-row");
  if(dr){
    const tr=dr.closest("tr"), body=tr.parentElement;
    if($$("tr",body).length<=1){
      $$("[contenteditable]",tr).forEach(e=>e.textContent="");
      $$(".box",tr).forEach(e=>e.classList.remove("on"));
    }else{ tr.remove(); }
    save(); return;
  }

  /* 删除列表条目 */
  const di=t.closest(".del-item");
  if(di){
    const it=di.closest(".grow-item"), list=it.parentElement;
    if($$(".grow-item",list).length<=1){
      const ce=$("[contenteditable]",it); if(ce) ce.textContent="";
      $$(".box",it).forEach(e=>e.classList.remove("on"));
    }else{ it.remove(); }
    save(); return;
  }

  /* ＋ 新增一行（表格） */
  const ar=t.closest("[data-addrow]");
  if(ar){
    const tb=ar.previousElementSibling, body=$("tbody",tb);
    const last=$$("tr",body).pop();
    const c=last.cloneNode(true);
    $$("[contenteditable]",c).forEach(e=>e.textContent="");
    $$(".box",c).forEach(e=>e.classList.remove("on"));
    $$(".opt",c).forEach(e=>e.classList.remove("on"));
    $$(".s",c).forEach(e=>e.classList.remove("on"));
    resetSelbox(c);
    body.appendChild(c);
    const first=$("[contenteditable]",c); if(first) first.focus();
    save(); return;
  }

  /* ＋ 新增一条（列表） */
  const ai=t.closest("[data-additem]");
  if(ai){
    const list=ai.previousElementSibling;
    const last=$$(".grow-item",list).pop();
    const c=last.cloneNode(true);
    const ce=$("[contenteditable]",c); if(ce) ce.textContent="";
    $$(".box",c).forEach(e=>e.classList.remove("on"));
    $$(".opt",c).forEach(e=>e.classList.remove("on"));
    $$(".s",c).forEach(e=>e.classList.remove("on"));
    c.classList.remove("struck","done"); c.style.removeProperty("--strike-x");
    list.appendChild(c);
    if(c.classList.contains("fit-row")) fitRenumber(list);
    const first=$("[contenteditable]",c); if(first) first.focus();
    save(); return;
  }

  /* 删除页 */
  const del=t.closest(".del-page");
  if(del){
    if($$(".page",book).length<=1){ toast("至少保留一页"); return; }
    const pg=del.closest(".page");
    const label=(pg.dataset.label||"这一页");
    const no=$$(".page",book).indexOf(pg)+1;
    askConfirm({
      title:"删除这一页？",
      msg:"即将删除第 <b>"+no+"</b> 页（"+esc(label)+"）。删除后无法恢复。"
    }).then(ok=>{
      if(!ok) return;
      pg.remove(); renumber(); autoIndex(); save();
      toast("已删除："+label);
    });
    return;
  }

  /* 打开面板 */
  if(t.id==="fab"){ openSheet(); return; }
  if(t.id==="mask"||t.id==="sheet-close"){ closeSheet(); return; }
  /* 模版面板：点灰色 ✕ → 从插入列表里删除这个模版（书里已有页面不受影响，可恢复） */
  const tpd=t.closest("[data-tpldel]");
  if(tpd){
    const k=tpd.dataset.tpldel, m=tplMeta(k);
    askConfirm({
      title:"从插入列表里删除？",
      msg:"「<b>"+esc(m.n)+"</b>」将不再出现在插入模版里。<br>书里已有的页面<b>不受影响</b>，之后可以随时恢复。",
      okText:"删除", danger:true
    }).then(ok=>{
      if(!ok) return;
      loadTplPref();
      if(TPL_HIDDEN.indexOf(k)<0) TPL_HIDDEN.push(k);
      saveTplPref();
      tplSortExit();
      openSheet();
      toast("已删除「"+m.n+"」");
    });
    return;
  }
  /* 模版面板：点「已删除 N 个 · 恢复」→ 全部恢复 */
  if(t.id==="trestore"){
    loadTplPref();
    const n=TPL_HIDDEN.length;
    TPL_HIDDEN=[];
    saveTplPref();
    openSheet();
    toast("已恢复 "+n+" 个模版");
    return;
  }
  /* 刚拖动完，别把松手那一下当成点击（否则会误插一页） */
  if(TS_JUST_DRAGGED) return;
  /* 模版面板：长按激活态中点卡片 → 先退出激活态，不插入页面 */
  if(TS_ON){
    const tc0=t.closest(".tcard");
    tplSortExit();
    if(tc0) return;
  }
  const tc=t.closest(".tcard");
  if(tc){ closeSheet(); setTimeout(()=>insert(tc.dataset.k),180); return; }

  if(t.id==="btn-top"){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.id==="btn-reset"){
    askConfirm({
      title:"恢复为初始页面？",
      msg:"当前所有内容将被<b>清空</b>，并恢复为初始 12 页模板。此操作无法撤销。",
      okText:"确认清空"
    }).then(ok=>{
      if(ok){ localStorage.removeItem(KEY); location.reload(); }
    });
    return;
  }
});

/* ==========================================================
   交互：输入
========================================================== */
document.addEventListener("input",function(e){
  const t=e.target;

  /* input 的值写入属性，保证存进 innerHTML */
  if(t.tagName==="INPUT"&&t.classList){
    t.setAttribute("value",t.value);
    if(t.classList.contains("wcell")){ refreshWeight(t.closest(".page")); save(); return; }
    if(t.classList.contains("dinput")){
      const pg=t.closest(".page")||document;
      syncDates(pg);
      if(t.closest('[data-tpl="weekly"]')) wkDates(pg);
      save(); return;
    }
    save(); return;
  }

  /* 月日历：内容有了/没了 → 符号显隐 */
  if(t.classList&&t.classList.contains("mc-txt")){
    const row=t.closest(".mc-row"); if(row) mcMarkRow(row);
    return;
  }
  /* 月任务：最后一行写了目标 → 自动补一行；写完/删完都要重算哪些行是空行 */
  if(t.classList&&(t.classList.contains("mt-goal")||t.classList.contains("mt-year"))){
    const tr=t.closest("tr"), tb=tr&&tr.parentElement;
    if(t.classList.contains("mt-goal") && tb && tr===tb.lastElementChild && t.textContent.trim()!==""){
      mtAddRow(tr.closest(".mc-month"));
    }
    mtSyncEmpty(tb); save(); return;
  }

  /* 表格自动增行 */
  const td=t.closest("td");
  if(td){
    const tb=td.closest("table");
    if(tb&&tb.hasAttribute("data-autorow")){
      const tr=td.parentElement, body=tr.parentElement;
      if(tr===body.lastElementChild && td.textContent.trim()!==""){
        const c=tr.cloneNode(true);
        $$("[contenteditable]",c).forEach(x=>x.textContent="");
        $$(".box",c).forEach(x=>x.classList.remove("on"));
        $$(".opt",c).forEach(x=>x.classList.remove("on"));
      $$(".s",c).forEach(x=>x.classList.remove("on"));
        resetSelbox(c);
        body.appendChild(c);
      }
    }
    return;
  }

  /* grow-list 自动增行（todo / fitness） */
  const gi=t.closest(".grow-item");
  if(gi){
    if(EXEC_STRIKE) return;                 /* 程序化划删除线触发的 input，不算写字 */
    const list=gi.parentElement;
    if(gi===list.lastElementChild && t.textContent.trim()!==""){
      const c=gi.cloneNode(true);
      const ce=$("[contenteditable]",c); if(ce) ce.textContent="";
      $$(".box",c).forEach(x=>x.classList.remove("on"));
      $$(".opt",c).forEach(x=>x.classList.remove("on"));
      $$(".s",c).forEach(x=>x.classList.remove("on"));
      /* 新行是干净的：不该继承上一行的删除线 / 打勾状态 */
      c.classList.remove("struck","done");
      c.style.removeProperty("--strike-x");
      list.appendChild(c);
      if(c.classList.contains("fit-row")) fitRenumber(list);
    }
    return;
  }
  save();
});

/* 日期选择：写入 value 属性以便持久化，并联动星期 / 星期高亮 */
document.addEventListener("change",function(e){
  const t=e.target;
  if(!t.classList) return;
  /* 日历格：选好的图片先压缩再插进那一格 */
  if(t.hasAttribute&&t.hasAttribute("data-cgfile")){
    const f=t.files&&t.files[0];
    const pg=t.closest(".page");
    if(f&&pg){
      const cell=cgCellOf(pg,t.dataset.cgd||"");
      if(cell){
        cgCompress(f,url=>{ cgInsertImage(pg,cell,url); });
      }else{ toast("这一格已经不在当前视图里了"); }
    }
    t.value="";
    return;
  }
  if(t.classList.contains("dinput")){
    t.setAttribute("value",t.value);
    const pg=t.closest(".page")||document;
    syncDates(pg);
    if(t.closest('[data-tpl="weekly"]')) wkDates(pg);
    /* 日记页按日存档：改日期＝切到那天的区块（没有就新建） */
    if(t.closest('[data-tpl="diary"]')) ddShow(pg,t.value);
    save();
    return;
  }
  if(t.classList.contains("wcell")){
    t.setAttribute("value",t.value);
    refreshWeight(t.closest(".page"));
    save();
  }
});

/* ==========================================================
   光标与行的通用操作（所有可编辑区域共用）
========================================================== */
/* 光标后面是否还有字 */
function hasTextAfter(el){
  const s=window.getSelection();
  if(!s||!s.rangeCount) return false;
  const r=s.getRangeAt(0);
  if(!el.contains(r.endContainer)) return false;
  const after=document.createRange();
  after.selectNodeContents(el);
  after.setStart(r.endContainer,r.endOffset);
  return /\S/.test(after.toString());
}
/* 把光标移到元素内容末尾：优先落进最后一个文本节点，
   真正停在「最后一个字后面」，而不是容器末尾（后者对中文输入/IME 更稳） */
function caretToEnd(el){
  try{ el.focus({preventScroll:true}); }catch(_){ el.focus&&el.focus(); }
  const s=window.getSelection();
  if(!s) return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  let last=null; while(w.nextNode()) last=w.currentNode;
  const r=document.createRange();
  if(last) r.setStart(last,last.length);
  else r.selectNodeContents(el);
  r.collapse(true);
  s.removeAllRanges(); s.addRange(r);
}
/* 这一行算不算「空的」：没有可见文字，且最多只剩一个换行占位 */
function isEmptyRow(el){
  if(el.textContent.trim()!=="") return false;
  return el.querySelectorAll("br").length<=1;
}
/* 从光标处拆成两行（仍在同一条里，第二行左边缘与第一行自动对齐） */
function breakLineAtCaret(el){
  const s=window.getSelection();
  if(!s||!s.rangeCount) return false;
  const r=s.getRangeAt(0);
  r.deleteContents();
  const br=document.createElement("br");
  r.insertNode(br);
  const nr=document.createRange();
  nr.setStartAfter(br); nr.collapse(true);
  s.removeAllRanges(); s.addRange(nr);
  return true;
}
/* 光标移到文字开头 */
function caretToStart(el){
  try{ el.focus({preventScroll:true}); }catch(_){ el.focus&&el.focus(); }
  const s=window.getSelection(); if(!s) return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  const first=w.nextNode();
  const r=document.createRange();
  if(first) r.setStart(first,0); else r.selectNodeContents(el);
  r.collapse(true); s.removeAllRanges(); s.addRange(r);
}
/* 年计划 / 周计划的条目列表：允许一路删到空（删空后就是「从没加过条目」的样子） */
function isYPList(el){
  const items=el.closest(".yp-items");
  if(!items) return false;
  const pg=items.closest(".page");
  const tpl=pg&&pg.dataset.tpl;
  return tpl==="yearly"||tpl==="weekly";
}
/* 空内容按退格 → 删掉整行，光标退回上一行文字末尾
   allowEmpty=true（年计划 / 周计划）时，第一行也能删；删光了列表就回到初始样式 */
function deleteEmptyRow(el,allowEmpty){
  const row=el.closest(".yp-item")||el.closest(".grow-item")||el.closest(".fj-row")||el.closest("tr");
  if(!row) return false;
  let container,sel;
  if(row.tagName==="TR"){ container=row.parentElement; sel="tr"; }
  else if(row.classList.contains("yp-item")){ container=row.parentElement; sel=".yp-item"; }
  else if(row.classList.contains("fj-row")){ container=row.parentElement; sel=".fj-row"; }
  else { container=row.parentElement; sel=".grow-item"; }
  const items=row.closest(".yp-items");
  const sibs=$$(sel,container);
  const i=sibs.indexOf(row);
  /* 只剩一行 / 已经是第一行：别的列表保留，年计划与周计划可以删空 */
  if(sibs.length<=1||i<=0){
    if(!allowEmpty) return false;
    const next=sibs[i+1];
    row.remove();
    if(items) renumberOL(items);
    if(row.classList.contains("fit-row")) fitRenumber(container);
    if(next){ const ne=$("[contenteditable]",next); if(ne) caretToStart(ne); }
    return true;
  }
  const prev=sibs[i-1];
  row.remove();
  if(items) renumberOL(items);
  const pce=$("[contenteditable]",prev);
  if(pce) caretToEnd(pce);
  return true;
}
/* 空内容按「删除键」（向后删）→ 同样删掉整行，光标落到下一行文字开头 */
function deleteRowForward(el){
  const row=el.closest(".yp-item");
  if(!row) return false;
  const items=row.parentElement;
  const sibs=$$(".yp-item",items);
  const i=sibs.indexOf(row);
  const next=sibs[i+1], prev=sibs[i-1];
  row.remove();
  renumberOL(items);
  if(next){ const ne=$("[contenteditable]",next); if(ne) caretToStart(ne); }
  else if(prev){ const pe=$("[contenteditable]",prev); if(pe) caretToEnd(pe); }
  return true;
}

/* 回车 / 退格的行级行为 */
document.addEventListener("keydown",function(e){
  const t=e.target;
  if(!t||!t.isContentEditable) return;

  /* ① 空内容 + 退格 → 删除该行，光标落到上一行最后一个字后面
     年计划 / 周计划里第一行也能删；删光了就回到「从没加过条目」的样子 */
  if(e.key==="Backspace"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
    if(isEmptyRow(t)){
      if(deleteEmptyRow(t,isYPList(t))){ e.preventDefault(); save(); return; }
    }
    return;
  }
  /* ①b 空内容 + 删除键（向后删）→ 同上，光标落到下一行开头 */
  if(e.key==="Delete"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
    if(isYPList(t)&&isEmptyRow(t)){
      if(deleteRowForward(t)){ e.preventDefault(); save(); return; }
    }
    return;
  }
  if(e.key!=="Enter") return;
  if(e.shiftKey) return;                     /* Shift+回车：条目内换行，走浏览器默认 */

  /* ② 光标后面还有字 → 从光标处拆成两行，仍属于同一条 */
  if(hasTextAfter(t)){
    e.preventDefault(); breakLineAtCaret(t); save(); return;
  }

  /* ③ 行尾回车 → 新增一条（列表 / 表格） */
  const gi=t.closest(".grow-item");
  if(gi){
    e.preventDefault();
    const list=gi.parentElement;
    let btn=list.nextElementSibling;
    if(btn&&btn.dataset.additem) btn.click();
    return;
  }
  /* 条目区：回车 = 在当前条目正下方新增同类型一项 */
  const yi=t.closest(".yp-item");
  if(yi){
    e.preventDefault();
    const kind=yi.classList.contains("task")?"task":(yi.classList.contains("ol")?"ol":(yi.classList.contains("del")?"del":"ul"));
    const items=yi.parentElement;
    const d=document.createElement("div");
    d.innerHTML=ypItem(kind);
    const ni=d.firstElementChild;
    yi.after(ni);
    const ce=$(".yp-txt",ni); if(ce) ce.focus();
    renumberOL(items); save(); return;
  }
  const td=t.closest("td");
  if(td){
    const tb=td.closest("table");
    if(tb&&tb.hasAttribute("data-autorow")){
      e.preventDefault();
      let btn=tb.nextElementSibling;
      if(btn&&btn.dataset.addrow) btn.click();
    }
  }
});

/* 统一兜底保存 */
document.addEventListener("blur",function(e){ if(e.target.isContentEditable) save(); },true);

/* ==========================================================
   体重：自动算 +/− 与折线图
========================================================== */
function refreshWeight(page){
  if(!page) return;
  const blk=page.querySelector(".mc-month.on")||page;   /* 当前月块（旧结构无月块时回退整页） */
  const cells=$$(".wcell",blk).map(i=>parseFloat(i.value));
  let prev=null, pts=[];
  $$(".wcell",blk).forEach((inp,i)=>{
    const v=parseFloat(inp.value);
    const cell=blk.querySelector('.delta[data-d="'+(i+1)+'"]');
    if(cell){
      if(isNaN(v)){ cell.textContent="—"; cell.className="delta"; }
      else{
        if(prev!==null && !isNaN(prev)){
          const d=+(v-prev).toFixed(1);
          cell.textContent=(d>0?"+":"")+d;
          cell.className="delta "+(d>0?"up":(d<0?"down":""));
        } else { cell.textContent="—"; cell.className="delta"; }
        prev=v;
      }
    }
    if(!isNaN(v)) pts.push([i,v]);
  });
  /* 结束体重 = 最新一条 */
  const endEl=$('[data-auto="end"]',blk);
  if(endEl){
    const last=pts.length?pts[pts.length-1][1]:null;
    endEl.textContent = last===null?"—":last.toFixed(1)+" kg";
  }
  /* 折线图（作用域限定在当前月块，避免多月份块重复 id） */
  const g=$(".wchart",blk);
  if(g){
    let s="";
    /* 网格 */
    for(let i=0;i<=4;i++){
      const y=10+i*27;
      s+=`<line x1="8" y1="${y}" x2="294" y2="${y}" stroke="#eee" stroke-width="1"/>`;
    }
    if(pts.length){
      const vals=pts.map(p=>p[1]);
      let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      const span=(mx-mn)||1; mn-=span*0.15; mx+=span*0.15;
      const X=i=>8+(i/(Math.max(pts.length-1,1)))*286;
      const Y=v=>118-((v-mn)/((mx-mn)||1))*98;
      const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
      s+=`<path d="${d}" fill="none" stroke="#1f1f1f" stroke-width="1.6" stroke-linejoin="round"/>`;
      pts.forEach((p,i)=>{ s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2" fill="#1f1f1f"/>`; });
      const lastp=pts[pts.length-1];
      s+=`<text x="${X(lastp[0]).toFixed(1)}" y="${(Y(lastp[1])-6).toFixed(1)}" font-size="9" fill="#1f1f1f" text-anchor="end">${lastp[1]}</text>`;
      s+=`<text x="10" y="16" font-size="8" fill="#aaa">${mx.toFixed(1)}</text>`;
      s+=`<text x="10" y="120" font-size="8" fill="#aaa">${mn.toFixed(1)}</text>`;
    }else{
      s+=`<text x="150" y="68" font-size="10" fill="#ccc" text-anchor="middle">填入体重自动生成曲线</text>`;
    }
    g.innerHTML=s;
  }
}

/* ==========================================================
   面板
========================================================== */
/* 模版列表的个性化：顺序（长按拖动）与已删除的模版 */
const TPL_KEY_ORDER="journal2026.v2.tplOrder", TPL_KEY_HIDDEN="journal2026.v2.tplHidden";
let TPL_ORDER=[], TPL_HIDDEN=[];
function loadTplPref(){
  try{ const a=JSON.parse(localStorage.getItem(TPL_KEY_ORDER));  TPL_ORDER =Array.isArray(a)?a:[]; }catch(_){ TPL_ORDER=[]; }
  try{ const a=JSON.parse(localStorage.getItem(TPL_KEY_HIDDEN)); TPL_HIDDEN=Array.isArray(a)?a:[]; }catch(_){ TPL_HIDDEN=[]; }
}
function saveTplPref(){
  localStorage.setItem(TPL_KEY_ORDER,JSON.stringify(TPL_ORDER));
  localStorage.setItem(TPL_KEY_HIDDEN,JSON.stringify(TPL_HIDDEN));
}
/* 按保存的顺序排列、去掉已删除的；没排过顺序的新模版接在后面 */
function tplVisibleList(){
  loadTplPref();
  const hidden=new Set(TPL_HIDDEN), map=new Map();
  TPL_LIST.forEach(x=>{ if(!hidden.has(x.k)) map.set(x.k,x); });
  const out=[];
  TPL_ORDER.forEach(k=>{ const x=map.get(k); if(x){ out.push(x); map.delete(k); } });
  map.forEach(x=>out.push(x));
  return out;
}
function tplCardHTML(x){
  return `<div class="tcard" data-k="${x.k}">`+
    `<button type="button" class="tpl-pen" data-tpledit="${x.k}" title="编辑这个模板的样式">${ICO_PEN}</button>`+
    `<button type="button" class="tpl-del" data-tpldel="${x.k}" title="从插入列表里删除这个模版">✕</button>`+
    `<div class="tico">${x.i}</div>`+
    `<div class="tn">${x.n}${TPL_CUSTOM[x.k]?'<span class="tpl-cust" title="已自定义">•</span>':''}</div>`+
    `<div class="td">${x.d}</div>`+
  `</div>`;
}
function openSheet(){
  const list=$("#tlist");
  loadTplPref();
  list.innerHTML=tplVisibleList().map(tplCardHTML).join("");
  const rs=$("#trestore");
  if(rs){
    if(TPL_HIDDEN.length){
      rs.classList.add("on");
      rs.textContent="已删除 "+TPL_HIDDEN.length+" 个模版 · 点此全部恢复";
    }else{ rs.classList.remove("on"); rs.textContent=""; }
  }
  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
}
function closeSheet(){
  tplSortExit();
  $("#mask").classList.remove("on");
  $("#sheet").classList.remove("on");
}

/* ---------- 模版卡：长按排序 + 删除 ----------
   长按 450ms → 卡片进入激活态（铅笔换成灰色 ✕），可拖动改顺序；
   松手没拖也保持激活态，方便再点 ✕ 删除。点别处退出激活态。 */
let TS_DRAG=null, TS_JUST_DRAGGED=false, TS_ON=false;
function tplSortExit(){
  TS_ON=false;
  $$(".tcard.tpl-on").forEach(c=>c.classList.remove("tpl-on"));
  document.body.classList.remove("tplsort");
}
function tplSortCancel(){
  const st=TS_DRAG;
  if(!st) return;
  clearTimeout(st.timer);
  if(st.ghost) st.ghost.remove();
  if(st.card) st.card.classList.remove("tpl-lift");
  $$(".tpl-dropline").forEach(x=>x.remove());
  document.body.classList.remove("tplsort");
  TS_DRAG=null;
}
function tplSortActivate(st){
  if(TS_DRAG!==st) return;
  st.active=true;
  TS_ON=true;
  st.card.classList.add("tpl-on");
  const b=st.card.getBoundingClientRect();
  const g=document.createElement("div");
  g.className="tpl-fly";
  g.innerHTML=st.card.innerHTML;
  g.style.left=b.left+"px"; g.style.top=b.top+"px"; g.style.width=b.width+"px";
  document.body.appendChild(g);
  st.ghost=g; st.dx=st.startX-b.left; st.dy=st.startY-b.top;
  st.card.classList.add("tpl-lift");
  document.body.classList.add("tplsort");
  if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(_){} }
}
function tplSortStart(e){
  if(TS_DRAG) return;
  if(e.pointerType==="mouse"&&e.button!==0) return;
  if(!$("#sheet").classList.contains("on")) return;
  const card=e.target.closest&&e.target.closest(".tcard");
  if(!card) return;
  const st={card:card, k:card.dataset.k, startX:e.clientX, startY:e.clientY,
            ghost:null, timer:0, active:false, drop:null};
  st.timer=setTimeout(()=>tplSortActivate(st),450);
  TS_DRAG=st;
}
function tplSortMove(e){
  const st=TS_DRAG; if(!st) return;
  if(!st.active){
    /* 长按还没成功就滑动 → 当作正常滚动 */
    if(Math.abs(e.clientY-st.startY)>8||Math.abs(e.clientX-st.startX)>8){
      clearTimeout(st.timer); TS_DRAG=null;
    }
    return;
  }
  if(e.cancelable) e.preventDefault();
  st.ghost.style.top=(e.clientY-st.dy)+"px";
  st.ghost.style.left=(e.clientX-st.dx)+"px";
  $$(".tpl-dropline").forEach(x=>x.remove());
  st.drop=null;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=el&&el.closest?el.closest(".tcard"):null;
  if(!tgt||tgt===st.card) return;
  const b=tgt.getBoundingClientRect();
  const after=(e.clientY>b.top+b.bottom)/2;
  const line=document.createElement("div");
  line.className="tpl-dropline";
  tgt.insertAdjacentElement(after?"afterend":"beforebegin",line);
  st.drop={k:tgt.dataset.k, after:after};
}
function tplSortEnd(){
  const st=TS_DRAG; if(!st) return;
  clearTimeout(st.timer);
  const active=st.active, drop=st.drop, card=st.card;
  tplSortCancel();
  if(!active) return;                     /* 没长按成功 → 交给 click 正常插入 */
  TS_JUST_DRAGGED=true;
  setTimeout(()=>{ TS_JUST_DRAGGED=false; },320);
  if(drop){
    /* 真正把卡片挪到落点，再按新 DOM 顺序写回偏好并重绘 */
    const tgt=$$(".tcard",$("#tlist")).find(c=>c.dataset.k===drop.k);
    if(tgt) tgt.insertAdjacentElement(drop.after?"afterend":"beforebegin",card);
    TPL_ORDER=$$(".tcard",$("#tlist")).map(c=>c.dataset.k);
    saveTplPref();
    TS_ON=false;
    openSheet();
    toast("模版顺序已保存");
  }else{
    card.classList.add("tpl-on");         /* 只长按没拖 → 保持激活态，可点 ✕ */
    document.body.classList.add("tplsort");
  }
}
document.addEventListener("pointerdown",tplSortStart);
document.addEventListener("pointermove",tplSortMove);
document.addEventListener("pointerup",tplSortEnd);
document.addEventListener("pointercancel",tplSortCancel);
document.addEventListener("touchmove",function(e){
  if(TS_DRAG&&TS_DRAG.active&&e.cancelable) e.preventDefault();
},{passive:false});

/* ==========================================================

function gotoPage(no){

  pg.classList.remove("flash"); void pg.offsetWidth; pg.classList.add("flash");

/* 当前视口里最靠中间的那一页，用来高亮 */

  const vh=window.innerHeight||800;

  $$(".page",book).forEach((pg,i)=>{
    const b=pg.getBoundingClientRect();
    if(b.bottom<90||b.top>vh-40) return;
    const d=Math.abs((b.top+b.bottom)/2-vh/2);

/* ---------- 长按拖动排序：只在同一类型内生效 ---------- */
let DW_DRAG=null, DW_JUST_DRAGGED=false;
function dwCancelDrag(){

}
function dwActivate(st){

}
function dwStart(e){

            ghost:null, timer:0, active:false, drop:null};

function dwMove(e){
  const st=DW_DRAG; if(!st) return;
  if(!st.active){
    /* 长按还没成功就滑动 → 当作正常滚动 */
    if(Math.abs(e.clientY-st.startY)>8||Math.abs(e.clientX-st.startX)>8){

  if(e.clientY<rb.top+40) st.body.scrollTop-=7;

  const after=e.clientY>(b.top+b.bottom)/2;

  line.className="dw-dropline";
  tgt.insertAdjacentElement(after?"afterend":"beforebegin",line);

function dwEnd(){

  dwCancelDrag();
  if(!active) return;                      /* 没长按成功 → 交给 click 正常跳转 */
  DW_JUST_DRAGGED=true;
  setTimeout(()=>{ DW_JUST_DRAGGED=false; },320);
  if(drop) dwCommit(fromNo,drop.no,drop.after);
  else toast("只能在同一类型内拖动排序");
}
function dwCommit(fromNo,toNo,after){
  const pages=$$(".page",book);
  const from=pages[fromNo-1], to=pages[toNo-1];
  if(!from||!to||from===to) return;
  if((from.dataset.tpl||"blank")!==(to.dataset.tpl||"blank")) return;
  to.insertAdjacentElement(after?"afterend":"beforebegin",from);
  renumber(); renumberOL(book); autoIndex(); save();
  dwRender();
  toast("顺序已调整");
}
document.addEventListener("pointerdown",dwStart);
document.addEventListener("pointermove",dwMove);
document.addEventListener("pointerup",dwEnd);
document.addEventListener("pointercancel",dwCancelDrag);
/* 拖动中别让抽屉跟着滚 */
document.addEventListener("touchmove",function(e){
  if(DW_DRAG&&DW_DRAG.active&&e.cancelable) e.preventDefault();
},{passive:false});

/* ==========================================================
   手机软键盘遮挡处理
   —— 聚焦编辑项时，把它滚到键盘上方；键盘弹出/收起时持续跟随
========================================================== */
let activeEdit=null;

/* 可视区（排除键盘）的上下边界，单位：client 坐标 */
function visBounds(){
  const vv=window.visualViewport;
  if(vv) return {top:vv.offsetTop, bottom:vv.offsetTop+vv.height};
  return {top:0, bottom:window.innerHeight};
}

/* 把元素滚进可视区，并尽量停在可视区上 40% 处，方便看到上文（如月份标题） */
function ensureVisible(el,force){
  if(!el) return;
  const b=visBounds();
  const r=el.getBoundingClientRect();
  const pad=18, room=b.bottom-b.top;
  let targetTop=Math.min(b.top+room*0.42, b.bottom-pad-r.height);
  targetTop=Math.max(targetTop, b.top+pad);
  let delta=0;
  if(r.bottom > b.bottom-pad)                        delta = r.top-targetTop;  // 被键盘挡住
  else if(r.top < b.top+pad)                         delta = r.top-(b.top+pad);// 露在可视区上方
  else if(force && Math.abs(r.top-targetTop)>room*0.25) delta = r.top-targetTop;
  if(Math.abs(delta)>2) window.scrollBy({top:delta,behavior:"auto"});
}

/* 键盘高度（px），未弹出时为 0 */
function kbHeight(){
  const vv=window.visualViewport;
  if(!vv) return 0;
  const h=window.innerHeight-(vv.offsetTop+vv.height);
  return h>60?h:0;
}

/* 编辑工具条：贴在键盘上沿，含「完成」与「＋下一项」
   同时给文档底部临时加高，保证最末尾的条目也能被滚上来 */
function updateKbdBar(){
  const bar=$("#kbdbar");
  const kb=kbHeight();
  if(book) book.style.paddingBottom = kb ? (kb+40)+"px" : "";
  if(!bar) return;
  if(!activeEdit || kb===0){ bar.classList.remove("on"); return; }
  const yi=activeEdit.closest(".yp-item");
  let html='<button data-kbd="done">完成</button>';
  if(yi){
    const kind=KIND_NAME[yi.classList.contains("task")?"task":(yi.classList.contains("ol")?"ol":(yi.classList.contains("del")?"del":"ul"))];
    html+='<button data-kbd="next">＋ '+kind+'</button>';
  }
  bar.innerHTML=html;
  bar.style.bottom=kb+"px";
  bar.classList.add("on");
}

/* 聚焦后的完整处理：加高 → 出工具条 → 滚动 */
function handleEditFocus(t){
  activeEdit=t;
  updateKbdBar();
  ensureVisible(t,true);
}

/* 新增同类型项（供工具条调用）：插到当前条目正下方 */
function addSibling(el){
  const yi=el.closest(".yp-item");
  if(yi){
    const kind=yi.classList.contains("task")?"task":(yi.classList.contains("ol")?"ol":(yi.classList.contains("del")?"del":"ul"));
    const items=yi.parentElement;
    const d=document.createElement("div");
    d.innerHTML=ypItem(kind);
    const ni=d.firstElementChild;
    yi.after(ni);
    const ce=$(".yp-txt",ni);
    renumberOL(items);
    if(ce){ ce.focus(); ensureVisible(ce,true); }
    save(); return;
  }
  const gi=el.closest(".grow-item");
  if(gi){
    const list=gi.parentElement;
    const btn=list.nextElementSibling;
    if(btn&&btn.dataset.additem){
      btn.click();
      const ce=$("[contenteditable]",list.lastElementChild);
      if(ce){ ce.focus(); ensureVisible(ce,true); }
    }
    return;
  }
  const td=el.closest("td");
  if(td){
    const tb=td.closest("table");
    if(tb&&tb.hasAttribute("data-autorow")){
      const btn=tb.nextElementSibling;
      if(btn&&btn.dataset.addrow){
        btn.click();
        const ce=$("[contenteditable]",tb.querySelector("tbody").lastElementChild);
        if(ce){ ce.focus(); ensureVisible(ce,true); }
      }
    }
  }
}

document.addEventListener("focusin",function(e){
  const t=e.target;
  if(!(t.isContentEditable || (t.tagName==="INPUT"&&t.type!=="checkbox"))) return;
  /* 日历格例外：格子很矮，键盘避让滚动会让点击目标错位（横向滚动容器里更明显），这里不做 */
  if(t.closest&&t.closest(".cg-cell")) return;
  /* 键盘弹出有延迟，多次补滚确保到位 */
  handleEditFocus(t);
  requestAnimationFrame(()=>handleEditFocus(t));
  [100,260,420].forEach(ms=>setTimeout(()=>{ if(activeEdit===t) handleEditFocus(t); },ms));
});

document.addEventListener("focusout",function(e){
  if(activeEdit===e.target){
    activeEdit=null;
    setTimeout(updateKbdBar,180);
  }
});

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",()=>{
    if(activeEdit) handleEditFocus(activeEdit);
    else updateKbdBar();
  });
  window.visualViewport.addEventListener("scroll",()=>updateKbdBar());
}
window.addEventListener("resize",()=>{
  if(activeEdit) setTimeout(()=>handleEditFocus(activeEdit),80);
});

/* 工具条按钮 */
document.addEventListener("click",function(e){
  const kb=e.target.closest("[data-kbd]");
  if(!kb) return;
  const act=kb.dataset.kbd;
  if(act==="done"){
    if(activeEdit) activeEdit.blur();
    else { const a=document.activeElement; if(a&&a.blur) a.blur(); }
    activeEdit=null; updateKbdBar(); save(); return;
  }
  if(act==="next"&&activeEdit){ addSibling(activeEdit); return; }
});

/* ==========================================================
   启动
========================================================== */
load();
if(!localStorage.getItem(KEY)) save();
</script>
</body>
</html>
