/* ==========================================================
   年计划：重排有序列表编号（只数 ol 项）
========================================================== */
function renumberOL(scope){
  const roots = (scope&&scope.classList&&scope.classList.contains("yp-items")) ? [scope]
              : (scope ? $$(".yp-items",scope) : $$(".yp-items"));
  roots.forEach(items=>{
    let n=0;
    $$(".yp-item",items).forEach(it=>{
      if(it.classList.contains("ol")){
        n++;
        const mk=$(".yp-mark",it);
        if(mk) mk.textContent=n+".";
        /* 序号宽度变了（9.→10.），整行删除线的起笔位置跟着重算 */
        if(it.classList.contains("struck")){
          const off=markContentLeft(it);
          if(off!=null) it.style.setProperty("--strike-x", off.toFixed(2)+"px");
        }
      }
    });
    /* 月任务步骤格：不用 ＋ 占位，点进单元格直接弹类型菜单（见 click 里的 td.mt-step）
       老存档里可能已经烘进一个 ＋，这里顺手清掉 */
    if(items.classList.contains("mt-items")){
      $$(".yp-addslot",items).forEach(s=>s.remove());
      mtSyncEmpty(items.closest("table"));   /* 步骤格增删条目 → 重算哪些行是空行 */
    }
    /* 周计划清单与每天的清单：末尾始终挂一个「占位」＋
       （幂等，appendChild 对已存在的节点是移动）
       ＋ 落在 15px 标记列里 → 中心与勾选框、圆点、周字左缘同一条竖线 */
    if(items.classList.contains("wk-items")||items.closest(".wk-day")){
      let slot=$(".yp-addslot",items);
      if(!slot){
        slot=document.createElement("div");
        slot.className="yp-addslot";
        slot.innerHTML='<span class="yp-mark"><button type="button" class="wk-add" data-mk="1" data-kinds="task,ul,ol,plain,strike" title="添加一项">＋</button></span>';
      }
      items.appendChild(slot);
    }
  });
}

    $$(".mc-row",blk).forEach(row=>{
      mcMarkRow(row);
      row.classList.toggle("today",
        isThisMonth && +row.dataset.d===td.getDate());
    });
  }
  pg.dataset.mcy=y; pg.dataset.mcm=m;
  /* 月日历的标题写着当前月份（切月即变）：可切换年月的这个函数是唯一入口 */
  if(pg.dataset.tpl==="monthcal"){

  }
  const lab=$("[data-mclab]",pg); if(lab) lab.textContent=y+" · "+pad(m+1)+"月";
  const wm=$("[data-mcwm]",pg);
  if(wm) wm.textContent = pg.dataset.tpl==="monthtask" ? (y+"年"+(m+1)+"月") : (y+"年");
  /* 三页：切月时副标题跟着变月份 */
  const sub=$(".sub",pg);
  if(sub){
    const t=pg.dataset.tpl;
    if(t==="habit") sub.textContent=(m+1)+" 月 · 习惯追踪";
    else if(t==="weight") sub.textContent="体重追踪 · "+y+"."+pad(m+1);
    else if(t==="booklist") sub.textContent="Reading list · "+y+"."+pad(m+1);
    else if(t==="calgrid") sub.textContent=(m+1)+" 月 · 每天一格";
  }
  /* 日历格：标题跟月份，再切到该月该看的分类 */
  if(pg.dataset.tpl==="calgrid"){
    const ttl=$(".mc-title",pg); if(ttl) ttl.textContent=(m+1)+"月日历";
    cgShow(pg,pg.dataset.cat);
  }
  if(pg.dataset.tpl==="weight") refreshWeight(pg);
}

   改日期 → 切到那天的区块（没有就新建一份空白），原先写的内容原样保留。 */
function ddISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ddShow(pg,iso){
  if(!iso) return;

  const inp=$(".dd-head .dinput",pg)||$(".dinput",pg);

    ? [scope] : $$('[data-tpl="diary"]',scope||book);

    if($("[data-ddwrap]",pg)) return;
    /* 表头＝含日期输入框的那个直接子级（老模板里它是第一个 div） */
    const head=[...pg.children].find(c=>c.querySelector&&c.querySelector(".dinput")) || pg.firstElementChild;
    const inp=head&&$(".dinput",head);
    const iso=(inp&&inp.value)||ddISO(bjDate());
    const wrap=document.createElement("div");
    wrap.className="dd-days"; wrap.dataset.ddwrap="1";
    const blk=document.createElement("div");
    blk.className="dd-day on"; blk.dataset.ymd=iso;
    let n=head?head.nextSibling:pg.firstChild;
    while(n){ const nx=n.nextSibling; blk.appendChild(n); n=nx; }

const MT_PDCA=[
  ["P","计划","Plan","月初定的目标 · 打算怎么做"],
  ["D","执行","Do","实际做了什么 · 只写事实"],
  ["C","检查","Check","和目标的差距 · 原因是什么"],

   注意 .mt-st 里常驻一个 ✕ 按钮，不能拿它的 textContent 判定，只看 data-st */
function mtIsEmpty(tr){
  if(!tr) return false;
  const g=$(".mt-goal",tr), y=$(".mt-year",tr), st=$(".mt-st",tr);
  if(g && g.textContent.trim()!=="") return false;
  if(y && y.textContent.trim()!=="") return false;

    if(mtIsEmpty(tr)) tr.dataset.mtempty="1";

      /* ＋ 由 renumberOL 挂成这天的「末尾占位」，落在周字下方的标记列里 */
      `<div class="yp-items"></div>`+

  return `<div class="wk-sec wk-week${sel?" on":""}" data-wk="${iso}">`+

    `<div class="wk-days">${days}</div>`+
  `</div>`;
}

/* 由日期算出该周周一，再铺出 7 天日期、周范围、今天高亮 */
function wkDates(scope){
  const roots=(scope&&scope.classList&&scope.classList.contains("wk-sec"))?[scope]
            :(scope?$$(".wk-sec",scope):$$(".wk-sec"));
  roots.forEach(sec=>{
    /* 新结构：周区块自带 data-wk（该周周一，天然就是周一不用再推算） */
    let mon=sec.dataset.wk?wkParseISO(sec.dataset.wk):null;
    if(!mon){
      /* 老结构：首周不带日期行（日期在页头），其余在自己的 .wk-top 里 */
      let inp=$(".dinput",sec);
      if(!inp){
        const pg=sec.closest(".page");
        const secs=$$(".wk-sec",pg);
        if(pg && secs[0]===sec) inp=$(".wk-head .dinput",pg);
      }
      const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(inp?inp.value:"");
      if(m){
        const base=new Date(+m[1],+m[2]-1,+m[3]);
        if(!isNaN(base.getTime())){
          mon=new Date(base);
          mon.setDate(base.getDate()-((base.getDay()+6)%7));
        }
      }
    }
    $$("[data-ddate]",sec).forEach((el,i)=>{
      if(!mon){ el.textContent="—"; return; }
      const d=new Date(mon); d.setDate(mon.getDate()+i);
      el.textContent=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      const row=el.closest(".wk-day");
      const isT=d.getFullYear()===TODAY.getFullYear()&&d.getMonth()===TODAY.getMonth()&&d.getDate()===TODAY.getDate();
      if(row) row.classList.toggle("today",isT);
    });
    /* 小标题右侧的日期范围：跟着这一周走 */
    const pr=$(".wk-prange",sec);
    if(pr) pr.textContent = mon ? wkRangeTxt(mon) : "";
    /* 首周的范围显示在页头，其余显示在各周自己的日期行 */
    const wr=$("[data-weekrange]",sec);
    let wr2=wr;
    if(!wr){
      const pg=sec.closest(".page");
      const secs=$$(".wk-sec",pg);
      if(pg && secs[0]===sec) wr2=$("[data-weekrange]",$(".wk-head",pg)||pg);
    }
    if(wr2){
      if(!mon){ wr2.textContent=""; }
      else{
        const sun=new Date(mon); sun.setDate(mon.getDate()+6);
        wr2.textContent=weekLabel(mon,sun);
      }
    }
  });
}

/* 老存档 / 老自定义模板：补上左侧删除列与底部新增入口（幂等） */
function migrateHabit(scope){
  const pages=(scope&&scope.dataset&&scope.dataset.tpl==="habit")
    ? [scope] : $$('[data-tpl="habit"]',scope||book);
  let dirty=false;
  pages.forEach(pg=>{
    /* 旧版那列 ✕ 已取消（改成表格前移 + 长按习惯名删除），老存档里残留的一并清掉 */
    $$(".habgrid .hx",pg).forEach(x=>{ x.remove(); dirty=true; });
    /* 旧版习惯名是裸文本直接放在 .hname 里；新结构必须包在 .nm 里
       （右对齐 + 与框的间距全靠 .nm 的绝对定位），否则所有间距调整都不生效 */
    $$(".habgrid .hr:not(.hdr) .hname",pg).forEach(hn=>{
      if($(".nm",hn)) return;
      const txt=hn.textContent;
      const s=document.createElement("span");
      s.className="nm"; s.setAttribute("contenteditable","true"); s.setAttribute("data-ph","习惯名");
      s.textContent=txt;
      hn.textContent="";
      hn.appendChild(s);
      dirty=true;
    });
    const sc=$(".hscroll",pg);
    const nx=sc&&sc.nextElementSibling;
    if(sc&&!(nx&&nx.dataset&&nx.dataset.hbadd)){
      const b=document.createElement("button");
      b.type="button"; b.className="addrow"; b.dataset.hbadd="1";
      b.textContent="＋ 新增一个习惯";
      sc.insertAdjacentElement("afterend",b);
      dirty=true;
    }
  });
  return dirty;
}
/* 三页改月切片器：老存档没有 .mc-months 结构，把现有内容包进「当前月」区块，
   重建 .mc-head（标题复用原有文字），保证改造前已填数据不丢 */
function migrateMonthPages(scope){
  const pages=scope?$$('[data-tpl]',scope):$$('[data-tpl]',book);
  let dirty=false;
  pages.forEach(pg=>{
    const t=pg.dataset.tpl;
    if(t!=="habit"&&t!=="booklist"&&t!=="weight") return;
    if($(".mc-months",pg)) return;            // 已是新结构
    const titleEl=$(".p-title",pg), subEl=$(".sub",pg);
    const title=titleEl?titleEl.textContent.trim():"";
    const n=bjDate(), y=n.getFullYear(), m=n.getMonth(), ym=y+"-"+pad(m+1);
    if(titleEl) titleEl.remove();
    if(subEl) subEl.remove();
    /* weight：删掉原 12 个 .pill 月份选择行；图表 id 改 class（避免多月份块重复 id） */
    pg.querySelectorAll(".pill").forEach(p=>{ const h=p.parentElement; if(h && /flex/.test(h.getAttribute("style")||"")) h.remove(); });
    let content=pg.innerHTML.replace(/id="wchart"/g,'class="wchart"');
    const sub = t==="habit" ? ((m+1)+" 月 · 习惯追踪")
              : t==="weight" ? ("体重追踪 · "+y+"."+pad(m+1))
              : ("Reading list · "+y+"."+pad(m+1));
    pg.innerHTML = mcHeadHTML(t==="weight"?"h1":"h2", title, sub, y, m)
      + `<div class="mc-months" data-mcwrap="1"><div class="mc-month on" data-ym="${ym}">${content}</div></div>`;
    pg.dataset.mcy=y; pg.dataset.mcm=m;
    dirty=true;
  });
  return dirty;
}
/* 长按习惯名 → 确认后删掉这一行（连同该行打卡记录）。
   长按是这套页面的通用手势（目录里长按拖动同源）：按下 450ms 触发，
   中途移动超过 8px 或松手即取消，不影响点击改名。 */
let HB_LP=null;
function hbDeleteRow(row){
  const grid=row&&row.closest(".habgrid");
  if(!row||!grid) return;
  if($$(".hr:not(.hdr)",grid).length<=1){ toast("至少保留一个习惯"); return; }
  const name=($(".hname",row).textContent||"").trim()||"这个习惯";
  const done=$$(".dot.on",row).length;
  const ce=$(".nm",row); if(ce&&ce.blur) ce.blur();
  askConfirm({
    title:"删除这个习惯？",
    msg:`「${esc(name)}」这一行连同已经打的 <b>${done}</b> 次卡会一起删掉。`,
    okText:"删除"
  }).then(ok=>{
    if(!ok) return;
    row.remove(); save(); toast("已删除习惯");
  });
}
function hbLPStart(e){
  if(HB_LP) return;
  if(e.pointerType==="mouse"&&e.button!==0) return;
  const el=e.target.closest&&e.target.closest(".habgrid .hname");
  if(!el) return;
  const st={el:el, x:e.clientX, y:e.clientY, timer:0};
  st.timer=setTimeout(()=>{
    HB_LP=null;
    const row=el.closest(".hr");
    if(row&&document.contains(el)) hbDeleteRow(row);
  },450);
  HB_LP=st;
}
function hbLPMove(e){
  const st=HB_LP; if(!st) return;
  if(Math.abs(e.clientX-st.x)>8||Math.abs(e.clientY-st.y)>8){
    clearTimeout(st.timer); HB_LP=null;
  }
}
function hbLPEnd(){
  const st=HB_LP; if(!st) return;
  clearTimeout(st.timer); HB_LP=null;
}
document.addEventListener("pointerdown",hbLPStart);
document.addEventListener("pointermove",hbLPMove);
document.addEventListener("pointerup",hbLPEnd);
document.addEventListener("pointercancel",hbLPEnd);

/* 老存档迁移：以前的格子是「一个 .cg-line + 一个 .cg-txt」→ 包成 .cg-items > .cg-item，
   类型/删除线/完成这些状态从格子挪到条目上（幂等） */
function cgNormalize(scope){
  let changed=false;
  $$(".cg-cell",scope||document).forEach(cell=>{
    if(!$(".cg-items",cell)){
      const box=document.createElement("div");
      box.className="cg-items";
      const line=$(".cg-line",cell);
      if(line){
        const kind=CG_TYPES.filter(t=>cell.classList.contains(t))[0]||"plain";
        const it=document.createElement("div");
        it.className="cg-item "+kind;
        if(cell.classList.contains("struck")) it.classList.add("struck");
        if(cell.classList.contains("done")) it.classList.add("done");
        const mk=$(".cg-mark",line), txt=$(".cg-txt",line);
        it.innerHTML='<span class="cg-mark"></span>';
        if(txt) it.appendChild(txt); else it.insertAdjacentHTML("beforeend",'<div class="cg-txt" contenteditable="true" data-ph="写点什么"></div>');
        CG_TYPES.forEach(t=>cell.classList.remove(t));
        cell.classList.remove("struck","done","cg-menuing");
        box.appendChild(it);
      }else{
        box.innerHTML=cgItemHTML("plain");
      }
      const imgs=$(".cg-imgs",cell);
      if(imgs) cell.insertBefore(box,imgs); else cell.appendChild(box);
      changed=true;
    }else{
      /* 保险：条目里缺标记列或类型类的补上 */
      $$(".cg-item",cell).forEach(it=>{
        if(!$(".cg-mark",it)){
          const mk=document.createElement("span");
          mk.className="cg-mark";
          it.insertBefore(mk,it.firstChild);
          changed=true;
        }
        if(!CG_TYPES.some(k=>it.classList.contains(k))){ it.classList.add("plain"); changed=true; }
      });
    }
    $$(".cg-item",cell).forEach(it=>cgMark(it));
    /* 心情模式那块：老格子没有 → 补一个空的（有表情的自然已经有了） */
    if(!$(".cg-moodbox",cell)){
      cgEnsureMoodBox(cell);
      changed=true;
    }
  });
  return changed;
}
/* 一个分类在一个月里的那份：周一开头，空位补 .cg-blank，今天那格标红 */
function cgSetHTML(y,m,name,on){
  const lead=(new Date(y,m,1).getDay()+6)%7;
  const dim=daysInMonth(y,m), td=bjDate();
  let cells="";
  for(let i=0;i<lead;i++) cells+='<div class="cg-blank"></div>';
  for(let d=1;d<=dim;d++){
    const iso=y+"-"+pad(m+1)+"-"+pad(d);
    cells+=cgCellHTML(iso,(y===td.getFullYear()&&m===td.getMonth()&&d===td.getDate()));
  }
  for(let i=lead+dim;i<Math.ceil((lead+dim)/7)*7;i++) cells+='<div class="cg-blank"></div>';
  return `<div class="cg-set${on?" on":""}" data-cg="${escAttr(name)}">`+
    `<div class="cg-scroll"><div class="cg-inner"><div class="cg-grid">`+
    ["周一","周二","周三","周四","周五","周六","周日"].map(w=>`<div class="cg-wh">${w}</div>`).join("")+
    cells+
    `</div></div></div></div>`;
}
function cgPaintPill(pg,name){
  const pill=$("[data-cgsel]",pg); if(!pill) return;
  const lab=$("[data-cglab]",pill);
  if(name){ lab.textContent=name; pill.classList.remove("cg-empty"); }
  else { lab.textContent="添加分类"; pill.classList.add("cg-empty"); }
}
function cgCloseMood(){
  $$(".mc-pop").forEach(p=>{ if(p.dataset.cgmood!==undefined){ p.classList.remove("on"); p.innerHTML=""; } });
  CG_MOOD_CELL=null; CG_MOOD_ITEM=null;
}
function cgCloseType(){
  $$(".cg-menu").forEach(m=>m.remove());
  $$(".cg-item.cg-menuing").forEach(c=>c.classList.remove("cg-menuing"));
  CG_TYPE_ITEM=null;
}
function cgActivate(pg,cell){
  $$(".cg-cell.on",pg).forEach(c=>{ if(c!==cell) c.classList.remove("on"); });
  cell.classList.add("on");
  /* 表情面板还挂在上一格上 → 收掉，免得选完插错格子 */
  if(CG_MOOD_CELL&&CG_MOOD_CELL!==cell) cgCloseMood();
}
function cgDeactivate(pg){ $$(".cg-cell.on",pg).forEach(c=>c.classList.remove("on")); }

/* 切分类：块不存在才建（空的），切走只是换 .on → 各月各类的内容永不串 */
function cgShow(pg,name){
  const blk=$(".mc-month.on",pg);
  if(!blk) return;
  const cats=cgCats(pg);
  cgCloseType(); cgCloseMood();
  if(!cats.length){
    if(!$(".cg-empty-state",blk))
      blk.innerHTML='<div class="cg-empty-state">还没有任何分类<br>点上面的「添加分类」起一个名字，就能开始写</div>';
    delete pg.dataset.cat;
    cgPaintPill(pg,"");
    return;
  }
  if(!$(".cg-sets",blk)) blk.innerHTML='<div class="cg-sets"></div>';
  const y=parseInt(pg.dataset.mcy,10), m=parseInt(pg.dataset.mcm,10);
  let target=(name&&cats.indexOf(name)>=0)?name:pg.dataset.cat;
  if(!target||cats.indexOf(target)<0) target=cats[0];
  /* 名单是全页共用的 → 每个月里都把名单上的分类各建一份（空的），切月份自动带过去。
     但这个月里被用户删掉的分类不再自动带回来（记在 .mc-month 的 data-cgdel 里）。 */
  const del=(blk.dataset.cgdel||"").split(",").filter(Boolean);
  cats.forEach(n=>{
    if(cgFindSet(blk,n)) return;
    if(del.indexOf(n)>=0) return;
    const d=document.createElement("div");
    d.innerHTML=cgSetHTML(y,m,n,false);
    $(".cg-sets",blk).appendChild(d.firstElementChild);
  });
  const set=cgFindSet(blk,target);
  cgSets(pg).forEach(b=>b.classList.toggle("on",b===set));   /* 全页只留一个 .on，隐藏月份里的也别留 */
  pg.dataset.cat=target;
  cgPaintPill(pg,target);
  const pop=$("[data-cgpop]",pg);                 /* 面板开着就刷新条数 */
  if(pop&&pop.classList.contains("on")) pop.innerHTML=cgPopHTML(pg);
}
function cgPopHTML(pg){
  const cats=cgCats(pg), cur=pg.dataset.cat, blk=$(".mc-month.on",pg);
  const rows=cats.map(n=>{
    const set=blk?cgFindSet(blk,n):null;
    const cnt=set?($$(".cg-txt",set).filter(t=>t.textContent.trim()).length+$$(".cg-img",set).length):0;
    return `<div class="cg-cat${n===cur?" on":""}" data-cgcat="${escAttr(n)}">`+
      `<span class="cg-catdot${n===cur?"":" gap"}"></span>`+
      `<span class="nm">${esc(n)}</span>`+
      `<span class="ct">${cnt||"　"}</span>`+
      `<span class="cx" data-cgdel="1" title="删除这个分类">✕</span></div>`;
  }).join("");
  return `<div class="mc-popin">`+
    `<div class="cg-poy">${cats.length?cats.length+" 个分类 · 长按可排序":"还没有分类"}</div>`+
    rows+
    `<div class="cg-new"><input type="text" placeholder="分类名字" maxlength="8" data-cgnew="1">`+
    `<button type="button" data-cgadd="1">确定</button></div>`+
  `</div>`;
}
function cgAddCat(pg,name,quiet){
  name=String(name||"").trim().slice(0,8);
  if(!name){ if(!quiet) toast("先给分类起个名字"); return; }
  const cats=cgCats(pg);
  if(cats.indexOf(name)>=0){ cgShow(pg,name); if(!quiet) toast("这个分类已经有了"); return; }
  cats.push(name); cgSaveCats(pg,cats);
  const blk=$(".mc-month.on",pg);
  if(blk){
    if(!$(".cg-sets",blk)) blk.innerHTML='<div class="cg-sets"></div>';
    blk.dataset.cgdel=(blk.dataset.cgdel||"").split(",").filter(x=>x&&x!==name).join(",");
    const y=parseInt(pg.dataset.mcy,10), m=parseInt(pg.dataset.mcm,10);
    const d=document.createElement("div");
    d.innerHTML=cgSetHTML(y,m,name,false);
    $(".cg-sets",blk).appendChild(d.firstElementChild);
  }
  cgShow(pg,name); mcClosePop(); save();
  if(!quiet) toast("已添加分类："+name);
}
/* 删除＝只删「当前月份」这一份（连内容），其它月份同名分类不受影响 */
function cgDelCat(pg,name){
  const y=parseInt(pg.dataset.mcy,10), m=parseInt(pg.dataset.mcm,10);
  askConfirm({
    title:"删除这个分类？",
    msg:'即将删除 <b>'+y+' 年 '+(m+1)+' 月</b>的「'+esc(name)+'」及其全部内容，删除后无法恢复。'+
        '<br>其它月份的「'+esc(name)+'」不受影响。'
  }).then(ok=>{
    if(!ok) return;
    /* 只删当前月份这一份，其它月份的同名分类原样留着 */
    const blk=$(".mc-month.on",pg);
    const s=blk?cgFindSet(blk,name):null;
    if(s) s.remove();
    if(blk) blk.dataset.cgdel=((blk.dataset.cgdel||"").split(",").filter(Boolean).concat([name])).join(",");
    /* 这个名字在所有月份都不存在了 → 从全页名单里去掉 */
    if(!cgSets(pg).some(b=>b.dataset.cg===name)) cgSaveCats(pg,cgCats(pg).filter(c=>c!==name));
    if(pg.dataset.cat===name) delete pg.dataset.cat;
    cgShow(pg,""); save();
    toast("已删除 "+y+" 年 "+(m+1)+" 月的「"+name+"」");
  });
}
function cgApplyOrder(pg,names){
  cgSaveCats(pg,names);
  $$(".mc-month",pg).forEach(blk=>{
    const sets=$(".cg-sets",blk); if(!sets) return;
    const map={}; cgSets(blk).forEach(b=>{ map[b.dataset.cg]=b; });
    names.forEach(n=>{ if(map[n]) sets.appendChild(map[n]); });
  });
  save();
}
/* 分类长按拖动排序（450ms 激活，跟抽屉/模版面板同一套手感） */
function cgDragStart(e){
  if(CG_DRAG) return;
  if(e.pointerType==="mouse"&&e.button!==0) return;
  const row=e.target.closest&&e.target.closest(".cg-cat");
  if(!row||e.target.closest("[data-cgdel]")) return;
  const st={row:row,list:row.parentElement,startX:e.clientX,startY:e.clientY,fly:null,active:false,timer:0};
  st.timer=setTimeout(()=>cgDragActivate(st),450);
  CG_DRAG=st;
}
function cgDragActivate(st){
  const b=st.row.getBoundingClientRect();
  const g=document.createElement("div");
  g.className="cg-fly"; g.innerHTML=st.row.innerHTML;
  g.style.left=b.left+"px"; g.style.top=b.top+"px"; g.style.width=b.width+"px";
  document.body.appendChild(g);
  st.fly=g; st.dy=st.startY-b.top; st.active=true;
  st.row.classList.add("gone");
  if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(_){} }
}
function cgDragMove(e){
  const st=CG_DRAG; if(!st) return;
  if(!st.active){
    if(Math.abs(e.clientY-st.startY)>8||Math.abs(e.clientX-st.startX)>8){ clearTimeout(st.timer); CG_DRAG=null; }
    return;
  }
  if(e.cancelable) e.preventDefault();
  st.fly.style.top=(e.clientY-st.dy)+"px";
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=el&&el.closest?el.closest(".cg-cat"):null;
  if(!tgt||tgt===st.row||tgt.parentElement!==st.list) return;
  const b=tgt.getBoundingClientRect();
  st.list.insertBefore(st.row,(e.clientY<b.top+b.height/2)?tgt:tgt.nextSibling);
}
function cgDragEnd(){
  const st=CG_DRAG; if(!st) return;
  clearTimeout(st.timer);
  CG_DRAG=null;
  if(!st.active) return;
  st.fly.remove();
  st.row.classList.remove("gone");
  const pg=st.row.closest(".page");
  cgApplyOrder(pg,$$(".cg-cat",st.list).map(r=>r.dataset.cgcat));
  toast("分类顺序已更新");
}
document.addEventListener("pointerdown",cgDragStart);
document.addEventListener("pointermove",cgDragMove);
document.addEventListener("pointerup",cgDragEnd);
document.addEventListener("pointercancel",cgDragEnd);
/* 分类名输入框：回车即建 */
document.addEventListener("keydown",function(e){
  const t=e.target;
  if(!t||!t.hasAttribute||!t.hasAttribute("data-cgnew")) return;
  if(e.key!=="Enter") return;
  e.preventDefault();
  const pg=t.closest(".page");
  cgAddCat(pg,t.value);
  t.value="";
});
/* 点格子：用 pointerdown 激活，不等 click。
   格子在横向滚动容器里，浏览器的 click 事件有时会错位（见下面 mousedown 那段），
   工具条靠 pointerdown 触发才稳。 */
document.addEventListener("pointerdown",function(e){
  const pg=e.target.closest&&e.target.closest(".page");
  if(!pg||pg.dataset.tpl!=="calgrid") return;
  const cell=e.target.closest(".cg-cell");
  if(cell){
    if(e.target.closest(".cg-menu")||e.target.closest("[data-cgemo]")) return;
    cgActivate(pg,cell);
    return;
  }
  if(e.target.closest(".mc-pop,[data-cgsel],[data-mcsel]")) return;
  cgDeactivate(pg); cgCloseType(); cgCloseMood();
},true);
/* 文字区在横向滚动容器里：浏览器放光标时会连带把整页滚动一段，
   mouseup 于是落在别的元素上、click 目标错位（手机上也一样）。
   拦掉默认的光标滚动，自己聚焦并把光标放到点中的位置。 */
document.addEventListener("mousedown",function(e){
  const txt=e.target.closest&&e.target.closest(".cg-txt");
  if(!txt) return;
  e.preventDefault();
  try{ txt.focus({preventScroll:true}); }catch(_){ txt.focus(); }
  let r=null;
  try{ r=document.caretRangeFromPoint(e.clientX,e.clientY); }catch(_){}
  if(r&&txt.contains(r.startContainer)){ const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  const it=txt.closest(".cg-item");
  if(it) CG_ITEM=it;
});
/* 条目里按回车 → 在光标处拆成紧邻的下一条（类型沿用原来那条）；
   空条目按退格 → 删掉这一条。都在 keydown 里拦，别让浏览器自己插 <br> */
document.addEventListener("keydown",function(e){
  const txt=e.target&&e.target.closest?e.target.closest(".cg-txt"):null;
  if(!txt) return;
  const cell=txt.closest(".cg-cell");
  if(!cell) return;
  if(e.key==="Enter"&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(cgSplitAt(txt)){ e.preventDefault(); return; }
  }
  if(e.key==="Backspace"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
    if(!txt.textContent.trim()){
      const item=txt.closest(".cg-item");
      if(item&&cgDeleteItem(item)) e.preventDefault();
    }
  }
});

/* ---- 条目：类型 / 删除线 / 任务打勾 / 回车拆分 ---- */
function cgMark(item){
  const mk=$(".cg-mark",item); if(!mk) return;
  const k=CG_TYPES.filter(t=>item.classList.contains(t))[0]||"plain";
  if(k==="task") mk.innerHTML='<span class="cg-box'+(item.classList.contains("done")?" on":"")+'"></span>';
  else if(k==="ul") mk.textContent="•";
  else if(k==="ol") mk.textContent=cgOlNumber(item);
  else mk.textContent="";
}
/* 有序编号：同一格子里按顺序 1. 2. 3. …（跟别页的 renumberOL 一个口径） */
function cgOlNumber(item){
  const list=item.parentElement;
  if(!list||!list.classList.contains("cg-items")) return "1.";
  const ols=$$(".cg-item.ol",list);
  return (ols.indexOf(item)+1)+".";
}
function cgRenumber(list){
  if(!list) return;
  let n=0;
  $$(".cg-item",list).forEach(it=>{
    if(it.classList.contains("ol")){ n++; const mk=$(".cg-mark",it); if(mk) mk.textContent=n+"."; }
  });
}
function cgSetKind(item,kind){
  CG_TYPES.forEach(t=>item.classList.remove(t));
  item.classList.add(kind);
  if(kind!=="task") item.classList.remove("done");
  cgMark(item);
  const list=item.parentElement;
  if(list&&list.classList.contains("cg-items")) cgRenumber(list);
  save();
}
function cgNextKind(item){
  const cur=CG_TYPES.filter(t=>item.classList.contains(t))[0]||"plain";
  cgSetKind(item,CG_TYPES[(CG_TYPES.indexOf(cur)+1)%CG_TYPES.length]);
}
function cgStrike(item){
  const txt=$(".cg-txt",item);
  if(!txt) return;
  const sel=window.getSelection();
  if(sel&&sel.rangeCount&&!sel.isCollapsed&&txt.contains(sel.anchorNode)) document.execCommand("strikeThrough");
  else item.classList.toggle("struck");
  save();
}
/* 工具条作用在「当前条目」：优先光标所在那条，否则这格最后一条 */
function cgCurItem(cell){
  const sel=window.getSelection();
  if(sel&&sel.rangeCount){
    const node=sel.anchorNode&&sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode&&sel.anchorNode.parentElement;
    const it=node&&node.closest?node.closest(".cg-item"):null;
    if(it&&cell.contains(it)) return it;
  }
  const items=$$(".cg-item",cell);
  return items[items.length-1]||null;
}
function cgOpenType(item){
  const cell=item.closest(".cg-cell");
  cgCloseType(); cgCloseMood();
  if(!cell) return;
  let menu=$(".cg-menu",cell);
  if(!menu){
    menu=document.createElement("div");
    menu.className="yp-menu cg-menu";
    menu.dataset.cgmenu="1";
    menu.innerHTML=CG_TYPES.map(k=>`<button type="button" data-kind="${k}">`+
      (MENU_ICON[k]?`<span class="mi">${MENU_ICON[k]}</span>`:"")+
      `<span>${CG_TYPE_LABEL[k]}</span></button>`).join("");
    item.after(menu);
  }
  item.classList.add("cg-menuing");
  CG_TYPE_ITEM=item;
}
/* 回车＝在光标处拆成紧邻的下一条；新条目沿用这一条的类型（之后可用 ⇄ 改） */
function cgSplitAt(txt){
  const item=txt.closest(".cg-item");
  const list=item?item.parentElement:null;
  if(!item||!list||!list.classList.contains("cg-items")) return false;
  const sel=window.getSelection();
  let tail="";
  if(sel&&sel.rangeCount&&txt.contains(sel.anchorNode)){
    const r=sel.getRangeAt(0);
    tail=(r.cloneRange?r.cloneRange():r).toString();
    r.deleteContents();                       /* 光标后面的字挪到新条目 */
    txt.normalize();
  }
  const kind=CG_TYPES.filter(t=>item.classList.contains(t))[0]||"plain";
  const box=document.createElement("div");
  box.innerHTML=cgItemHTML(kind);
  const next=box.firstElementChild;
  item.after(next);
  const ntxt=$(".cg-txt",next);
  ntxt.innerHTML=tail.replace(/^\u00a0+/,"");
  cgMark(next);
  cgRenumber(list);
  CG_ITEM=next;
  ntxt.focus();
  /* 光标放到新条目开头 */
  try{
    const s=getSelection(), r=document.createRange();
    r.selectNodeContents(ntxt); r.collapse(true);
    s.removeAllRanges(); s.addRange(r);
  }catch(_){}
  save();
  return true;
}
/* 空条目 + 退格 → 删掉这一条（最后一条只清空） */
function cgDeleteItem(item){
  const list=item.parentElement;
  if(!list) return false;
  const items=$$(".cg-item",list);
  if(items.length<=1){
    const txt=$(".cg-txt",item);
    if(txt) txt.innerHTML="";
    item.classList.remove("struck","done");
    CG_TYPES.forEach(t=>item.classList.remove(t));
    item.classList.add("plain");
    cgMark(item);
    save();
    return true;
  }
  const prev=item.previousElementSibling;
  item.remove();
  cgRenumber(list);
  CG_ITEM=(prev&&prev.classList.contains("cg-item"))?prev:list.firstElementChild;
  const pt=$(".cg-txt",CG_ITEM);
  if(pt){
    pt.focus();
    try{ const s=getSelection(), r=document.createRange(); r.selectNodeContents(pt); r.collapse(false);
         s.removeAllRanges(); s.addRange(r); }catch(_){}
  }
  save();
  return true;
}
function cgClear(cell){
  const imgs=$(".cg-imgs",cell), mbox=$(".cg-moodbox",cell);
  const hasMood=!!(mbox&&mbox.dataset.emo);
  const empty=!$$(".cg-txt",cell).some(t=>t.textContent.trim())
    && !(imgs&&imgs.querySelector(".cg-img")) && !hasMood;
  /* 空的格子：直接删掉，不弹确认；用空白位补住（点空白位能再放回来） */
  if(empty){
    const blank=document.createElement("div");
    blank.className="cg-blank";
    blank.dataset.d=cell.dataset.d;
    cell.replaceWith(blank);
    cgDeactivate(cell.closest(".page"));
    save();
    toast("已删除这一格（点空白处可放回）");
    return;
  }
  askConfirm({ title:"清空这一格？", msg:"即将清空 <b>"+esc(cell.dataset.d)+"</b> 这一格的文字、图片与心情，删除后无法恢复。" })
  .then(ok=>{
    if(!ok) return;
    if(imgs) imgs.innerHTML="";
    /* 清空：条目全部收成一条空的 */
    const items=$(".cg-items",cell);
    if(items) items.innerHTML=cgItemHTML("plain");
    if(mbox){
      mbox.dataset.emo="";
      const fc=$(".cg-face",mbox); if(fc) fc.textContent="";
      const mn=$(".cg-mname",mbox); if(mn) mn.textContent="";
    }
    cell.classList.remove("mood");
    CG_ITEM=null;
    save();
  });
}
/* 删掉的空白位点一下 → 把那天的格子放回来 */
function cgRestoreCell(blank){
  const d=blank.dataset.d, td=bjDate();
  const today=(d===td.getFullYear()+"-"+pad(td.getMonth()+1)+"-"+pad(td.getDate()));
  const box=document.createElement("div");
  box.innerHTML=cgCellHTML(d,today);
  blank.replaceWith(box.firstElementChild);
  save();
}
/* ---- 图片：先压缩再存，存不下就明说，不静默失败 ---- */
function cgStoreBytes(){
  let n=0;
  try{ for(let i=0;i<localStorage.length;i++) n+=(localStorage.getItem(localStorage.key(i))||"").length; }catch(_){}
  return n*2;                                   /* JS 字符数 → 字节数约 ×2 */
}
function cgCompress(file,cb){
  const fr=new FileReader();
  fr.onerror=()=>cb("");
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>cb("");
    img.onload=()=>{
      const max=480;
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      const sc=Math.min(1,max/Math.max(w||1,h||1));
      w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement("canvas");
      cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let out="";
      try{ out=cv.toDataURL("image/jpeg",0.72); }catch(_){ out=fr.result; }
      cb(out);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function cgInsertImage(pg,cell,url){
  if(!url){ toast("这张图读不出来，换一张试试"); return; }
  if($$(".cg-img",cell).length>=CG_IMG_PER_CELL){ toast("这一格已经有 "+CG_IMG_PER_CELL+" 张图了"); return; }
  if($$(".cg-img",pg).length>=CG_IMG_PER_PAGE){ toast("本页图片已满 "+CG_IMG_PER_PAGE+" 张，先删几张再插"); return; }
  if(cgStoreBytes()+url.length*2>CG_STORE_MAX){ toast("存储快满了，删几张图片再试"); return; }
  const box=document.createElement("div");
  box.className="cg-img";
  box.innerHTML='<img src="'+url+'" alt=""><button type="button" class="cg-img-x" title="删除图片">✕</button>';
  $(".cg-imgs",cell).appendChild(box);
  save();
}

function cgEnsureMoodBox(cell){
  let box=$(".cg-moodbox",cell);
  if(box) return box;
  const tmp=document.createElement("div");
  tmp.innerHTML=cgMoodBoxHTML("");
  box=tmp.firstElementChild;
  const imgs=$(".cg-imgs",cell);
  if(imgs) cell.insertBefore(box,imgs); else cell.appendChild(box);

function cgSetFace(cell,emo){
  const box=cgEnsureMoodBox(cell);
  box.dataset.emo=emo;
  $(".cg-face",box).textContent=emo;
  $(".cg-mname",box).textContent=CG_MOOD_NAME[emo]||"";
  save();
}
function cgEnterMood(pg,cell){
  const box=cgEnsureMoodBox(cell);
  cgCloseType();
  cell.classList.add("mood");
  /* 还没选过表情 → 顺手把面板打开；选过就直接显示原来那个 */
  cgCloseMood();
  if(!box.dataset.emo) cgOpenMood(pg,cell);
  save();
}
function cgExitMood(cell){
  cell.classList.remove("mood");
  cgCloseMood();
  save();
}
function cgToggleMood(pg,cell){
  if(cell.classList.contains("mood")) cgExitMood(cell);
  else cgEnterMood(pg,cell);
}
/* ---- 心情表情：面板挂页级（格子在会被 display:none 的月区块里） ---- */
function cgOpenMood(pg,cell,item){
  const pop=$("[data-cgmood]",pg);
  if(!pop) return;
  item=item||cgCurItem(cell);
  const on=pop.classList.contains("on")&&CG_MOOD_CELL===cell;
  cgCloseType();
  if(on){ cgCloseMood(); return; }
  cgActivate(pg,cell);
  pop.innerHTML='<div class="cg-mood">'+CG_MOODS.map(m=> m==="-"
    ? '<div class="sep"></div>'
    : `<button type="button" data-cgemo="${m}">${m}</button>`).join("")+'</div>';
  pop.classList.add("on");
  CG_MOOD_CELL=cell; CG_MOOD_ITEM=item;
  /* 定位基准是 pop 的 offsetParent（.mc-titlerow），不是 .page：
     以前拿 .page 的 rect 算，整块会往下偏一个页头高度 */
  const r=cell.getBoundingClientRect();
  const host=pop.offsetParent||pg, hr=host.getBoundingClientRect();
  const W=Math.min(300,Math.max(180,hr.width-4));
  pop.style.width=W+"px";
  pop.style.marginTop="0px";
  pop.style.left=Math.max(0,Math.min(r.left-hr.left,hr.width-W))+"px";
  pop.style.top=(r.bottom-hr.top+6)+"px";
  ensureVisible(pop,true);
}

/* 保存前把「系统运行时加的东西」剥掉，只留真正的模板内容 */
function cleanTplHtml(page){
  const c=page.cloneNode(true);
  /* 注入物：页码 / 删页 / 表格操作列 / 列表占位＋ / 空行删除 / 列表＋按钮 */
  $$(".page-num,.del-page,.rowact,.yp-addslot,.mt-del,[data-additem],"+
     ".fit-row .yp-sw,.fit-row .yp-st,.fit-row .yp-del,.fit-row .del-item",c).forEach(x=>x.remove());
  /* FIT 行的删除线属于内容状态，模板里不留 */
  $$(".fit-row.struck",c).forEach(x=>{ x.classList.remove("struck"); x.style.removeProperty("--strike-x"); });
  $$(".fit-row.done",c).forEach(x=>x.classList.remove("done"));
  /* 弹层：清空内容与开关状态 */
  $$(".bl-pop,.mc-pop,[data-mtpop],.yp-menu,.yp-pop",c).forEach(x=>{
    x.innerHTML=""; x.classList.remove("on"); delete x.dataset.for;
  });
  /* 编辑期的临时物：块删除按钮 / 块定位类 / 临时加上的可编辑属性 */
  $$("[data-tplx]",c).forEach(x=>x.remove());
  $$(".tpl-blk",c).forEach(x=>x.classList.remove("tpl-blk"));
  $$("[data-tpl-ed]",c).forEach(x=>{ x.removeAttribute("contenteditable"); x.removeAttribute("data-tpl-ed"); });
  /* 运行时 id / 状态复位 */
  $$("[data-mtid]",c).forEach(x=>delete x.dataset.mtid);
  $$("[data-selid]",c).forEach(x=>delete x.dataset.selid);
  $$("[data-mtst]",c).forEach(x=>{ delete x.dataset.st; });
  $$("[contenteditable]",c).forEach(x=>x.removeAttribute("data-focus"));
  /* 日期字段：清掉值，插入时按当天重算 */
  $$("input.dinput",c).forEach(i=>{ i.value=""; i.removeAttribute("value"); });
  $$(".dwd",c).forEach(x=>{ x.textContent=""; x.classList.remove("set"); });
  /* 年计划年份跟随插入年 */
  $$(".yp-year",c).forEach(el=>el.textContent=String(TODAY.getFullYear()));
  /* 年计划标题字样跟着年份走 */
  $$("[data-yttl]",c).forEach(el=>el.textContent=TODAY.getFullYear()+"年计划");
  /* 月日历 / 月任务：区块内容随月份生成，模板里不留，插入时按当天重建 */
  const wrap=$("[data-mcwrap]",c);
  if(wrap) wrap.innerHTML="";
  delete c.dataset.mcy; delete c.dataset.mcm;
  /* 日记页：按日区块同理，模板里只留表头，插入时按当天重建 */
  const dw=$("[data-ddwrap]",c);
  if(dw) dw.innerHTML="";
  delete c.dataset.dd;
  /* 周计划：周区块同理，模板里只留页头，插入时按当周重建 */
  const ww=$("[data-wkwrap]",c);
  if(ww) ww.innerHTML="";
  delete c.dataset.wk; delete c.dataset.wky; delete c.dataset.wkm;
  /* 饮食页：周区块同理，模板里只留页头，插入时按当周重建 */
  if(c.dataset.tpl==="food"){
    const fw=$("[data-fjwrap]",c);
    if(fw) fw.innerHTML="";
  }
  /* 日历格：分类名单与分类区块都属于「内容」，模板里不带 */
  if(c.dataset.tpl==="calgrid"){
    c.dataset.cgcats="[]";
    delete c.dataset.cat;
  }
  return c.outerHTML;
}

/* 模板里的日期是空的（保存时被清掉），插入时从当天起按顺序补上 */
function fillEmptyDates(page){
  const n=bjDate(), base=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  let i=0;
  $$("input.dinput",page).forEach(inp=>{
    if(inp.value) return;
    const d=new Date(base.getTime()); d.setDate(d.getDate()+i); i++;
    const v=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    inp.value=v; inp.setAttribute("value",v);
  });
}

/* 插入自定义模板时，把「跟当天走」的东西重算一次 */
function hydrateTpl(page){
  const n=bjDate();
  fillEmptyDates(page);
  $$(".yp-year",page).forEach(el=>el.textContent=String(n.getFullYear()));
  if(page.dataset.tpl==="yearly") ypUpdateCur(page);
  const wrap=$("[data-mcwrap]",page);
  if(wrap){
    /* 自定义模板里没存月份区块，这里清一次以防万一 */
    if(!$$(".mc-month",wrap).length) wrap.innerHTML="";
    delete page.dataset.mcy; delete page.dataset.mcm;
  }
  /* 日记页：模板里没有日区块 → 按当天建一份 */
  const dw=$("[data-ddwrap]",page);
  if(dw){
    if(!$$(".dd-day",dw).length) dw.innerHTML="";
    delete page.dataset.dd;
    ddInitPage(page);
  }
  /* 周计划：模板里没有周区块 → 按当周建一份 */
  const ww=$("[data-wkwrap]",page);
  if(ww){
    if(!$$(".wk-week",ww).length) ww.innerHTML="";
    delete page.dataset.wk; delete page.dataset.wky; delete page.dataset.wkm;
    wkInitPage(page);
  }
  /* 饮食页：周区块同理，插入时按当周重建 7 张卡 */
  const fj=$("[data-fjwrap]",page);
  if(fj){
    if(!$$(".fj-week",fj).length) fj.innerHTML="";
    delete page.dataset.wk; delete page.dataset.wky; delete page.dataset.wkm;
    fjInitPage(page);
  }
}

/* 编辑模式专用：让原本静态的文字可以直接改，并给每个一级块一个删除入口
   （保存时会把这两样临时东西都撤掉，只留用户改过的文字与结构） */
function decorateTplEdit(page){
  const SKIP={BUTTON:1,INPUT:1,SVG:1,PATH:1,TEXTAREA:1,SELECT:1,SCRIPT:1,STYLE:1,BR:1};
  $$("*",page).forEach(el=>{
    if(el.isContentEditable) return;            /* 本来就是可写的，保持原样 */
    if(SKIP[el.tagName]) return;
    if(el.closest("button")) return;
    if(el.querySelector("*")) return;           /* 只看叶子 */
    if(!el.textContent.trim()) return;
    el.setAttribute("contenteditable","true");
    el.dataset.tplEd="1";
  });
  Array.from(page.children).forEach(blk=>{
    blk.classList.add("tpl-blk");
    /* 用 span 而不是 button：有的块本身就是 <button>，里面不能再嵌 button */
    const x=document.createElement("span");
    x.className="tpl-x"; x.dataset.tplx="1";
    x.setAttribute("role","button"); x.title="删除这一块";
    x.textContent="✕";
    blk.appendChild(x);
  });
}

let TPL_EDITING=null;

  }
  const name=$("[data-tplname]");
  if(name) name.textContent="编辑模板 · "+meta.n;
  document.body.classList.add("tpledit");
  window.scrollTo(0,0);
}
function exitTplEdit(){
  TPL_EDITING=null;
  document.body.classList.remove("tpledit");
  $("#tplarea").innerHTML="";
}
function saveTplEdit(){
  const k=TPL_EDITING; if(!k) return;
  const page=$(".page",$("#tplarea"));
  if(!page){ toast("没有内容可保存"); return; }
  TPL_CUSTOM[k]=cleanTplHtml(page);
  saveTpls(); exitTplEdit();
  toast("模板已更新："+tplMeta(k).n);
}
function resetTplEdit(){
  const k=TPL_EDITING; if(!k) return;
  delete TPL_CUSTOM[k]; saveTpls();
  const box=$("#tplarea");
  box.innerHTML=T[k]();
  const page=$(".page",box);
  if(page){
    initRowControls(page);
    fillEmptyDates(page); syncDates(box); wkDates(box); renumberOL(box);
    if(k==="weight") refreshWeight(page);
    if(isMCPage(page.dataset.tpl)) mcInitPage(page);
    decorateTplEdit(page);
  }
  toast("已恢复内置样式");
}
