  pop.classList.add("on");
  CG_MOOD_CELL=cell; CG_MOOD_ITEM=item;
  /* 定位基准是 pop 的 offsetParent（.mc-titlerow），不是 .page：
     以前拿 .page 的 rect 算，整块会往下偏一个页头高度 */
  const r=cell.getBoundingClientRect();
  const host=pop.offsetParent||pg, hr=host.getBoundingClientRect();
  const W=Math.min(300,Math.max(180,hr.width-4));
  pop.style.width=W+"px";
  pop.style.marginTop="0px";
  pop.style.left=Math.max(0,Math.min(r.left-hr.left,hr.width-W))+"px";
  pop.style.top=(r.bottom-hr.top+6)+"px";
  ensureVisible(pop,true);
}

/* 保存前把「系统运行时加的东西」剥掉，只留真正的模板内容 */
function cleanTplHtml(page){
  const c=page.cloneNode(true);
  /* 注入物：页码 / 删页 / 表格操作列 / 列表占位＋ / 空行删除 / 列表＋按钮 */

  $$(".fit-row.done",c).forEach(x=>x.classList.remove("done"));
  /* 条目的缩进状态属于内容，模板里不留 */
  $$(".yp-item.ind",c).forEach(x=>x.classList.remove("ind"));

  $$(".bl-pop,.mc-pop,[data-mtpop],.yp-menu,.yp-pop",c).forEach(x=>{
    x.innerHTML=""; x.classList.remove("on"); delete x.dataset.for;
  });
  /* 编辑期的临时物：块删除按钮 / 块定位类 / 临时加上的可编辑属性 */
  $$("[data-tplx]",c).forEach(x=>x.remove());
  $$(".tpl-blk",c).forEach(x=>x.classList.remove("tpl-blk"));
  $$("[data-tpl-ed]",c).forEach(x=>{ x.removeAttribute("contenteditable"); x.removeAttribute("data-tpl-ed"); });
  /* 运行时 id / 状态复位 */
  $$("[data-mtid]",c).forEach(x=>delete x.dataset.mtid);
  $$("[data-selid]",c).forEach(x=>delete x.dataset.selid);
  $$("[data-mtst]",c).forEach(x=>{ delete x.dataset.st; });
  $$("[contenteditable]",c).forEach(x=>x.removeAttribute("data-focus"));
  /* 日期字段：清掉值，插入时按当天重算 */
  $$("input.dinput",c).forEach(i=>{ i.value=""; i.removeAttribute("value"); });
  $$(".dwd",c).forEach(x=>{ x.textContent=""; x.classList.remove("set"); });
  /* 年计划年份跟随插入年 */

  const wrap=$("[data-mcwrap]",c);
  if(wrap) wrap.innerHTML="";
  delete c.dataset.mcy; delete c.dataset.mcm;
  /* 日记页：按日区块同理，模板里只留表头，插入时按当天重建 */
  const dw=$("[data-ddwrap]",c);

     每个钟点格回到「一条空的纯文本条目」（可编辑的是 .tt-tx，不是 .tt-c）。 */

  $$('.page[data-tpl="daily"] .grow-list,.page[data-tpl="timer"] .grow-list',c).forEach(l=>{

    delete c.dataset.tl;
  }
  return c.outerHTML;
}

function fillEmptyDates(page){

    inp.value=v; inp.setAttribute("value",v);
  });
}

  }
  /* 日记页：模板里没有日区块 → 按当天建一份 */
  const dw=$("[data-ddwrap]",page);
  if(dw){
    if(!$$(".dd-day",dw).length) dw.innerHTML="";
    delete page.dataset.dd;
    ddInitPage(page);
  }
  /* 一日四格：模板里没有日区块 → 按当天建一份 */
  const gw=$("[data-dgwrap]",page);
  if(gw){
    if(!$$(".dg-day",gw).length) gw.innerHTML="";
    delete page.dataset.dg;
    dgInitPage(page);
  }
  /* 周计划：模板里没有周区块 → 按当周建一份 */
  const ww=$("[data-wkwrap]",page);
  if(ww){
    if(!$$(".wk-week",ww).length) ww.innerHTML="";
    delete page.dataset.wk; delete page.dataset.wky; delete page.dataset.wkm;
    wkInitPage(page);
  }
  /* 饮食页：周区块同理，插入时按当周重建 7 张卡 */
  const fj=$("[data-fjwrap]",page);
  if(fj){
    if(!$$(".fj-week",fj).length) fj.innerHTML="";
    delete page.dataset.wk; delete page.dataset.wky; delete page.dataset.wkm;
    fjInitPage(page);
  }
  /* 计时模式：按当天填日期 + 建现在线（记录容器为空） */
  if(page.dataset.tpl==="timer") tbInit(page);
  /* 空白任务表：按当天建一份清单 + 标题 */
  if(page.dataset.tpl==="tasklist") tlInitPage(page);
}

/* 编辑模式专用：让原本静态的文字可以直接改，并给每个一级块一个删除入口
   （保存时会把这两样临时东西都撤掉，只留用户改过的文字与结构） */
function decorateTplEdit(page){
  const SKIP={BUTTON:1,INPUT:1,SVG:1,PATH:1,TEXTAREA:1,SELECT:1,SCRIPT:1,STYLE:1,BR:1};
  $$("*",page).forEach(el=>{
    if(el.isContentEditable) return;            /* 本来就是可写的，保持原样 */
    if(SKIP[el.tagName]) return;
    if(el.closest("button")) return;
    if(el.querySelector("*")) return;           /* 只看叶子 */
    if(!el.textContent.trim()) return;
    el.setAttribute("contenteditable","true");
    el.dataset.tplEd="1";
  });
  Array.from(page.children).forEach(blk=>{
    blk.classList.add("tpl-blk");
    /* 用 span 而不是 button：有的块本身就是 <button>，里面不能再嵌 button */
    const x=document.createElement("span");
    x.className="tpl-x"; x.dataset.tplx="1";
    x.setAttribute("role","button"); x.title="删除这一块";
    x.textContent="✕";
    blk.appendChild(x);
  });
}

let TPL_EDITING=null;
function enterTplEdit(k){
  TPL_EDITING=k;
  const meta=tplMeta(k);
  const box=$("#tplarea");
  box.innerHTML=tplHtml(k);
  const page=$(".page",box);
  if(page){
    /* 编辑期也装上自动加行等控件，方便把行数先调好 */
    initRowControls(page);
    fillEmptyDates(page); syncDates(box); wkDates(box); renumberOL(box);
    if(k==="weight") refreshWeight(page);
    /* 月日历/月任务需要一个区块才能编辑（按当天建，内容随月份走） */
    if(isMCPage(page.dataset.tpl)) mcInitPage(page);
    decorateTplEdit(page);
  }
  const name=$("[data-tplname]");
  if(name) name.textContent="编辑模板 · "+meta.n;
  document.body.classList.add("tpledit");
  window.scrollTo(0,0);
}
function exitTplEdit(){
  TPL_EDITING=null;
  document.body.classList.remove("tpledit");
  $("#tplarea").innerHTML="";
}
function saveTplEdit(){
  const k=TPL_EDITING; if(!k) return;
  const page=$(".page",$("#tplarea"));
  if(!page){ toast("没有内容可保存"); return; }
  TPL_CUSTOM[k]=cleanTplHtml(page);
  saveTpls(); exitTplEdit();
  toast("模板已更新："+tplMeta(k).n);
}
function resetTplEdit(){
  const k=TPL_EDITING; if(!k) return;
  delete TPL_CUSTOM[k]; saveTpls();
  const box=$("#tplarea");
  box.innerHTML=T[k]();
  const page=$(".page",box);
  if(page){
    initRowControls(page);
    fillEmptyDates(page); syncDates(box); wkDates(box); renumberOL(box);
    if(k==="weight") refreshWeight(page);
    if(isMCPage(page.dataset.tpl)) mcInitPage(page);
    decorateTplEdit(page);
  }
  toast("已恢复内置样式");
}

const KEY="journal2026.v2";

/* 给页面内的所有列表装上「+ 新增」和「× 删除」控件（幂等，可重复调用） */
function initRowControls(page){
  /* --- 表格 --- */
  $$('table[data-autorow]',page).forEach(tb=>{
    const thead=$("thead",tb);
    const body=$("tbody",tb);
    if(!body) return;
    const rows=$$("tr",body);
    const needAct = rows.length && !rows[0].querySelector(".rowact");
    if(needAct){
      if(thead){
        const htr=$("tr",thead);
        if(htr && !$(".rowact",htr)){
          const th=document.createElement("th");
          th.className="rowact"; th.textContent="";
          htr.appendChild(th);
        }
      }
      rows.forEach(tr=>{
        const td=document.createElement("td");
        td.className="rowact";
        td.innerHTML='<button class="del-row" title="删除此行">×</button>';
        tr.appendChild(td);
      });
    }
    if(!tb.nextElementSibling || !tb.nextElementSibling.classList.contains("addrow")){
      const b=document.createElement("button");
      b.className="addrow"; b.dataset.addrow="1"; b.textContent="＋ 新增一行";
      tb.insertAdjacentElement("afterend",b);
    }
  });

  /* --- grow-list（Todo / fitness / 周计划任务） --- */
  $$(".grow-list",page).forEach(list=>{
    fitNormalize(list);                       /* FIT 行：补标记列与 ⇄/S/× */
    const items=$$(".grow-item",list);
    items.forEach(it=>{
      if(it.classList.contains("fit-row")) return;   /* FIT 行用 ⇄/S/×，不再挂单独的 × */
      if(!$(".del-item",it)){
        const b=document.createElement("button");
        b.className="del-item"; b.dataset.delitem="1"; b.textContent="×"; b.title="删除此条";
        it.appendChild(b);
      }
    });
    let ab=list.nextElementSibling;
    if(!ab || !ab.classList.contains("addrow")){
      ab=document.createElement("button");
      ab.className="addrow"; ab.type="button"; ab.dataset.additem="1";
      list.insertAdjacentElement("afterend",ab);
    }
    if(page && (page.dataset.tpl==="daily"||page.dataset.tpl==="timer")){
      /* 日计划 / 计时模式 Todo：这个 ＋ 换成「先选类型」的菜单（和周计划同一套）。
         同时留着 data-additem，这样末尾回车新增那条逻辑照旧能用（点它＝弹菜单）。 */
      if(!ab.dataset.mk){ ab.dataset.mk="1"; ab.dataset.kinds="task,ul,ol,plain"; }
      ab.textContent="＋ 新增条目";
    }else{
      ab.textContent="＋ 新增一条";
    }
  });
}

/* 页面右下角的 ✕ 与悬浮按钮（目录 / ＋）位置重叠时，让 ✕ 先让位。
   那个 ✕ 是「删除此页」，滚一点就移开了；而目录 / ＋ 必须随时能点。
   不做的话：某页底边正好滚到悬浮按钮那一段时，两个悬浮按钮会被 ✕ 挡住点不动。 */
function delPageYield(){
  /* ⚠️ 别用 offsetParent 判可见性：fixed 定位元素的 offsetParent 恒为 null */
  const fabs=["#idxbtn","#fab"].map(x=>$(x)).filter(Boolean)
    .filter(e=>getComputedStyle(e).display!=="none")
    .map(e=>e.getBoundingClientRect());
  if(!fabs.length) return;
  $$(".del-page",book).forEach(b=>{
    const r=b.getBoundingClientRect();
    const hit=fabs.some(f=>!(r.right<f.left||r.left>f.right||r.bottom<f.top||r.top>f.bottom));
    b.classList.toggle("away",hit);
  });
}
window.addEventListener("scroll",delPageYield,{passive:true});
window.addEventListener("resize",delPageYield);

function renumber(){
  $$(".page",book).forEach((p,i)=>{
    let n=$(".page-num",p);
    if(!n){ n=document.createElement("div"); n.className="page-num"; p.appendChild(n); }
    n.textContent=(i+1);
    if(!$(".del-page",p)){
      const b=document.createElement("button");
      b.className="del-page"; b.textContent="✕"; b.title="删除此页";
      p.appendChild(b);
    }
    initRowControls(p);
    delPageYield();
    /* 老存档：单行格子 → 多条目结构；顺带补心情块 */
    if(p.dataset.tpl==="calgrid" && cgNormalize(p)) __cgMigrated=true;
    if(isMCPage(p.dataset.tpl)) mcInitPage(p);
    if(p.dataset.tpl==="diary") ddInitPage(p);
    if(p.dataset.tpl==="daygrid") dgInitPage(p);   /* 一日四格：按日区块 + 四格等高 */
    if(p.dataset.tpl==="weekly") wkInitPage(p);
    if(p.dataset.tpl==="food") fjInitPage(p);
    if(p.dataset.tpl==="daily"||p.dataset.tpl==="timer"){
      ttRefresh(p);                              /* 按 data-tt 重画时间块 + 徽标（计时页只挂徽标） */
      $$(".grow-list",p).forEach(chkRenumber);   /* Todo 的有序行重排序号 */
    }
    /* 年计划条目补 ID（老存档迁移） */
    if(p.dataset.tpl==="yearly" && yplEnsureIds(p)) __yplMigrated=true;
  });
  yplRefreshAll();          /* 周计划条目上的 @标签 跟着重画（改名 / 删除都体现在这里） */
}

function save(){
  try{ fitPaintRows(book); }catch(_){}
  $$("[contenteditable]",book).forEach(e=>e.removeAttribute("data-focus"));
  /* 兜底：日计划 / 计时模式 的 Todo 是周计划那一格的镜像，任何改动后都重画一次（含周计划那边）。
     靠签名短路，内容没变时完全不碰 DOM，所以不会打断正在输入的光标。 */
  if(window.__dailyReady){
    try{ dailyRefresh(); }catch(_){}
  }
  /* 每日记录：刷新「已有条目」状态（⊕ 与类型位互斥）—— 在写存档前刷，存进去的 class 就是对的 */
  try{ dnMarkRows(); }catch(_){}
  /* 图片多了可能撑爆 localStorage：当场说明白，别静默丢数据 */
  try{ localStorage.setItem(KEY, book.innerHTML); window.__saveWarned=false; }
  catch(err){
    if(!window.__storeWarned){
      window.__saveWarned=true;
      toast(err&&err.name==="QuotaExceededError"
        ? "存储空间已满，本次改动没存进去"
        : "这个浏览器不让存数据，改动只在本次打开期间有效");
    }
  }
}

  /* 计时模式：填日期 / 重画右栏 / 恢复徽标（进行中的记录会自己接着走）；
     tbInit 末尾会再刷一次 Todo 镜像，把周计划那一格的内容带过来 */
  $$('.page[data-tpl="timer"]',book).forEach(tbInit);
  /* 空白任务表：按各自记住的那天把清单摆出来 */
  $$('.page[data-tpl="tasklist"]',book).forEach(tlInitPage);
  buildIndex();
}

/* ==========================================================
   插入
========================================================== */
function insert(key){
  const html=tplHtml(key);          /* 有自定义样式就用自定义的 */
  const wrap=document.createElement("div");
  wrap.innerHTML=html;
  const page=wrap.firstElementChild;
  if(TPL_CUSTOM[key]) hydrateTpl(page);
  book.appendChild(page);
  page.scrollIntoView({behavior:"smooth",block:"start"});
  renumber();
  renumberOL(page);   /* 新页面的周计划列表立刻挂上占位 ＋（月任务步骤格不用） */
  if(migrateYPHead(page)) ypUpdateCur(page);   /* 老的自定义模板可能还是旧页头 */
  migrateHabit(page);                          /* 老的自定义模板补删除列 / 新增入口 */
  migrateHabitWeeks(page);                     /* 老的自定义模板：打卡页补周视图结构 */
  migrateMoodScale(page);                      /* 老的自定义模板：心情刻度补五档文字 */
  if(key==="weight") refreshWeight(page);
  syncDates(page);
  wkDates(page);
  if(page.dataset.tpl==="daily") dailyRefresh(page);
  if(page.dataset.tpl==="timer") tbInit(page);   /* 计时模式：按当天填日期 + 建现在线 */
  if(page.dataset.tpl==="tasklist") tlInitPage(page);   /* 空白任务表：按当天建清单 */
  autoIndex();
  save();
  toast("已插入："+page.dataset.label);
}

/* ==========================================================
   交互：点击
========================================================== */
document.addEventListener("click",function(e){
  const t=e.target;
  /* 长按刚弹出的面板：这一下 click 只是长按手势的收尾（弹层定位会滚动页面，
     click 落点已经不是那条了），别把它当成「点别处」把面板关了 */
  if(window.__tdJustOpened){ window.__tdJustOpened=false; return; }
  if(window.__tbJustOpened){ window.__tbJustOpened=false; return; }   /* 计时页长按同上 */

  /* 计时模式：点格子里的 ● 徽标 → 回到计时弹窗 */
  const rchip=t.closest("[data-runchip]");
  if(rchip){
    const it=rchip.closest(".tt-it"), pg=it&&it.closest('.page[data-tpl="timer"]');
    if(pg){ TB_PG=pg; TB_IT=it; tbDlgRender(); tbShow(); }
    return;
  }

  /* 日计划 / 计时模式 Todo 是「周计划 · 那一格」的镜像：这里的每个符号都转发到真源那条上，
     复用原有全部逻辑（换类型 / 删除线 / 删除 / 缩进 / 打勾） */
  const dmi=t.closest('.page[data-tpl="daily"] .grow-list > .yp-item,.page[data-tpl="timer"] .grow-list > .yp-item');
  if(dmi && !t.closest("[data-ttbadge]")){ dailyMirrorClick(dmi,t); return; }

  /* 目录侧边栏：打开 / 关闭 / 底部插入入口 / 点条目跳转 */
  if(t.closest("[data-idxbtn]")){ openDrawer(); return; }
  if(t.closest("[data-dwclose]")||t.id==="dwm"){ closeDrawer(); return; }
  if(t.closest("[data-dwadd]")){ closeDrawer(); setTimeout(openSheet,240); return; }
  const delBtn=t.closest(".dw-del");
  if(delBtn){
    if(DW_SWIPE_JUST) return;
    const dwr=delBtn.closest("[data-dwno]");
    if(dwr) dwSwipeDelete(dwr);
    return;
  }
  const dwr=t.closest("[data-dwno]");
  if(dwr){
    if(DW_JUST_DRAGGED||DW_SWIPE_JUST) return;   /* 刚拖/滑完，别当成点击 */
    if(DW_OPEN_ROW===dwr){ dwSwipeReset(); return; }   /* 打开态轻点内容＝收起，不跳页 */
    if(DW_OPEN_ROW) dwSwipeReset();                    /* 打开态点别的行：先收起 */
    const no=parseInt(dwr.dataset.dwno,10);
    closeDrawer();
    setTimeout(()=>gotoPage(no),60);
    return;
  }

  /* 面板：卡片右上角铅笔 → 进入模板样式编辑 */
  const pen=t.closest("[data-tpledit]");
  if(pen){ closeSheet(); enterTplEdit(pen.dataset.tpledit); return; }
  /* 模板编辑模式：块删除 / 保存 / 取消 / 恢复默认 */
  const tpx=t.closest("[data-tplx]");
  if(tpx){ const blk=tpx.parentElement; blk.remove(); return; }
  if(t.closest("[data-tplsave]")){ saveTplEdit(); return; }
  if(t.closest("[data-tplcancel]")){ exitTplEdit(); toast("已取消编辑"); return; }
  if(t.closest("[data-tplreset]")){ resetTplEdit(); return; }

  /* 月任务：标出「当前行」——空行的删除按钮靠它显形（移动端 hover 不可靠）。
     每次点击先清掉旧的，再按落点重新标 */
  $$("tr.mt-act",book).forEach(r=>r.classList.remove("mt-act"));
  const mtrow=t.closest("tr");
  if(mtrow && mtrow.dataset.mtempty) mtrow.classList.add("mt-act");

  /* 索引：点「整理」 */
  const ri=t.closest("[data-reindex]");
  if(ri){ buildIndex(); toast("已整理 "+$$('.ix-row',book).length+" 条"); return; }

  /* 索引：点条目 → 跳转并高亮 */
  const go=t.closest("[data-goto]");
  if(go){ gotoPage(parseInt(go.dataset.goto,10)); return; }

  /* ---------- 日历格（calgrid）---------- */
  if(t.closest("[data-cgsel]")){
    const cgs=t.closest("[data-cgsel]");
    const pg=cgs.closest(".page"), pop=$("[data-cgpop]",pg);
    if(!pop) return;
    const wasOn=pop.classList.contains("on");
    mcClosePop();
    if(!wasOn){
      pop.innerHTML=cgPopHTML(pg);
      pop.classList.add("on");
      pop.style.left=(cgs.offsetLeft||0)+"px";
      const pr=pop.getBoundingClientRect(), gr=pg.getBoundingClientRect();
      const over=pr.right-(gr.right-19);
      if(over>0) pop.style.left=Math.max(0,(cgs.offsetLeft||0)-over)+"px";
    }
    return;
  }
  const cgAdd=t.closest("[data-cgadd]");
  if(cgAdd){
    const pg=cgAdd.closest(".page"), inp=$("[data-cgnew]",pg);
    cgAddCat(pg,inp?inp.value:"");
    if(inp) inp.value="";
    return;
  }
  const cgCat=t.closest("[data-cgcat]");
  if(cgCat){
    const pg=cgCat.closest(".page");
    if(t.closest("[data-cgdel]")){ cgDelCat(pg,cgCat.dataset.cgcat); return; }
    cgShow(pg,cgCat.dataset.cgcat);
    mcClosePop(); save();
    return;
  }
  const cgAct=t.closest("[data-cgact]");
  if(cgAct){
    const cell=cgAct.closest(".cg-cell"), pg=cgAct.closest(".page"), a=cgAct.dataset.cgact;
    const item=cgCurItem(cell);
    if(a==="type"){ if(item) cgOpenType(item); return; }
    if(a==="img"){
      const inp=$("[data-cgfile]",pg);
      if(inp){ inp.dataset.cgd=cell.dataset.d; inp.value=""; inp.click(); }
      return;
    }
    if(a==="mood"){ cgToggleMood(pg,cell); return; }
    if(a==="strike"){ if(item) cgStrike(item); return; }
    if(a==="clear"){ cgClear(cell); return; }
  }
  /* 心情模式下点那张大脸 → 换一个表情（点名字是改字，交给默认行为） */
  const cgMoodBox=t.closest(".cg-moodbox");
  if(cgMoodBox){
    const mcell=cgMoodBox.closest(".cg-cell"), mpg=mcell&&mcell.closest(".page");
    if(mpg){
      cgActivate(mpg,mcell);
      if(!t.closest(".cg-mname")) cgOpenMood(mpg,mcell);
    }
    return;
  }
  const cgKind=t.closest(".cg-menu button");
  if(cgKind){
    const item=CG_TYPE_ITEM;
    cgCloseType();
    if(item) cgSetKind(item,cgKind.dataset.kind);
    return;
  }
  const cgEmo=t.closest("[data-cgemo]");
  if(cgEmo){
    const cell=CG_MOOD_CELL, item=CG_MOOD_ITEM;
    cgCloseMood();
    /* 心情模式：选表情＝换成这一格的大表情（名字跟着换） */
    if(cell&&cell.classList.contains("mood")){ cgSetFace(cell,cgEmo.dataset.cgemo); return; }
    const txt=item?$(".cg-txt",item):null;
    if(txt){
      /* 面板按钮会抢焦点、选区可能已经丢了 → 丢失时把光标放到该条目末尾 */
      const s=window.getSelection();
      if(!s.rangeCount||!txt.contains(s.anchorNode)){
        const r=document.createRange();
        r.selectNodeContents(txt); r.collapse(false);
        s.removeAllRanges(); s.addRange(r);
      }
      txt.focus({preventScroll:true});
      try{ document.execCommand("insertText",false,cgEmo.dataset.cgemo); }
      catch(_){ txt.textContent+=cgEmo.dataset.cgemo; }
      save();
    }
    return;
  }
  const cgImgX=t.closest(".cg-img-x");
  if(cgImgX){ cgImgX.closest(".cg-img").remove(); save(); return; }
  const cgBlank=t.closest(".cg-blank[data-d]");
  if(cgBlank){ cgRestoreCell(cgBlank); return; }
  const cgMk=t.closest(".cg-mark");
  if(cgMk){
    const item=cgMk.closest(".cg-item");
    if(item&&item.classList.contains("task")){ item.classList.toggle("done"); cgMark(item); save(); }
    return;
  }
  const cgCell=t.closest(".cg-cell");
  if(cgCell){
    const pg=cgCell.closest(".page");
    cgActivate(pg,cgCell);
    const item=t.closest(".cg-item");
    if(item) CG_ITEM=item;
    return;
  }
  /* 点日历格页面上的别处 → 收起工具条 / 表情面板 / 类型菜单 */
  const cgPg=t.closest(".page");
  if(cgPg && cgPg.dataset.tpl==="calgrid" && !t.closest(".mc-pop,[data-cgsel],[data-mcsel]")){
    cgDeactivate(cgPg); cgCloseType(); cgCloseMood();
  }

  /* FIT 行（饮食页底部）：点行弹类型菜单；文字区照常打字 */
  const fr=t.closest(".fit-row");
  if(fr){
    if(t.closest("[data-ypst]")){ if(!fitStrikeRow(fr)) toast("先选中要加删除线的文字"); return; }
    if(t.closest("[data-ypsw]")){ fitNextKind(fr); save(); return; }
    if(t.closest("[data-ypdel]")){ fitDelRow(fr); save(); return; }
    const fbx=t.closest(".box");
    if(fbx){ fbx.classList.toggle("on"); fr.classList.toggle("done",fbx.classList.contains("on")); save(); return; }
    if(t.closest(".fin")) return;
    const flist=fr.parentElement;
    const fex=$(".yp-menu",flist);
    if(fex && FIT_MENU_ROW===fr){ closeFitMenu(); return; }   /* 再点一次＝收起，行回来 */
    openFitMenu(fr);
    return;
  }

  /* 月日历：点页面别处收起年月面板（周切片器也复用 .mc-pop，一并收起） */
  if($(".mc-pop.on") && !t.closest(".mc-pop") && !t.closest("[data-mcsel]") && !t.closest("[data-wksel]") && !t.closest("[data-cyearsel]")) mcClosePop();

  /* 点别处收起「类型菜单」（＋ / 步骤格唤出的那个）；点 ＋ 本身保留开关效果 */
  if(!t.closest(".yp-menu") && !t.closest("[data-mk]")){
    closeFitMenu();
  }

  /* 点别处收起「读书清单状态下拉」的面板 */
  if(!t.closest(".bl-pop") && !t.closest("[data-selst]")) blClosePop();
  /* 点别处收起「年计划年份」的面板 */
  if(!t.closest(".yp-pop") && !t.closest("[data-ysel]")) ypClosePop();
  /* 点别处收起「关联到年计划」的面板（点面板内部 / 点那条条目本身不算） */
  if(!t.closest(".ypl-pop") && !t.closest(".ypl-lp")) yplClose();
  /* 点别处收起「安排到时间表」的面板 */
  if(!t.closest(".td-pop") && !t.closest(".td-lp")) tdClose();
  /* 点别处收起时间表的类型菜单 */
  if(!t.closest(".tt-menu") && !t.closest("[data-ttmk]") && !t.closest("[data-ttsw]")) ttCloseMenu();

  /* 打卡页：切到某一周 / 打开收起周切片器 */
  const hbw=t.closest("[data-hbwi]");
  if(hbw){
    const pg=hbw.closest(".page");
    if(pg){ pg.dataset.hbw=hbw.dataset.hbwi; mcClosePop(); hbWeek(pg); save(); }
    return;
  }
  const hbs=t.closest("[data-hbsel]");
  if(hbs){
    const pg=hbs.closest(".page"), pop=$("[data-hbpop]",pg);
    if(pop){
      const wasOn=pop.classList.contains("on");
      mcClosePop();
      if(!wasOn){
        const y=parseInt(pg.dataset.mcy,10), m=parseInt(pg.dataset.mcm,10);
        pop.innerHTML=hbPopHTML(isNaN(y)?bjDate().getFullYear():y,
                                isNaN(m)?bjDate().getMonth():m,
                                parseInt(pg.dataset.hbw,10)||1);
        pop.classList.add("on");
        pop.style.left=(hbs.offsetLeft||0)+"px";
        const pr=pop.getBoundingClientRect(), gr=pg.getBoundingClientRect();
        const over=pr.right-(gr.right-19);
        if(over>0) pop.style.left=Math.max(0,(hbs.offsetLeft||0)-over)+"px";
      }
    }
    return;
  }
  /* 自定义日期选择器：点显示层打开 / 再点关闭 */
  const dsh=t.closest("[data-dshow]");
  if(dsh){
    const df=dsh.closest(".dfield"), dinp=df&&$(".dinput",df);
    if(dinp){
      if(DP.el && DP.el.classList.contains("on") && DP.inp===dinp) dpClose();
      else dpOpen(dinp);
    }
    return;
  }
  /* 年度日历：打开 / 收起年份切片器 */
  const cys=t.closest("[data-cyearsel]");
  if(cys){
    const pg=cys.closest(".page"), pop=$("[data-cyearpop]",pg);
    const wasOn=pop&&pop.classList.contains("on");
    mcClosePop();
    if(pop&&!wasOn){
      pop.innerHTML=ycalPopHTML(parseInt($("[data-cyear]",pg).textContent,10)||TODAY.getFullYear());
      pop.classList.add("on");
    }
    return;
  }
  /* 年度日历：面板里翻年 */
  const cyp=t.closest("[data-cyprev]"), cyn=t.closest("[data-cynext]");
  if(cyp||cyn){
    const pop=(cyp||cyn).closest(".mc-pop");
    const cur=parseInt($(".mc-yt",pop).textContent,10)||TODAY.getFullYear();
    pop.innerHTML=ycalPopHTML(cur+(cyp?-1:1));
    return;
  }
  /* 年度日历：选年 → 重绘 12 格 */
  const cyel=t.closest("[data-cyel]");
  if(cyel){
    const pg=cyel.closest(".page");
    const y=parseInt(cyel.dataset.cyel,10);
    const ye=$("[data-cyear]",pg); if(ye) ye.textContent=y;
    const g=$("[data-ygrid]",pg); if(g) g.innerHTML=yearGrid(y, ycalImps(pg));
    mcClosePop(); save(); autoIndex(); return;
  }
  /* 月日历：打开 / 收起年月切片器 */
  const mcs=t.closest("[data-mcsel]");
  if(mcs){
    const pg=mcs.closest(".page"), pop=$("[data-mcpop]",pg);
    const wasOn=pop.classList.contains("on");
    mcClosePop();
    if(!wasOn){
      pop.innerHTML=mcPopHTML(parseInt(pg.dataset.mcy,10),parseInt(pg.dataset.mcm,10));
      /* 面板对齐到切片器下方（月日历的切片器不再贴最左，所以要跟着走位）；窄屏会捅出右边界 → 夹回纸面内 */
      pop.classList.add("on");
      pop.style.left=(mcs.offsetLeft||0)+"px";
      const pr=pop.getBoundingClientRect(), gr=pg.getBoundingClientRect();
      const over=pr.right-(gr.right-19);
      if(over>0) pop.style.left=Math.max(0,(mcs.offsetLeft||0)-over)+"px";
    }
    return;
  }
  /* 月日历：切年份（把今天所在的年写进页面，内容同步） */
  const mcprev=t.closest("[data-mcyprev]"), mcnext=t.closest("[data-mcynext]");
  if(mcprev||mcnext){
    const pg=(mcprev||mcnext).closest(".page");
    const y=parseInt(pg.dataset.mcy,10)+(mcprev?-1:1);
    const m=parseInt(pg.dataset.mcm,10);
    mcShow(pg,y,m);
    $("[data-mcpop]",pg).innerHTML=mcPopHTML(y,m);
    save(); return;
  }
  /* 月日历：选月份 */
  const mcmo=t.closest("[data-mcmo]");
  if(mcmo){
    const pg=mcmo.closest(".page");
    mcShow(pg,parseInt(pg.dataset.mcy,10),parseInt(mcmo.dataset.mcmo,10));
    mcClosePop(); save(); return;
  }
  /* 月日历：符号切换 实心（有固定时间） ⇄ 短横（笔记） */
  const mcsy=t.closest(".mc-sym");
  if(mcsy){
    const row=mcsy.closest(".mc-row");
    if(row&&!row.classList.contains("blank")){
      mcsy.dataset.sym = mcsy.dataset.sym==="dash" ? "dot" : "dash";
      save();
    }
    return;
  }

  /* 月任务：空行最右侧的 ✕ → 删除这一行（不补行，行数由用户自己控制） */
  const mtdel=t.closest("[data-mtdel]");
  if(mtdel){
    const tr=mtdel.closest("tr"), tb=tr&&tr.closest("tbody");
    if(tr&&tb&&tb.children.length>1){
      tr.remove(); mtSyncEmpty(tb); save(); toast("已删除一行");
    }else{
      toast("至少保留一行");
    }
    return;
  }
  /* 月任务：完成情况单元格 → 弹三选菜单 */
  const mtst=t.closest("[data-mtst]");
  if(mtst){
    const pop=$("[data-mtpop]",mtst.closest(".page"));
    const was=pop&&pop.classList.contains("on")&&pop.dataset.for===mtst.dataset.mtid;
    mcClosePop();
    if(!was){
      mcTagId(mtst);
      if(pop){ pop.dataset.for=mtst.dataset.mtid; mtOpenStatus(mtst); }
    }
    return;
  }
  /* 月任务：选状态 */
  const mtv=t.closest("[data-mtstv]");
  if(mtv){
    const pop=mtv.closest(".mc-pop");
    const id=pop&&pop.dataset.for;
    const td=id?$(`[data-mtid="${id}"]`,mtv.closest(".page")):null;
    if(td) mtSetStatus(td,mtv.dataset.mtstv);
    mcClosePop(); save(); return;
  }
  /* 月任务：＋ 新增一行（限定在当前月份区块内） */
  const mtadd=t.closest("[data-mtadd]");
  if(mtadd){
    mtAddRow(mtadd.closest(".mc-month")||mtadd.closest(".page"));
    const tb=$(".mt-tbl tbody",mtadd.closest(".mc-month")||mtadd.closest(".page"));
    const last=tb&&tb.lastElementChild;
    const ce=last&&last.querySelector(".mt-goal"); if(ce) ce.focus();
    return;
  }
  /* 月任务：光标落进「具体执行步骤」单元格 → 直接弹类型菜单（＝原来点 ＋ 的效果）
     注意：本段位于类型菜单等条目处理之前，必须排除条目 / 菜单内的点击，
     否则会把「选类型 / ⇄ / ×」的点击吞掉 */
  const mtstep=t.closest("td.mt-step");
  if(mtstep && !t.closest(".yp-item") && !t.closest("[data-mk]") && !t.closest(".yp-menu")){
    const items=$(".yp-items",mtstep);
    if(items){ openAddMenu(items,"task,ul,ol,plain,strike"); return; }
  }

  /* 月度计划：切年份 / 选月份 → 重绘月历 */
  const mpv=t.closest("[data-mprev]"), mpx=t.closest("[data-mnext]"), mmo=t.closest('[data-opt="mm"] .opt');
  if(mpv||mpx||mmo){
    const pg=(mpv||mpx||mmo).closest(".page");
    const ye=$("[data-myear]",pg);
    let y=parseInt(ye.textContent,10)||TODAY.getFullYear();
    if(mpv) y--; if(mpx) y++;
    ye.textContent=y;
    if(mmo){ const g=mmo.parentElement; $$(".opt",g).forEach(s=>s.classList.toggle("on",s===mmo)); }
    const mon=pg.querySelector('[data-opt="mm"] .opt.on');
    const m=mon?parseInt(mon.textContent,10)-1:TODAY.getMonth();
    const grid=$("[data-mgrid]",pg);
    if(grid) grid.innerHTML=monthGrid(y,m);
    save(); autoIndex(); return;
  }

  /* 年度日历：切年份 → 重绘 12 格 */
  const cpv=t.closest("[data-cprev]"), cpx=t.closest("[data-cnext]");
  if(cpv||cpx){
    const pg=(cpv||cpx).closest(".page");
    const ye=$("[data-cyear]",pg);
    let y=parseInt(ye.textContent,10)||TODAY.getFullYear();
    y += cpv ? -1 : 1;
    ye.textContent=y;
    const g=$("[data-ygrid]",pg);
    if(g) g.innerHTML=yearGrid(y);
    save(); autoIndex(); return;
  }

  /* 周计划：周切片器 —— 打开/收起面板 */
  const wks=t.closest("[data-wksel]");
  if(wks){
    const pg=wks.closest(".page"), pop=$("[data-wkpop]",pg);
    if(!pop) return;
    const wasOn=pop.classList.contains("on");
    mcClosePop();
    if(!wasOn){
      pop.innerHTML=wkPopHTML(parseInt(pg.dataset.wky,10),parseInt(pg.dataset.wkm,10),pg.dataset.wk);
      pop.classList.add("on");
      pop.style.left=(wks.offsetLeft||0)+"px";
      /* 标题长的页（如 Food Journal）药丸靠右，206px 面板会捅出纸面 → 整体左移到不溢出
         （19 = 纸面 1px 边框 + 18px 内边距） */
      const pr=pop.getBoundingClientRect(), gr=pg.getBoundingClientRect();
      const over=pr.right-(gr.right-19);
      if(over>0) pop.style.left=Math.max(0,(wks.offsetLeft||0)-over)+"px";
    }
    return;
  }
  /* 周计划：面板里翻月份（只翻列表，选中哪一周要再点一次） */
  const wkprev=t.closest("[data-wkprev]"), wknext=t.closest("[data-wknext]");
  if(wkprev||wknext){
    const pg=(wkprev||wknext).closest(".page");
    let y=parseInt(pg.dataset.wky,10), m=parseInt(pg.dataset.wkm,10);
    if(wkprev){ m--; if(m<0){ m=11; y--; } }
    else{ m++; if(m>11){ m=0; y++; } }
    pg.dataset.wky=y; pg.dataset.wkm=m;
    $("[data-wkpop]",pg).innerHTML=wkPopHTML(y,m,pg.dataset.wk);
    return;
  }
  /* 周计划：选某一周（切块；没写过的周自动新建一份空白） */
  const wkw=t.closest("[data-wkw]");
  if(wkw){
    const pg=wkw.closest(".page"), iso=wkw.dataset.wkw;
    /* 饮食页与周计划页共用这一份面板：按页类型走各自的切周 */
    if(pg.dataset.tpl==="food") fjShow(pg,iso); else wkShow(pg,iso);
    mcClosePop(); save(); autoIndex();
    return;
  }

  /* 周计划：删除某一周 */
  const wkd=t.closest("[data-wkdel]");
  if(wkd){
    const pg=wkd.closest(".page");
    if($$(".wk-sec",pg).length<=1){ toast("至少保留一周"); return; }
    const sec=wkd.closest(".wk-sec");
    const dt=$(".dinput",sec);
    const when=dt&&dt.value?dt.value:"这一周";
    askConfirm({
      title:"删除这一周？",
      msg:"即将删除 <b>"+esc(when)+"</b> 的计划与周记。删除后无法恢复。"
    }).then(ok=>{
      if(!ok) return;
      sec.remove(); autoIndex(); save(); toast("已删除该周");
    });
    return;
  }

  /* 周计划：编辑周记 */
  const wke=t.closest("[data-wkedit]");
  if(wke){
    const j=$(".wk-journal",wke.closest(".wk-sec"));
    if(j){ j.focus(); ensureVisible(j,true); }
    return;
  }

  /* 加号 —— 展开类型菜单（年计划 / 周计划通用） */
  const mk=t.closest("[data-mk]");
  if(mk){
    /* 优先看按钮所属容器，其次是其后的条目区（页头 ＋ 的情况） */
    let items=null;
    const host=mk.closest(".yp-month")||mk.closest(".wk-day")||mk.closest(".yp-items");
    if(host) items=$(".yp-items",host)||host;
    if(!items){
      let nx=mk.nextElementSibling;
      while(nx && !nx.classList.contains("yp-items") && !nx.classList.contains("grow-list"))
        nx=nx.nextElementSibling;
      items=nx;
    }
    /* 日计划 Todo：＋ 在列表「后面」，所以要往前找 .grow-list */
    if(!items){
      let pv=mk.previousElementSibling;
      while(pv && !pv.classList.contains("yp-items") && !pv.classList.contains("grow-list"))
        pv=pv.previousElementSibling;
      items=pv;
    }
    if(!items){
      const pg=mk.closest(".page");
      items=$(".wk-items",pg);
    }
    if(items) openAddMenu(items, mk.dataset.kinds);
    return;
  }

  /* 选择类型 → 添加一项 */
  const kb=t.closest(".yp-menu button");
  if(kb){
    const menu=kb.parentElement, items=menu.parentElement;
    const kind=kb.dataset.kind;
    /* 时间表的类型菜单：不新增条目，改的是被点的那一格 */
    if(menu.classList.contains("tt-menu")){
      const it=TT_MENU_ITEM;
      menu.remove(); TT_MENU_ITEM=null;
      if(it) ttSetKind(it,kind);
      save(); return;
    }
    /* FIT 行的菜单：不新增条目，改的是被点的那一行 */
    if(menu.dataset.fitrow){
      const frow=FIT_MENU_ROW;
      closeFitMenu();                        /* 菜单消失 + 那一行回到原位 */
      if(frow){
        if(kind==="strike"){ if(!fitStrikeRow(frow)) toast("先选中要加删除线的文字"); }
        else fitSetKind(frow,kind);
        save();
      }
      return;
    }
    menu.remove();
    if(kind==="strike"){
      /* 删除线不是类型：施加到选中的文字（没有选中就整条），不新增条目 */
      const r=applyStrike();
      if(!r){ toast("先选中要加删除线的文字"); return; }
      if(r==="item" && SEL_BOX) toggleStruckRow(SEL_BOX.closest(".yp-item,.fit-row"));
      save(); return;
    }
    const d=document.createElement("div");
    /* 日计划 / 计时模式 Todo：菜单弹在这一页，但条目要落到「周计划 · 那一格」这个真源上 */
    if(items.classList.contains("grow-list")){
      const dpg=items.closest('.page[data-tpl="daily"],.page[data-tpl="timer"]');
      const cell=dpg&&dailyCell(dpg);
      const dst=cell?($(".yp-items",cell)||cell):null;
      if(dst){
        d.innerHTML=ypItem(kind);
        dst.appendChild(d.firstElementChild);
        yplEnsureIds(cell.closest(".page")||book);
        renumberOL(dst);
        const niAt=$$(".yp-item",dst).length-1;
        save();
        dailyMirrorFocus(dpg,niAt,"end");
        return;
      }
      d.innerHTML=chkRowHTML(kind);          /* 兜底：拿不到周计划那格时按老结构加 */
      items.appendChild(d.firstElementChild);
      chkRenumber(items);
      const ce=$(".txt",items.lastElementChild); if(ce) ce.focus();
      save(); return;
    }
    d.innerHTML=ypItem(kind);
    items.appendChild(d.firstElementChild);
    /* 新条目也要拿 ID，否则它永远挂不上（周计划引用靠 ID 认人） */
    yplEnsureIds(items.closest(".page")||book);
    const ce=$(".yp-txt",items.lastElementChild); if(ce) ce.focus();
    renumberOL(items);
    const dgp=items.closest('.page[data-tpl="daygrid"]'); if(dgp) dgFit(dgp);
    save(); return;
  }

  /* 缩进按钮：整行缩进一格 / 再点退回（只能一级，同一个按钮自动翻向）
     列表第一行不能缩进（按钮是隐藏的，这里再挡一道，避免程序化点击漏进来） */
  const iw=t.closest("[data-ypind]");
  if(iw){
    const it=iw.closest(".yp-item");
    if(it){
      const list=it.parentElement;
      if($$(".yp-item",list)[0]!==it){ it.classList.toggle("ind"); save(); }
    }
    return;
  }

  /* 行内删除线按钮 S：选中了字只划选中的，没选中划整行（含符号），再点取消 */
  const stb=t.closest("[data-ypst]");
  if(stb){
    if(!strikeRow(stb.closest(".yp-item,.fit-row"))) toast("先选中要加删除线的文字");
    return;
  }

  /* 切换类型（任务 → 无序 → 有序 → 删除线） */
  const sw=t.closest("[data-ypsw]");
  if(sw){
    const it=sw.closest(".yp-item");
    const ni=setYPKind(it, nextKind(ypKindOf(it)));
    renumberOL(ni.closest(".yp-items"));
    /* 日计划 Todo 是周计划那一格的镜像：换完类型要把镜像与时间表一起重画
       （时间表里排进来的那条会跟着换类型） */
    const dpg=ni.closest('.page[data-tpl="daily"]');
    if(dpg) dailyAfter(dpg);
    save(); return;
  }

  /* 条目复制：菜单 →「复制到…」→ 出目标选择器 */
  const yccopy=t.closest("[data-ypccopy]");
  if(yccopy&&YPC_ITEM){
    const pop=yccopy.closest(".ypl-pop");
    if(pop){
      pop.innerHTML=ypcTargetHTML(YPC_ITEM);
      /* 周计划是 7 天，给它放宽列表高度，一屏看完不用滚 */
      pop.classList.toggle("ypc-days", !YPC_ITEM.closest('.page[data-tpl="yearly"]'));
      /* 列表先滚到原位置附近，省得往下翻着找 */
      const lst=pop.querySelector(".ypl-list"), here=pop.querySelector(".ypl-mo.here");
      if(lst&&here) lst.scrollTop=Math.max(0,here.offsetTop-lst.offsetTop-70);
    }
    return;
  }
  /* 条目复制：菜单 →「关联到年计划」→ 交给现有的关联面板 */
  const yclink=t.closest("[data-ypclink]");
  if(yclink&&YPC_ITEM){
    const it=YPC_ITEM;
    YPC_ITEM=null;
    yplOpen(it);
    return;
  }
  /* 目标选择器：返回菜单 */
  const ycback=t.closest("[data-ypcback]");
  if(ycback&&YPC_ITEM){
    const pop=ycback.closest(".ypl-pop");
    if(pop) pop.innerHTML=ypcMenuHTML(YPC_ITEM);
    return;
  }
  /* 目标选择器：选定 → 复制 */
  const ycm=t.closest("[data-ypcm]");
  if(ycm&&YPC_ITEM){ ypcDo(YPC_ITEM, parseInt(ycm.dataset.ypcm,10)); return; }
  const ycd=t.closest("[data-ypcd]");
  if(ycd&&YPC_ITEM){ ypcDo(YPC_ITEM, parseInt(ycd.dataset.ypcd,10)); return; }

  /* 关联面板：选月份 */
  const ymo=t.closest("[data-yplmo]");
  if(ymo&&YPL_ITEM){
    YPL_MONTH=parseInt(ymo.dataset.yplmo,10);
    const pop=ymo.closest(".ypl-pop");
    if(pop){ pop.innerHTML=yplItemsHTML(YPL_MONTH); pop.scrollTop=0; }
    return;
  }
  /* 关联面板：返回月份列表 */
  const yback=t.closest("[data-yplback]");
  if(yback&&YPL_ITEM){
    YPL_MONTH=null;
    const pop=yback.closest(".ypl-pop");
    if(pop){ pop.innerHTML=yplMonthHTML(); }
    return;
  }
  /* 关联面板：点某条 → 挂上 / 取消（可多选，不关面板） */
  const yit=t.closest("[data-yplit]");
  if(yit&&YPL_ITEM){
    yplToggle(YPL_ITEM,yit.dataset.yplit);
    /* 重画当前列表，勾选状态即时更新 */
    const pop=yit.closest(".ypl-pop");
    if(pop&&YPL_MONTH!=null){
      const sc=pop.querySelector(".ypl-list").scrollTop;
      pop.innerHTML=yplItemsHTML(YPL_MONTH);
      pop.querySelector(".ypl-list").scrollTop=sc;
    }
    return;
  }
  /* 周计划条目上的 @标签：绿标 → 进它指向的年计划条目详情页；
     灰标（原条目已删除）→ 弹「取消这个关联」 */
  const ytag=t.closest(".ypl-tag");
  if(ytag){
    const id=ytag.dataset.yplref;
    const it=ytag.closest(".yp-item");
    const hit=yplFind(id);
    if(!hit){
      askConfirm({ title:"这条已经删除了",
        msg:`原年计划条目 <b>${esc(ytag.getAttribute("title")||"")}</b> 已被删除。<br>要取消这个关联吗？`,
        okText:"取消关联" })
      .then(ok=>{ if(ok && it){ const refs=yplRead(it).filter(r=>r.id!==id);
        yplWrite(it,refs); yplPaint(it); yplPaintYearly(); save(); toast("已取消关联"); } });
      return;
    }
    ypdOpen(id,it);       /* 绿标 → 详情页，记住来路（回到周计划） */
    return;
  }
  /* 年计划条目行尾的「被引用」徽标 → 详情页 */
  const rb=t.closest("[data-ypref]");
  if(rb){ ypdOpen(rb.dataset.ypid,null); return; }
  /* 详情页：返回（回到来路） */
  if(t.closest("[data-ypdback]")){
    const from=YPD_FROM;
    ypdClose();
    if(from && document.contains(from)){
      const wkEl=from.closest("[data-wk]");
      const iso=wkEl?wkEl.dataset.wk:(from.closest('.page[data-tpl="weekly"]')||{}).dataset?.wk;
      if(iso) wkShow(from.closest(".page"),iso);
      ensureVisible(from,true);
      from.classList.remove("flash"); void from.offsetWidth; from.classList.add("flash");
      setTimeout(()=>from.classList.remove("flash"),1100);
    }
    return;
  }
  /* 年计划：删除一项 —— 若有周计划引用，先说清楚再删 */
  const yd=t.closest("[data-ypdel]");
  if(yd){
    const it=yd.closest(".yp-item"), items=it.closest(".yp-items");
    const id=it.dataset.ypid;
    const users=[];
    $$(".yp-item",book).forEach(w=>{
      if(!w.closest('[data-tpl="weekly"]')&&!w.closest(".wk-week")) return;
      if(yplRead(w).some(r=>r.id===id)) users.push(w);
    });
    const doDel=()=>{
      it.remove(); renumberOL(items);
      /* 引用它的周计划条目标成「已删除」，不静默消失 */
      users.forEach(w=>{ yplPaint(w); });
      const dgp=items.closest('.page[data-tpl="daygrid"]'); if(dgp) dgFit(dgp);
      save();
    };
    if(users.length){
      askConfirm({ title:"这条被周计划引用了",
        msg:`<b>${esc(($(".yp-txt",it)||{}).textContent||"这条")}</b> 被 <b>${users.length}</b> 条周计划条目引用。<br>删掉后那些标签会变成灰色「已删除」。`,
        okText:"仍然删除" })
      .then(ok=>{ if(ok) doDel(); });
    }else{
      doDel();
    }
    return;
  }

  /* 打卡页：新增一个习惯 */
  const hba=t.closest("[data-hbadd]");
  if(hba){ hbAddRow(hba.closest(".page")); return; }

  /* 年计划：点年份切片器 → 弹年份面板 */
  const ysel=t.closest("[data-ysel]");
  if(ysel){
    const pg=ysel.closest(".page"), pop=$("[data-ypop]",pg);
    const wasOn=pop&&pop.classList.contains("on");
    ypClosePop();
    if(!wasOn&&pop){
      const cur=parseInt(($(".yp-year",pg)||{}).textContent,10)||TODAY.getFullYear();
      pop.innerHTML=ypPopHTML(cur);
      pop.classList.add("on");
      const on=$(".yp-yo.on",pop); if(on&&on.scrollIntoView) on.scrollIntoView({block:"center"});
    }
    return;
  }
  /* 年计划：选年份 → 标题字样跟着变 */
  const ypy=t.closest("[data-ypy]");
  if(ypy){
    ypSetYear(ypy.closest(".page"),parseInt(ypy.dataset.ypy,10));
    ypClosePop();
    return;
  }

  /* 时间表格子里的「类型位」：是任务＝打勾（和 Todo 联动）；别的类型＝弹类型菜单 */
  const tmk=t.closest("[data-ttmk]");
  if(tmk){
    const it=tmk.closest(".tt-it");
    const row=it&&it.closest(".tt-r");
    const pg=row&&row.closest('.page[data-tpl="daily"]');
    const h=parseInt(((($(".tt-h",row)||{}).textContent)||"").trim(),10);
    if(it && (it.dataset.kind||"plain")==="task"){
      const todo=pg?ttOwner(pg,h):null;
      if(todo){
        const bx=$(".box",todo);
        if(bx){ bx.classList.toggle("on"); todo.classList.toggle("done",bx.classList.contains("on")); }
        else todo.classList.toggle("done");
        if(pg) ttRender(pg);
      }else{
        it.dataset.done=(it.dataset.done==="1")?"0":"1";
        ttPaintItem(it);
      }
      save();
    }else{
      ttOpenMenu(it);
    }
    return;
  }
  /* 时间表里任务行尾的 ⇄ → 弹类型菜单换类型 */
  const tsw=t.closest("[data-ttsw]");
  if(tsw){ ttOpenMenu(tsw.closest(".tt-it")); return; }
  /* 时间表行尾的 × → 删除这一格（只有手动写的条目才有这个按钮） */
  const tdl=t.closest("[data-ttdl]");
  if(tdl){ ttDelItem(tdl.closest(".tt-it")); return; }
  /* 每日记录：行首的 ＋ → 空的这一天弹「选格式」菜单（已有记录的行不弹，换格式走条目自己的 ⇄） */
  const dnp=t.closest("[data-dnplus]");
  if(dnp){
    const dday=dnp.closest(".dn-day"), dpg=dnp.closest('[data-tpl="daynote"]');
    if(dday && dpg){
      const body=$(".dn-body",dday);
      if(body && !$(".yp-item",body)) openAddMenu(body,"task,ul,ol,plain,strike");
    }
    return;
  }
  /* Todo 行尾的时段徽标 → 跳到时间表那一行并闪一下 */
  const tbg=t.closest("[data-ttbadge]");
  if(tbg){
    const it=tbg.closest('.grow-list > .yp-item')||tbg.closest(".chk.grow-item");
    const hrs=ttRead(it);
    const pg=mirPage(it);
    if(hrs.length && pg){
      /* 日计划 → .tt-r 那一行；计时模式 → .tt2 的那一格 */
      const r=(pg.dataset.tpl==="timer")
        ? $('.tt2 .tt-c[data-tbh="'+hrs[0]+'"]',pg)
        : ttRowOf(pg,hrs[0]);
      if(r){
        ensureVisible(r,true);
        r.classList.remove("tt-flash"); void r.offsetWidth; r.classList.add("tt-flash");
        setTimeout(()=>r.classList.remove("tt-flash"),1000);
      }
    }
    return;
  }
  /* 「安排到时间表」面板：点一个钟点＝勾上 / 取消 */
  const tdh=t.closest("[data-tdh]");
  if(tdh && TD_ITEM){ tdToggle(parseInt(tdh.dataset.tdh,10)); return; }

  /* 勾选框 */
  const box=t.closest(".box");
  if(box){
    box.classList.toggle("on");
    const c=box.closest(".chk"); if(c) c.classList.toggle("done",box.classList.contains("on"));
    const yi=box.closest(".yp-item"); if(yi) yi.classList.toggle("done",box.classList.contains("on"));
    /* 日计划：打了勾 → 时间表里那个块也一起转灰 */
    const dp2=box.closest('.page[data-tpl="daily"]');
    if(dp2) ttRender(dp2);
    save(); return;
  }

  /* 习惯格子 */
  const dot=t.closest(".habgrid .dot");
  if(dot){
    dot.classList.toggle("on");
    const hpg=dot.closest('.page[data-tpl="habit"]');
    if(hpg) hbWeek(hpg);            /* 小计与顶部连胜跟着变 */
    save(); return;
  }

  /* 心情刻度条 */
  const seg=t.closest("[data-mood]");
  if(seg){ const bar=seg.parentElement; $$(".seg",bar).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.mood,10)<=parseInt(seg.dataset.mood,10))); save(); return; }

  /* 饱腹感 */
  const ff=t.closest(".fj-row .f");
  if(ff){ const box=ff.parentElement; $$(".f",box).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.f,10)<=parseInt(ff.dataset.f,10))); save(); return; }

  /* 餐食来源（单选） */
  const src=t.closest(".src");
  if(src){ const g=src.parentElement; $$(".src",g).forEach(s=>s.classList.toggle("on",s===src)); save(); return; }

  /* 读书清单：点状态框 → 弹下拉面板（再点一次收起） */
  const slb=t.closest("[data-selst]");
  if(slb){
    const pg=slb.closest(".page"), pop=pg&&$("[data-blpop]",pg);
    const was=pop&&pop.classList.contains("on")&&pop.dataset.for===slb.dataset.selid;
    blClosePop();
    if(!was) blOpen(slb);
    return;
  }
  /* 读书清单：选一项 → 写入并收起 */
  const blo=t.closest(".bl-opt");
  if(blo){
    const pop=blo.closest("[data-blpop]");
    const id=pop&&pop.dataset.for;
    const box=id?$(`[data-selid="${id}"]`,pop.closest(".page")):null;
    if(box) blSet(box,blo.dataset.blv);
    blClosePop(); save(); return;
  }

  /* 单选题式选项组（同组互斥） */
  const op=t.closest(".opt");
  if(op){
    const g=op.parentElement;
    $$(".opt",g).forEach(s=>s.classList.toggle("on",s===op));
    save(); return;
  }

  /* 星级 */
  const st=t.closest("[data-star]");
  if(st){ const g=st.parentElement; $$(".s",g).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.star,10)<=parseInt(st.dataset.star,10))); save(); return; }

  /* 阅读进度 */
  const pg=t.closest("[data-p]");
  if(pg){ const g=pg.parentElement; $$(".p",g).forEach(s=>s.classList.toggle("on",parseInt(s.dataset.p,10)<=parseInt(pg.dataset.p,10))); save(); return; }

  /* 版本 pill */
  const pl=t.closest("[data-kind]");
  if(pl){ $$("[data-kind]",pl.closest(".field")).forEach(s=>s.classList.toggle("on",s===pl)); save(); return; }

  /* 天气 */
  const wx=t.closest(".wx");
  if(wx){ $$(".wx",wx.closest(".weather")).forEach(s=>s.classList.toggle("on",s===wx)); save(); return; }

  /* 星期高亮 */
  const dw=t.closest(".dow span");
  if(dw){ $$("span",dw.parentElement).forEach(s=>s.classList.toggle("on",s===dw)); save(); return; }

  /* 删除表格行 */
  const dr=t.closest(".del-row");
  if(dr){
    const tr=dr.closest("tr"), body=tr.parentElement;
    if($$("tr",body).length<=1){
      $$("[contenteditable]",tr).forEach(e=>e.textContent="");
      $$(".box",tr).forEach(e=>e.classList.remove("on"));
    }else{ tr.remove(); }
    save(); return;
  }

  /* 删除列表条目 */
  const di=t.closest(".del-item");
  if(di){
    const it=di.closest(".grow-item"), list=it.parentElement;
    if($$(".grow-item",list).length<=1){
      const ce=$("[contenteditable]",it); if(ce) ce.textContent="";
      $$(".box",it).forEach(e=>e.classList.remove("on"));
    }else{ it.remove(); }
    save(); return;
  }

  /* ＋ 新增一行（表格） */
  const ar=t.closest("[data-addrow]");
  if(ar){
    const tb=ar.previousElementSibling, body=$("tbody",tb);
    const last=$$("tr",body).pop();
    const c=last.cloneNode(true);
    $$("[contenteditable]",c).forEach(e=>e.textContent="");
    $$(".box",c).forEach(e=>e.classList.remove("on"));
    $$(".opt",c).forEach(e=>e.classList.remove("on"));
    $$(".s",c).forEach(e=>e.classList.remove("on"));
    resetSelbox(c);
    body.appendChild(c);
    const first=$("[contenteditable]",c); if(first) first.focus();
    save(); return;
  }

  /* ＋ 新增一条（列表） */
  const ai=t.closest("[data-additem]");
  if(ai){
    const list=ai.previousElementSibling;
    const last=$$(".grow-item",list).pop();
    const c=last.cloneNode(true);
    const ce=$("[contenteditable]",c); if(ce) ce.textContent="";
    $$(".box",c).forEach(e=>e.classList.remove("on"));
    $$(".opt",c).forEach(e=>e.classList.remove("on"));
    $$(".s",c).forEach(e=>e.classList.remove("on"));
    c.classList.remove("struck","done"); c.style.removeProperty("--strike-x");
    list.appendChild(c);
    if(c.classList.contains("fit-row")) fitRenumber(list);
    const first=$("[contenteditable]",c); if(first) first.focus();
    save(); return;
  }

  /* 删除页 */
  const del=t.closest(".del-page");
  if(del){
    if($$(".page",book).length<=1){ toast("至少保留一页"); return; }
    const pg=del.closest(".page");
    const label=(pg.dataset.label||"这一页");
    const no=$$(".page",book).indexOf(pg)+1;
    askConfirm({
      title:"删除这一页？",
      msg:"即将删除第 <b>"+no+"</b> 页（"+esc(label)+"）。删除后无法恢复。"
    }).then(ok=>{
      if(!ok) return;
      pg.remove(); renumber(); autoIndex(); save();
      toast("已删除："+label);
    });
    return;
  }

  /* 打开面板 */
  if(t.id==="fab"){ openSheet(); return; }
  if(t.id==="mask"||t.id==="sheet-close"){ closeSheet(); return; }
  /* 模版面板：点灰色 ✕ → 从插入列表里删除这个模版（书里已有页面不受影响，可恢复） */
  const tpd=t.closest("[data-tpldel]");
  if(tpd){
    const k=tpd.dataset.tpldel, m=tplMeta(k);
    askConfirm({
      title:"从插入列表里删除？",
      msg:"「<b>"+esc(m.n)+"</b>」将不再出现在插入模版里。<br>书里已有的页面<b>不受影响</b>，之后可以随时恢复。",
      okText:"删除", danger:true
    }).then(ok=>{
      if(!ok) return;
      loadTplPref();
      if(TPL_HIDDEN.indexOf(k)<0) TPL_HIDDEN.push(k);
      saveTplPref();
      tplSortExit();
      openSheet();
      toast("已删除「"+m.n+"」");
    });
    return;
  }
  /* 模版面板：点「已删除 N 个 · 恢复」→ 全部恢复 */
  if(t.id==="trestore"){
    loadTplPref();
    const n=TPL_HIDDEN.length;
    TPL_HIDDEN=[];
    saveTplPref();
    openSheet();
    toast("已恢复 "+n+" 个模版");
    return;
  }
  /* 刚拖动完，别把松手那一下当成点击（否则会误插一页） */
  if(TS_JUST_DRAGGED) return;
  /* 模版面板：长按激活态中点卡片 → 先退出激活态，不插入页面 */
  if(TS_ON){
    const tc0=t.closest(".tcard");
    tplSortExit();
    if(tc0) return;
  }
  const tc=t.closest(".tcard");
  if(tc){ closeSheet(); setTimeout(()=>insert(tc.dataset.k),180); return; }

  if(t.id==="btn-top"){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.id==="btn-reset"){
    askConfirm({
      title:"恢复为初始页面？",
      msg:"当前所有内容将被<b>清空</b>，并恢复为初始 12 页模板。此操作无法撤销。",
      okText:"确认清空"
    }).then(ok=>{
      if(ok){ lsDel(KEY); location.reload(); }
    });
    return;
  }
});

/* ==========================================================
   交互：输入
========================================================== */
document.addEventListener("input",function(e){
  const t=e.target;

  /* 空白任务表标题：用户一改就永久固定（不再随日期/重开被重置） */
  if(t.hasAttribute && t.hasAttribute("data-tlttl")){
    t.dataset.tltuser="1"; save(); return;
  }


  /* input 的值写入属性，保证存进 innerHTML */
  if(t.tagName==="INPUT"&&t.classList){
    t.setAttribute("value",t.value);
    if(t.classList.contains("wcell")){ refreshWeight(t.closest(".page")); save(); return; }
    if(t.classList.contains("dinput")){
      const pg=t.closest(".page")||document;
      syncDates(pg);
      if(t.closest('[data-tpl="weekly"]')) wkDates(pg);
      save(); return;
    }
    save(); return;
  }

  /* 月日历：内容有了/没了 → 符号显隐 */
  if(t.classList&&t.classList.contains("mc-txt")){
    const row=t.closest(".mc-row"); if(row) mcMarkRow(row);
    return;
  }
  /* 月任务：最后一行写了目标 → 自动补一行；写完/删完都要重算哪些行是空行 */
  if(t.classList&&(t.classList.contains("mt-goal")||t.classList.contains("mt-year"))){
    const tr=t.closest("tr"), tb=tr&&tr.parentElement;
    if(t.classList.contains("mt-goal") && tb && tr===tb.lastElementChild && t.textContent.trim()!==""){
      mtAddRow(tr.closest(".mc-month"));
    }
    mtSyncEmpty(tb); save(); return;
  }

  /* 表格自动增行 */
  const td=t.closest("td");
  if(td){
    if(t.closest('[data-tpl="yearcal"]')) ycalPaint(t.closest(".page"));
    const tb=td.closest("table");
    if(tb&&tb.hasAttribute("data-autorow")){
      const tr=td.parentElement, body=tr.parentElement;
      if(tr===body.lastElementChild && td.textContent.trim()!==""){
        const c=tr.cloneNode(true);
        $$("[contenteditable]",c).forEach(x=>x.textContent="");
        $$(".box",c).forEach(x=>x.classList.remove("on"));
        $$(".opt",c).forEach(x=>x.classList.remove("on"));
      $$(".s",c).forEach(x=>x.classList.remove("on"));
        resetSelbox(c);
        body.appendChild(c);
      }
    }
    return;
  }

  /* grow-list 自动增行（todo / fitness） */
  const gi=t.closest(".grow-item");
  if(gi){
    /* 日计划 Todo 改名 → 时间表里那个任务名跟着变（两处始终一致） */
    if(gi.classList.contains("chk") && gi.closest('.page[data-tpl="daily"]') && !t.closest(".tt-c")){
      ttSyncName(t);
    }
    if(EXEC_STRIKE) return;                 /* 程序化划删除线触发的 input，不算写字 */
    const list=gi.parentElement;
    /* 用「最后一个 .grow-item」判断，而不是 lastElementChild ——
       因为类型菜单会被插在列表末尾，用 lastElementChild 会误判 */
    const gitems=$$(".grow-item",list);
    if(gitems[gitems.length-1]===gi && t.textContent.trim()!==""){
      const c=gi.cloneNode(true);
      const ce=$("[contenteditable]",c); if(ce) ce.textContent="";
      $$(".box",c).forEach(x=>x.classList.remove("on"));
      $$(".opt",c).forEach(x=>x.classList.remove("on"));
      $$(".s",c).forEach(x=>x.classList.remove("on"));
      /* 新行是干净的：不该继承上一行的删除线 / 打勾状态 */
      c.classList.remove("struck","done");
      c.style.removeProperty("--strike-x");
      list.appendChild(c);
      if(c.classList.contains("fit-row")) fitRenumber(list);
    }
    /* ⚠️ 这里原来 return 掉了末尾的通用 save()：打字 / 自动加行都不即时落盘，
       写完就刷新会丢（2026-10-16 修 —— 新页面「空白任务表」的行就是 .chk.grow-item） */
    save();
    return;
  }
  /* 日计划 / 计时模式 Todo 镜像行：打字直接写回周计划真源那条，时间表里的任务名也跟着变 */
  const dmt=t.closest('.page[data-tpl="daily"] .grow-list > .yp-item > .yp-txt,.page[data-tpl="timer"] .grow-list > .yp-item > .yp-txt');
  if(dmt){
    const row=dmt.closest(".yp-item"), src=dailySrc(row);
    if(src){
      const st=$(".yp-txt",src);
      if(st && st.innerHTML!==dmt.innerHTML) st.innerHTML=dmt.innerHTML;
      ttSyncName(dmt);
      save();                    /* save() 里的兜底刷新会把光标原样还回来 */
      return;
    }
  }
  /* 一日四格：在最后一条写了字 → 同小节补一条；写完/删完都要重算四格等高 */
  const dgt=t.closest(".dg-items .yp-txt");
  if(dgt){
    dgGrow(dgt);
    const dgp=dgt.closest('.page[data-tpl="daygrid"]'); if(dgp) dgFit(dgp);
    save(); return;
  }
  /* 年计划条目改了字 → 引用了它的周计划标签要跟着变（标签读的是活文字，不是快照） */
  const yit2=t.closest(".yp-item");
  if(yit2 && (yit2.closest('[data-tpl="yearly"]')||yit2.closest(".yp-month"))){
    yplRefreshAll();
    save(); return;
  }
  /* 详情页里改「条目名 / 动机」→ 写回年计划条目 */
  if(t.closest("[data-ypdname]")){ ypdSyncField("name",t.textContent.trim()); return; }  if(t.closest("[data-ypdnote]")){ ypdSyncField("note",t.textContent.trim()); return; }
  if(t.closest("[data-ypddue]")){
    ypdSyncField("due",t.textContent.trim());
    /* 顺手刷新括号里的天数（三态变色） */
    const wrap=t.closest(".ypd-due");
    if(wrap){ const h=$(".hint",wrap); if(h) h.outerHTML=ypdDueHint(t.textContent.trim())||
      '<span class="hint"></span>'; }
    return;
  }
  /* 时间表里的任务名改了 → 写回 Todo 那一条（两处始终一致） */
  if(t.closest("[data-tttx]")){
    ttPaintItem(t.closest(".tt-it"));    /* 有内容 → ＋ 让位、行尾 × 出现（一次刷到位） */
    ttSyncName(t); save(); return;
  }

  save();
});

/* 日期选择：写入 value 属性以便持久化，并联动星期 / 星期高亮 */
document.addEventListener("change",function(e){
  const t=e.target;
  if(!t.classList) return;

  if(t.hasAttribute&&t.hasAttribute("data-cgfile")){
    const f=t.files&&t.files[0];
    const pg=t.closest(".page");
    if(f&&pg){
      const cell=cgCellOf(pg,t.dataset.cgd||"");
      if(cell){
        cgCompress(f,url=>{ cgInsertImage(pg,cell,url); });
      }else{ toast("这一格已经不在当前视图里了"); }
    }
    t.value="";
    return;
  }
  if(t.classList.contains("dinput")){
    t.setAttribute("value",t.value);
    const pg=t.closest(".page")||document;
    syncDates(pg);
    if(t.closest('[data-tpl="weekly"]')) wkDates(pg);
    /* 日记页按日存档：改日期＝切到那天的区块（没有就新建） */
    if(t.closest('[data-tpl="diary"]')) ddShow(pg,t.value);
    if(t.closest('[data-tpl="daygrid"]')) dgShow(pg,t.value);   /* 一日四格：按日存档 */
    /* 空白任务表：改日期＝切那天的清单 + 标题跟着变 */
    if(t.closest('[data-tpl="tasklist"]')) tlShow(pg,t.value);
    /* 日计划：改日期＝换看哪一天，Todo 跟着换成周计划那一天的条目 */
    if(t.closest('[data-tpl="daily"]')){
      const before=dailyISO(pg);
      dailyRefresh(pg);
      const n=dailyRows(pg).length;
      const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(t.value||"");
      toast(m&&before!==t.value
        ? (m[2]*1)+"月"+(m[3]*1)+"日 · 来自周计划的 "+n+" 条"
        : "Todo 已同步");
    }
    save();
    return;
  }
  if(t.classList.contains("wcell")){
    t.setAttribute("value",t.value);
    refreshWeight(t.closest(".page"));
    save();
  }
});

/* ==========================================================
   光标与行的通用操作（所有可编辑区域共用）
========================================================== */
/* 光标后面是否还有字 */
function hasTextAfter(el){
  const s=window.getSelection();
  if(!s||!s.rangeCount) return false;
  const r=s.getRangeAt(0);
  if(!el.contains(r.endContainer)) return false;
  const after=document.createRange();
  after.selectNodeContents(el);
  after.setStart(r.endContainer,r.endOffset);
  return /\S/.test(after.toString());
}
/* 把光标移到元素内容末尾：优先落进最后一个文本节点，
   真正停在「最后一个字后面」，而不是容器末尾（后者对中文输入/IME 更稳） */
function caretToEnd(el){
  try{ el.focus({preventScroll:true}); }catch(_){ el.focus&&el.focus(); }
  const s=window.getSelection();
  if(!s) return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  let last=null; while(w.nextNode()) last=w.currentNode;
  const r=document.createRange();
  if(last) r.setStart(last,last.length);
  else r.selectNodeContents(el);
  r.collapse(true);
  s.removeAllRanges(); s.addRange(r);
}
/* 这一行算不算「空的」：没有可见文字，且最多只剩一个换行占位 */
function isEmptyRow(el){
  if(el.textContent.trim()!=="") return false;
  return el.querySelectorAll("br").length<=1;
}
/* 从光标处拆成两行（仍在同一条里，第二行左边缘与第一行自动对齐） */
function breakLineAtCaret(el){
  const s=window.getSelection();
  if(!s||!s.rangeCount) return false;
  const r=s.getRangeAt(0);
  r.deleteContents();
  const br=document.createElement("br");
  r.insertNode(br);
  const nr=document.createRange();
  nr.setStartAfter(br); nr.collapse(true);
  s.removeAllRanges(); s.addRange(nr);
  return true;
}
/* 光标移到文字开头 */
function caretToStart(el){
  try{ el.focus({preventScroll:true}); }catch(_){ el.focus&&el.focus(); }
  const s=window.getSelection(); if(!s) return;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  const first=w.nextNode();
  const r=document.createRange();
  if(first) r.setStart(first,0); else r.selectNodeContents(el);
  r.collapse(true); s.removeAllRanges(); s.addRange(r);
}
/* 年计划 / 周计划的条目列表：允许一路删到空（删空后就是「从没加过条目」的样子） */
function isYPList(el){
  const items=el.closest(".yp-items");
  if(!items) return false;
  const pg=items.closest(".page");
  const tpl=pg&&pg.dataset.tpl;
  return tpl==="yearly"||tpl==="weekly";
}
/* 空内容按退格 → 删掉整行，光标退回上一行文字末尾
   allowEmpty=true（年计划 / 周计划）时，第一行也能删；删光了列表就回到初始样式 */
function deleteEmptyRow(el,allowEmpty){
  const row=el.closest(".yp-item")||el.closest(".grow-item")||el.closest(".fj-row")||el.closest("tr");
  if(!row) return false;
  let container,sel;
  if(row.tagName==="TR"){ container=row.parentElement; sel="tr"; }
  else if(row.classList.contains("yp-item")){ container=row.parentElement; sel=".yp-item"; }
  else if(row.classList.contains("fj-row")){ container=row.parentElement; sel=".fj-row"; }
  else { container=row.parentElement; sel=".grow-item"; }
  const items=row.closest(".yp-items");
  const sibs=$$(sel,container);
  const i=sibs.indexOf(row);
  /* 只剩一行 / 已经是第一行：别的列表保留，年计划与周计划可以删空 */
  if(sibs.length<=1||i<=0){
    if(!allowEmpty) return false;
    const next=sibs[i+1];
    row.remove();
    if(items) renumberOL(items);
    if(row.classList.contains("fit-row")) fitRenumber(container);
    if(next){ const ne=$("[contenteditable]",next); if(ne) caretToStart(ne); }
    return true;
  }
  const prev=sibs[i-1];
  row.remove();
  if(items) renumberOL(items);
  const pce=$("[contenteditable]",prev);
  if(pce) caretToEnd(pce);
  return true;
}
/* 空内容按「删除键」（向后删）→ 同样删掉整行，光标落到下一行文字开头 */
function deleteRowForward(el){
  const row=el.closest(".yp-item");
  if(!row) return false;
  const items=row.parentElement;
  const sibs=$$(".yp-item",items);
  const i=sibs.indexOf(row);
  const next=sibs[i+1], prev=sibs[i-1];
  row.remove();
  renumberOL(items);
  if(next){ const ne=$("[contenteditable]",next); if(ne) caretToStart(ne); }
  else if(prev){ const pe=$("[contenteditable]",prev); if(pe) caretToEnd(pe); }
  return true;
}

/* 回车 / 退格的行级行为 */
document.addEventListener("keydown",function(e){
  const t=e.target;
  if(!t||!t.isContentEditable) return;
  if(t.closest(".yp-detail")) return;        /* 详情页里的编辑走原生行为，不进条目的拆行/删行逻辑 */
  /* 时间表里的任务名：单行字段，不进拆行 / 删行那一套 */
  if(t.closest("[data-tttx]")){ if(e.key==="Enter") e.preventDefault(); return; }

  /* 日计划 / 计时模式 Todo 镜像行：先把光标搬到周计划真源那条上，
     下面的拆行 / 新增 / 删行逻辑就能原样作用在真源上 */
  const dmk=t.closest('.page[data-tpl="daily"] .grow-list > .yp-item,.page[data-tpl="timer"] .grow-list > .yp-item');
  if(dmk){
    const pg=mirPage(dmk);
    const src=dailySrc(dmk);
    if(src){
      const st=$(".yp-txt",src);
      const off=caretOffsetIn(t);
      if(st){ st.innerHTML=t.innerHTML; if(off!=null) setCaretOffset(st,off); }
      const bare=!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey;
      const cell=src.parentElement;
      const at=$$(".yp-item",cell).indexOf(src);
      if(e.key==="Backspace"&&bare&&isEmptyRow(t)){
        if(deleteEmptyRow(st,true)){ e.preventDefault(); dailyMirrorFocus(pg,at,"end"); save(); }
        return;
      }
      if(e.key==="Delete"&&bare&&isEmptyRow(t)){
        if(deleteRowForward(st)){ e.preventDefault(); dailyMirrorFocus(pg,at,"start"); save(); }
        return;
      }
      if(e.key==="Enter"&&!e.shiftKey){
        if(hasTextAfter(st)){ e.preventDefault(); breakLineAtCaret(st); dailyAfter(pg); save(); return; }
        e.preventDefault();
        const kind=src.classList.contains("task")?"task":
          (src.classList.contains("ol")?"ol":(src.classList.contains("del")?"del":"ul"));
        const d=document.createElement("div");
        d.innerHTML=ypItem(kind);
        const ni=d.firstElementChild;
        src.after(ni);
        yplEnsureIds(ni.closest(".page")||book);
        renumberOL(cell);
        const niAt=$$(".yp-item",cell).indexOf(ni);
        save();
        dailyMirrorFocus(pg,niAt,"start");
        return;
      }
      return;                    /* 其余按键走默认行为（纯打字，input 里会写回真源） */
    }
  }

  /* ① 空内容 + 退格 → 删除该行，光标落到上一行最后一个字后面
     年计划 / 周计划里第一行也能删；删光了就回到「从没加过条目」的样子 */
  if(e.key==="Backspace"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
    if(isEmptyRow(t)){
      if(deleteEmptyRow(t,isYPList(t))){ e.preventDefault(); save(); return; }
    }
    return;
  }
  /* ①b 空内容 + 删除键（向后删）→ 同上，光标落到下一行开头 */
  if(e.key==="Delete"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!e.shiftKey){
    if(isYPList(t)&&isEmptyRow(t)){
      if(deleteRowForward(t)){ e.preventDefault(); save(); return; }
    }
    return;
  }
  if(e.key!=="Enter") return;
  if(e.shiftKey) return;                     /* Shift+回车：条目内换行，走浏览器默认 */

  /* ② 光标后面还有字 → 从光标处拆成两行，仍属于同一条 */
  if(hasTextAfter(t)){
    e.preventDefault(); breakLineAtCaret(t); save(); return;
  }

  /* ③ 行尾回车 → 新增一条（列表 / 表格） */
  const gi=t.closest(".grow-item");
  if(gi){
    e.preventDefault();
    const list=gi.parentElement;
    let btn=list.nextElementSibling;
    if(btn&&btn.dataset.additem) btn.click();
    return;
  }
  /* 条目区：回车 = 在当前条目正下方新增同类型一项 */
  const yi=t.closest(".yp-item");
  if(yi){
    e.preventDefault();
    let kind;
    const dnp=yi.closest('.page[data-tpl="daynote"]');
    if(dnp){
      /* 每日记录：格式沿用上一条（任务框→任务框）；
         上一条是删除线（划掉的 / 老的 del 类型）→ 新条目默认任务框 */
      kind=(yi.classList.contains("struck")||yi.classList.contains("del")) ? "task" : ypKindOf(yi);
    }else{
      kind=yi.classList.contains("task")?"task":(yi.classList.contains("ol")?"ol":(yi.classList.contains("del")?"del":"ul"));
    }
    const items=yi.parentElement;
    const d=document.createElement("div");
    d.innerHTML=ypItem(kind);
    const ni=d.firstElementChild;
    yi.after(ni);
    yplEnsureIds(ni.closest(".page")||book);   /* 回车新起的一条也要有 ID */
    const ce=$(".yp-txt",ni); if(ce) ce.focus();
    renumberOL(items); save(); return;
  }
  const td=t.closest("td");
  if(td){
    const tb=td.closest("table");
    if(tb&&tb.hasAttribute("data-autorow")){
      e.preventDefault();
      let btn=tb.nextElementSibling;
      if(btn&&btn.dataset.addrow) btn.click();
    }
  }
});

/* ==========================================================
   体重：自动算 +/− 与折线图
========================================================== */
function refreshWeight(page){
  if(!page) return;
  const blk=page.querySelector(".mc-month.on")||page;   /* 当前月块（旧结构无月块时回退整页） */
  const cells=$$(".wcell",blk).map(i=>parseFloat(i.value));
  let prev=null, pts=[];
  $$(".wcell",blk).forEach((inp,i)=>{
    const v=parseFloat(inp.value);
    const cell=blk.querySelector('.delta[data-d="'+(i+1)+'"]');
    if(cell){
      if(isNaN(v)){ cell.textContent="—"; cell.className="delta"; }
      else{
        if(prev!==null && !isNaN(prev)){
          const d=+(v-prev).toFixed(1);
          cell.textContent=(d>0?"+":"")+d;
          cell.className="delta "+(d>0?"up":(d<0?"down":""));
        } else { cell.textContent="—"; cell.className="delta"; }
        prev=v;
      }
    }
    if(!isNaN(v)) pts.push([i,v]);
  });
  /* 结束体重 = 最新一条 */
  const endEl=$('[data-auto="end"]',blk);
  if(endEl){
    const last=pts.length?pts[pts.length-1][1]:null;
    endEl.textContent = last===null?"—":last.toFixed(1)+" kg";
  }
  /* 折线图（作用域限定在当前月块，避免多月份块重复 id） */
  const g=$(".wchart",blk);
  if(g){
    let s="";
    /* 网格 */
    for(let i=0;i<=4;i++){
      const y=10+i*27;
      s+=`<line x1="8" y1="${y}" x2="294" y2="${y}" stroke="#eee" stroke-width="1"/>`;
    }
    if(pts.length){
      const vals=pts.map(p=>p[1]);
      let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      const span=(mx-mn)||1; mn-=span*0.15; mx+=span*0.15;
      const X=i=>8+(i/(Math.max(pts.length-1,1)))*286;
      const Y=v=>118-((v-mn)/((mx-mn)||1))*98;
      const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
      s+=`<path d="${d}" fill="none" stroke="#1f1f1f" stroke-width="1.6" stroke-linejoin="round"/>`;
      pts.forEach((p,i)=>{ s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2" fill="#1f1f1f"/>`; });
      const lastp=pts[pts.length-1];
      s+=`<text x="${X(lastp[0]).toFixed(1)}" y="${(Y(lastp[1])-6).toFixed(1)}" font-size="9" fill="#1f1f1f" text-anchor="end">${lastp[1]}</text>`;
      s+=`<text x="10" y="16" font-size="8" fill="#aaa">${mx.toFixed(1)}</text>`;
      s+=`<text x="10" y="120" font-size="8" fill="#aaa">${mn.toFixed(1)}</text>`;
    }else{
      s+=`<text x="150" y="68" font-size="10" fill="#ccc" text-anchor="middle">填入体重自动生成曲线</text>`;
    }
    g.innerHTML=s;
  }
}

/* 模版列表的个性化：顺序（长按拖动）与已删除的模版 */
const TPL_KEY_ORDER="journal2026.v2.tplOrder", TPL_KEY_HIDDEN="journal2026.v2.tplHidden";
let TPL_ORDER=[], TPL_HIDDEN=[];
function loadTplPref(){
  try{ const a=JSON.parse(lsGet(TPL_KEY_ORDER));  TPL_ORDER =Array.isArray(a)?a:[]; }catch(_){ TPL_ORDER=[]; }
  try{ const a=JSON.parse(lsGet(TPL_KEY_HIDDEN)); TPL_HIDDEN=Array.isArray(a)?a:[]; }catch(_){ TPL_HIDDEN=[]; }
}
function saveTplPref(){
  lsSet(TPL_KEY_ORDER,JSON.stringify(TPL_ORDER));
  lsSet(TPL_KEY_HIDDEN,JSON.stringify(TPL_HIDDEN));
}
/* 按保存的顺序排列、去掉已删除的；没排过顺序的新模版接在后面 */
function tplVisibleList(){
  loadTplPref();
  const hidden=new Set(TPL_HIDDEN), map=new Map();
  TPL_LIST.forEach(x=>{ if(!hidden.has(x.k)) map.set(x.k,x); });
  const out=[];
  TPL_ORDER.forEach(k=>{ const x=map.get(k); if(x){ out.push(x); map.delete(k); } });
  map.forEach(x=>out.push(x));
  return out;
}
function tplCardHTML(x){

/* ---------- 模版卡：长按排序 + 删除 ----------
   长按 450ms → 卡片进入激活态（铅笔换成灰色 ✕），可拖动改顺序；
   松手没拖也保持激活态，方便再点 ✕ 删除。点别处退出激活态。 */
let TS_DRAG=null, TS_JUST_DRAGGED=false, TS_ON=false;
function tplSortExit(){
  TS_ON=false;
  $$(".tcard.tpl-on").forEach(c=>c.classList.remove("tpl-on"));
  document.body.classList.remove("tplsort");
}
function tplSortCancel(){
  const st=TS_DRAG;
  if(!st) return;
  clearTimeout(st.timer);
  if(st.ghost) st.ghost.remove();
  if(st.card) st.card.classList.remove("tpl-lift");
  $$(".tpl-dropline").forEach(x=>x.remove());
  document.body.classList.remove("tplsort");
  TS_DRAG=null;
}
function tplSortActivate(st){
  if(TS_DRAG!==st) return;
  st.active=true;
  TS_ON=true;
  st.card.classList.add("tpl-on");
  const b=st.card.getBoundingClientRect();
  const g=document.createElement("div");
  g.className="tpl-fly";
  g.innerHTML=st.card.innerHTML;
  g.style.left=b.left+"px"; g.style.top=b.top+"px"; g.style.width=b.width+"px";
  document.body.appendChild(g);
  st.ghost=g; st.dx=st.startX-b.left; st.dy=st.startY-b.top;
  st.card.classList.add("tpl-lift");
  document.body.classList.add("tplsort");
  if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(_){} }
}
function tplSortStart(e){
  if(TS_DRAG) return;
  if(e.pointerType==="mouse"&&e.button!==0) return;
  if(!$("#sheet").classList.contains("on")) return;
  const card=e.target.closest&&e.target.closest(".tcard");
  if(!card) return;
  const onName=e.target.closest&&e.target.closest("[data-tplrn]");
  const st={card:card, k:card.dataset.k, startX:e.clientX, startY:e.clientY,
            ghost:null, timer:0, active:false, drop:null, rename:!!onName};
  st.timer=setTimeout(()=>{ st.rename? tplRenameStart(card,st.k) : tplSortActivate(st); },450);
  TS_DRAG=st;
}
function tplSortMove(e){
  const st=TS_DRAG; if(!st) return;
  if(!st.active){
    /* 长按还没成功就滑动 → 当作正常滚动 */
    if(Math.abs(e.clientY-st.startY)>8||Math.abs(e.clientX-st.startX)>8){
      clearTimeout(st.timer); TS_DRAG=null;
    }
    return;
  }
  if(e.cancelable) e.preventDefault();
  st.ghost.style.top=(e.clientY-st.dy)+"px";
  st.ghost.style.left=(e.clientX-st.dx)+"px";
  $$(".tpl-dropline").forEach(x=>x.remove());
  st.drop=null;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=el&&el.closest?el.closest(".tcard"):null;
  if(!tgt||tgt===st.card) return;
  const b=tgt.getBoundingClientRect();
  const after=(e.clientY>b.top+b.bottom)/2;
  const line=document.createElement("div");
  line.className="tpl-dropline";
  tgt.insertAdjacentElement(after?"afterend":"beforebegin",line);
  st.drop={k:tgt.dataset.k, after:after};
}
function tplSortEnd(){
  const st=TS_DRAG; if(!st) return;
  clearTimeout(st.timer);
  const active=st.active, drop=st.drop, card=st.card, renaming=st.rename;
  tplSortCancel();
  /* 改名长按：已进入编辑，别把这下松手当点击插入 */
  if(renaming){
    TS_JUST_DRAGGED=true;
    setTimeout(()=>{ TS_JUST_DRAGGED=false; },800);
    return;
  }
  if(!active) return;                     /* 没长按成功 → 交给 click 正常插入 */
  TS_JUST_DRAGGED=true;
  setTimeout(()=>{ TS_JUST_DRAGGED=false; },320);
  if(drop){
    /* 真正把卡片挪到落点，再按新 DOM 顺序写回偏好并重绘 */
    const tgt=$$(".tcard",$("#tlist")).find(c=>c.dataset.k===drop.k);
    if(tgt) tgt.insertAdjacentElement(drop.after?"afterend":"beforebegin",card);
    TPL_ORDER=$$(".tcard",$("#tlist")).map(c=>c.dataset.k);
    saveTplPref();
    TS_ON=false;
    openSheet();
    toast("模版顺序已保存");
  }else{
    card.classList.add("tpl-on");         /* 只长按没拖 → 保持激活态，可点 ✕ */
    document.body.classList.add("tplsort");
  }
}
/* 长按模板名 → 就地改名（不依赖 prompt，WebView 里也能用） */
function tplRenameStart(card,k){
  TS_DRAG=null; TS_ON=false;
  TS_JUST_DRAGGED=true;
  setTimeout(()=>{ TS_JUST_DRAGGED=false; },800);
  const tn=$(".tn",card); if(!tn) return;
  let done=false;
  const finish=(ok)=>{
    if(done) return; done=true;
    tn.contentEditable="false"; tn.classList.remove("tn-edit");
    const v=tn.textContent.replace(/\s+/g," ").trim();
    if(ok){
      if(v && v!==tplMeta(k).n) TPL_NAME[k]=v; else delete TPL_NAME[k];
      saveTplNames();
    }
    openSheet();
    toast(ok? (v?("模板名："+v):"已恢复默认名") : "已取消改名");
  };
  tn.contentEditable="true";
  tn.classList.add("tn-edit");
  tn.focus();
  try{
    const r=document.createRange(); r.selectNodeContents(tn);
    const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(_){}
  tn.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){ ev.preventDefault(); ev.stopPropagation(); finish(true); }
    else if(ev.key==="Escape"){ ev.preventDefault(); ev.stopPropagation(); finish(false); }
  },true);
  tn.addEventListener("click",ev=>ev.stopPropagation());
  tn.addEventListener("blur",()=>finish(true),{once:true});
}
document.addEventListener("pointerdown",tplSortStart);
document.addEventListener("pointermove",tplSortMove);

function dwStart(e){

/* ---------- 左滑删除：内容层平移露出右侧红块 ---------- */
let DW_SWIPE=null, DW_SWIPE_JUST=false, DW_OPEN_ROW=null;
const SWIPE_W=64, SWIPE_TRIG=8, SWIPE_SNAP=32;

/* 收起当前已打开（左滑露出红块）的行 */
function dwSwipeReset(){
  if(DW_OPEN_ROW){
    const c=DW_OPEN_ROW.querySelector(".dw-c");
    if(c){ c.style.transition="transform .18s ease"; c.style.transform=""; }
    DW_OPEN_ROW=null;
  }
}

function dwSwipeDown(e){
  if(e.pointerType==="mouse"&&e.button!==0) return;
  const row=e.target.closest&&e.target.closest(".dw-r");
  if(!row) return;
  if(e.target.closest(".dw-del")) return;            /* 红块点击不触发滑动 */
  DW_SWIPE={row:row, c:row.querySelector(".dw-c"), id:e.pointerId,
            startX:e.clientX, startY:e.clientY, x:0, active:false};
}
function dwSwipeMove(e){
  const st=DW_SWIPE; if(!st) return;
  if(DW_DRAG&&DW_DRAG.active){ DW_SWIPE=null; return; }  /* 长按排序接管 → 放弃滑动 */
  const dx=e.clientX-st.startX, dy=e.clientY-st.startY;
  if(!st.active){
    if(Math.abs(dx)>SWIPE_TRIG && Math.abs(dx)>Math.abs(dy)){
      st.active=true;
      if(DW_DRAG){ clearTimeout(DW_DRAG.timer); DW_DRAG=null; }  /* 别启动长按排序 */
      try{ st.row.setPointerCapture(st.id); }catch(_){}
    } else if(Math.abs(dy)>SWIPE_TRIG && Math.abs(dy)>=Math.abs(dx)){
      DW_SWIPE=null; return;                          /* 纵向 → 交给滚动 */
    } else return;
  }
  if(e.cancelable) e.preventDefault();
  st.x=Math.max(-SWIPE_W, Math.min(0, dx));
  if(st.c) st.c.style.transform="translateX("+st.x+"px)";
}
function dwSwipeUp(){
  const st=DW_SWIPE; if(!st) return;
  DW_SWIPE=null;
  if(!st.active) return;
  DW_SWIPE_JUST=true;
  setTimeout(()=>{ DW_SWIPE_JUST=false; },320);
  const open = st.x < -SWIPE_SNAP;
  if(st.c){
    st.c.style.transition="transform .18s ease";
    st.c.style.transform = open ? "translateX(-"+SWIPE_W+"px)" : "";
    setTimeout(()=>{ if(st.c) st.c.style.transition=""; },200);
  }
  if(open){ if(DW_OPEN_ROW&&DW_OPEN_ROW!==st.row) dwSwipeReset(); DW_OPEN_ROW=st.row; }
  else if(DW_OPEN_ROW===st.row) DW_OPEN_ROW=null;
}
/* 点红块删除：复用既有确认逻辑 */
function dwSwipeDelete(dwr){
  const no=parseInt(dwr.dataset.dwno,10);
  const pages=$$(".page",book);
  const pg=pages[no-1];
  if(!pg) return;
  if(pages.length<=1){ toast("至少保留一页"); return; }
  const label=(pg.dataset.label||("第 "+no+" 页"));
  askConfirm({
    title:"删除这一页？",
    msg:"即将删除第 <b>"+no+"</b> 页（"+esc(label)+"）。删除后无法恢复。"
  }).then(ok=>{
    if(!ok){ dwSwipeReset(); return; }
    if(DW_OPEN_ROW===dwr) DW_OPEN_ROW=null;
    pg.remove(); renumber(); autoIndex(); save();
    dwRender();
    toast("已删除："+label);
  });
}

document.addEventListener("pointerdown",dwStart);
document.addEventListener("pointermove",dwMove);
document.addEventListener("pointerup",dwEnd);
document.addEventListener("pointercancel",dwCancelDrag);
/* 左滑删除：内容层平移露出右侧红块 */
document.addEventListener("pointerdown",dwSwipeDown);
document.addEventListener("pointermove",dwSwipeMove);
document.addEventListener("pointerup",dwSwipeUp);
document.addEventListener("pointercancel",dwSwipeUp);
/* 拖动 / 左滑中别让抽屉跟着滚 */
document.addEventListener("touchmove",function(e){
  if(DW_DRAG&&DW_DRAG.active&&e.cancelable) e.preventDefault();
  if(DW_SWIPE&&DW_SWIPE.active&&e.cancelable) e.preventDefault();
},{passive:false});

/* ==========================================================
   手机软键盘遮挡处理
   —— 聚焦编辑项时，把它滚到键盘上方；键盘弹出/收起时持续跟随
========================================================== */
let activeEdit=null;

/* 可视区（排除键盘）的上下边界，单位：client 坐标 */
function visBounds(){
  const vv=window.visualViewport;
  if(vv) return {top:vv.offsetTop, bottom:vv.offsetTop+vv.height};
  return {top:0, bottom:window.innerHeight};
}

/* 把元素滚进可视区，并尽量停在可视区上 40% 处，方便看到上文（如月份标题） */
function ensureVisible(el,force){
  if(!el) return;
  const b=visBounds();
  const r=el.getBoundingClientRect();
  const pad=18, room=b.bottom-b.top;
  let targetTop=Math.min(b.top+room*0.42, b.bottom-pad-r.height);
  targetTop=Math.max(targetTop, b.top+pad);
  let delta=0;
  if(r.bottom > b.bottom-pad)                        delta = r.top-targetTop;  // 被键盘挡住
  else if(r.top < b.top+pad)                         delta = r.top-(b.top+pad);// 露在可视区上方
  else if(force && Math.abs(r.top-targetTop)>room*0.25) delta = r.top-targetTop;
  if(Math.abs(delta)>2) window.scrollBy({top:delta,behavior:"auto"});
}

/* 键盘高度（px），未弹出时为 0 */
function kbHeight(){
  const vv=window.visualViewport;
  if(!vv) return 0;
  const h=window.innerHeight-(vv.offsetTop+vv.height);
  return h>60?h:0;
}

/* 编辑工具条：贴在键盘上沿，含「完成」与「＋下一项」
   同时给文档底部临时加高，保证最末尾的条目也能被滚上来 */
function updateKbdBar(){
  const bar=$("#kbdbar");
  const kb=kbHeight();
  if(book) book.style.paddingBottom = kb ? (kb+40)+"px" : "";
  if(!bar) return;
  if(!activeEdit || kb===0){ bar.classList.remove("on"); return; }
  const yi=activeEdit.closest(".yp-item");
  let html='<button data-kbd="done">完成</button>';
  if(yi){
    const kind=KIND_NAME[yi.classList.contains("task")?"task":(yi.classList.contains("ol")?"ol":(yi.classList.contains("del")?"del":"ul"))];
    html+='<button data-kbd="next">＋ '+kind+'</button>';
  }
  bar.innerHTML=html;
  bar.style.bottom=kb+"px";
  bar.classList.add("on");
}

/* 聚焦后的完整处理：加高 → 出工具条 → 滚动 */
function handleEditFocus(t){
  activeEdit=t;
  updateKbdBar();
  ensureVisible(t,true);
}

/* 新增同类型项（供工具条调用）：插到当前条目正下方 */
function addSibling(el){
  const yi=el.closest(".yp-item");
  if(yi){
    const kind=yi.classList.contains("task")?"task":(yi.classList.contains("ol")?"ol":(yi.classList.contains("del")?"del":"ul"));
    const items=yi.parentElement;
    const d=document.createElement("div");
    d.innerHTML=ypItem(kind);
    const ni=d.firstElementChild;
    yi.after(ni);
    yplEnsureIds(ni.closest(".page")||book);   /* 工具条「＋类型」新起的也要有 ID */
    const ce=$(".yp-txt",ni);
    renumberOL(items);
    if(ce){ ce.focus(); ensureVisible(ce,true); }
    save(); return;
  }
  const gi=el.closest(".grow-item");
  if(gi){
    const list=gi.parentElement;
    const btn=list.nextElementSibling;
    if(btn&&btn.dataset.additem){
      btn.click();
      const ce=$("[contenteditable]",list.lastElementChild);
      if(ce){ ce.focus(); ensureVisible(ce,true); }
    }
    return;
  }
  const td=el.closest("td");
  if(td){
    const tb=td.closest("table");
    if(tb&&tb.hasAttribute("data-autorow")){
      const btn=tb.nextElementSibling;
      if(btn&&btn.dataset.addrow){
        btn.click();
        const ce=$("[contenteditable]",tb.querySelector("tbody").lastElementChild);
        if(ce){ ce.focus(); ensureVisible(ce,true); }
      }
    }
  }
}

document.addEventListener("focusin",function(e){
  const t=e.target;
  if(!(t.isContentEditable || (t.tagName==="INPUT"&&t.type!=="checkbox"))) return;
  /* 日历格 / 时间表格子例外：格子很矮（29px），键盘避让滚动会让点击目标错位
     （横向滚动容器里更明显——时间表文字现在是横向滑动的），这里不做 */
  if(t.closest&&(t.closest(".cg-cell")||t.closest(".tt-r")||t.closest(".tt2 .tt-c"))) return;
  /* 键盘弹出有延迟，多次补滚确保到位 */
  handleEditFocus(t);
  requestAnimationFrame(()=>handleEditFocus(t));
  [100,260,420].forEach(ms=>setTimeout(()=>{ if(activeEdit===t) handleEditFocus(t); },ms));
});

document.addEventListener("focusout",function(e){
  if(activeEdit===e.target){
    activeEdit=null;
    setTimeout(updateKbdBar,180);
  }
  /* 时间格里手动写的内容：删光 + 失焦 → 整格还原成空白（不留空勾选框这类残留）。
     排进来的（data-ttauto）不碰；没删空、或本来就是干净的空格，也都不动。 */
  const ttx=e.target&&e.target.closest&&e.target.closest("[data-tttx]");
  if(!ttx) return;
  const it=ttx.closest(".tt-it");
  if(!it || it.dataset.ttauto) return;
  if(ttx.textContent.trim()) return;
  const k=it.dataset.kind||"plain";
  if(k==="plain" && it.dataset.done!=="1" && !it.classList.contains("struck")) return;
  ttResetItem(it);
  save();
});

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",()=>{
    if(activeEdit) handleEditFocus(activeEdit);
    else updateKbdBar();
  });
  window.visualViewport.addEventListener("scroll",()=>updateKbdBar());
}
window.addEventListener("resize",()=>{
  if(activeEdit) setTimeout(()=>handleEditFocus(activeEdit),80);
  /* 一日四格：宽度变了要重新量四格的自然高度，十字线才不会偏心 */
  $$('.page[data-tpl="daygrid"]',book).forEach(dgFit);
});

/* 工具条按钮 */
document.addEventListener("click",function(e){
  const kb=e.target.closest("[data-kbd]");
  if(!kb) return;
  const act=kb.dataset.kbd;
  if(act==="done"){
    if(activeEdit) activeEdit.blur();
    else { const a=document.activeElement; if(a&&a.blur) a.blur(); }
    activeEdit=null; updateKbdBar(); save(); return;
  }
  if(act==="next"&&activeEdit){ addSibling(activeEdit); return; }
});

/* Esc 关闭年计划条目详情页 / 安排到时间表面板 / 计时弹窗（计时不停） */
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if($(".yp-detail")) ypdClose();
  tdClose();
  tbHide();
});

/* ==========================================================
   启动
========================================================== */
load();
if(!lsGet(KEY)) save();
/* 计时模式：每秒刷新现在线 / 实时钟 / 进行中的块与徽标（没有计时页时几乎零开销） */
setInterval(tbTick,1000);
</script>
